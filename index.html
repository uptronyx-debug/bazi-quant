    const CHARGE_COLORS = {
        '金': [['金', '#d4af37'], ['銀', '#c7ccd1'], ['白', '#f4f4f4'], ['灰', '#8a8a8a']],
        '木': [['藍', '#1f6fd6'], ['黑', '#111111'], ['綠', '#2e7d32'], ['藍綠', '#2a8a8a']],
        '水': [['黑', '#111111'], ['藍', '#1f6fd6'], ['白', '#f4f4f4'], ['灰', '#8a8a8a']],
        '火': [['紅', '#b71c1c'], ['橘', '#e67e22'], ['黃', '#f4d03f'], ['綠', '#3e8e41']],
        '土': [['紅', '#b71c1c'], ['橘', '#e67e22'], ['黃', '#f4d03f'], ['土', '#9c5a1a'], ['咖啡', '#8d6e63']]
    };
    function computeChargeContext(strengthLabel, totalScore, dayElement, dy, gans, zhis) {
        const caiEl = wuxingRel[dayElement].ke;
        const yinEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        if (strengthLabel === '從強格') return { els: [dayElement, yinEl], basis: '從強格・繼續補幫扶（比劫、印）' };
        if (strengthLabel === '從弱格') {
            const ctx = computeCareerContext(strengthLabel, totalScore, dayElement, dy, gans, zhis, dy ? dy.startYear : null);
            const ge = ctx.primaryEl;
            return { els: ge ? [ge] : [caiEl], basis: `從弱格・繼續補耗洩（以最旺的${ge || caiEl}為主）` };
        }
        if (strengthLabel === '身強') return { els: [caiEl], basis: `身強（${totalScore}分）・補財` };
        const ctx = computeCareerContext(strengthLabel, totalScore, dayElement, dy, gans, zhis, dy ? dy.startYear : null);
        return ctx.asStrong
            ? { els: [caiEl], basis: `身弱（${totalScore}分）・${dy ? dy.ganZhi + '運' : ''}印比幫扶・補財` }
            : { els: [dayElement, yinEl], basis: `身弱（${totalScore}分）・${dy ? dy.ganZhi + '運' : '未起運'}財官食傷耗洩・補比劫、印` };
    }

    function careerPillarScore(gan, zhi, ctx, dayElement) {
        let n = 0;
        if (ctx.targets.includes(careerCatOf(ganElementMap[gan], dayElement))) n++;
        if (ctx.targets.includes(careerCatOf(ganElementMap[zhiMainGan(zhi)], dayElement))) n++;
        return n;
    }
    // 每柱：天干 30%＋地支本氣 70%（轉職為人生大事，地支只看本氣，從嚴）
    function careerPillarW(gan, zhi, ctx, dayElement) {
        const g = ctx.targets.includes(careerCatOf(ganElementMap[gan], dayElement)) ? 1 : 0;
        const z = ctx.targets.includes(careerCatOf(ganElementMap[zhiMainGan(zhi)], dayElement)) ? 1 : 0;
        return g * GZ_W.gan + z * GZ_W.zhi;
    }
    function careerScore(yG, yZ, mG, mZ, ctx, dayElement) {
        const y = careerPillarScore(yG, yZ, ctx, dayElement), m = careerPillarScore(mG, mZ, ctx, dayElement);
        const score = Math.round(careerPillarW(yG, yZ, ctx, dayElement) * 40 + careerPillarW(mG, mZ, ctx, dayElement) * 60);
        return { y, m, score, ok: score >= 60 };
    }

    /**
     * 官運旺流日（教材整理；教材組合為舉例，包含但不限於）：
     *  主看官殺星（剋我者），財星可生官為輔（天干官殺×地支財亦可）
     *  天干：官殺 1.0、財 0.5；地支：依藏干比重，官殺×1.0、財×0.5
     *  天干、地支皆含官殺或財，且當日有官殺出現 → 官旺日
     */
    function computeLiuriWork(dGan, dZhi, dayGan, dayElement) {
        const caiEl = wuxingRel[dayElement].ke;
        const gsEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        const val = g => ganElementMap[g] === gsEl ? 1.0 : (ganElementMap[g] === caiEl ? 0.5 : 0);
        const C = g => elementColors[ganElementMap[g]];
        const ganOK = val(dGan) > 0;
        let zhiE = 0; const zhiParts = [];
        const hw = zhiHiddenWeights[dZhi] || {};
        Object.keys(hw).forEach(hg => {
            const v = val(hg) * hw[hg];
            if (v > 0) { zhiE += v; zhiParts.push(`<b style="color:${C(hg)}">${hg}${getPreciseTenGod(hg, dayGan)}</b>${Math.round(hw[hg] * 100)}%`); }
        });
        const zhiOK = zhiE >= LIURI_ZHI_MIN;
        if (!zhiOK) { zhiE = 0; zhiParts.length = 0; }
        const hasGS = ganElementMap[dGan] === gsEl || (zhiOK && Object.keys(hw).some(hg => ganElementMap[hg] === gsEl));
        const score = Math.max(0, Math.min(100, Math.round((val(dGan) * GZ_W.gan + zhiE * GZ_W.zhi) * 100)));
        const tier = (ganOK && zhiOK && hasGS) ? '官旺日' : ((ganOK || zhiOK) ? '半官' : '平');
        const ganTxt = ganOK ? `天干<b style="color:${C(dGan)}">${dGan}${getPreciseTenGod(dGan, dayGan)}</b>` : '';
        const zhiTxt = zhiOK ? `地支${dZhi}含${zhiParts.join('、')}` : '';
        return { score, tier, ganOK, zhiOK, detail: [ganTxt, zhiTxt].filter(Boolean).join('；') };
    }

    /**
     * 人際流日（比劫能量）：不分身強身弱，掃描比肩、劫財旺的日子
     *  天干：比劫 1.0；地支：依量化系統藏干比重，比劫 ×1.0
     *  天干、地支皆含比劫 → 慎言日（人際交集旺，容易節外生枝、口角）
     *  身弱者比劫為幫扶，體感通常不明顯；身強者較容易感受到
     */
    function computeLiuriRen(dGan, dZhi, dayGan, dayElement) {
        const val = g => ganElementMap[g] === dayElement ? 1.0 : 0;
        const C = g => elementColors[ganElementMap[g]];
        const ganOK = val(dGan) > 0;
        let zhiE = 0; const zhiParts = [];
        const hw = zhiHiddenWeights[dZhi] || {};
        Object.keys(hw).forEach(hg => {
            const v = val(hg) * hw[hg];
            if (v > 0) { zhiE += v; zhiParts.push(`<b style="color:${C(hg)}">${hg}${getPreciseTenGod(hg, dayGan)}</b>${Math.round(hw[hg] * 100)}%`); }
        });
        const zhiOK = zhiE >= LIURI_ZHI_MIN;
        if (!zhiOK) { zhiE = 0; zhiParts.length = 0; }
        const score = Math.max(0, Math.min(100, Math.round((val(dGan) * GZ_W.gan + zhiE * GZ_W.zhi) * 100)));
        const tier = (ganOK && zhiOK) ? '慎言日' : ((ganOK || zhiOK) ? '人際活絡' : '平');
        const ganTxt = ganOK ? `天干<b style="color:${C(dGan)}">${dGan}${getPreciseTenGod(dGan, dayGan)}</b>` : '';
        const zhiTxt = zhiOK ? `地支${dZhi}含${zhiParts.join('、')}` : '';
        return { score, tier, ganOK, zhiOK, detail: [ganTxt, zhiTxt].filter(Boolean).join('；') };
    }

    /**
     * 流日三合／三會偵測（延伸應用，非教材規則）：
     *  只在「原局＋大運＋流年」已具兩字、由流日補上第三字時成立（原局本身已成局者不算）
     *  財局 → 財星加強；食傷局 → 食傷生財；比劫局 → 比劫奪財（破財）；
     *  印局／官殺局且原局含財地支被拉入 → 財星被化走（破財）
     */
    const JU_LIST = [
        { kind: '三合', zhi: ['申','子','辰'], el: '水' }, { kind: '三合', zhi: ['亥','卯','未'], el: '木' },
        { kind: '三合', zhi: ['寅','午','戌'], el: '火' }, { kind: '三合', zhi: ['巳','酉','丑'], el: '金' },
        { kind: '三會', zhi: ['寅','卯','辰'], el: '木' }, { kind: '三會', zhi: ['巳','午','未'], el: '火' },
        { kind: '三會', zhi: ['申','酉','戌'], el: '金' }, { kind: '三會', zhi: ['亥','子','丑'], el: '水' }
    ];
    // srcs：[{ zhi, from:'年支'|'月支'|'日支'|'時支'|'大運'|'流年', natal:bool }]
    function detectLiuriJu(dZhi, srcs, dayElement, topic) {
        const caiEl = wuxingRel[dayElement].ke, ssEl = wuxingRel[dayElement].sheng;
        const gsEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        const out = [];
        JU_LIST.forEach(ju => {
            if (!ju.zhi.includes(dZhi)) return;
            if (srcs.some(x => x.zhi === dZhi)) return; // 流日需補上「新的」一字
            const others = ju.zhi.filter(z => z !== dZhi);
            const used = others.map(z => srcs.find(x => x.zhi === z));
            if (used.some(u => !u)) return;
            const name = `${ju.zhi.join('')}${ju.kind === '三會' ? '會' : '合'}${ju.el}`;
            const from = used.map(u => `${u.from}${u.zhi}`).join('、');
            const strong = ju.kind === '三會';
            let effect = null;
            if (topic === 'ren') {
                if (ju.el === dayElement) out.push({ name, kind: ju.kind, from, members: ju.zhi, type: 'boost', label: '比劫局', bonus: strong ? 30 : 25 });
                return;
            }
            if (topic === 'work') {
                if (ju.el === gsEl) effect = { type: 'boost', label: '官殺局', bonus: strong ? 30 : 25 };
                else if (ju.el === caiEl) effect = { type: 'boost', label: '財局（財生官）', bonus: strong ? 15 : 12 };
                if (effect) out.push({ name, kind: ju.kind, from, members: ju.zhi, ...effect });
                return;
            }
            // 三合／三會只當加分項：財局、食傷局（比劫局、印局、官殺局暫不判破財）
            if (ju.el === caiEl) effect = { type: 'boost', label: '財局', bonus: strong ? 30 : 25 };
            else if (ju.el === ssEl) effect = { type: 'boost', label: '食傷局', bonus: strong ? 15 : 12 };
            if (effect) out.push({ name, kind: ju.kind, from, members: ju.zhi, ...effect });
        });
        return out;
    }

    function detectPoCai(dGan, dZhi, baseGans, baseZhis, dayGan, dayElement) {
        const caiEl = wuxingRel[dayElement].ke;
        const P = ['年', '月', '日', '時'];
        const zhiHasCai = z => Object.keys(zhiHiddenWeights[z] || {}).some(hg => ganElementMap[hg] === caiEl);
        const hits = [];
        baseZhis.forEach((z, i) => {
            if (!z || z === '-') return;
            if (zhiHasCai(z) && zhiChongMap[z] === dZhi) hits.push({ type: '沖', txt: `${dZhi}沖${P[i]}支${z}（財星）` });
            if (zhiHasCai(z) && zhiHeMap[z] === dZhi) hits.push({ type: '合', liuheZhi: z, txt: `${dZhi}${z}合，${P[i]}支財星被合絆` });
        });
        baseGans.forEach((g, i) => {
            if (i === 2 || !g || g === '-' || ganElementMap[g] !== caiEl) return;
            const z = baseZhis[i];
            if (z && zhiChongMap[z] === dZhi && !zhiHasCai(z)) hits.push({ type: '沖', txt: `${dZhi}沖${P[i]}支${z}，動及${P[i]}干財星${g}` });
            if (ganHeMap[g] === dGan) hits.push({ type: '合', txt: `${dGan}${g}合，${P[i]}干財星被合絆` });
        });
        return hits;
    }

    /**
     * 依當日十神屬性給出一句「可執行的」建議文字，取代單純的分數顯示。
     */
    function getLiuriSuggestion(ganTenGod) {
        const map = {
            '比肩': '人際互動旺，適合聚會交流，但避免合夥財務、借貸往來，防比肩奪利。',
            '劫財': '破財訊號較明顯，大額消費、借貸出借宜謹慎，避免衝動決策。',
            '食神': '心情較放鬆、表達力佳，適合創作、談合作、享受生活，忌過度耗費心神。',
            '傷官': '想法多、易鋒芒外露，適合腦力激盪，但溝通宜收斂，避免與上司衝突。',
            '正財': '利於穩健進財、記帳理財、簽訂長期契約，行動務實為佳。',
            '偏財': '機會財、業外收入運較旺，適合投資評估、拓展人脈，但忌貪快求多。',
            '正官': '責任感提升，適合處理公事、面談、簽約，行事宜按部就班守規矩。',
            '七殺': '壓力與挑戰感較重，決策宜謹慎保守，避免衝突對抗或高風險操作。',
            '正印': '適合學習、簽約用印、靜心規劃，貴人運佳，宜多請益前輩。',
            '偏印': '適合獨處思考、專業鑽研，但社交互動易顯冷淡，避免過度多疑。'
        };
        return map[ganTenGod] || '今日五行氣場平順，依既定計畫行事即可。';
    }

    // 全域版精確十神（含陰陽），供格局／用神判定使用（與 calculateBaziCore 內的 getSpecificShiShen 邏輯相同）
    // ===================================================================
    // 六親動態偵測器 (Relative_Dynamics_Scanner) — 子女星專屬偵測模組 (Child_Star_Scanner)
    // 角色映射：男命子女星＝官殺、女命子女星＝食傷（不分兒女、不論胎數）；子女宮＝時柱地支
    // 只做條件觸發與數據記錄，不做解讀；解讀交給 AI 提詞
    // ===================================================================
    const XING_PAIRS = ['子卯', '寅巳', '巳申', '申寅', '丑戌', '戌未', '未丑'];
    function getXingType(a, b) {
        if (!a || !b || a === '-' || b === '-') return null;
        if (a === b && ['辰', '午', '酉', '亥'].includes(a)) return '自刑';
        if (XING_PAIRS.includes(a + b) || XING_PAIRS.includes(b + a)) return '刑';
        return null;
    }

    function scanChildStars(ctx) {
        const { dg, dayElement, gender, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const childEl = gender === 1
            ? Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement)   // 男命：官殺（剋我者）
            : wuxingRel[dayElement].sheng;                                       // 女命：食傷（我生者）
        const childCatName = gender === 1 ? '官殺' : '食傷';
        const palaceZhi = baseZhis[3];

        // ---- 二、子女星定位與擷取（最大容量 3，依優先順序） ----
        const stars = [];
        const push = (s) => { if (stars.length < 3) stars.push(s); };
        // Priority 1：天干（日干為日主本身，略過）
        baseGans.forEach((g, i) => {
            if (i === 2 || g === '-' || ganElementMap[g] !== childEl) return;
            push({ gan: g, pillarIdx: i, layer: '天干' });
        });
        // Priority 2：地支主氣
        baseZhis.forEach((z, i) => {
            if (z === '-') return;
            const w = zhiHiddenWeights[z] || {};
            const sorted = Object.keys(w).sort((a, b) => w[b] - w[a]);
            if (sorted[0] && ganElementMap[sorted[0]] === childEl) push({ gan: sorted[0], pillarIdx: i, layer: '地支主氣' });
        });
        // Priority 3：地支中氣／餘氣
        baseZhis.forEach((z, i) => {
            if (z === '-') return;
            const w = zhiHiddenWeights[z] || {};
            const sorted = Object.keys(w).sort((a, b) => w[b] - w[a]);
            sorted.slice(1).forEach((hg, k) => {
                if (ganElementMap[hg] === childEl) push({ gan: hg, pillarIdx: i, layer: k === 0 ? '地支中氣' : '地支餘氣' });
            });
        });

        // ---- 三、狀態屬性判定 ----
        const dayHourChong = baseZhis[2] !== '-' && zhiChongMap[baseZhis[2]] === baseZhis[3];
        stars.forEach(s => {
            s.tenGod = getPreciseTenGod(s.gan, dg);
            s.pillarName = pNames[s.pillarIdx];
            s.sittingBranch = baseZhis[s.pillarIdx];
            if (s.layer === '天干') {
                const r = getTraditionalRoots(s.gan, s.pillarIdx, baseZhis, pNames);
                s.hasTonggen = r.roots.length > 0;
                s.tonggenLabel = r.label;
                s.hasTougan = true; // 本身就在天干
                s.touganLabel = '本身透干';
            } else {
                s.hasTonggen = true; // 本身就藏於地支
                s.tonggenLabel = s.layer;
                const exact = baseGans.some((g, i) => i !== 2 && g === s.gan);
                const sameEl = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === childEl);
                s.hasTougan = exact || sameEl;
                s.touganLabel = exact ? `「${s.gan}」透出` : (sameEl ? '同類透出' : '未透干');
            }
            // 子女緣分輕薄：①無通根或無透干（天干星本身已透看通根；地支星本身有根看透干）②日支與時支相沖

        });

        // ---- 四、動態歲運偵測 ----
        const sittingSet = [...new Set(stars.map(s => s.sittingBranch).filter(z => z && z !== '-'))];
        const targets = [{ zhi: palaceZhi, label: '子女宮' }];
        sittingSet.forEach(z => { if (z !== palaceZhi) targets.push({ zhi: z, label: `子女星(${z})` }); });

        // 依地支順序排出固定寫法（例：午子 → 子午）
        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                if (!t.zhi || t.zhi === '-') return;
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                // 三刑：歲運地支＋目標地支＋原局另一支 湊齊
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', name: `${pairName(inZhi, t.zhi)}刑`, target: t.label }); // 寅申、丑未已計沖，不重複標刑
            });
            return hits;
        };
        // 依教材「易懷孕時機」：① 子女星（男官殺／女食傷）透干 ② 地支主氣為子女星
        const checkStarArrival = (inGan, inZhi, ganLabel) => {
            const hits = [];
            if (inGan && ganElementMap[inGan] === childEl) hits.push('原星透干');
            const w = zhiHiddenWeights[inZhi] || {};
            const main = Object.keys(w).sort((a, b) => w[b] - w[a])[0];
            if (main && ganElementMap[main] === childEl) hits.push('地支主氣');
            return hits;
        };

        // 合：依所學體系暫只採「三合成子女星局」（歲運地支＋原局另兩支湊齊，且局的五行＝子女星）
        const SAN_HE = [['申','子','辰','水'], ['亥','卯','未','木'], ['寅','午','戌','火'], ['巳','酉','丑','金']];
        const checkHe = (inGan, inZhi) => {
            const hits = [];
            SAN_HE.forEach(([a, b, c, el]) => {
                if (el !== childEl || ![a, b, c].includes(inZhi)) return;
                if ([a, b, c].filter(z => z !== inZhi).every(z => baseZhis.includes(z)))
                    hits.push({ kind: '三合', name: `${a}${b}${c}三合${el}局` });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            const arrive = checkStarArrival(dy.gan, dy.zhi, '天干帶子女星');
            const he = checkHe(dy.gan, dy.zhi);
            if (clash.length || arrive.length || he.length) events.dayun.push({
                time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive, he
            });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const g = gz.charAt(0), z = gz.charAt(1);
            const clash = checkClash(z);
            const arrive = checkStarArrival(g, z, '流年天干透子女星');
            const he = checkHe(g, z);
            if (clash.length || arrive.length || he.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive, he });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const g = bz.getMonthGan(), z = bz.getMonthZhi();
            const clash = checkClash(z);
            const arrive = checkStarArrival(g, z, '流月天干透子女星');
            const he = checkHe(g, z);
            if (!clash.length && !arrive.length && !he.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({
                time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: g + z, isCurrent: i === 0, isPast: i < 0, clash, arrive, he
            });
        }

        // 子女個性判讀柱：子女星所在的柱（天干＋地支），去重後合併
        // 只用干支本身（五行陰陽），不帶命主十神：十神是「相對日主」的關係，不代表子女本身的個性
        const YANG_ZHI = '子寅辰午申戌';
        const personalityPillars = [...new Set(stars.map(s => s.pillarIdx))].sort().map(i => ({
            pillarName: pNames[i], gan: baseGans[i], zhi: baseZhis[i],
            ganDesc: `${stemPolarity[baseGans[i]] === 1 ? '陽' : '陰'}${ganElementMap[baseGans[i]]}`,
            zhiDesc: `${YANG_ZHI.includes(baseZhis[i]) ? '陽' : '陰'}${zhiElementMap[baseZhis[i]]}`
        }));

        // 整盤判定子女緣（不逐星判斷）
        // 子女緣強：①子女星干支相見（有通根／透干：天干星有根，或地支星有透）或 ②子女星坐子女宮（時支主氣為子女星），且日時支不相沖
        // 其餘皆為子女緣分輕薄（含原局不見子女星）
        const ganZhiMeet = stars.some(st => st.hasTonggen && st.hasTougan);
        const palaceMain = (() => { const w = zhiHiddenWeights[palaceZhi] || {}; const m = Object.keys(w).sort((a, b) => w[b] - w[a])[0]; return m && ganElementMap[m] === childEl ? m : null; })();
        const strongReasons = [];
        if (ganZhiMeet) strongReasons.push('子女星干支相見（通根透干）');
        if (palaceMain) strongReasons.push(`子女星坐子女宮（時支${palaceZhi}主氣${palaceMain}）`);
        const thinReasons = [];
        if (!stars.length) thinReasons.push('原局不見子女星');
        else if (!strongReasons.length) thinReasons.push('子女星未通根透干，也未坐子女宮');
        if (dayHourChong) thinReasons.push('日時支相沖');
        const affinity = (strongReasons.length && !dayHourChong) ? 'strong' : 'thin';

        return { childEl, childCatName, palaceZhi, stars, events, dayHourChong, dg, baseGans, baseZhis, personalityPillars,
            affinity, strongReasons, thinReasons };
    }

    /**
     * 六親迷你命盤：沿用上方排盤格式（時/日/月/年），十神改標為該分頁對應的「星」。
     * roleFn(gan) → 回傳角色名（例如「子女星」）或 null（非該星，改以淡色顯示原十神縮寫）
     */
    function renderRoleChart(baseGans, baseZhis, dg, isRoleFn, palaceIdx, palaceLabel, extraZhiRingIdx = []) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const names = ['年柱', '月柱', '日柱', '時柱'];
        const order = [3, 2, 1, 0];
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };
        const tg = (g, isDm) => isDm ? '日主' : (ssShort[getPreciseTenGod(g, dg)] || '');
        // 屬於該星的字加圈；地支只要藏有該星也圈起來
        const ring = (ch, color, on) => `<span class="rc-ch${on ? ' rc-ring' : ''}" style="color:${color}">${ch}</span>`;
        let h = `<div class="rc-wrap"><table class="rc-table"><tr>`;
        order.forEach(i => h += `<td class="rc-head">${names[i]}${i === palaceIdx ? `<div class="rc-palace">${palaceLabel}</div>` : ''}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-tg">${tg(baseGans[i], i === 2)}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ring(baseGans[i], elementColors[ganElementMap[baseGans[i]]] || '#888', i !== 2 && isRoleFn(baseGans[i]))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ring(baseZhis[i], elementColors[zhiElementMap[baseZhis[i]]] || '#888', hiddenOf(baseZhis[i]).some(isRoleFn) || extraZhiRingIdx.includes(i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => {
            h += `<td class="rc-hidden">` + hiddenOf(baseZhis[i]).map(g =>
                `<div>${ring(g, elementColors[ganElementMap[g]], isRoleFn(g))}<span style="color:${elementColors[ganElementMap[g]]}">${tg(g, false)}</span></div>`
            ).join('') + `</td>`;
        });
        h += `</tr></table></div>`;
        return h;
    }

    function renderChildScanHtml(scan) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const elC = elementColors[scan.childEl];
        let html = `
            <div class="rel-summary">
                <span>子女宮 <b>時支「${scan.palaceZhi}」</b></span>
                <span>子女星 <b style="color:${elC}">${scan.childCatName}（${scan.childEl}）</b></span>
                <span>${scan.affinity === 'strong'
                    ? `<span class="tag tag-star">子女緣強</span> <span class="rel-thin-why">${scan.strongReasons.join('・')}</span>`
                    : `<span class="tag tag-chong">子女緣分輕薄</span> <span class="rel-thin-why">${scan.thinReasons.join('・')}</span>`}</span>
            </div>
        `;
        html += renderRoleChart(scan.baseGans, scan.baseZhis, scan.dg,
            (g) => ganElementMap[g] === scan.childEl, 3, '子女宮');
        if (scan.personalityPillars.length) {
            html += `<div class="rel-persona">🧬 子女個性判讀柱：` + scan.personalityPillars.map(pp =>
                `<b>${pp.pillarName}柱 <span style="color:${elementColors[ganElementMap[pp.gan]]}">${pp.gan}</span><span style="color:${elementColors[zhiElementMap[pp.zhi]]}">${pp.zhi}</span></b>`
            ).join('、') + `</div>`;
        }
        if (scan.stars.length === 0) {
            html += `<div class="rel-empty"><span class="tag tag-neutral">原局不見子女星</span></div>`;
        } else {
            html += `<div class="rel-star-grid">` + scan.stars.map(s => `
                <div class="rel-star-card">
                    <div class="rel-star-head">
                        <span class="rel-star-gan" style="color:${elementColors[ganElementMap[s.gan]]}">${s.gan}<small>${ssShort[s.tenGod] || s.tenGod}</small></span>
                        <span class="rel-star-pos">${s.pillarName}・${s.layer}</span>
                    </div>
                    <div class="rel-star-row"><span>坐柱</span><b>${s.pillarName}柱 ${scan.baseGans[s.pillarIdx]}${s.sittingBranch}</b></div>
                    <div class="rel-star-row"><span>通根</span><b class="${s.hasTonggen ? 'ok' : 'ng'}">${s.tonggenLabel}</b></div>
                    <div class="rel-star-row"><span>透干</span><b class="${s.hasTougan ? 'ok' : 'ng'}">${s.touganLabel}</b></div>
                </div>
            `).join('') + `</div>`;
        }

        html += renderRelEventBlocks(scan.events);
        return html;
    }

    function renderRelEventBlocks(events) {
        const evRow = (e) => {
            const tags = e.clash.map(c => `<span class="tag ${c.type === '沖' ? 'tag-chong' : 'tag-xing'}">${c.name}・${c.target}</span>`)
                .concat(e.arrive.map(a => `<span class="tag tag-star">${a}</span>`))
                .concat((e.he || []).map(h => `<span class="tag tag-sanhe">${h.name}</span>`)).join(' ');
            return `
                <div class="rel-ev-row${e.isCurrent ? ' is-current' : ''}${e.isPast ? ' is-past' : ''}">
                    <div class="rel-ev-time">${e.time}${e.isCurrent ? ' <span class="rel-now">現在</span>' : ''}</div>
                    <div class="rel-ev-gz">${e.ganZhi.split('').map(c => `<span style="color:${elementColors[ganElementMap[c] || zhiElementMap[c]]}">${c}</span>`).join('')}</div>
                    <div class="rel-ev-tags">${tags}</div>
                </div>`;
        };
        const evBlock = (title, list, emptyMsg) => `
            <div class="rel-ev-block">
                <div class="rel-ev-title">${title}</div>
                ${list.length ? list.map(evRow).join('') : `<div class="rel-ev-empty">${emptyMsg}</div>`}
            </div>`;
        return evBlock('🌊 大運', events.dayun, '各步大運無觸發')
            + evBlock('📆 流年（前後 3 年）', events.liunian, '此區間無觸發')
            + evBlock('🗓️ 流月（前 6 月＋後 12 月）', events.liuyue, '此區間無觸發');
    }

    function buildChildScanPromptText(scan) {
        let t = `子女宮：時支「${scan.palaceZhi}」；子女星＝${scan.childCatName}（${scan.childEl}），不分兒女、不論胎數。\n`;
        t += `日支與時支相沖：${scan.dayHourChong ? '是' : '否'}\n`;
        t += scan.affinity === 'strong'
            ? `整體子女緣：[子女緣強]（${scan.strongReasons.join('、')}）\n`
            : `整體子女緣：[子女緣分輕薄]（${scan.thinReasons.join('、')}）\n`;
        if (scan.stars.length === 0) t += '原局子女星：無\n';
        scan.stars.forEach((s, i) => {
            t += `子女星${i + 1}：${s.gan}（${s.tenGod}）位於${s.pillarName}柱${s.layer}；通根：${s.tonggenLabel}；透干：${s.touganLabel}`;
            t += '\n';
        });
        if (scan.personalityPillars.length) {
            t += `子女個性判讀柱（以該柱天干＋地支合併判斷${scan.personalityPillars.length > 1 ? '，多柱請綜合判讀' : ''}）[推斷子女個性]：` +
                scan.personalityPillars.map(pp => `${pp.pillarName}柱「${pp.gan}${pp.zhi}」（${pp.gan}${pp.ganDesc}、${pp.zhi}${pp.zhiDesc}）`).join('、') +
                '。請只依干支本身的五行陰陽與干支組合推斷子女性格，勿以命主十神（正財、七殺等）推斷子女個性。\n';
        }
        const fmt = (e) => {
            const parts = [];
            if (e.clash.length) parts.push(`子女宮/星被沖刑（${e.clash.map(c => c.name + '・' + c.target).join('、')}）[推斷突發事件或變動]`);
            if (e.arrive.length) parts.push(`歲運現子女星（${e.arrive.join('、')}）[推斷得子時機]`);
            (e.he || []).forEach(h => parts.push(`${h.name}（子女星局）[推斷得子時機・力量強]`));
            return `- ${e.time} ${e.ganZhi}${e.isCurrent ? '（現在）' : (e.isPast ? '（已過，供驗證）' : '')}：${parts.join('；')}`;
        };
        t += '大運觸發：\n' + (scan.events.dayun.length ? scan.events.dayun.map(fmt).join('\n') : '- 無') + '\n';
        t += '流年觸發：\n' + (scan.events.liunian.length ? scan.events.liunian.map(fmt).join('\n') : '- 無') + '\n';
        t += '流月觸發：\n' + (scan.events.liuyue.length ? scan.events.liuyue.map(fmt).join('\n') : '- 無');
        return t;
    }

    // ===================================================================
    // 兄弟星偵測 (Sibling_Star_Scanner)：比劫星＝與日主同五行；只掃比劫星坐支被歲運沖刑
    // ===================================================================
    function scanSiblingStars(ctx) {
        const { dg, dayElement, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const el = dayElement;
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };

        // 擷取規則同父母星：天干有比劫必取 1 顆；地支主氣有比劫必取 1 顆；
        // 兩者皆無，才往地支中氣→餘氣找 1 顆（同層取比重最高）。順序：月→年→日→時（月柱為兄弟宮）
        const stars = [];
        const ORDER = [1, 0, 2, 3];
        const gi = ORDER.find(i => i !== 2 && baseGans[i] !== '-' && ganElementMap[baseGans[i]] === el);
        if (gi !== undefined) stars.push({ gan: baseGans[gi], pillarIdx: gi, layer: '天干' });
        const zi = ORDER.find(i => baseZhis[i] !== '-' && ganElementMap[hiddenOf(baseZhis[i])[0]] === el);
        if (zi !== undefined) stars.push({ gan: hiddenOf(baseZhis[zi])[0], pillarIdx: zi, layer: '地支主氣' });
        if (!stars.length) {
            for (const [pos, layerName] of [[1, '地支中氣'], [2, '地支餘氣']]) {
                let best = null;
                ORDER.forEach(i => {
                    const z = baseZhis[i], hg = hiddenOf(z)[pos];
                    if (hg && ganElementMap[hg] === el && (!best || zhiHiddenWeights[z][hg] > best.w)) best = { i, hg, w: zhiHiddenWeights[z][hg] };
                });
                if (best) { stars.push({ gan: best.hg, pillarIdx: best.i, layer: layerName }); break; }
            }
        }

        stars.forEach(st => {
            st.tenGod = getPreciseTenGod(st.gan, dg);
            st.pillarName = pNames[st.pillarIdx];
            st.sittingBranch = baseZhis[st.pillarIdx];
            if (st.layer === '天干') {
                const r = getTraditionalRoots(st.gan, st.pillarIdx, baseZhis, pNames);
                st.hasTonggen = r.roots.length > 0; st.tonggenLabel = r.label;
                st.hasTougan = true; st.touganLabel = '本身透干';
            } else {
                st.hasTonggen = true; st.tonggenLabel = st.layer;
                const exact = baseGans.some((g, i) => i !== 2 && g === st.gan);
                const sameEl = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === el);
                st.hasTougan = exact || sameEl;
                st.touganLabel = exact ? `「${st.gan}」透出` : (sameEl ? '同類透出' : '未透干');
            }
        });

        // 目標：比劫星坐支（去重）
        const targets = [];
        stars.forEach(st => { if (st.sittingBranch && st.sittingBranch !== '-' && !targets.some(t => t.idx === st.pillarIdx)) targets.push({ idx: st.pillarIdx, zhi: st.sittingBranch, label: `比劫(${st.sittingBranch})` }); });

        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', name: `${pairName(inZhi, t.zhi)}刑`, target: t.label });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            if (clash.length) events.dayun.push({ time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const clash = checkClash(gz.charAt(1));
            if (clash.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const clash = checkClash(bz.getMonthZhi());
            if (!clash.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash, arrive: [] });
        }
        return { el, stars, targets, events, dg, baseGans, baseZhis };
    }

    function renderSiblingScanHtml(scan) {
        const ssShort = { '比肩':'比', '劫財':'劫' };
        let html = `
            <div class="rel-summary">
                <span>兄弟星 <b style="color:${elementColors[scan.el]}">比劫（${scan.el}）</b></span>
                <span>比劫坐支 <b>${scan.targets.length ? scan.targets.map(t => `${t.zhi}`).join('、') : '無'}</b></span>
            </div>
        `;
        // 只圈選中的那顆比劫星，以及它的坐支
        const SIB_RING = '#2ed573';
        const marks = [];
        scan.stars.forEach(st => {
            if (st.layer === '天干') marks.push({ type: 'gan', idx: st.pillarIdx, gan: null, color: SIB_RING });
            else marks.push({ type: 'zhi', idx: st.pillarIdx, gan: st.gan, color: SIB_RING });
            marks.push({ type: 'zhi', idx: st.pillarIdx, gan: null, color: SIB_RING });
        });
        html += renderMarkedChart(scan.baseGans, scan.baseZhis, scan.dg, marks);
        if (scan.stars.length === 0) {
            html += `<div class="rel-empty"><span class="tag tag-neutral">原局不見比劫星</span></div>`;
        } else {
            html += `<div class="rel-star-grid">` + scan.stars.map(st => `
                <div class="rel-star-card">
                    <div class="rel-star-head">
                        <span class="rel-star-gan" style="color:${elementColors[ganElementMap[st.gan]]}">${st.gan}<small>${ssShort[st.tenGod] || st.tenGod}</small></span>
                        <span class="rel-star-pos">${st.pillarName}・${st.layer}</span>
                    </div>
                    <div class="rel-star-row"><span>坐柱</span><b>${st.pillarName}柱 ${scan.baseGans[st.pillarIdx]}${st.sittingBranch}</b></div>
                    <div class="rel-star-row"><span>通根</span><b class="${st.hasTonggen ? 'ok' : 'ng'}">${st.tonggenLabel}</b></div>
                    <div class="rel-star-row"><span>透干</span><b class="${st.hasTougan ? 'ok' : 'ng'}">${st.touganLabel}</b></div>
                </div>
            `).join('') + `</div>`;
        }
        html += renderRelEventBlocks(scan.events);
        return html;
    }

    function buildSiblingScanPromptText(scan) {
        let t = `兄弟星＝比劫（${scan.el}，與日主同五行），天干有取 1 顆、地支主氣有取 1 顆；兩者皆無才取地支中氣或餘氣 1 顆（用於提醒手足安危）。\n`;
        if (scan.stars.length === 0) t += '原局比劫星：無\n';
        scan.stars.forEach((st, i) => {
            t += `比劫星${i + 1}：${st.gan}（${st.tenGod}）位於${st.pillarName}柱${st.layer}，坐支「${st.sittingBranch}」；通根：${st.tonggenLabel}；透干：${st.touganLabel}\n`;
        });
        const fmt = (e) => `- ${e.time} ${e.ganZhi}${e.isCurrent ? '（現在）' : (e.isPast ? '（已過，供驗證）' : '')}：比劫坐支被沖刑（${e.clash.map(c => c.name + '・' + c.target).join('、')}）[推斷兄弟手足變動]`;
        t += '大運觸發：\n' + (scan.events.dayun.length ? scan.events.dayun.map(fmt).join('\n') : '- 無') + '\n';
        t += '流年觸發：\n' + (scan.events.liunian.length ? scan.events.liunian.map(fmt).join('\n') : '- 無') + '\n';
        t += '流月觸發：\n' + (scan.events.liuyue.length ? scan.events.liuyue.map(fmt).join('\n') : '- 無');
        return t;
    }

    // ===================================================================
    // 父母星偵測 (Parent_Star_Scanner)：母＝印星（生我者）、父＝財星（我剋者），不分正偏
    // 每位家人最多 2 顆：天干 1 顆（月→年→時）＋地支 1 顆（主氣優先；無主氣則取藏干比重最高者）
    // 掃描：父母星所在柱的地支，被大運／流年／流月沖刑（依教材「家人星該柱地支」）
    // ===================================================================
    const YIMA_ZHI = '寅申巳亥', SIKU_ZHI = '辰戌丑未';
    function scanParentStars(ctx) {
        const { dg, dayElement, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const motherEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        const fatherEl = wuxingRel[dayElement].ke;
        const PILLAR_ORDER = [1, 0, 2, 3]; // 父母以月、年柱優先
        const hiddenSorted = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };

        // 擷取規則（依藏干表的主氣／中氣／餘氣排列）：
        // 天干有就取 1 顆；地支主氣有就取 1 顆；兩者都沒有，才往地支中氣→餘氣找 1 顆（同層取比重最高者）
        const pickStars = (el, who) => {
            const picked = [];
            const gi = PILLAR_ORDER.find(i => i !== 2 && baseGans[i] !== '-' && ganElementMap[baseGans[i]] === el);
            if (gi !== undefined) picked.push({ who, gan: baseGans[gi], pillarIdx: gi, layer: '天干' });
            const zi = PILLAR_ORDER.find(i => baseZhis[i] !== '-' && ganElementMap[hiddenSorted(baseZhis[i])[0]] === el);
            if (zi !== undefined) picked.push({ who, gan: hiddenSorted(baseZhis[zi])[0], pillarIdx: zi, layer: '地支主氣' });
            if (!picked.length) {
                for (const [pos, layerName] of [[1, '地支中氣'], [2, '地支餘氣']]) {
                    let best = null;
                    PILLAR_ORDER.forEach(i => {
                        const z = baseZhis[i], hg = hiddenSorted(z)[pos];
                        if (hg && ganElementMap[hg] === el && (!best || zhiHiddenWeights[z][hg] > best.w)) best = { i, hg, w: zhiHiddenWeights[z][hg] };
                    });
                    if (best) { picked.push({ who, gan: best.hg, pillarIdx: best.i, layer: layerName }); break; }
                }
            }
            picked.forEach(st => {
                st.tenGod = getPreciseTenGod(st.gan, dg);
                st.pillarName = pNames[st.pillarIdx];
                st.sittingBranch = baseZhis[st.pillarIdx];
                if (st.layer === '天干') {
                    const r = getTraditionalRoots(st.gan, st.pillarIdx, baseZhis, pNames);
                    st.hasTonggen = r.roots.length > 0; st.hasTougan = true;
                } else {
                    st.hasTonggen = true;
                    st.hasTougan = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === el);
                }
            });
            return picked;
        };

        const mother = pickStars(motherEl, '母');
        const father = pickStars(fatherEl, '父');

        // 目標：父母星所在柱的地支（同一支同時是父母星時合併標示）
        const targets = [];
        [...mother, ...father].forEach(st => {
            const ex = targets.find(t => t.idx === st.pillarIdx);
            if (ex) { if (!ex.who.includes(st.who)) ex.who.push(st.who); }
            else targets.push({ idx: st.pillarIdx, zhi: st.sittingBranch, who: [st.who] });
        });
        targets.forEach(t => t.label = `${t.who.join('、')}(${t.zhi})`);

        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        // 刑的性質：驛馬（寅申巳亥）＝出入安全；四庫（辰戌丑未）＝健康檢查；其餘（子卯、午午、酉酉）＝一般刑
        const xingKind = (chars) => [...chars].every(c => YIMA_ZHI.includes(c)) ? '驛馬' : ([...chars].every(c => SIKU_ZHI.includes(c)) ? '四庫' : '');
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', kind: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', kind: xingKind(trio.join('')), name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', kind: xingKind(inZhi), name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', kind: xingKind(inZhi + t.zhi), name: `${pairName(inZhi, t.zhi)}刑`, target: t.label });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            if (clash.length) events.dayun.push({ time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const clash = checkClash(gz.charAt(1));
            if (clash.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const clash = checkClash(bz.getMonthZhi());
            if (!clash.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash, arrive: [] });
        }
        return { motherEl, fatherEl, mother, father, targets, events, dg, baseGans, baseZhis };
    }

    const PARENT_RING = { '母': '#ff6b9d', '父': '#ffb347' };

    // 指定位置加圈的迷你命盤（每顆星可用不同顏色）
    function renderMarkedChart(baseGans, baseZhis, dg, marks) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const names = ['年柱', '月柱', '日柱', '時柱'];
        const order = [3, 2, 1, 0];
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };
        const tg = (g, isDm) => isDm ? '日主' : (ssShort[getPreciseTenGod(g, dg)] || '');
        const ringColor = (type, idx, g) => { const m = marks.find(mk => mk.type === type && mk.idx === idx && (!g || mk.gan === g)); return m ? m.color : null; };
        const ch = (c, color, rc) => `<span class="rc-ch${rc ? ' rc-ring' : ''}" style="color:${color};${rc ? `border-color:${rc};` : ''}">${c}</span>`;
        let h = `<div class="rc-wrap"><table class="rc-table"><tr>`;
        order.forEach(i => h += `<td class="rc-head">${names[i]}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-tg">${tg(baseGans[i], i === 2)}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ch(baseGans[i], elementColors[ganElementMap[baseGans[i]]] || '#888', ringColor('gan', i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ch(baseZhis[i], elementColors[zhiElementMap[baseZhis[i]]] || '#888', ringColor('zhi', i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => {
            h += `<td class="rc-hidden">` + hiddenOf(baseZhis[i]).map(g =>
                `<div>${ch(g, elementColors[ganElementMap[g]], ringColor('zhi', i, g))}<span style="color:${elementColors[ganElementMap[g]]}">${tg(g, false)}</span></div>`
            ).join('') + `</td>`;
        });
        h += `</tr></table></div>`;
        return h;
    }

    function renderParentScanHtml(scan) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const all = [...scan.mother, ...scan.father];
        const marks = all.map(st => ({ type: st.layer === '天干' ? 'gan' : 'zhi', idx: st.pillarIdx, gan: st.layer === '天干' ? null : st.gan, color: PARENT_RING[st.who] }));
        let html = `
            <div class="rel-summary">
                <span><i class="rel-dot" style="border-color:${PARENT_RING['母']}"></i>母星 <b style="color:${elementColors[scan.motherEl]}">印（${scan.motherEl}）</b></span>
                <span><i class="rel-dot" style="border-color:${PARENT_RING['父']}"></i>父星 <b style="color:${elementColors[scan.fatherEl]}">財（${scan.fatherEl}）</b></span>
            </div>
        `;

        html += renderMarkedChart(scan.baseGans, scan.baseZhis, scan.dg, marks);
        const card = (st) => `
            <div class="rel-star-card" style="border-color:${PARENT_RING[st.who]}55">
                <div class="rel-star-head">
                    <span class="rel-star-gan" style="color:${elementColors[ganElementMap[st.gan]]}">${st.gan}<small>${ssShort[st.tenGod] || st.tenGod}</small></span>
                    <span class="rel-star-pos"><b style="color:${PARENT_RING[st.who]}">${st.who}星</b><br>${st.pillarName}・${st.layer}</span>
                </div>
                <div class="rel-star-row"><span>坐柱</span><b>${st.pillarName}柱 ${scan.baseGans[st.pillarIdx]}${st.sittingBranch}</b></div>
            </div>`;
        const missing = [];
        if (!scan.mother.length) missing.push('原局不見印星（母星）');
        if (!scan.father.length) missing.push('原局不見財星（父星）');
        if (missing.length) html += `<div class="rel-empty">${missing.map(m => `<span class="tag tag-neutral">${m}</span>`).join(' ')}</div>`;
        if (all.length) html += `<div class="rel-star-grid">${all.map(card).join('')}</div>`;
        html += renderRelEventBlocks(scan.events);
        return html;
    }

    function buildParentScanPromptText(scan) {
        let t = `母星＝印星（${scan.motherEl}），父星＝財星（${scan.fatherEl}），不分正偏。天干有取 1 顆、地支主氣有取 1 顆；兩者皆無才取地支中氣或餘氣 1 顆。\n`;
        const line = (arr, who) => arr.length
            ? arr.map(st => `${who}星：${st.gan}（${st.tenGod}）位於${st.pillarName}柱${st.layer}，該柱地支「${st.sittingBranch}」`).join('\n') + '\n'
            : `${who}星：原局無\n`;
        t += line(scan.mother, '母') + line(scan.father, '父');

        const tagOf = (c) => c.kind === '四庫' ? '[推斷家人健康檢查]' : '[推斷家人出入安全]';
        const fmt = (e) => `- ${e.time} ${e.ganZhi}${e.isCurrent ? '（現在）' : (e.isPast ? '（已過，供驗證）' : '')}：` +
            e.clash.map(c => `${c.name}・${c.target}${c.kind === '驛馬' ? '（驛馬刑）' : c.kind === '四庫' ? '（四庫刑）' : ''} ${tagOf(c)}`).join('；');
        t += '大運觸發：\n' + (scan.events.dayun.length ? scan.events.dayun.map(fmt).join('\n') : '- 無') + '\n';
        t += '流年觸發：\n' + (scan.events.liunian.length ? scan.events.liunian.map(fmt).join('\n') : '- 無') + '\n';
        t += '流月觸發：\n' + (scan.events.liuyue.length ? scan.events.liuyue.map(fmt).join('\n') : '- 無');
        return t;
    }

    function switchRelTab(name) {
        document.querySelectorAll('.rel-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.rel-tab-panel').forEach(p => p.style.display = (p.dataset.tab === name ? 'block' : 'none'));
    }

    function getPreciseTenGod(targetGan, dGan) {
        if (!targetGan || targetGan === '-') return '';
        const tEl = ganElementMap[targetGan], dEl = ganElementMap[dGan];
        const samePol = stemPolarity[targetGan] === stemPolarity[dGan];
        if (tEl === dEl) return samePol ? '比肩' : '劫財';
        if (wuxingRel[dEl].sheng === tEl) return samePol ? '食神' : '傷官';
        if (wuxingRel[dEl].ke === tEl) return samePol ? '偏財' : '正財';
        if (wuxingRel[tEl].ke === dEl) return samePol ? '七殺' : '正官';
        if (wuxingRel[tEl].sheng === dEl) return samePol ? '偏印' : '正印';
        return '';
    }

    /**
     * 獨立的「從格」判斷——完全不使用量化系統總分，改用傳統子平「通根有無」＋
     * 「滿盤一面倒（比劫印 or 財官食傷其中一方掛零）」的離散式判斷，與量化分數系統脫鉤。
     * 回傳 '從強' / '從弱' / null（null 代表不成立從格，仍依正格常規論）。
     */
    function checkCongGeIndependently(dGan, dayElement, baseGans, baseZhis, pNames, genEl) {
        const dayIndex = pNames.indexOf('日');
        const dayRoots = getTraditionalRoots(dGan, dayIndex, baseZhis, pNames);
        const hasRoot = dayRoots.roots.length > 0;

        const catOf = (el) => {
            if (el === dayElement) return '比劫';
            if (el === genEl) return '印';
            if (wuxingRel[dayElement].sheng === el) return '食傷';
            if (wuxingRel[dayElement].ke === el) return '財';
            return '官殺';
        };
        let helpCount = 0, drainCount = 0; // 統計日干以外的 3 天干＋4 地支本氣，落在「印比」或「財官食傷」哪一邊
        baseGans.forEach((g, idx) => {
            if (idx === dayIndex || g === '-') return;
            const cat = catOf(ganElementMap[g]);
            if (cat === '比劫' || cat === '印') helpCount++; else drainCount++;
        });
        baseZhis.forEach((z) => {
            if (z === '-') return;
            const cat = catOf(zhiElementMap[z]);
            if (cat === '比劫' || cat === '印') helpCount++; else drainCount++;
        });

        if (!hasRoot && helpCount === 0) return '從弱';
        if (hasRoot && drainCount === 0) return '從強';
        return null;
    }

    /**
     * 子平格局定式＋用神／忌神判定（簡化版，僅供參考，非嚴格對應單一流派）。
     * 格局：以月令（月支）藏干為主氣，優先採「已透干」者定格；比肩／劫財月令另定建祿／羊刃（月劫）；
     *       從強格／從弱格的判定改用傳統子平「通根＋滿盤一面倒」的獨立邏輯（見 checkCongGeIndependently），
     *       與下方「用神／忌神」的量化分數（量化系統）判斷脫鉤，兩者刻意採不同方法。
     * 用神／忌神：先判斷是否需要調候（月支寒暖＋原局水火比例），調候優先於扶抑；
     *            從格時用神方向依上方獨立判斷的從強／從弱而定；非從格時才採用量化系統的量化身強／身弱。
     */
    function determineGeJuAndYongShen(mz, dGan, dayElement, baseGans, baseZhis, pNames, strengthLabel, elementCount, totalElements) {
        // ---- 1. 格局：月令司令神（本氣優先，若有其他藏干已透干則以透干者優先） ----
        const hideGansObj = zhiHiddenWeights[mz] || {};
        const sortedCandidates = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
        const benQiGan = sortedCandidates[0];
        // 傳統子平：建祿／羊刃（月劫）只看「月令本氣」是否為比劫；
        // 雜氣月（如丑辰未戌）中、餘氣的比劫即使透干也不另成格，改取其他透干者，皆無則取本氣。
        // （另排除日干本身：日干不算「透出」）
        const isBiJieGan = g => ganElementMap[g] === dayElement;
        const otherGans = baseGans.filter((g, i) => g && g !== '-' && i !== pNames.indexOf('日'));
        let geJuGan, skippedBiJie = null;
        if (isBiJieGan(benQiGan)) {
            geJuGan = benQiGan;
        } else {
            const transparentCandidate = sortedCandidates.find(c => otherGans.includes(c) && !isBiJieGan(c));
            skippedBiJie = sortedCandidates.find(c => otherGans.includes(c) && isBiJieGan(c)) || null;
            geJuGan = transparentCandidate || benQiGan;
        }
        const isTou = otherGans.includes(geJuGan);
        const geJuTenGod = getPreciseTenGod(geJuGan, dGan);

        const geJuNameMap = {
            '正官': '正官格', '七殺': '七殺格', '正財': '正財格', '偏財': '偏財格',
            '食神': '食神格', '傷官': '傷官格', '正印': '正印格', '偏印': '偏印格'
        };
        let geJuBaseName;
        if (geJuTenGod === '比肩') {
            geJuBaseName = '建祿格';
        } else if (geJuTenGod === '劫財') {
            geJuBaseName = (stemPolarity[dGan] === 1) ? '羊刃格' : '月劫格';
        } else {
            geJuBaseName = geJuNameMap[geJuTenGod] || '雜氣格';
        }

        // 獨立判斷從格（不依賴量化系統總分）
        const genEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        const congGeResult = checkCongGeIndependently(dGan, dayElement, baseGans, baseZhis, pNames, genEl);

        let geJuName = geJuBaseName;
        let isExtreme = !!congGeResult;
        if (isExtreme) {
            const extremeLabel = congGeResult === '從強' ? '從強格（專旺）' : '從弱格';
            geJuName = `${extremeLabel}（不依正格論，原局月令本屬${geJuBaseName}；依傳統子平通根＋滿盤判定，非量化系統分數）`;
        }
        const geJuNote = `月支「${mz}」藏干以「${geJuGan}」定格${isTou ? '，且已透干（格局清晰）' : '，未透干，僅以藏干本氣論格'}` +
            (skippedBiJie ? `；${skippedBiJie}為比劫透出，不另成格` : '');

        // ---- 2. 調候判斷（優先於扶抑） ----
        const pct = (el) => totalElements > 0 ? (elementCount[el] / totalElements) * 100 : 0;
        const winterZhi = ['亥', '子', '丑'], summerZhi = ['巳', '午', '未'];
        let tiaohou = null;
        if (winterZhi.includes(mz) && pct('火') < 12) {
            tiaohou = { need: ['火', '木'], avoid: ['水', '金'], reason: `月支「${mz}」屬冬季寒月，原局火僅約 ${pct('火').toFixed(0)}%，調候優先，需以火（次選木生火）為用` };
        } else if (summerZhi.includes(mz) && pct('水') < 12) {
            tiaohou = { need: ['水', '金'], avoid: ['火', '木'], reason: `月支「${mz}」屬夏季炎月，原局水僅約 ${pct('水').toFixed(0)}%，調候優先，需以水（次選金生水）為用` };
        }

        // ---- 3. 扶抑用神／忌神（十神類別 → 換算對應五行） ----
        const catToEl = {
            '比劫': dayElement,
            '印': genEl,
            '食傷': wuxingRel[dayElement].sheng,
            '財': wuxingRel[dayElement].ke,
            '官殺': Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement)
        };
        const toElements = (cats) => [...new Set(cats.map(c => catToEl[c]))];

        let yongCats, jiCats, logicNote;
        if (congGeResult === '從強') {
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '從強格：日主氣勢已成一方獨大，用神反取比劫、印星以順其勢；財官食傷逆勢而為，稱忌神。（此判斷依傳統子平通根＋滿盤，非量化系統分數）';
        } else if (congGeResult === '從弱') {
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '從弱格：日主氣勢已從他方，用神反取財官食傷順其強勢；比劫印星欲扶身反而逆勢，稱忌神。（此判斷依傳統子平通根＋滿盤，非量化系統分數）';
        } else if (strengthLabel === '身強' || strengthLabel === '從強格') {
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '身強：日主偏旺（依量化系統判定），用神取財官食傷剋洩耗身；印比為忌神，恐助身過旺。';
        } else {
            // 涵蓋 strengthLabel === '身弱' 或 '從弱格'：只要獨立判斷未成立從格，一律以正格「身弱」扶抑邏輯處理
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '身弱：日主偏弱（依量化系統判定），用神取比劫印星生扶日主；財官食傷為忌神，恐耗身過度。';
        }

        let yongElements = toElements(yongCats), jiElements = toElements(jiCats);
        let tiaohouActive = false;
        if (tiaohou) {
            tiaohouActive = true;
            yongElements = tiaohou.need;
            jiElements = tiaohou.avoid;
            logicNote = `【調候優先於扶抑】${tiaohou.reason}。扶抑判斷僅供次要參考：${logicNote}`;
        }

        return {
            geJuName, geJuBaseName, geJuGan, geJuTenGod, geJuNote, isExtreme, congGeResult,
            yongElements, jiElements, yongCats, jiCats, logicNote, tiaohouActive
        };
    }

    function generate12MonthTactics(dg, dz, mg, mz, tg, tz, yg, yz, dayElement, gender) {
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); 

        let tactics = { love: [], career: [], wealth: [], health: [], family: [] };
        
        const baseGans = [yg, mg, dg, tg];
        const baseZhis = [yz, mz, dz, tz];
        const pNames = ['年', '月', '日', '時'];

        const months = [], ev = [];
        const addTactic = (cat, monthStr, badge, desc, kind, mi) => {
            ev.push({ cat, kind, mi, desc });
            tactics[cat].push(`
                <tr class="lm-month-row"><td colspan="2"><span class="lm-month-chip">📅 ${monthStr}</span></td></tr>
                <tr class="lm-event-row">
                    <td class="lm-badge-cell">${badge}</td>
                    <td class="lm-desc-cell">${desc}</td>
                </tr>
            `);
        };

        for(let i = -6; i <= 12; i++) {
            let d = new Date(currentYear, currentMonth + i, 15);
            let y = d.getFullYear();
            let m = d.getMonth() + 1;
            
            const solar = Solar.fromYmd(y, m, 15);
            const lunar = solar.getLunar();
            const bazi = lunar.getEightChar();
            let mGan = bazi.getMonthGan();
            let mZhi = bazi.getMonthZhi();

            const jieRange = getJieQiRange(solar);
            const timeText = jieRange
                ? `${jieRange.startLabel} ~ ${jieRange.endLabel}`
                : `${y}年${m}月`; // 節氣資料抓取失敗時的備援顯示
            // 時間格式比照六親分頁：過去＝深藍、現在＝亮藍＋「現在」標記；干支依五行上色
            const gzHtml = `<span style="color:${elementColors[ganElementMap[mGan]]}">${mGan}</span><span style="color:${elementColors[zhiElementMap[mZhi]]}">${mZhi}</span>`;
            months.push({ i, m, gan: mGan, zhi: mZhi, start: jieRange ? jieRange.startLabel : `${m}月` });
            const mi = months.length - 1;
            let monthStr = `<span class="lm-time${i < 0 ? ' is-past' : ''}">${timeText}</span> <span class="lm-gz">${gzHtml}</span>`
                + (i === 0 ? ' <span class="rel-now">現在</span>' : (i < 0 ? '<span class="lm-past-note">（已過）</span>' : ''));

            let mGanEl = ganElementMap[mGan];
            let tgGan = getTenGodForElement(mGanEl, dayElement);
            let isWealth = tgGan === '財星';
            let isShiShang = tgGan === '食傷';
            let isGuanSha = tgGan === '官殺';
            let isBiJie = tgGan === '比劫';

            let originPillars = [];
            baseGans.forEach((bg, idx) => { if(bg !== '-' && bg === mGan) originPillars.push(`${pNames[idx]}干`); });
            baseZhis.forEach((bz, idx) => { if(bz !== '-' && Object.keys(zhiHiddenWeights[bz] || {}).includes(mGan)) originPillars.push(`${pNames[idx]}支`); });

            let originBadge = originPillars.length > 0 
                ? `<b style="color:var(--color-origin); font-size:11px;">📍原局引動(${originPillars.join('/')})</b>` 
                : `<b style="color:var(--color-neutral); font-size:11px;">☄️流月外來</b>`;
            
            // 動態判斷透干強度描述
            let hasGan = originPillars.some(p => p.includes('干'));
            let hasZhi = originPillars.some(p => p.includes('支'));
            let actionDesc = "透干";
            if (hasGan && hasZhi) actionDesc = "通根透干";
            else if (hasZhi && !hasGan) actionDesc = "藏干引透";
            else if (hasGan && !hasZhi) actionDesc = "天干明透";

            const clashBadge = (target) => `<b style="color:var(--color-chong); font-size:11px;">💥沖${target}</b>`;
            const combineBadge = (target) => `<b style="color:var(--color-liuhe); font-size:11px;">🌀合${target}</b>`;
            const kuBadge = (target) => `<b style="color:var(--color-ku); font-size:11px;">🔑沖開${target}</b>`;
            const xingBadge = (target) => `<b style="color:var(--color-xing); font-size:11px;">🌀${target}自刑</b>`;


            if (zhiChongMap[dz] === mZhi) addTactic('love', monthStr, clashBadge('日支'), `沖動夫妻宮 (${dz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[dz] === mZhi) addTactic('love', monthStr, combineBadge('日支'), `合動夫妻宮 (${dz}${mZhi}合)`, 'he', mi);
            if ((gender === 1 && isWealth) || (gender === 0 && isGuanSha)) addTactic('love', monthStr, originBadge, `✨ 配偶星「${mGan}」${actionDesc}`, 'yin', mi);

            if (zhiChongMap[mz] === mZhi) addTactic('career', monthStr, clashBadge('月支'), `沖動事業宮 (${mz}${mZhi}沖)`, 'chong', mi);
            if (isShiShang) addTactic('career', monthStr, originBadge, `💡 食傷「${mGan}」${actionDesc}`, 'yin', mi);
            if (isGuanSha) addTactic('career', monthStr, originBadge, `⚠️ 官殺「${mGan}」${actionDesc}`, 'yin', mi);

            if (zhiChongMap[tz] === mZhi) addTactic('wealth', monthStr, clashBadge('時支'), `沖動投資/子女宮 (${tz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[tz] === mZhi) addTactic('wealth', monthStr, combineBadge('時支'), `合動時柱 (${tz}${mZhi}合)`, 'he', mi);
            if (isBiJie) addTactic('wealth', monthStr, originBadge, `💸 比劫「${mGan}」${actionDesc}`, 'yin', mi);
            if (['辰','戌','丑','未'].includes(mZhi)) {
                let clashIndex = baseZhis.indexOf(zhiChongMap[mZhi]);
                if (clashIndex !== -1) {
                    addTactic('wealth', monthStr, kuBadge(`${pNames[clashIndex]}庫`), `財庫引動 (${baseZhis[clashIndex]}${mZhi}沖)`, 'ku', mi);
                }
            }

            if (zhiChongMap[dz] === mZhi) addTactic('health', monthStr, clashBadge('日支'), `根基逢沖 (${dz}${mZhi}沖)`, 'chong', mi);
            else if (zhiChongMap[mz] === mZhi) addTactic('health', monthStr, clashBadge('月支'), `提綱逢沖 (${mz}${mZhi}沖)`, 'chong', mi);
            if (['辰','午','酉','亥'].includes(mZhi) && mZhi === dz) addTactic('health', monthStr, xingBadge('日支'), `自刑引動 (${dz}${mZhi}刑)`, 'xing', mi);

            if (zhiChongMap[yz] === mZhi) addTactic('family', monthStr, clashBadge('年支'), `沖動父母宮 (${yz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[yz] === mZhi) addTactic('family', monthStr, combineBadge('年支'), `合動父母宮 (${yz}${mZhi}合)`, 'he', mi);
        }

        const formatList = (list, emptyMsg) => list.length > 0 ? `<table class="lm-table">${list.join('')}</table>` : `<div style="font-size:13px; color:#888; margin-top:5px; padding-left:10px;">${emptyMsg}</div>`;
        const TOPICS = [
            ['love', '感情', '#ff9800', '觀測日支與配偶星', '此週期感情宮位無明顯劇烈引動'],
            ['career', '事業', '#2ed573', '觀測月柱與官殺食傷', '此週期事業宮位無明顯劇烈引動'],
            ['wealth', '財運', '#00d2ff', '觀測時柱與比劫財星', '此週期無明顯財庫沖動或破財徵兆'],
            ['health', '健康', '#ff5252', '觀測日月支逢沖刑', '此週期根基穩固，無重大沖刑'],
            ['family', '家庭', '#a29bfe', '觀測年柱', '此週期家庭宮位平順']
        ];
        // 每格的記號：沖＝紅點、刑＝粉點、庫＝金菱、合＝青環、十神引動＝主題色方塊（同格多件以優先序顯示並標件數）
        const KIND = { chong: ['●', '#ff5252'], xing: ['●', '#ff4fa3'], ku: ['◆', '#ffd166'], he: ['○', '#00d2ff'], yin: ['■', null] };
        const cellOf = (cat, mi, col) => {
            const L = ev.filter(e => e.cat === cat && e.mi === mi);
            if (!L.length) return '<i class="lm-dot0"></i>';
            const pri = ['chong', 'xing', 'ku', 'he', 'yin'].find(k => L.some(e => e.kind === k));
            const [ch, c] = KIND[pri];
            return `<b class="lm-mk" style="color:${c || col}" data-tip="${months[mi].gan}${months[mi].zhi}（${months[mi].start}起）：${L.map(e => e.desc).join('；')}">${ch}${L.length > 1 ? `<sup>${L.length}</sup>` : ''}</b>`;
        };
        const colCls = (o) => o.i < 0 ? 'past' : (o.i === 0 ? 'now' : '');
        const grid = `
            <div class="lm-grid-wrap"><table class="lm-grid">
                <tr><th class="lm-rl"></th>${months.map(o => `<th class="${colCls(o)}"><span style="color:${elementColors[ganElementMap[o.gan]]}">${o.gan}</span><span style="color:${elementColors[zhiElementMap[o.zhi]]}">${o.zhi}</span><small>${o.m}月</small></th>`).join('')}</tr>
                ${TOPICS.map(([k, n, col]) => `<tr><td class="lm-rl" style="color:${col}" onclick="lmTab('${k}')">${n}</td>${months.map((o, mi) => `<td class="${colCls(o)}">${cellOf(k, mi, col)}</td>`).join('')}</tr>`).join('')}
                <tr class="lm-sum"><td class="lm-rl">變動</td>${months.map((o, mi) => { const n = ev.filter(e => e.mi === mi && e.kind !== 'yin').length; return `<td class="${colCls(o)}">${n ? `<span class="lm-bar" style="height:${Math.min(4, n) * 4 + 2}px"></span>` : ''}</td>`; }).join('')}</tr>
            </table></div>
            <div class="lm-legend"><span><b style="color:#ff5252">●</b>沖</span><span><b style="color:#ff4fa3">●</b>刑</span><span><b style="color:#ffd166">◆</b>庫</span><span><b style="color:#00d2ff">○</b>合</span><span><b>■</b>十神引動</span><span class="lm-legend-r">淡＝已過・框＝本月</span></div>`;
        const upcoming = k => ev.filter(e => e.cat === k && months[e.mi].i >= 0).length;
        return `
            <div class="lm-wrap">
                <div class="lm-tabs">
                    <button class="lm-tab on" data-k="all" onclick="lmTab('all')">總覽</button>
                    ${TOPICS.map(([k, n, col]) => `<button class="lm-tab" data-k="${k}" style="--c:${col}" onclick="lmTab('${k}')">${n}${upcoming(k) ? `<sup>${upcoming(k)}</sup>` : ''}</button>`).join('')}
                </div>
                <div class="lm-pane" data-k="all">${grid}</div>
                <div class="lm-lists">
                ${TOPICS.map(([k, n, col, sub, empty]) => `<div class="lm-pane" data-k="${k}" style="display:none;">
                    <div class="lm-sub" style="color:${col}">${n}<span>${sub}</span></div>
                    ${formatList(tactics[k], empty)}
                </div>`).join('')}
                </div>
            </div>
        `;
    }

        document.querySelectorAll('.tt2-tabs .lm-tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
        document.querySelectorAll('.tt2-pane').forEach(p => p.style.display = p.dataset.k === k ? '' : 'none');
    }

        document.querySelectorAll('#monthlyTacticsOutput .lm-tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
        document.querySelectorAll('#monthlyTacticsOutput .lm-pane').forEach(p => p.style.display = p.dataset.k === k ? '' : 'none');
    }

    function calculateBaziCore() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        const gender = parseInt(document.getElementById('gender').value);
        const genderStr = gender === 1 ? '元男' : '元女';
        const currentYear = new Date().getFullYear();

        let yg, yz, mg, mz, dg, dz, tg, tz;
        let startYearOfLife;
        let daYunData = [];
        let solarInfoHtml = '';
        let birthSolarForJieQi = null; // 僅在「依出生日期」模式下有值，供精確得令（人元司令分野）計算使用

        if (mode === 'date') {
            let dateVal = document.getElementById('birthDate').value; // 格式："YYYY-MM-DD"
            if (!dateVal) { alert('請選擇出生日期'); return; }
            let [y, m, d] = dateVal.split('-').map(Number);
            let h = parseInt(document.getElementById('birthHour').value);
            let min = parseInt(document.getElementById('birthMinute').value);

            let useTrueSolar = document.getElementById('useTrueSolar').checked;
            let useSplitZi = document.getElementById('useSplitZi').checked;

            // 出生地換算：當地鐘錶時間 → 扣夏令 → UTC
            const L = getBirthLoc();
            const stdOff = isNaN(L.std) ? 480 : L.std;
            const wallMs = Date.UTC(y, m - 1, d, h, min);
            const utcMs = wallMs - (stdOff + L.dst) * 60000;
            // 年、月柱（節氣交接）與大運：用絕對時刻，換成東八區時間對照節氣表
            const absD = new Date(utcMs + 480 * 60000);
            const solarAbs = Solar.fromYmdHms(absD.getUTCFullYear(), absD.getUTCMonth() + 1, absD.getUTCDate(), absD.getUTCHours(), absD.getUTCMinutes(), 0);
            const baZiAbs = solarAbs.getLunar().getEightChar();
            // 日、時柱：用出生地的當地時間（標準時間，或真太陽時）
            let localMs = wallMs - L.dst * 60000;
            const p2 = (n) => String(n).padStart(2, '0');
            const locNote = (stdOff !== 480 || L.dst) ? `出生地 ${L.place || ''}（${fmtOff(stdOff)}${L.dst ? `，夏令 +${L.dst / 60}h` : ''}）${L.dst ? ` → 當地標準時間 ${p2(new Date(localMs).getUTCHours())}:${p2(new Date(localMs).getUTCMinutes())}` : ''}` : '';

            if (useTrueSolar) {
                const lon = L.lon;
                const lonDiff = lon * 4 - stdOff;
                const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
                const daysInMonth = [0, 31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let dayOfYear = d;
                for (let i = 1; i < m; i++) dayOfYear += daysInMonth[i];
                const B = (360 / 365.24) * (dayOfYear - 81) * (Math.PI / 180);
                const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
                const totalOffset = lonDiff + eot;
                localMs += totalOffset * 60000;
                const t = new Date(localMs);
                const sign = totalOffset >= 0 ? '+' : '';
                solarInfoHtml = `<div style="text-align:center; margin-bottom:15px; font-size:13px; color:#aaa; background:#1a1a1a; padding:8px 12px; border-radius:6px; border:1px solid #333;">
                    ${locNote ? `<span style="color:#ccc;">${locNote}</span><br>` : ''}
                    <b style="color:#00d2ff;">☀️ 真太陽時校正：</b> 經度 ${lon}° (時差 ${sign}${totalOffset.toFixed(1)} 分鐘)<br>
                    <span style="color:#e0e0e0; margin-top: 4px; display: inline-block;">當地真太陽時：${t.getUTCFullYear()}年${t.getUTCMonth() + 1}月${t.getUTCDate()}日 ${t.getUTCHours()}時${t.getUTCMinutes()}分</span>
                </div>`;
            } else if (locNote) {
                solarInfoHtml = `<div style="text-align:center; margin-bottom:15px; font-size:13px; color:#ccc; background:#1a1a1a; padding:8px 12px; border-radius:6px; border:1px solid #333;">${locNote}</div>`;
            }
            const lt = new Date(localMs);
            let dateObj = new Date(lt.getUTCFullYear(), lt.getUTCMonth(), lt.getUTCDate(), lt.getUTCHours(), lt.getUTCMinutes(), 0);

            y = dateObj.getFullYear();
            m = dateObj.getMonth() + 1;
            d = dateObj.getDate();
            h = dateObj.getHours();
            let finalMin = dateObj.getMinutes();

            const solar = Solar.fromYmdHms(y, m, d, h, finalMin, 0);
            birthSolarForJieQi = solarAbs;
            const baZi = solar.getLunar().getEightChar();

            yg = baZiAbs.getYearGan(); yz = baZiAbs.getYearZhi();
            mg = baZiAbs.getMonthGan(); mz = baZiAbs.getMonthZhi();
            tg = baZi.getTimeGan(); tz = baZi.getTimeZhi();

            // 【早晚子時 絕對控制邏輯】
            if (h === 23) {
                if (useSplitZi) {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setHours(22);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                } else {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setDate(tempDate.getDate() + 1);
                    tempDate.setHours(1);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                }
            } else {
                dg = baZi.getDayGan(); 
                dz = baZi.getDayZhi();
            }

            startYearOfLife = absD.getUTCFullYear();

            const yun = baZiAbs.getYun(gender);
            yun.getDaYun().forEach(dy => {
                if (dy.getIndex() > 0 && dy.getIndex() <= 10) {
                    const gz = dy.getGanZhi();
                    daYunData.push({ index: dy.getIndex(), startYear: dy.getStartYear(), startAge: dy.getStartAge(), gan: gz.charAt(0), zhi: gz.charAt(1), ganZhi: gz });
                }
            });
        } else {
            yg = document.getElementById('yg').value; yz = document.getElementById('yz').value;
            mg = document.getElementById('mg').value; mz = document.getElementById('mz').value;
            dg = document.getElementById('dg').value; dz = document.getElementById('dz').value;
            tg = document.getElementById('tg').value; tz = document.getElementById('tz').value;
            
            // 由四柱反推出生日期：找得到就用真實的出生年與大運；找不到才用估算
            const cand = baziPick(baziCands());
            if (cand) {
                startYearOfLife = cand.getYear();
                cand.getLunar().getEightChar().getYun(gender).getDaYun().forEach(dy => {
                    if (dy.getIndex() > 0 && dy.getIndex() <= 10) {
                        const gz = dy.getGanZhi();
                        daYunData.push({ index: dy.getIndex(), startYear: dy.getStartYear(), startAge: dy.getStartAge(), gan: gz.charAt(0), zhi: gz.charAt(1), ganZhi: gz });
                    }
                });
            }
            if (!startYearOfLife) startYearOfLife = currentYear - 30;
            let yunStartAge = parseInt(document.getElementById('baziStartAge').value) || 1;

            const isYangYear = stemPolarity[yg] === 1;
            const isMale = gender === 1;
            const direction = (isYangYear === isMale) ? 1 : -1;

            const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
            const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

            for (let i = 1; i <= 10 && !cand; i++) {
                let gIdx = (stems.indexOf(mg) + i * direction) % 10;
                if(gIdx < 0) gIdx += 10;
                let zIdx = (branches.indexOf(mz) + i * direction) % 12;
                if(zIdx < 0) zIdx += 12;

                let dGan = stems[gIdx], dZhi = branches[zIdx];
                daYunData.push({ index: i, startYear: startYearOfLife + yunStartAge - 1 + ((i-1) * 10), startAge: yunStartAge + ((i-1) * 10), gan: dGan, zhi: dZhi, ganZhi: dGan + dZhi });
            }
        }

        const dayGan = dg;
        const dayElement = ganElementMap[dayGan];
        const allBaseZhis = [yz, mz, dz, tz]; 

        let currentDaYun = daYunData.find(dy => currentYear >= dy.startYear && currentYear < dy.startYear + 10);
        let dyGan = '-', dyZhi = '-';

        const totalScore = calculateQuantStrengthScore(baziMap, dayElement);

                const dayInfo = (d) => fullDay(Solar.fromYmdHms(d.getFullYear(), d.getMonth() + 1, d.getDate(), 12, 0, 0).getLunar().getEightChar(), d.getFullYear());
                window.__liuriDayInfo = dayInfo;
                const days = [];

                    const d = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate() + offset);
                    const solarD = Solar.fromYmdHms(d.getFullYear(), d.getMonth() + 1, d.getDate(), 12, 0, 0);

                    const ganTenGod = getSpecificShiShen(dGanD, dayGan);

                    const fd = fullDay(baziD, d.getFullYear());

                    days.push({

                    });
                }

                // ---- 組裝 SVG 分組長條圖：X軸=10天，每天兩條bar（整體／財運），風格比照「原局五行」的漸層細長條 ----
                const w = 40 * 21 + 30, h = 230;
                const padL = 26, padR = 10, padT = 40, padB = 46;

                const gap = (groupW - barW * 2) / 3;

                // 折線圖（股價趨勢風）：點＝當日財星能量；財旺日標「旺」；與下方小卡連動閃爍
                const pts = days.map((dday, i) => ({ x: padL + i * groupW + groupW / 2, y: baseY - plotH * dday.wealth / 100, d: dday, i }));
                // 單調三次插值（Fritsch–Carlson）：曲線平滑但不會超過相鄰點，數值不失真
                const smooth = (P) => {
                    const n = P.length, dx = [], m = [], tg = [];
                    for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1].x - P[i].x; m[i] = (P[i + 1].y - P[i].y) / dx[i]; }
                    tg[0] = m[0]; tg[n - 1] = m[n - 2];
                    for (let i = 1; i < n - 1; i++) tg[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
                    for (let i = 0; i < n - 1; i++) {
                        if (m[i] === 0) { tg[i] = 0; tg[i + 1] = 0; continue; }
                        const a = tg[i] / m[i], b = tg[i + 1] / m[i], h2 = a * a + b * b;
                        if (h2 > 9) { const t3 = 3 / Math.sqrt(h2); tg[i] = t3 * a * m[i]; tg[i + 1] = t3 * b * m[i]; }
                    }
                    let dd = `M${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}`;
                    for (let i = 0; i < n - 1; i++) {
                        const h3 = dx[i] / 3;
                        dd += ` C${(P[i].x + h3).toFixed(1)},${(P[i].y + tg[i] * h3).toFixed(1)} ${(P[i + 1].x - h3).toFixed(1)},${(P[i + 1].y - tg[i + 1] * h3).toFixed(1)} ${P[i + 1].x.toFixed(1)},${P[i + 1].y.toFixed(1)}`;
                    }
                    return dd;
                };

        }

        const elementCount = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
        const elementSpecificShiShen = { '木': [], '火': [], '土': [], '金': [], '水': [] }; 
        
        originalPillars.forEach(p => {

            p.hideShiShen.forEach((ss, index) => {

                elementCount[el] += weight; elementSpecificShiShen[el].push(ss);
            });
        });

        let totalElements = 0;
        Object.values(elementCount).forEach(v => totalElements += v);

        // ===== 朋友契合度分頁：提供命主資料（此分頁不列入 AI 提詞） =====
        try {
            const mePct = {};
            Object.keys(elementCount).forEach(el => mePct[el] = totalElements > 0 ? elementCount[el] / totalElements * 100 : 0);
            window.__friendCtx = { dayElement, strengthLabel, totalScore, mePct };

        } catch (e) { console.warn('朋友分頁計算失敗:', e); }
        
        // 得勢（傳統：只看天干比劫/印星黨助，不含地支，避免與「得地」重複計算）
        // 月干、時干緊貼日干各 1.0；年干隔位 0.5；該干在地支「有根」以上（通根分數≥4）力量 ×1.5
        // 滿分 3.75；≥2.0 為得勢（約 53%）
        const SHI_MAX = 3.75, SHI_TH = 2.0;
        let shiSum = 0; const shiParts = [];
        [{ gan: yg, idx: 0, w: 0.5, p: '年' }, { gan: mg, idx: 1, w: 1.0, p: '月' }, { gan: tg, idx: 3, w: 1.0, p: '時' }].forEach(it => {
            if (!it.gan || it.gan === '-') return;
            const el = ganElementMap[it.gan];
            if (el !== dayElement && el !== genEl) return;
            const rooted = getTraditionalRoots(it.gan, it.idx, allBaseZhis, pNames).score >= 4;
            shiSum += it.w * (rooted ? 1.5 : 1);
            shiParts.push(`${it.p}${it.gan}${el === dayElement ? '比' : '印'}${rooted ? '·有根' : ''}`);
        });
        const shiPct = Math.min(100, shiSum / SHI_MAX * 100);
        let isDeShi = shiSum >= SHI_TH;
        let shiLabel = isDeShi ? "得勢" : (shiSum > 0 ? "有助" : "孤立");
        let shiColor = isDeShi ? '#2ed573' : (shiSum > 0 ? '#ff9800' : '#ff5252');

        // ---- 子平格局定式與用神／忌神判定 ----
        const geJuYongShen = determineGeJuAndYongShen(mz, dg, dayElement, baseGans, baseZhis, pNames, strengthLabel, elementCount, totalElements);
        
        // cmdHtml 於調候計算完成後組裝（體力＋調候 合併為汽車儀表面板）

        // [Dash 2: 顯星/定格 (Dynamic Penetration & Rooting)]
        // 「定格」統一改用 determineGeJuAndYongShen() 的結果（含建祿/羊刃/從格特例判斷，避免與下方重複計算）
        // 從強/從弱的短標籤取自「獨立子平判斷」(congGeResult)，不使用量化系統分數的 strengthLabel 字串，兩套系統徹底脫鉤
        let traditionalPattern = geJuYongShen.isExtreme
            ? (geJuYongShen.congGeResult === '從強' ? '從強格' : '從弱格')
            : geJuYongShen.geJuName;
        let traditionalDesc = geJuYongShen.isExtreme
            ? `不依正格論，原局月令屬${geJuYongShen.geJuBaseName}`
            : geJuYongShen.geJuNote;

        // 2. 判斷天干「實權主導」 (天干有強根者)
        let rootedShiShen = [];
        let strongestRootScore = 0;
        let powerDesc = "全局無明顯強根";

        [{gan: yg, idx: 0}, {gan: mg, idx: 1}, {gan: tg, idx: 3}].forEach(item => {
            if (item.gan !== '-') {
