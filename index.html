<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字五行(量化版)</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d2ff;
            --border: #333;
            --good-color: #2e7d32;
            --bad-color: #555555;
            --card-bg: rgba(20, 20, 20, 0.6);

            /* ===== 命理語意色彩 Design Tokens =====
               全站沖/合/刑/庫/引動等關係一律引用這組變數，未來要調色只需改這裡。 */
            --color-chong: #ff5252;    /* 沖 */
            --color-hai: #ff9800;      /* 害 */
            --color-xing: #e91e63;     /* 刑（含自刑／三刑）— 與半合的紫色區分開 */
            --color-liuhe: #00d2ff;    /* 六合（天干／地支） */
            --color-sanhe: #8e44ad;    /* 三合局 */
            --color-banhe: #9b59b6;    /* 半合局 */
            --color-sanhui: #d35400;   /* 三會局 */
            --color-ku: #ff9800;       /* 墓庫／開庫引動 */
            --color-origin: #00d2ff;   /* 原局引動／通根透干 */
            --color-dayun: #f39c12;    /* 大運引動 */
            --color-liunian: #2ed573;  /* 流年引動 */
            --color-neutral: #888;     /* 無明顯反應／外來 */
            --score-good: #2ed573;     /* 量化評分：強／佳 */
            --score-warn: #ff9800;     /* 量化評分：普通 */
            --score-bad: #ff5252;      /* 量化評分：弱／差 */
            --color-liuri-overall: #00d2ff;  /* 流日圖表：整體運勢 */
            --color-liuri-wealth: #ffb347;   /* 流日圖表：財運 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-variant-numeric: tabular-nums; /* 數字等寬對齊，數據感更一致 */
        }
        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,210,255,0.05);
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
        }
        /* 窄螢幕（手機）大幅收窄外層留白，讓內容盡量貼齊邊緣、減少不必要的左右滑動 */
        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { padding: 12px 8px; border-radius: 8px; }
        }
        h2 {
            color: var(--accent); text-align: center; margin-top: 0;
            letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,210,255,0.35);
            font-weight: 700;
        }
        
        .form-group {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;
        }
        input, select, button {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: #2a2a2a; border: 1px solid var(--border);
            color: white; border-radius: 6px; font-size: 16px;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,210,255,0.2);
        }
        button {
            background-color: var(--accent); color: #000; font-weight: bold; cursor: pointer;
            grid-column: span 2; transition: 0.25s; letter-spacing: 0.5px;
        }
        button:hover { background-color: #0099cc; box-shadow: 0 0 16px rgba(0,210,255,0.5); transform: translateY(-1px); }
        
        .result-box {
            margin-top: 25px; padding: 20px; background-color: #232323;
            border-radius: 4px; display: none;
        }

        
        .bazi-table-wrapper { background: #1a1a1a; border-radius: 6px; padding: 15px 5px; margin-bottom: 20px; overflow-x: auto; }
        .bazi-table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
        .bazi-table td { padding: 6px 4px; vertical-align: middle; }
        .bazi-table .bt-header { color: #aaa; font-size: 13px; font-weight: bold; padding-bottom: 8px; }
        .bazi-table .bt-shishen { font-size: 12px; font-weight: bold; }
        .bazi-table .bt-ganzhi { font-size: 22px; font-weight: bold; }
        .bazi-table .bt-hidden-bg { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 5px 0; margin-top: 2px; height: 100%; min-width: 45px; }
        .bazi-table .bt-hidden-item { display: flex; justify-content: center; gap: 4px; margin-bottom: 2px; }

        /* --- 核心能量儀表板專用樣式 --- */
        .dash-grid-top {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px;
        }
        .dash-grid-bottom {
            display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px;
        }
        .dash-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            position: relative; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .dash-card:hover { border-color: rgba(0,210,255,0.35); box-shadow: 0 0 12px rgba(0,210,255,0.08); }
        .dash-card-title {
            font-size: 12px; color: #999; margin-bottom: 12px; font-weight: bold;
            width: 100%; border-bottom: 1px dashed #444; padding-bottom: 6px;
            letter-spacing: 0.5px; text-transform: none;
        }
        .dash-footnote {
            font-size: 11px; color: #777; line-height: 1.7; margin-top: 4px;
            padding: 8px 10px; border-top: 1px dashed #333;
        }
        
        .dayun-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
        .dayun-item { background: #2a2a2a; padding: 10px 5px; border-radius: 6px; border: 1px solid #444; }
        .table-container { border: 1px solid #333; border-radius: 6px; position: relative; overflow-x: auto; }
        .liunian-table { width: 100%; border-collapse: collapse; margin-bottom: 0; background: #1a1a1a; font-size: 13px; }
        .liunian-table th, .liunian-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #333; }
        .liunian-table th { background: #2a2a2a; color: var(--accent); font-weight: normal; font-size: 12px; border-bottom: 2px solid #555; }
        
        .score-box { background: rgba(0, 210, 255, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        
        .ai-btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .ai-btn-group button { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0; }
        
        #copyPromptBtn { background: #333; color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        #copyPromptBtn:hover { background: #444; transform: translateY(-2px); }

        /* 新增：得令得地得勢 區塊樣式 */
        .dash-status-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 4px;
            font-size: 11px;
            align-items: center;
        }
        .dash-status-label {
            color: #aaa;
        }
        .dash-status-value {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .status-on { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; }
        .status-off { background: rgba(255, 82, 82, 0.15); color: #ff5252; border: 1px solid #ff5252; }
        .status-partial { background: rgba(255, 152, 0, 0.15); color: #ff9800; border: 1px solid #ff9800; }

        /* ===== 體力儀表（汽車儀表風） ===== */
        .dash-grid-top.pg-layout { grid-template-columns: 1fr; }
        .pg-lamp-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin: -4px 0 6px; }
        .pg-lamp { display:inline-flex; align-items:center; gap:7px; padding:4px 12px 4px 9px; border-radius:999px;
            border:1px solid #333; background:linear-gradient(180deg,#141414,#0c0c0c); font-size:12px; font-weight:bold;
            color:#4a4a4a; letter-spacing:1px; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); transition: color .3s, border-color .3s; }
        .pg-lamp .pg-dot { width:10px; height:10px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #3a3a3a, #161616);
            box-shadow: inset 0 0 2px #000; transition: background .3s, box-shadow .3s; }
        .pg-lamp.on.lit { color:#2ed573; border-color:rgba(46,213,115,.55); }
        .pg-lamp.on.lit .pg-dot { background:radial-gradient(circle at 35% 35%, #c8ffdd, #2ed573 55%, #14a352);
            box-shadow:0 0 6px #2ed573, 0 0 16px rgba(46,213,115,.55); animation: pgFlicker .7s steps(1,end); }
        .pg-lamp-note { font-size:10px; color:#666; }
        @keyframes pgFlicker { 0%{opacity:1} 15%{opacity:.2} 30%{opacity:1} 45%{opacity:.35} 60%{opacity:1} }
        .pg-row { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; width:100%; }
        .pg-gauge { display:flex; flex-direction:column; align-items:center; min-width:0;
            background: radial-gradient(ellipse at 50% 70%, rgba(0,210,255,0.05), transparent 70%); border-radius:10px; padding:2px 0 4px; }
        .pg-gauge svg { width:100%; max-width:210px; height:auto; display:block; overflow:visible; }
        .pg-title { font-size:11px; color:#999; letter-spacing:1px; margin-top:-2px; }
        .pg-status { margin-top:4px; font-size:12px; font-weight:bold; padding:2px 10px; border-radius:999px; border:1px solid currentColor;
            background:rgba(0,0,0,.25); opacity:0; transform: translateY(4px) scale(.9); transition: opacity .4s, transform .4s; white-space:nowrap; }
        .pg-gauge.pg-done .pg-status { opacity:1; transform:none; animation: pgPop .5s ease-out; }
        .pg-detail { margin-top:4px; font-size:10px; color:#888; line-height:1.4; text-align:center; padding:0 2px; word-break:keep-all; overflow-wrap:anywhere; }
        @keyframes pgPop { 0%{ box-shadow:0 0 0 0 currentColor; } 100%{ box-shadow:0 0 0 8px transparent; } }
        .pg-val { font-variant-numeric: tabular-nums; }

        /* ===== 格局：中控顯示屏 ===== */
        .gj-wrap { display:flex; flex-direction:column; gap:12px; width:100%; text-align:left; }
        .gj-lcd { position:relative; border-radius:8px; padding:9px 11px 10px; overflow:hidden; text-align:center;
            background:linear-gradient(180deg,#0b1a22,#071017); border:1px solid rgba(0,210,255,.28);
            box-shadow: inset 0 0 18px rgba(0,210,255,.08), inset 0 1px 0 rgba(255,255,255,.05); }
        .gj-lcd::after { content:''; position:absolute; inset:0; pointer-events:none;
            background:repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px); }
        .gj-lcd::before { content:''; position:absolute; top:0; bottom:0; width:40%; left:-50%; pointer-events:none;
            background:linear-gradient(90deg, transparent, rgba(0,210,255,.12), transparent); }
        .anim-on .gj-lcd::before { animation: gjSweep 1.1s ease-out .2s both; }
        @keyframes gjSweep { from { left:-50%; } to { left:120%; } }
        .gj-lcd-head { display:flex; justify-content:space-between; font-size:10px; color:#5f8a99; letter-spacing:1px; }
        .gj-name { font-size:22px; font-weight:bold; color:#00d2ff; letter-spacing:3px; margin:3px 0 3px;
            text-shadow:0 0 8px rgba(0,210,255,.6), 0 0 20px rgba(0,210,255,.25); }
        .gj-desc { font-size:10px; color:#86a9b6; line-height:1.45; }
        .gj-sec-head { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:#999; margin-bottom:6px; letter-spacing:.5px; }
        .gj-sec-head { flex-wrap:wrap; gap:2px 8px; }
        .gj-sec-head > span { white-space:nowrap; }
        .gj-note { font-size:10px; }
        .gj-tiles { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:3px; }
        .gj-tile { height:32px; min-width:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;
            border-radius:4px; background:#111; border:1px solid #262626; color:#3a3a3a; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
        .gj-tile.lit { color:var(--c); border-color:var(--c); background:var(--cbg); box-shadow:0 0 8px var(--cglow), inset 0 0 6px var(--cglow); text-shadow:0 0 6px var(--cglow); }
        .gj-tile.half { color:var(--c); border:1px dashed var(--c); opacity:.5; }
        .gj-legend { font-size:9px; color:#666; margin-top:5px; text-align:right; }
        .gj-key { display:inline-block; width:8px; height:8px; border-radius:2px; vertical-align:-1px; margin-right:3px; }
        .gj-key.lit { background:#2ed573; box-shadow:0 0 4px #2ed573; }
        .gj-key.half { border:1px dashed #2ed573; opacity:.6; }
        .gj-els { display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; }
        .gj-el { border-radius:6px; padding:5px 0 4px; text-align:center; border:1px solid #262626; background:#111; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
        .gj-el b { display:block; font-size:15px; color:#444; line-height:1.2; }
        .gj-el span { font-size:9px; color:#555; letter-spacing:1px; }
        .gj-el.yong { border-color:var(--c); background:var(--cbg); box-shadow:0 0 10px var(--cglow); }
        .gj-el.yong b { color:var(--c); text-shadow:0 0 6px var(--cglow); }
        .gj-el.yong span { color:#2ed573; font-weight:bold; }
        .gj-el.ji { border-color:rgba(255,82,82,.4); }
        .gj-el.ji b { color:var(--c); opacity:.4; }
        .gj-el.ji span { color:#ff5252; }
        .gj-glamps { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:3px; }
        .gj-gl { text-align:center; font-size:11px; padding:3px 0; border-radius:4px; background:#111; border:1px solid #232323; color:#3c3c3c;
            box-shadow: inset 0 1px 2px rgba(0,0,0,.7); white-space:nowrap; }
        .gj-gl.on { color:#00d2ff; border-color:#00d2ff; background:rgba(0,210,255,.12); box-shadow:0 0 8px rgba(0,210,255,.5), inset 0 0 6px rgba(0,210,255,.3); text-shadow:0 0 6px rgba(0,210,255,.6); font-weight:bold; }
        .gj-gl.half { color:#00d2ff; border:1px dashed rgba(0,210,255,.6); opacity:.55; }
        .gj-lamp-row { display:flex; gap:6px; align-items:flex-start; margin-bottom:5px; }
        .gj-lamp-lbl { font-size:9px; color:#5f8a99; padding-top:4px; width:22px; flex-shrink:0; letter-spacing:1px; }
        .gj-lamps { display:flex; flex-wrap:wrap; gap:4px; flex:1; }
        .gj-lamp { display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:2px 7px 2px 3px; border-radius:999px; background:#111;
            border:1px solid #262626; color:#444; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); white-space:nowrap; }
        .gj-lamp i { font-style:normal; font-size:9px; width:14px; height:14px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:#1c1c1c; color:#444; }
        .gj-lamp.ok { color:#2ed573; border-color:#2ed573; background:rgba(46,213,115,.1); box-shadow:0 0 8px rgba(46,213,115,.45); font-weight:bold; }
        .gj-lamp.ok i { background:#2ed573; color:#000; box-shadow:0 0 5px #2ed573; }
        .gj-lamp.bad { color:#ff5252; border-color:#ff5252; background:rgba(255,82,82,.1); box-shadow:0 0 8px rgba(255,82,82,.45); font-weight:bold; }
        .gj-lamp.bad i { background:#ff5252; color:#000; box-shadow:0 0 5px #ff5252; }
        .gj-lamp-empty { font-size:10px; color:#555; padding-top:3px; }
        .gj-cb-list { display:flex; flex-direction:column; gap:5px; margin-top:7px; }
        .gj-cb-top .gj-cb-cond { margin-top:0; font-size:10px; color:#999; font-weight:normal; }
        .gj-combos { display:flex; flex-direction:column; gap:6px; }
        .gj-cb { border-radius:6px; padding:6px 9px; border:1px solid; background:#0e1114; }
        .gj-cb.ok { border-color:rgba(46,213,115,.45); box-shadow: inset 3px 0 0 #2ed573; }
        .gj-cb.bad { border-color:rgba(255,82,82,.45); box-shadow: inset 3px 0 0 #ff5252; }
        .gj-cb-top { display:flex; align-items:center; gap:7px; font-size:13px; flex-wrap:wrap; }
        .gj-cb.ok b { color:#2ed573; text-shadow:0 0 6px rgba(46,213,115,.45); }
        .gj-cb.bad b { color:#ff5252; text-shadow:0 0 6px rgba(255,82,82,.45); }
        .gj-cb-tag { font-size:10px; font-weight:bold; padding:0 5px; border-radius:3px; color:#000; }
        .gj-cb.ok .gj-cb-tag { background:#2ed573; box-shadow:0 0 6px #2ed573; }
        .gj-cb.bad .gj-cb-tag { background:#ff5252; box-shadow:0 0 6px #ff5252; }
        .gj-cb-cond { font-size:10.5px; color:#aaa; margin-top:3px; }
        .gj-cb-why { font-size:10px; color:#5f8a99; margin-top:1px; }
        .gj-cb-none { font-size:11px; color:#666; text-align:center; padding:8px 0; border:1px dashed #2a2a2a; border-radius:6px; }
        .anim-on .gj-anim { animation: gjBoot .45s ease-out both; animation-delay: var(--d, 0s); }
        @keyframes gjBoot { 0% { opacity:0; transform:scale(.85); filter:brightness(2); } 60% { opacity:1; filter:brightness(1.6); } }


        /* ===== 原局五行：LED 分段電平表 ===== */
        .wx-panel { width:100%; flex:1; display:flex; flex-direction:column; }
        .wx-head { display:flex; justify-content:space-between; font-size:10px; color:#5f8a99; letter-spacing:1px; margin-bottom:10px; }
        .wx-meters { flex:1; display:grid; grid-template-columns: 22px repeat(5, minmax(0,1fr)); gap:8px; align-items:end; }
        .wx-axis { position:relative; height:var(--wx-h, 170px); margin-bottom:38px; }
        .wx-axis span { position:absolute; right:0; transform:translateY(50%); font-size:9px; color:#555; font-variant-numeric: tabular-nums; }
        .wx-col { display:flex; flex-direction:column; align-items:center; min-width:0; }
        .wx-val { font-size:17px; font-weight:bold; color:var(--c); text-shadow:0 0 8px var(--cglow); margin-bottom:6px; font-variant-numeric: tabular-nums;
            font-family:'SF Mono', Menlo, Consolas, monospace; }
        .wx-val small { font-size:10px; margin-left:1px; opacity:.8; }
        .wx-bar { position:relative; width:100%; max-width:46px; height:var(--wx-h, 170px); display:flex; flex-direction:column-reverse; gap:3px;
            padding:3px; box-sizing:border-box; border-radius:5px; background:#0b0d10; border:1px solid #262a30; box-shadow: inset 0 1px 4px rgba(0,0,0,.8); }
        .wx-seg { flex:1; border-radius:2px; background:#16191d; box-shadow: inset 0 0 2px rgba(0,0,0,.8); }
        .wx-seg.lit { background:var(--c); box-shadow:0 0 6px var(--cglow); }
        .wx-avg { position:absolute; left:-3px; right:-3px; bottom:33.33%; border-top:1px dashed rgba(255,255,255,.35); pointer-events:none; }
        .wx-peak { position:absolute; left:-2px; right:-2px; height:2px; margin-bottom:-1px; background:#fff; border-radius:1px;
            box-shadow:0 0 6px var(--c), 0 0 12px var(--cglow); }
        .wx-col.over .wx-bar { border-color:var(--c); box-shadow:0 0 10px var(--cglow), inset 0 1px 4px rgba(0,0,0,.8); }
        .wx-el { margin-top:7px; font-size:16px; font-weight:bold; color:var(--c); line-height:1; }
        .wx-tg { font-size:10px; color:#777; margin-top:3px; }
        .anim-pending .wx-seg.lit, .anim-pending .wx-peak { opacity:0 !important; }
        .anim-on .wx-seg.lit { animation: wxLit .22s ease-out both; animation-delay: var(--d); }
        @keyframes wxLit { from { opacity:0; filter:brightness(2.4); } }
        .anim-on .wx-peak { animation: wxPeak .7s cubic-bezier(.34,1.56,.64,1) both; animation-delay: var(--d); }
        @keyframes wxPeak { from { bottom:0; opacity:0; } 30% { opacity:1; } }
        @media (max-width: 500px) {
            .wx-meters { --wx-h: 130px; gap:6px; }
            .wx-val { font-size:15px; }
        }
        @media (prefers-reduced-motion: reduce) { .anim-on .wx-seg.lit, .anim-on .wx-peak { animation:none !important; } }

        /* ===== 十神星圖（儀表風）＋大運捲軸 ===== */
        .st-panel { width:100%; flex:1; display:flex; flex-direction:column; }
        .st-head-r { display:flex; align-items:center; gap:8px; }
        .st-badge { font-size:10px; color:#00d2ff; border:1px solid rgba(0,210,255,.35); background:rgba(0,210,255,.08); padding:1px 7px; border-radius:999px; letter-spacing:0; }
        .st-switch { display:inline-flex; align-items:center; gap:5px; cursor:pointer; color:#888; font-size:10px; letter-spacing:1px; user-select:none; }
        .st-switch input { display:none; }

        .st-switch input:checked + .st-knob { background:rgba(255,179,71,.2); border-color:#ffb347; }
        .st-switch input:checked + .st-knob::after { transform:translateX(12px); background:#ffb347; box-shadow:0 0 6px #ffb347; }
        .st-switch:has(input:checked) { color:#ffb347; }
        .st-body { flex:1; display:flex; align-items:center; gap:6px; min-height:0; }

        .st-dychip.weak rect { stroke:rgba(255,179,71,.45); stroke-dasharray:2 2; }

        .st-dy-layer > * { animation: peFade .35s ease-out both; }
        .st-flow { stroke-dasharray: 2 12; opacity:.75; }
        .anim-on .st-flow { animation: peFade .6s ease-out both, stFlow 1.6s linear infinite; animation-delay: var(--d), 0s; }
        @keyframes stFlow { to { stroke-dashoffset: -14; } }
        .st-orbit { transform-box: fill-box; transform-origin: center; animation: stSpin 14s linear infinite; }
        @keyframes stSpin { to { transform: rotate(360deg); } }
        .st-dy { display:none; flex-direction:column; align-items:center; width:62px; flex-shrink:0; gap:3px; }
        .st-panel.dy-on .st-dy { display:flex; animation: peFade .3s ease-out both; }
        .st-dy-btn { background:#111; border:1px solid #2a2f36; color:#ffb347; width:100%; font-size:9px; line-height:1; padding:4px 0; border-radius:5px; cursor:pointer; }
        .st-dy-btn, .st-dy-btn:hover, .st-dy-btn:focus, .st-dy-btn:active { background:#111 !important; box-shadow:none !important; transform:none !important; margin:0 !important; }
        .st-dy-btn:hover { border-color:#ffb347; }
        .st-dy-list { height:204px; box-sizing:border-box; width:100%; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; position:relative;
            border-radius:6px; background:#0b0d10; border:1px solid #22272d; padding:71px 0;
            -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); }
        .st-dy-list::-webkit-scrollbar { display:none; }
        .st-dy-item { scroll-snap-align:center; height:62px; box-sizing:border-box; padding:5px 2px; text-align:center; cursor:pointer;
            border-top:1px solid transparent; border-bottom:1px solid transparent; transition: background .2s; }
        .st-dy-item.active { background:rgba(255,179,71,.1); border-color:rgba(255,179,71,.5); }

        @media (max-width: 500px) { .st-dy { width:56px; } .st-dy-gz { font-size:15px; } }
        @media (prefers-reduced-motion: reduce) { .st-flow, .st-orbit { animation:none !important; } }
        /* ===== 十神星圖動畫 ===== */
        .anim-pending .pe-anim, .anim-pending .gj-anim { opacity:0; }
        .pe-node, .pe-halo { transform-box: fill-box; transform-origin: center; }
        .anim-on .pe-sheng { stroke-dasharray:140; animation: peDraw .5s ease-out both; animation-delay: var(--d); }
        @keyframes peDraw { from { stroke-dashoffset:140; } to { stroke-dashoffset:0; } }
        .anim-on .pe-ke { animation: peFade .5s ease-out both; animation-delay: var(--d); }
        @keyframes peFade { from { opacity:0; } }
        .anim-on .pe-node { animation: pePop .6s cubic-bezier(.34,1.56,.64,1) both; animation-delay: var(--d); }
        @keyframes pePop { from { opacity:0; transform:scale(.2); } }
        .anim-on .pe-ss { animation: peSlide .45s ease-out both; animation-delay: var(--d); }
        .anim-on .pe-ss.pe-ss-l { animation-name: peSlideL; }
        @keyframes peSlide { from { opacity:0; transform:translateX(-8px); } }
        @keyframes peSlideL { from { opacity:0; transform:translateX(8px); } }
        .anim-on .pe-badge { animation: peFade .5s ease-out both; animation-delay: var(--d); }
        .pe-dot { opacity:0; filter: drop-shadow(0 0 4px #00d2ff); }
        .anim-on .pe-dot { animation: peDotIn .6s ease-out both; animation-delay: var(--d); }
        @keyframes peDotIn { from { opacity:0; } to { opacity:.85; } }
        .pe-halo { opacity:0; }
        .anim-on .pe-halo { animation: peHalo 2.6s ease-out 1.3s infinite; }
        @keyframes peHalo { 0% { opacity:.7; transform:scale(1); } 100% { opacity:0; transform:scale(1.75); } }
        @media (prefers-reduced-motion: reduce) {
            .anim-on .gj-anim, .anim-on .pe-anim, .anim-on .pe-halo, .anim-on .gj-lcd::before { animation:none !important; }
            .anim-on .pe-dot { opacity:0 !important; }

        /* ===== 流日面板：單一長條圖，一行顯示10天趨勢 ===== */

        .liuri-advice-hint { font-size: 11px; color: #666; text-align: center; margin-top: 14px; margin-bottom: 6px; }

        /* ===== 輸入模式切換：並排分段式按鈕，取代原生 radio 對齊不齊的問題 ===== */
        .mode-toggle { display: flex; background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 18px; }
        .mode-toggle-btn {

        /* ===== 近月動態流月掃描：真表格對齊（badge 欄自動依內容最寬對齊，不再跑版） ===== */
        table.lm-table { width: 100%; border-collapse: collapse; margin-top: 12px; }

        table.lm-table td.lm-desc-cell { color: #ddd; font-size: 13px; vertical-align: top; padding: 2px 0 8px 0; }
        /* 窄螢幕：放棄表格欄位對齊，改成上下堆疊的區塊，避免中文字被擠到逐字換行 */

        /* 每個字都放在同尺寸的圓框裡（未圈時框線透明），圈與不圈的字寬度一致，十神才會對齊 */

        .fr-rank-row.is-sel { background: rgba(0,210,255,0.08); box-shadow: inset 0 0 0 1px rgba(0,210,255,0.35); }
        .fr-rank-no { color: #888; font-size: 11px; text-align: center; }
        .fr-rank-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fr-rank-track { height: 6px; background: #262626; border-radius: 3px; overflow: hidden; }
        .fr-rank-track span { display: block; height: 100%; border-radius: 3px; }
        .fr-rank-score { font-weight: bold; text-align: right; }
        @media (max-width: 500px) {
            .fr-viz { grid-template-columns: 1fr; }
            .fr-input { grid-template-columns: 1fr 1fr; }
            .fr-input button { grid-column: 1 / -1; width: 100%; }
        }
        .rel-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid; margin-right: 4px; vertical-align: -1px; }
        .rel-coming { font-size: 12px; color: #666; text-align: center; padding: 14px 0 4px 0; }
        @media (max-width: 500px) {
            .rel-star-grid { grid-template-columns: 1fr 1fr; }
            .rel-ev-row { grid-template-columns: 1fr 36px; }
            .rel-ev-tags { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>八字五行(量化版)</h2>

    <div class="saved-charts-panel">
        <div id="savedChartsList" class="saved-charts-list"></div>
    </div>

    <div class="mode-toggle">
        <label class="mode-toggle-btn active" data-mode="date">
            <input type="radio" name="inputMode" value="date" checked onchange="toggleInputMode()">
            <span>依出生日期</span>
        </label>
        <label class="mode-toggle-btn" data-mode="bazi">
            <input type="radio" name="inputMode" value="bazi" onchange="toggleInputMode()">
            <span>手動輸入八字</span>
        </label>
    </div>

    <!-- 出生日期輸入介面 -->
    <div class="form-group" id="dateInputGroup" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px;">
        <div style="display: flex; gap: 8px;">

            <select id="birthHour" style="padding: 12px; font-size: 15px; flex: 1;"></select>
            <select id="birthMinute" style="padding: 12px; font-size: 15px; flex: 1;"></select>
        </div>
        <details class="acc-section" style="margin-bottom: 0; margin-top: 6px;">
            <summary class="acc-summary" style="font-size: 13px; padding: 10px 12px;">⚙️ 進階設定（早晚子時／真太陽時）<span class="acc-chevron">▾</span></summary>
            <div class="acc-body" style="display: flex; flex-direction: column; gap: 12px; padding-top: 10px;">
                <label style="display: flex; align-items: center; cursor: pointer; color: #fff; font-size: 14px;">
                    <input type="checkbox" id="useSplitZi" style="width: 18px; height: 18px; margin-right: 8px;">
                    <span style="flex:1;">區分早晚子時 <span style="font-size:12px; color:#aaa;">(23:00~00:00 日柱算當日)</span></span>
                </label>
                <div style="height: 1px; background: #3c3c3c;"></div>
                <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <label style="display: flex; align-items: center; cursor: pointer; color: #fff; font-size: 14px; min-width: 120px;">
                        <input type="checkbox" id="useTrueSolar" style="width: 18px; height: 18px; margin-right: 8px;" onchange="toggleTrueSolar()">
                        啟用真太陽時

                        <span style="color: #aaa; font-size: 13px; white-space: nowrap;">經度:</span>
                        <input type="number" id="longitude" value="121.5" step="0.1" style="padding: 8px; font-size: 14px; flex: 1; min-width: 60px;">
                        <span style="font-size: 12px; color: #888; white-space: nowrap;">(台灣 121.5)</span>

        </details>
    </div>

    <!-- 手動八字輸入介面 -->
    <div class="form-group" id="baziInputGroup" style="display: none; flex-direction: column; gap: 15px; margin-bottom: 20px;">
        <div style="background-color: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid var(--border);">
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">年柱</span>
                <select id="yg" style="padding: 10px; font-size:15px;"></select>
                <select id="yz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">月柱</span>
                <select id="mg" style="padding: 10px; font-size:15px;"></select>
                <select id="mz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">日柱</span>
                <select id="dg" style="padding: 10px; font-size:15px;"></select>
                <select id="dz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">時柱</span>
                <select id="tg" style="padding: 10px; font-size:15px;"></select>
                <select id="tz" style="padding: 10px; font-size:15px;"></select>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 13px;">西元年</span>
                <input type="number" id="baziYear" title="出生年份，用來推算流年" style="padding-left: 60px; padding-right: 8px;">
            </div>
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 13px;">起運歲</span>
                <input type="number" id="baziStartAge" value="1" title="大運幾歲開始交運 (虛歲)" style="padding-left: 60px; padding-right: 8px;">
            </div>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 0;">
        <select id="gender" style="grid-column: span 2;">
            <option value="1">男性</option>
            <option value="0">女性</option>
        </select>
    </div>
    <div class="form-group" style="grid-template-columns: 2fr 1fr; margin-top: 15px; display: grid; gap: 10px;">
        <button onclick="calculateBazi()">執行運算</button>
        <button onclick="saveCurrentChartPrompt()" style="background: #333; color: var(--accent); border: 1px solid var(--accent);">💾 儲存</button>
    </div>

    <div class="result-box" id="resultBox">
        <!-- 1. 排盤基本資料 (常駐顯示，不收合) -->
        <div id="baziGrid"></div>
        
        <!-- 2. 核心能量儀表板 (預設展開) -->
        <div id="energyDashboardOutput"></div>

        <!-- 3. 流日速覽 (新增，預設展開) -->
        <div id="liuriOutput"></div>

        <!-- 4. 原局結構拆解 (天地通透) -->
        <details class="acc-section">
            <summary class="acc-summary">☯️ 天地通透（藏干通根與透干）<span class="acc-chevron">▾</span></summary>
            <div class="acc-body">
                <div id="tonggenOutput"></div> 
                <div style="height: 1px; background: linear-gradient(90deg, transparent, #444, transparent); margin: 20px 0;"></div>
                <div id="touganOutput"></div> 
            </div>
        </details>
        
        <div id="hebanOutput"></div>
        <div id="chongxingOutput"></div>
        <div id="sikuOutput"></div>
        
        <!-- 5. 歲運交感與引動 (動態時間軸) -->
        <div id="dayunLiunianOutput"></div>
        <div id="dynamicTonggenTouganOutput"></div>
        
        <!-- 6. 落地戰術指南 -->
        <div id="monthlyTacticsOutput"></div>

        <!-- 我的人際圈（父母／兄弟／子女／朋友／婚姻）：放在命主資訊之後 -->
        <div id="relativesOutput"></div>
        
        <!-- 7. AI 深度總結（永遠常駐顯示，不放進手風琴） -->
        <div class="ai-btn-group" id="aiBtnContainer" style="display:none;">
            <button id="copyPromptBtn" style="flex:1;" onclick="copyPromptForAI()">📋 一鍵複製提示詞，貼給 AI 解盤</button>
        </div>
    </div>

    <div style="text-align:center; margin-top:20px; opacity:0.6;">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=uptronyx-debug.bazi-app" alt="訪客累計人次" style="height:20px;">
    </div>
    
</div>

<script>
    window.currentBaziDataForAI = null;

    window.onload = function() {
        if (typeof Solar === 'undefined') {
            document.querySelector('.container').innerHTML =
                '<h2 style="color:#ff5252;">⚠️ 排盤引擎載入失敗</h2>' +
                '<p style="color:#ccc; line-height:1.7;">無法載入 lunar-javascript 這個排盤核心套件（通常是 CDN 連線被擋、公司/學校網路防火牆，或暫時斷線）。<br>' +
                '請確認網路連線正常後重新整理頁面；若在企業網路環境仍失敗，建議改用手機網路或連上其他 Wi-Fi 測試。</p>';
            return;
        }
        const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
        const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const ganSelects = ['yg', 'mg', 'dg', 'tg'];
        const zhiSelects = ['yz', 'mz', 'dz', 'tz'];
        
        ganSelects.forEach(id => {
            const el = document.getElementById(id);
            stems.forEach(g => { el.appendChild(new Option(g, g)); });
        });

        zhiSelects.forEach(id => {
            const el = document.getElementById(id);
            branches.forEach(z => { el.appendChild(new Option(z, z)); });
        });

        const now = new Date();
        const pad2 = (n) => String(n).padStart(2, '0');
        // 24 小時制小時／分鐘下拉選單，避免原生 datetime-local 依裝置語系顯示 12 小時制造成誤判
        const hourSelect = document.getElementById('birthHour');
        for (let h = 0; h <= 23; h++) hourSelect.appendChild(new Option(`${pad2(h)} 時`, h));
        const minuteSelect = document.getElementById('birthMinute');
        for (let m = 0; m <= 59; m++) minuteSelect.appendChild(new Option(`${pad2(m)} 分`, m));

        document.getElementById('birthDate').value = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
        hourSelect.value = now.getHours();
        minuteSelect.value = now.getMinutes();
        document.getElementById('baziYear').value = now.getFullYear();

        try {
            const solarNow = Solar.fromYmdHms(now.getFullYear(), now.getMonth() + 1, now.getDate(), now.getHours(), now.getMinutes(), 0);
            const baziNow = solarNow.getLunar().getEightChar();
            
            document.getElementById('yg').value = baziNow.getYearGan();
            document.getElementById('yz').value = baziNow.getYearZhi();
            document.getElementById('mg').value = baziNow.getMonthGan();
            document.getElementById('mz').value = baziNow.getMonthZhi();
            document.getElementById('dg').value = baziNow.getDayGan();
            document.getElementById('dz').value = baziNow.getDayZhi();
            document.getElementById('tg').value = baziNow.getTimeGan();
            document.getElementById('tz').value = baziNow.getTimeZhi();
        } catch (e) {
            document.getElementById('yg').value = '己'; document.getElementById('yz').value = '巳';
            document.getElementById('mg').value = '己'; document.getElementById('mz').value = '巳';
            document.getElementById('dg').value = '丁'; document.getElementById('dz').value = '丑';
            document.getElementById('tg').value = '乙'; document.getElementById('tz').value = '巳';
        }
        renderSavedChartsList();
    };

    function toggleTrueSolar() {
        const isChecked = document.getElementById('useTrueSolar').checked;
        document.getElementById('solarTimeSettings').style.display = isChecked ? 'flex' : 'none';
    }

    function toggleInputMode() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        if (mode === 'date') {
            document.getElementById('dateInputGroup').style.display = 'flex';
            document.getElementById('baziInputGroup').style.display = 'none';
        } else {
            document.getElementById('dateInputGroup').style.display = 'none';
            document.getElementById('baziInputGroup').style.display = 'flex';
        }
        document.querySelectorAll('.mode-toggle-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
    }

    // ===== 我的命盤：存在瀏覽器 localStorage，只有這台裝置看得到，不會上傳 =====
    // ===================================================================
    // 朋友契合度（單向：朋友對命主的幫助）— 不列入 AI 提詞
    // 命主身弱／從弱：喜 印、比劫（各 1.0）
    // 命主身強／從強：喜 官殺、財（各 1.0），食傷 0.3，印比 0
    // 總分 = 主分數 80% ＋ 補缺分 20%（命主喜用低於 20% 平衡線的缺口，合盤平均後補回比例）
    // ===================================================================
    const FRIENDS_KEY = 'bazi_friends_v1';
    const FIVE_ELS = ['木', '火', '土', '金', '水'];
    const BALANCE_LINE = 20;
    let __selectedFriendIdx = null;

    function getFriends() { try { return JSON.parse(localStorage.getItem(FRIENDS_KEY) || '[]'); } catch (e) { return []; } }
    function setFriends(list) { try { localStorage.setItem(FRIENDS_KEY, JSON.stringify(list)); } catch (e) { alert('儲存失敗，可能是瀏覽器隱私模式或空間已滿。'); } }

    // 朋友只有年月日（無時辰）：排年、月、日三柱，以中午 12:00 排盤避開子時換日
    function calcFriendPct(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const bz = Solar.fromYmdHms(y, m, d, 12, 0, 0).getLunar().getEightChar();
        const gans = [bz.getYearGan(), bz.getMonthGan(), bz.getDayGan()];
        const zhis = [bz.getYearZhi(), bz.getMonthZhi(), bz.getDayZhi()];
        const cnt = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
        gans.forEach(g => cnt[ganElementMap[g]] += 1.0);
        zhis.forEach(z => { const w = zhiHiddenWeights[z] || {}; Object.keys(w).forEach(g => cnt[ganElementMap[g]] += w[g]); });
        const total = Object.values(cnt).reduce((a, b) => a + b, 0);
        const pct = {}; FIVE_ELS.forEach(el => pct[el] = total ? cnt[el] / total * 100 : 0);
        return { pct, pillars: gans.map((g, i) => g + zhis[i]) };
    }

    function friendWeights(ctx) {
        const de = ctx.dayElement;
        const yin = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === de);
        const shiShang = wuxingRel[de].sheng, cai = wuxingRel[de].ke;
        const guanSha = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === de);
        const isWeak = ctx.strengthLabel === '身弱' || ctx.strengthLabel === '從弱格';
        const w = {}; FIVE_ELS.forEach(el => w[el] = 0);
        if (isWeak) { w[yin] = 1; w[de] = 1; }
        else { w[guanSha] = 1; w[cai] = 1; w[shiShang] = 0.3; }
        return { w, isWeak, names: { [yin]: '印', [de]: '比劫', [shiShang]: '食傷', [cai]: '財', [guanSha]: '官殺' } };
    }

    function computeFriendScore(ctx, frPct) {
        const { w } = friendWeights(ctx);
        const main = FIVE_ELS.reduce((sum, el) => sum + frPct[el] * w[el], 0);
        const combined = {}; FIVE_ELS.forEach(el => combined[el] = (ctx.mePct[el] + frPct[el]) / 2);
        let gap = 0, filled = 0;
        FIVE_ELS.forEach(el => {
            if (w[el] === 1 && ctx.mePct[el] < BALANCE_LINE) {
                gap += BALANCE_LINE - ctx.mePct[el];
                filled += Math.max(0, Math.min(combined[el], BALANCE_LINE) - ctx.mePct[el]);
            }
        });
        const fill = gap > 0 ? filled / gap * 100 : null;
        const total = Math.round(fill === null ? main : main * 0.8 + fill * 0.2);
        return { main: Math.round(main), fill: fill === null ? null : Math.round(fill), total: Math.max(0, Math.min(100, total)), combined };
    }

    function friendGrade(score) {
        if (score >= 80) return { label: '神隊友', color: '#2ed573' };
        if (score >= 60) return { label: '合拍', color: '#00d2ff' };
        if (score >= 40) return { label: '普通', color: '#ff9800' };
        return { label: '各有所長', color: '#999' };
    }

    function renderFriendGauge(score) {
        const g = friendGrade(score);
        const R = 70, C = Math.PI * R;
        const off = C * (1 - score / 100);
        return `
            <svg viewBox="0 0 180 110" class="fr-gauge">
                <path d="M20 95 A70 70 0 0 1 160 95" fill="none" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round"/>
                <path d="M20 95 A70 70 0 0 1 160 95" fill="none" stroke="${g.color}" stroke-width="14" stroke-linecap="round"
                    stroke-dasharray="${C}" stroke-dashoffset="${C}" data-target-offset="${off}" class="fr-gauge-arc"/>
                <text x="90" y="80" text-anchor="middle" class="fr-gauge-num" fill="#fff">${score}</text>
                <text x="90" y="102" text-anchor="middle" class="fr-gauge-label" fill="${g.color}">${g.label}</text>
            </svg>`;
    }

    function renderFriendBars(ctx, sc) {
        const { w } = friendWeights(ctx);
        const maxV = Math.max(50, ...FIVE_ELS.map(el => Math.max(ctx.mePct[el], sc.combined[el]))) * 1.1;
        const pct = (v) => (v / maxV * 100).toFixed(2);
        return `<div class="fr-bars">` + FIVE_ELS.map(el => {
            const me = ctx.mePct[el], cb = sc.combined[el];
            const lo = Math.min(me, cb), hi = Math.max(me, cb);
            const up = cb > me;
            const deltaCls = up ? (w[el] > 0 ? 'fr-delta-good' : 'fr-delta-up') : 'fr-delta-down';
            return `
                <div class="fr-bar-row">
                    <span class="fr-bar-el${w[el] === 1 ? ' is-fav' : ''}" style="color:${elementColors[el]}">${el}</span>
                    <div class="fr-bar-track">
                        <div class="fr-bar-line" style="left:${pct(BALANCE_LINE)}%"></div>
                        <div class="fr-bar-base" style="width:${pct(me)}%; background:${elementColors[el]};" data-target-width="${pct(lo)}"></div>
                        <div class="fr-bar-delta ${deltaCls}" style="left:${pct(lo)}%; width:0%;" data-target-width="${pct(hi - lo)}"></div>
                    </div>
                    <span class="fr-bar-val">${me.toFixed(0)}→<b>${cb.toFixed(0)}</b>%</span>
                </div>`;
        }).join('') + `</div>`;
    }

    function animateFriendViz() {
        requestAnimationFrame(() => requestAnimationFrame(() => {
            document.querySelectorAll('.fr-gauge-arc').forEach(a => a.style.strokeDashoffset = a.dataset.targetOffset);
            document.querySelectorAll('.fr-bar-base, .fr-bar-delta').forEach(b => b.style.width = b.dataset.targetWidth + '%');
        }));
    }

    function renderFriendsTab() {
        const panel = document.getElementById('friendPanel');
        const ctx = window.__friendCtx;
        if (!panel || !ctx) return;
        const { isWeak, names, w } = friendWeights(ctx);
        const fav = FIVE_ELS.filter(el => w[el] === 1).map(el => `<b style="color:${elementColors[el]}">${el}</b>（${names[el]}）`).join('、');
        const friends = getFriends().map((f, i) => {
            try { const r = calcFriendPct(f.date); return { ...f, idx: i, ...r, score: computeFriendScore(ctx, r.pct) }; }
            catch (e) { return null; }
        }).filter(Boolean);
        if (__selectedFriendIdx === null || !friends.some(f => f.idx === __selectedFriendIdx)) __selectedFriendIdx = friends.length ? friends[friends.length - 1].idx : null;
        const sel = friends.find(f => f.idx === __selectedFriendIdx);

        let html = `
            <div class="rel-summary">
                <span>命主 <b>${ctx.strengthLabel}</b>（${ctx.totalScore}分）${!isWeak && ctx.strengthLabel === '從強格' ? '・視為身強' : ''}${isWeak && ctx.strengthLabel === '從弱格' ? '・視為身弱' : ''}</span>
                <span>喜 ${fav}</span>
            </div>
            <div class="fr-input">
                <input type="text" id="friendName" placeholder="朋友名字" maxlength="12">
                <input type="date" id="friendDate">
                <button onclick="addFriend()">計算</button>
            </div>
        `;
        if (sel) {
            html += `
                <div class="fr-result">
                    <div class="fr-result-head">👤 ${sel.name}<span class="fr-pillars">${sel.pillars.join(' ')}（無時柱）</span></div>
                    <div class="fr-viz">
                        <div class="fr-gauge-wrap">
                            ${renderFriendGauge(sel.score.total)}
                            <div class="fr-breakdown">主分數 ${sel.score.main}${sel.score.fill === null ? '・無缺口' : `・補缺 ${sel.score.fill}`}</div>
                        </div>
                        <div class="fr-bars-wrap">
                            <div class="fr-bars-title">命主五行 → 合盤後（虛線＝20% 平衡線）</div>
                            ${renderFriendBars(ctx, sel.score)}
                        </div>
                    </div>
                </div>
            `;
        } else {
            html += `<div class="rel-coming">輸入朋友的出生年月日，計算他對你的五行互補度</div>`;
        }
        if (friends.length) {
            const ranked = [...friends].sort((a, b) => b.score.total - a.score.total);
            html += `<div class="rel-ev-title" style="margin-top:14px;">🏆 朋友排行榜</div><div class="fr-rank">` + ranked.map((f, r) => {
                const g = friendGrade(f.score.total);
                return `
                    <div class="fr-rank-row${f.idx === __selectedFriendIdx ? ' is-sel' : ''}" onclick="selectFriend(${f.idx})">
                        <span class="fr-rank-no">${r + 1}</span>
                        <span class="fr-rank-name">${f.name}</span>

    // ===== 人元司令分野表（用於精確判斷「得令」，與上方藏干比重系統為獨立用途）=====
    // 資料來源：三命通會／淵海子平通行版「十二月令人元司令分野表」，
    // 以出生月支起始的「節」（非中氣）為 0 天基準，逐段累加天數判斷「當令司令神」。
    // 各校版本天數略有 1~3 日出入屬正常現象（節氣交接精確度、地域曆法差異所致）。
    const renYuanSiLing = {
        '寅': [['戊', 7], ['丙', 7], ['甲', 16]],
        '卯': [['甲', 10], ['乙', 20]],
        '辰': [['乙', 9], ['癸', 3], ['戊', 18]],

        '戌': [['辛', 9], ['丁', 3], ['戊', 18]],
        '亥': [['戊', 7], ['甲', 5], ['壬', 18]],
        '子': [['壬', 10], ['癸', 20]],
        '丑': [['癸', 9], ['辛', 3], ['己', 18]]
    };
    // 對應每個月支「起運」的節氣名稱（十二「節」，非十二「中氣」）
    const monthJieName = {
        '寅': '立春', '卯': '驚蟄', '辰': '清明', '巳': '立夏', '午': '芒種', '未': '小暑',
        '申': '立秋', '酉': '白露', '戌': '寒露', '亥': '立冬', '子': '大雪', '丑': '小寒'
    };

    /**
     * 依據出生的真實節氣交接日，精確計算「本月人元司令神」。
     * birthSolar: lunar-javascript 的 Solar 物件（僅在「依出生日期」模式下可取得）
     * monthZhi: 月支文字，例如 '寅'
     * 若無法取得節氣資料（例如手動輸入八字、無出生日期時），回傳 null，呼叫端應改用簡易月支五行法 fallback。
     */
    // lunar-javascript 的節氣表以簡體字為鍵（惊蛰、芒种），程式內用繁體名稱，查表時需轉換
    const JQ_SIMP = { '驚蟄': '惊蛰', '芒種': '芒种', '穀雨': '谷雨', '小滿': '小满', '處暑': '处暑' };
    function jqGet(table, name) { return table ? (table[name] || table[JQ_SIMP[name]] || null) : null; }

    function getSiLingGan(birthSolar, monthZhi) {
        try {
            if (!birthSolar || typeof Solar === 'undefined') return null;
            const jieName = monthJieName[monthZhi];
            if (!jieName) return null;

            const y = birthSolar.getYear();
            // 取前一年、當年、後一年三份節氣表，避免跨年邊界（例如子月、丑月）找不到節氣日期
            let candidateDates = [];
            [y - 1, y, y + 1].forEach(yy => {
                const table = Solar.fromYmd(yy, 6, 1).getLunar().getJieQiTable();
                const jd = jqGet(table, jieName);
                if (jd) candidateDates.push(jd);
            });
            if (candidateDates.length === 0) return null;

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            const birthKey = toKey(birthSolar);
            // 找「不晚於出生日」且最近的一個節氣日期
            let validDates = candidateDates.filter(s => toKey(s) <= birthKey);
            if (validDates.length === 0) return null;
            validDates.sort((a, b) => toKey(b) - toKey(a));
            const jieDate = validDates[0];

            const daysPassed = birthSolar.getJulianDay() - jieDate.getJulianDay();
            if (daysPassed < 0) return null;

            const segments = renYuanSiLing[monthZhi];
            if (!segments) return null;
            let acc = 0;
            for (let i = 0; i < segments.length; i++) {
                acc += segments[i][1];
                if (daysPassed < acc || i === segments.length - 1) return segments[i][0];
            }
            return segments[segments.length - 1][0];
        } catch (e) {
            console.warn('getSiLingGan 計算失敗，改用簡易月支五行法:', e);
            return null;
        }
    }

    // 十二「節」名稱清單（依時間順序，用於流月精確區間標示）
    const jieOrderNames = ['立春', '驚蟄', '清明', '立夏', '芒種', '小暑', '立秋', '白露', '寒露', '立冬', '大雪', '小寒'];
    const jieNameToZhi = {};
    Object.keys(monthJieName).forEach(zhi => { jieNameToZhi[monthJieName[zhi]] = zhi; });

    /**
     * 依任意一個取樣日期，回傳該日所屬的節氣月精確區間（起訖節氣名稱＋國曆日期）。
     * 回傳 null 代表節氣資料抓取失敗，呼叫端應 fallback 回國曆年月顯示。
     */
    function getJieQiRange(sampleSolar) {
        try {
            if (!sampleSolar || typeof Solar === 'undefined') return null;
            const y = sampleSolar.getYear();
            let allJie = [];
            [y - 1, y, y + 1].forEach(yy => {
                const table = Solar.fromYmd(yy, 6, 1).getLunar().getJieQiTable();
                jieOrderNames.forEach(name => { const jd = jqGet(table, name); if (jd) allJie.push({ name: name, solar: jd }); });
            });
            if (allJie.length === 0) return null;

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            allJie.sort((a, b) => toKey(a.solar) - toKey(b.solar));
            const sampleKey = toKey(sampleSolar);

            let startIdx = -1;
            for (let i = 0; i < allJie.length; i++) {
                if (toKey(allJie[i].solar) <= sampleKey) startIdx = i; else break;
            }
            if (startIdx === -1 || !allJie[startIdx + 1]) return null;

            const start = allJie[startIdx];
            const end = allJie[startIdx + 1];
            const fmt = (s) => `${s.getYear()}/${s.getMonth()}/${s.getDay()}`;
            return {
                startLabel: `${fmt(start.solar)} ${start.name}`,
                endLabel: `${fmt(end.solar)} ${end.name}`,
                monthZhi: jieNameToZhi[start.name]
            };
        } catch (e) {
            console.warn('getJieQiRange 計算失敗，改用國曆年月顯示:', e);
            return null;
        }
    }

                 if (baseZhis.includes(needed[0]) && baseZhis.includes(needed[1])) isShiShiTriggered = true;
            }
            if (!isShiShiTriggered && ((tZhi === '丑' && z2 === '戌') || (tZhi === '戌' && z2 === '丑') || (tZhi === '戌' && z2 === '未') || (tZhi === '未' && z2 === '戌'))) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」與 ${p.name}「${z2}」發生恃勢相刑</span>`);
        });
        return [...new Set(alerts)];
    }

    function calculateXuYulanScore(baziMap, dayElement) {
        const shengMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
        const helpfulElements = [dayElement];
        for (let k in shengMap) if (shengMap[k] === dayElement) helpfulElements.push(k);
        const isHelpful = (el) => helpfulElements.includes(el);

        let state = [
            { id: 'YG', el: ganElementMap[baziMap.year.gan], score: 0, max: 5 },
            { id: 'YZ', el: zhiElementMap[baziMap.year.zhi], score: 0, max: 20 },
            { id: 'MG', el: ganElementMap[baziMap.month.gan], score: 0, max: 5 },
            { id: 'MZ', el: zhiElementMap[baziMap.month.zhi], score: 0, max: 35 },
            { id: 'DG', el: ganElementMap[baziMap.day.gan], score: 0, max: 0 },
            { id: 'DZ', el: zhiElementMap[baziMap.day.zhi], score: 0, max: 20 },
            { id: 'TG', el: ganElementMap[baziMap.time.gan], score: 0, max: 5 },
            { id: 'TZ', el: zhiElementMap[baziMap.time.zhi], score: 0, max: 10 }
        ];

        const getChar = (idx) => [baziMap.year, baziMap.month, baziMap.day, baziMap.time][idx];

        state.forEach(item => { if (isHelpful(item.el)) item.score = item.max; });
        state[4].score = 0; 

        if (shengMap[state[3].el] === state[2].el && shengMap[state[2].el] === dayElement) state[3].score = state[3].max;
        if (shengMap[state[7].el] === state[6].el && shengMap[state[6].el] === dayElement) state[7].score = state[7].max;
        if (shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[0].score = state[0].max;
        if (shengMap[state[1].el] === state[0].el && shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[1].score = state[1].max;

        const hasElementAdjacent = (pillarIdx, targetEl) => {
            if (state[pillarIdx*2].el === targetEl) return true; 
            if (pillarIdx > 0 && (state[(pillarIdx-1)*2].el === targetEl || state[(pillarIdx-1)*2+1].el === targetEl)) return true;
            if (pillarIdx < 3 && (state[(pillarIdx+1)*2].el === targetEl || state[(pillarIdx+1)*2+1].el === targetEl)) return true;
            return false;
        };

        for(let p = 0; p < 4; p++) {
            let zhiChar = getChar(p).zhi;
            if (!['辰', '戌', '丑', '未'].includes(zhiChar)) continue; 
            
            let zhiState = state[p*2+1];
            let ganState = state[p*2];

            if (zhiChar === '辰') {
                if (ganState.el === '木') zhiState.el = '木';
                else if (ganState.el === '水') zhiState.el = '水';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '水')) zhiState.el = '水';
            } else if (zhiChar === '戌') { 
                if (ganState.el === '火') zhiState.el = '火';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '火')) zhiState.el = '火';
            } else if (zhiChar === '丑') {
                if (ganState.el === '金') zhiState.el = '金';
                else if (ganState.el === '水') zhiState.el = '水';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '金')) zhiState.el = '金';
                if (hasElementAdjacent(p, '水')) zhiState.el = '水';
            } else if (zhiChar === '未') {
                if (ganState.el === '火') zhiState.el = '火';
                else if (ganState.el === '木') zhiState.el = '木';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '火')) zhiState.el = '火';
                if (hasElementAdjacent(p, '木')) zhiState.el = '木';
            }

            zhiState.score = isHelpful(zhiState.el) ? zhiState.max : 0;
        }

        const allZhis = [getChar(0).zhi, getChar(1).zhi, getChar(2).zhi, getChar(3).zhi];
        const sanHui = [{r:['寅','卯','辰'], e:'木'}, {r:['巳','午','未'], e:'火'}, {r:['申','酉','戌'], e:'金'}, {r:['亥','子','丑'], e:'水'}];
        sanHui.forEach(hui => {
            if (hui.r.every(c => allZhis.includes(c))) {
                for(let i=0; i<4; i++) {
                    if (hui.r.includes(allZhis[i])) {
                        state[i*2+1].el = hui.e;
                        state[i*2+1].score = isHelpful(hui.e) ? state[i*2+1].max : 0;
                    }
                }
            }
        });

        const sanHe = [{r:['申','子','辰'], e:'水'}, {r:['亥','卯','未'], e:'木'}, {r:['寅','午','戌'], e:'火'}, {r:['巳','酉','丑'], e:'金'}];
        sanHe.forEach(he => {
            let matches = [];
            for(let i=0; i<4; i++) if (he.r.includes(allZhis[i])) matches.push({idx: i, branch: allZhis[i]});
            let uniqueBranches = [...new Set(matches.map(m => m.branch))];
            if (uniqueBranches.length >= 2) {
                if (isHelpful(he.e)) { 
                    matches.forEach(m => {
                        state[m.idx*2+1].el = he.e;
                        state[m.idx*2+1].score = state[m.idx*2+1].max;
                    });
                }
            }
        });

        let total = 0;
        state.forEach(s => total += s.score);
        return total;
    }

    function getTraditionalRoots(targetGan, targetIndex, allZhis, pNames) {
        let roots = [];
        let targetElement = ganElementMap[targetGan]; 
        let maxScore = 0;
        let finalLabel = "虛浮無根";

        allZhis.forEach((zhi, index) => {
            let hideGansObj = zhiHiddenWeights[zhi] || {};
            let sortedGans = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
            let foundIndex = sortedGans.findIndex(hg => ganElementMap[hg] === targetElement);
            
            if (foundIndex !== -1) {
                let rootType = foundIndex === 0 ? "本氣" : (foundIndex === 1 ? "中氣" : "餘氣");
                roots.push({ pillarName: pNames[index], zhi: zhi, type: rootType });
                let score = 0;
                let distance = Math.abs(targetIndex - index);
                
                if (index === 1 && foundIndex === 0) score = 10;
                else if (distance === 0 && foundIndex === 0) score = 8;
                else if ((distance === 0 && foundIndex === 1) || (distance === 1 && foundIndex === 0)) score = 5;
                else if (distance > 1 && foundIndex === 0) score = 4;
                else score = 2;

                if (score > maxScore) maxScore = score;
            }
        });

        if (maxScore >= 10) finalLabel = "月令強根";
        else if (maxScore >= 8) finalLabel = "自坐強根";
        else if (maxScore >= 4) finalLabel = "有根";
        else if (maxScore > 0) finalLabel = "弱根";

        return { roots: roots, label: finalLabel, score: maxScore };
    }

    // ===== 汽車儀表風半圓儀表（體力：通根／天干比印／調候） =====
    const PG = { cx: 100, cy: 100, R: 78 };
    function pgPt(t, r) { const th = Math.PI * (1 - t); return [PG.cx + r * Math.cos(th), PG.cy - r * Math.sin(th)]; }
    function pgArc(t0, t1, r) {
        if (t1 < t0) [t0, t1] = [t1, t0];
        if (t1 - t0 < 0.0005) return '';
        const [x0, y0] = pgPt(t0, r), [x1, y1] = pgPt(t1, r);
        return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
    }
    function pgZoneColor(cfg, v) {
        const zs = cfg.zones;
        if (v <= zs[0].from) return zs[0].color;
        const z = zs.find(z => v >= z.from && v < z.to) || zs[zs.length - 1];
        return z.color;
    }
    function pgFmt(cfg, v) {
        const n = Math.round(v);
        if (cfg.fmt === 'signed') return (n > 0 ? '+' : '') + n;
        if (cfg.fmt === 'pct') return n + '%';
        return String(n);
    }
    function renderCarGauge(cfg) {
        const { R } = PG, span = cfg.max - cfg.min, T = v => (v - cfg.min) / span;
        let s = `<svg viewBox="0 0 200 132" aria-label="${cfg.title}">`;
        // 錶面
        s += `<path d="M${PG.cx - R - 10},${PG.cy} A${R + 10},${R + 10} 0 0 1 ${PG.cx + R + 10},${PG.cy} Z" fill="url(#pgFace)" stroke="url(#pgBezel)" stroke-width="2"/>`;
        // 分區色帶（暗）＋內側細彩線
        cfg.zones.forEach(z => {
            s += `<path d="${pgArc(T(z.from), T(z.to), R)}" stroke="${z.color}" stroke-opacity="0.16" stroke-width="10" fill="none"/>`;
            s += `<path d="${pgArc(T(z.from), T(z.to), R - 9)}" stroke="${z.color}" stroke-opacity="0.75" stroke-width="1.6" fill="none"/>`;
        });
        // 刻度
        for (let v = cfg.min; v <= cfg.max + 1e-9; v += cfg.minorStep) {
            const major = cfg.majors.some(m => Math.abs(m - v) < 1e-6);
            const [x0, y0] = pgPt(T(v), major ? R - 22 : R - 17), [x1, y1] = pgPt(T(v), R - 12);
            s += `<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${major ? '#ddd' : '#666'}" stroke-width="${major ? 1.8 : 1}" stroke-linecap="round"/>`;
        }
        (cfg.labels || []).forEach(l => {
            const [x, y] = pgPt(T(l.v), R - 32);
            s += `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="${l.size || 9}" font-weight="bold" fill="${l.color || '#888'}">${l.text}</text>`;
        });
        // 門檻標記（三角形）
        if (cfg.marker) {
            const t = T(cfg.marker.v), [tx, ty] = pgPt(t, R + 8), [bx1, by1] = pgPt(t - 0.025, R + 15), [bx2, by2] = pgPt(t + 0.025, R + 15);
            s += `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${bx1.toFixed(1)},${by1.toFixed(1)} ${bx2.toFixed(1)},${by2.toFixed(1)}" fill="${cfg.marker.color}" filter="url(#pgGlow)"/>`;
            const [lx, ly] = pgPt(T(cfg.marker.v), R - 12), [lx2, ly2] = pgPt(T(cfg.marker.v), R + 5);
            s += `<line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="${cfg.marker.color}" stroke-width="2"/>`;
        }
        // 動態：亮起的填充弧、指針、數值
        s += `<path class="pg-fill" d="" stroke="${pgZoneColor(cfg, cfg.min)}" stroke-width="10" fill="none" stroke-linecap="butt" filter="url(#pgGlow)"/>`;
        s += `<g class="pg-needle" transform="rotate(-90 ${PG.cx} ${PG.cy})" filter="url(#pgNeedle
