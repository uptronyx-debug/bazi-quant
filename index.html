    // 全域版精確十神（含陰陽），供格局／用神判定使用（與 calculateBaziCore 內的 getSpecificShiShen 邏輯相同）
    function getPreciseTenGod(targetGan, dGan) {
        if (!targetGan || targetGan === '-') return '';
        const tEl = ganElementMap[targetGan], dEl = ganElementMap[dGan];
        const samePol = stemPolarity[targetGan] === stemPolarity[dGan];
        if (tEl === dEl) return samePol ? '比肩' : '劫財';
        if (wuxingRel[dEl].sheng === tEl) return samePol ? '食神' : '傷官';
        if (wuxingRel[dEl].ke === tEl) return samePol ? '偏財' : '正財';
        if (wuxingRel[tEl].ke === dEl) return samePol ? '七殺' : '正官';
        if (wuxingRel[tEl].sheng === dEl) return samePol ? '偏印' : '正印';
        return '';
    }

    /**
     * 子平格局定式＋用神／忌神判定（簡化版，僅供參考，非嚴格對應單一流派）。
     * 格局：以月令（月支）藏干為主氣，優先採「已透干」者定格；比肩／劫財月令另定建祿／羊刃（月劫）；
     *       極強極弱（從強格／從弱格）時覆蓋為變格，不依正格常規論。
     * 用神／忌神：先判斷是否需要調候（月支寒暖＋原局水火比例），調候優先於扶抑；
     *            否則依身強／身弱／從強／從弱四種狀態各自對應（從格的用神方向與正格身強身弱恰好相反）。
     */
    function determineGeJuAndYongShen(mz, dGan, dayElement, baseGans, strengthLabel, elementCount, totalElements) {
        // ---- 1. 格局：月令司令神（本氣優先，若有其他藏干已透干則以透干者優先） ----
        const hideGansObj = zhiHiddenWeights[mz] || {};
        const sortedCandidates = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
        const benQiGan = sortedCandidates[0];
        const transparentCandidate = sortedCandidates.find(c => baseGans.includes(c));
        const geJuGan = transparentCandidate || benQiGan;
        const isTou = baseGans.includes(geJuGan);
        const geJuTenGod = getPreciseTenGod(geJuGan, dGan);

        const geJuNameMap = {
            '正官': '正官格', '七殺': '七殺格', '正財': '正財格', '偏財': '偏財格',
            '食神': '食神格', '傷官': '傷官格', '正印': '正印格', '偏印': '偏印格'
        };
        let geJuBaseName;
        if (geJuTenGod === '比肩') {
            geJuBaseName = '建祿格';
        } else if (geJuTenGod === '劫財') {
            geJuBaseName = (stemPolarity[dGan] === 1) ? '羊刃格' : '月劫格';
        } else {
            geJuBaseName = geJuNameMap[geJuTenGod] || '雜氣格';
        }

        let geJuName = geJuBaseName;
        let isExtreme = (strengthLabel === '從強格' || strengthLabel === '從弱格');
        if (isExtreme) {
            geJuName = `${strengthLabel}（不依正格論，原局月令本屬${geJuBaseName}）`;
        }
        const geJuNote = `月支「${mz}」藏干以「${geJuGan}」定格${isTou ? '，且已透干（格局清晰）' : '，未透干，僅以藏干本氣論格'}`;

        // ---- 2. 調候判斷（優先於扶抑） ----
        const pct = (el) => totalElements > 0 ? (elementCount[el] / totalElements) * 100 : 0;
        const winterZhi = ['亥', '子', '丑'], summerZhi = ['巳', '午', '未'];
        let tiaohou = null;
        if (winterZhi.includes(mz) && pct('火') < 12) {
            tiaohou = { need: ['火', '木'], avoid: ['水', '金'], reason: `月支「${mz}」屬冬季寒月，原局火僅約 ${pct('火').toFixed(0)}%，調候優先，需以火（次選木生火）為用` };
        } else if (summerZhi.includes(mz) && pct('水') < 12) {
            tiaohou = { need: ['水', '金'], avoid: ['火', '木'], reason: `月支「${mz}」屬夏季炎月，原局水僅約 ${pct('水').toFixed(0)}%，調候優先，需以水（次選金生水）為用` };
        }

        // ---- 3. 扶抑用神／忌神（十神類別 → 換算對應五行） ----
        const genEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        const catToEl = {
            '比劫': dayElement,
            '印': genEl,
            '食傷': wuxingRel[dayElement].sheng,
            '財': wuxingRel[dayElement].ke,
            '官殺': Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement)
        };
        const toElements = (cats) => [...new Set(cats.map(c => catToEl[c]))];

        let yongCats, jiCats, logicNote;
        if (strengthLabel === '從強格') {
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '從強格：日主氣勢已成一方獨大，用神反取比劫、印星以順其勢；財官食傷逆勢而為，稱忌神。';
        } else if (strengthLabel === '身強') {
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '身強：日主偏旺，用神取財官食傷剋洩耗身；印比為忌神，恐助身過旺。';
        } else if (strengthLabel === '身弱') {
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '身弱：日主偏弱，用神取比劫印星生扶日主；財官食傷為忌神，恐耗身過度。';
        } else { // 從弱格
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '從弱格：日主氣勢已從他方，用神反取財官食傷順其強勢；比劫印星欲扶身反而逆勢，稱忌神。';
        }

        let yongElements = toElements(yongCats), jiElements = toElements(jiCats);
        let tiaohouActive = false;
        if (tiaohou) {
            tiaohouActive = true;
            yongElements = tiaohou.need;
            jiElements = tiaohou.avoid;
            logicNote = `【調候優先於扶抑】${tiaohou.reason}。扶抑判斷僅供次要參考：${logicNote}`;
        }

        return {
            geJuName, geJuBaseName, geJuGan, geJuTenGod, geJuNote, isExtreme,
            yongElements, jiElements, yongCats, jiCats, logicNote, tiaohouActive
        };
    }

    function generate12MonthTactics(dg, dz, mg, mz, tg, tz, yg, yz, dayElement, gender) {
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); 

        let tactics = { love: [], career: [], wealth: [], health: [], family: [] };
        
        const baseGans = [yg, mg, dg, tg];
        const baseZhis = [yz, mz, dz, tz];
        const pNames = ['年', '月', '日', '時'];

        const addTactic = (cat, monthStr, badge, desc) => {
            tactics[cat].push(`
                <tr class="lm-month-row"><td colspan="2">${monthStr}</td></tr>
                <tr class="lm-event-row">
                    <td class="lm-badge-cell">${badge}</td>
                    <td class="lm-desc-cell">${desc}</td>
                </tr>
            `);
        };

        for(let i = -6; i <= 12; i++) {
            let d = new Date(currentYear, currentMonth + i, 15);
            let y = d.getFullYear();
            let m = d.getMonth() + 1;
            
            const solar = Solar.fromYmd(y, m, 15);
            const lunar = solar.getLunar();
            const bazi = lunar.getEightChar();
            let mGan = bazi.getMonthGan();
            let mZhi = bazi.getMonthZhi();

            const jieRange = getJieQiRange(solar);
            let monthStr = jieRange
                ? `${jieRange.startLabel} ~ ${jieRange.endLabel} (${mGan}${mZhi})`
                : `${y}年${m}月 (${mGan}${mZhi})`; // 節氣資料抓取失敗時的備援顯示

            let mGanEl = ganElementMap[mGan];
            let tgGan = getTenGodForElement(mGanEl, dayElement);
            let isWealth = tgGan === '財星';
            let isShiShang = tgGan === '食傷';
            let isGuanSha = tgGan === '官殺';
            let isBiJie = tgGan === '比劫';

            let originPillars = [];
            baseGans.forEach((bg, idx) => { if(bg !== '-' && bg === mGan) originPillars.push(`${pNames[idx]}干`); });
            baseZhis.forEach((bz, idx) => { if(bz !== '-' && Object.keys(zhiHiddenWeights[bz] || {}).includes(mGan)) originPillars.push(`${pNames[idx]}支`); });

            let originBadge = originPillars.length > 0 
                ? `<b style="color:var(--color-origin); font-size:11px;">📍原局引動(${originPillars.join('/')})</b>` 
                : `<b style="color:var(--color-neutral); font-size:11px;">☄️流月外來</b>`;
            
            // 動態判斷透干強度描述
            let hasGan = originPillars.some(p => p.includes('干'));
            let hasZhi = originPillars.some(p => p.includes('支'));
            let actionDesc = "透干";
            if (hasGan && hasZhi) actionDesc = "通根透干";
            else if (hasZhi && !hasGan) actionDesc = "藏干引透";
            else if (hasGan && !hasZhi) actionDesc = "天干明透";

            const clashBadge = (target) => `<b style="color:var(--color-chong); font-size:11px;">💥沖${target}</b>`;
            const combineBadge = (target) => `<b style="color:var(--color-liuhe); font-size:11px;">🌀合${target}</b>`;
            const kuBadge = (target) => `<b style="color:var(--color-ku); font-size:11px;">🔑沖開${target}</b>`;
            const xingBadge = (target) => `<b style="color:var(--color-xing); font-size:11px;">🌀${target}自刑</b>`;


            if (zhiChongMap[dz] === mZhi) addTactic('love', monthStr, clashBadge('日支'), `沖動夫妻宮 (${dz}${mZhi}沖)`);
            if (zhiHeMap[dz] === mZhi) addTactic('love', monthStr, combineBadge('日支'), `合動夫妻宮 (${dz}${mZhi}合)`);
            if ((gender === 1 && isWealth) || (gender === 0 && isGuanSha)) addTactic('love', monthStr, originBadge, `✨ 配偶星「${mGan}」${actionDesc}`);

            if (zhiChongMap[mz] === mZhi) addTactic('career', monthStr, clashBadge('月支'), `沖動事業宮 (${mz}${mZhi}沖)`);
            if (isShiShang) addTactic('career', monthStr, originBadge, `💡 食傷「${mGan}」${actionDesc}`);
            if (isGuanSha) addTactic('career', monthStr, originBadge, `⚠️ 官殺「${mGan}」${actionDesc}`);

            if (zhiChongMap[tz] === mZhi) addTactic('wealth', monthStr, clashBadge('時支'), `沖動投資/子女宮 (${tz}${mZhi}沖)`);
            if (zhiHeMap[tz] === mZhi) addTactic('wealth', monthStr, combineBadge('時支'), `合動時柱 (${tz}${mZhi}合)`);
            if (isBiJie) addTactic('wealth', monthStr, originBadge, `💸 比劫「${mGan}」${actionDesc}`);
            if (['辰','戌','丑','未'].includes(mZhi)) {
                let clashIndex = baseZhis.indexOf(zhiChongMap[mZhi]);
                if (clashIndex !== -1) {
                    addTactic('wealth', monthStr, kuBadge(`${pNames[clashIndex]}庫`), `財庫引動 (${baseZhis[clashIndex]}${mZhi}沖)`);
                }
            }

            if (zhiChongMap[dz] === mZhi) addTactic('health', monthStr, clashBadge('日支'), `根基逢沖 (${dz}${mZhi}沖)`);
            else if (zhiChongMap[mz] === mZhi) addTactic('health', monthStr, clashBadge('月支'), `提綱逢沖 (${mz}${mZhi}沖)`);
            if (['辰','午','酉','亥'].includes(mZhi) && mZhi === dz) addTactic('health', monthStr, xingBadge('日支'), `自刑引動 (${dz}${mZhi}刑)`);

            if (zhiChongMap[yz] === mZhi) addTactic('family', monthStr, clashBadge('年支'), `沖動父母宮 (${yz}${mZhi}沖)`);
            if (zhiHeMap[yz] === mZhi) addTactic('family', monthStr, combineBadge('年支'), `合動父母宮 (${yz}${mZhi}合)`);
        }

        const formatList = (list, emptyMsg) => list.length > 0 ? `<table class="lm-table">${list.join('')}</table>` : `<div style="font-size:13px; color:#888; margin-top:5px; padding-left:10px;">${emptyMsg}</div>`;

        return `
            <div class="score-box" style="text-align: left; padding: 20px; border-color: #555; background: rgba(0,0,0,0.3); margin-top: 0; margin-bottom: 0; border-radius: 8px;">
                <div style="margin-bottom: 15px;">
                    <b style="color:#ff9800; font-size:14px;">💖 感情 / 婚姻 (觀測日支與配偶星)</b>
                    ${formatList(tactics.love, '此週期感情宮位無明顯劇烈引動')}
                </div>
                <div style="margin-bottom: 15px;">
                    <b style="color:#2ed573; font-size:14px;">📈 事業 / 職場 (觀測月柱與官殺食傷)</b>
                    ${formatList(tactics.career, '此週期事業宮位無明顯劇烈引動')}
                </div>
                <div style="margin-bottom: 15px;">
                    <b style="color:#00d2ff; font-size:14px;">💰 財運 / 投資 (觀測時柱與比劫財星)</b>
                    ${formatList(tactics.wealth, '此週期無明顯財庫沖動或破財徵兆')}
                </div>
                <div style="margin-bottom: 15px;">
                    <b style="color:#ff5252; font-size:14px;">🏥 健康 / 情緒 (觀測日月支逢沖刑)</b>
                    ${formatList(tactics.health, '此週期根基穩固，無重大沖刑')}
                </div>
                <div>
                    <b style="color:#a29bfe; font-size:14px;">🏡 家庭 / 長輩 (觀測年柱)</b>
                    ${formatList(tactics.family, '此週期家庭宮位平順')}
                </div>
            </div>
        `;
    }

    function calculateBaziCore() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        const gender = parseInt(document.getElementById('gender').value);
        const genderStr = gender === 1 ? '元男' : '元女';
        const currentYear = new Date().getFullYear();

        let yg, yz, mg, mz, dg, dz, tg, tz;
        let startYearOfLife;
        let daYunData = [];
        let solarInfoHtml = '';
        let birthSolarForJieQi = null; // 僅在「依出生日期」模式下有值，供精確得令（人元司令分野）計算使用

        if (mode === 'date') {
            let y = parseInt(document.getElementById('year').value);
            let m = parseInt(document.getElementById('month').value);
            let d = parseInt(document.getElementById('day').value);
            let h = parseInt(document.getElementById('hour').value);
            let min = parseInt(document.getElementById('minute').value) || 0;

            let useTrueSolar = document.getElementById('useTrueSolar').checked;
            let useSplitZi = document.getElementById('useSplitZi').checked;

            let dateObj = new Date(y, m - 1, d, h, min, 0);

            if (useTrueSolar) {
                let lon = parseFloat(document.getElementById('longitude').value) || 120;
                let lonDiff = (lon - 120) * 4; 
                
                let isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
                let daysInMonth = [0, 31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let dayOfYear = d;
                for(let i=1; i<m; i++) dayOfYear += daysInMonth[i];
                
                let B = (360 / 365.24) * (dayOfYear - 81) * (Math.PI / 180);
                let eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
                
                let totalOffset = lonDiff + eot;
                
                dateObj.setMinutes(dateObj.getMinutes() + totalOffset);
                
                let sign = totalOffset >= 0 ? '+' : '';
                solarInfoHtml = `<div style="text-align:center; margin-bottom:15px; font-size:13px; color:#aaa; background:#1a1a1a; padding:8px 12px; border-radius:6px; border:1px solid #333;">
                    <b style="color:#00d2ff;">☀️ 真太陽時校正：</b> 經度 ${lon}° (時差 ${sign}${totalOffset.toFixed(1)} 分鐘)<br>
                    <span style="color:#e0e0e0; margin-top: 4px; display: inline-block;">實際出生時間換算：${dateObj.getFullYear()}年${dateObj.getMonth() + 1}月${dateObj.getDate()}日 ${dateObj.getHours()}時${dateObj.getMinutes()}分</span>
                </div>`;
            }

            y = dateObj.getFullYear();
            m = dateObj.getMonth() + 1;
            d = dateObj.getDate();
            h = dateObj.getHours();
            let finalMin = dateObj.getMinutes();

            const solar = Solar.fromYmdHms(y, m, d, h, finalMin, 0);
            birthSolarForJieQi = solar;
            const lunar = solar.getLunar();
            const baZi = lunar.getEightChar();
            
            yg = baZi.getYearGan(); yz = baZi.getYearZhi();
            mg = baZi.getMonthGan(); mz = baZi.getMonthZhi();
            tg = baZi.getTimeGan(); tz = baZi.getTimeZhi();
            
            // 【早晚子時 絕對控制邏輯】
            if (h === 23) {
                if (useSplitZi) {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setHours(22);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                } else {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setDate(tempDate.getDate() + 1);
                    tempDate.setHours(1);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                }
            } else {
                dg = baZi.getDayGan(); 
                dz = baZi.getDayZhi();
            }

            startYearOfLife = y;

            const yun = baZi.getYun(gender);
            yun.getDaYun().forEach(dy => {
                if (dy.getIndex() > 0 && dy.getIndex() <= 10) {
                    const gz = dy.getGanZhi();
                    daYunData.push({ index: dy.getIndex(), startYear: dy.getStartYear(), startAge: dy.getStartAge(), gan: gz.charAt(0), zhi: gz.charAt(1), ganZhi: gz });
                }
            });
        } else {
            yg = document.getElementById('yg').value; yz = document.getElementById('yz').value;
            mg = document.getElementById('mg').value; mz = document.getElementById('mz').value;
            dg = document.getElementById('dg').value; dz = document.getElementById('dz').value;
            tg = document.getElementById('tg').value; tz = document.getElementById('tz').value;
            
            startYearOfLife = parseInt(document.getElementById('baziYear').value) || (currentYear - 30);
            let yunStartAge = parseInt(document.getElementById('baziStartAge').value) || 1;

            const isYangYear = stemPolarity[yg] === 1;
            const isMale = gender === 1;
            const direction = (isYangYear === isMale) ? 1 : -1;

            const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
            const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

            for (let i = 1; i <= 10; i++) {
                let gIdx = (stems.indexOf(mg) + i * direction) % 10;
                if(gIdx < 0) gIdx += 10;
                let zIdx = (branches.indexOf(mz) + i * direction) % 12;
                if(zIdx < 0) zIdx += 12;

                let dGan = stems[gIdx], dZhi = branches[zIdx];
                daYunData.push({ index: i, startYear: startYearOfLife + yunStartAge - 1 + ((i-1) * 10), startAge: yunStartAge + ((i-1) * 10), gan: dGan, zhi: dZhi, ganZhi: dGan + dZhi });
            }
        }

        const dayGan = dg;
        const dayElement = ganElementMap[dayGan];
        const allBaseZhis = [yz, mz, dz, tz]; 

        let currentDaYun = daYunData.find(dy => currentYear >= dy.startYear && currentYear < dy.startYear + 10);
        let dyGan = '-', dyZhi = '-';
        
        if (currentDaYun) { dyGan = currentDaYun.gan; dyZhi = currentDaYun.zhi; } 
        else if (daYunData.length > 0) { dyGan = daYunData[0].gan; dyZhi = daYunData[0].zhi; }

        const lnSolar = Solar.fromYmd(currentYear, 7, 1);
        const lnBaZi = lnSolar.getLunar().getEightChar();
        const lnGan = lnBaZi.getYearGan(); const lnZhi = lnBaZi.getYearZhi();

        function getSpecificShiShen(targetGan, dGan) {
            if (!targetGan || targetGan === '-') return '-';
            const tEl = ganElementMap[targetGan], dEl = ganElementMap[dGan];
            const samePol = stemPolarity[targetGan] === stemPolarity[dGan];
            if (tEl === dEl) return samePol ? '比肩' : '劫財';
            if (wuxingRel[dEl].sheng === tEl) return samePol ? '食神' : '傷官';
            if (wuxingRel[dEl].ke === tEl) return samePol ? '偏財' : '正財';
            if (wuxingRel[tEl].ke === dEl) return samePol ? '七殺' : '正官';
            if (wuxingRel[tEl].sheng === dEl) return samePol ? '偏印' : '正印';
            return '';
        }

        function buildPillarObj(name, gan, zhi, isDay = false) {
            let hideGansObj = zhiHiddenWeights[zhi] || {};
            let hideGans = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
            if(hideGans.length === 0 && zhi !== '-') hideGans = [gan]; 
            return {
                name: name, gan: gan, zhi: zhi,
                ganShiShen: isDay ? genderStr : getSpecificShiShen(gan, dayGan),
                hideGan: hideGans, hideShiShen: hideGans.map(hg => getSpecificShiShen(hg, dayGan))
            };
        }

        const displayPillars = [
            buildPillarObj('流年', lnGan, lnZhi), buildPillarObj('大運', dyGan, dyZhi),
            buildPillarObj('時柱', tg, tz), buildPillarObj('日柱', dg, dz, true),
            buildPillarObj('月柱', mg, mz), buildPillarObj('年柱', yg, yz)
        ];

        let gridHtml = `<div class="bazi-table-wrapper"><table class="bazi-table"><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            gridHtml += `<td class="bt-header" style="${style}">${p.name}</td>`;
        });
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = p.name === '日柱' ? '#2ed573' : (elementColors[ganElementMap[p.gan]] || '#888');
            gridHtml += `<td class="bt-shishen" style="${style} color:${color};">${p.ganShiShen}</td>`;
        });
        
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = elementColors[ganElementMap[p.gan]] || '#888';
            gridHtml += `<td class="bt-ganzhi" style="${style} color:${color};">${p.gan}</td>`;
        });
        
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = elementColors[zhiElementMap[p.zhi]] || '#888';
            gridHtml += `<td class="bt-ganzhi" style="${style} color:${color};">${p.zhi}</td>`;
        });
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let hiddenHtml = '<div class="bt-hidden-bg">';
            for(let j=0; j<p.hideGan.length; j++) {
                let hGan = p.hideGan[j];
                let hColor = elementColors[ganElementMap[hGan]] || '#888';
                hiddenHtml += `<div class="bt-hidden-item"><span style="color:${hColor}; font-size:12px; font-weight:bold;">${hGan}</span><span style="color:${hColor}; font-size:12px; font-weight:bold;">${p.hideShiShen[j]}</span></div>`;
            }
            hiddenHtml += '</div>';
            gridHtml += `<td style="${style} vertical-align:top;">${hiddenHtml}</td>`;
        });
        gridHtml += `</tr></table></div>`;
        document.getElementById('baziGrid').innerHTML = solarInfoHtml + gridHtml;

        const baziMap = { year: { gan: yg, zhi: yz }, month: { gan: mg, zhi: mz }, day: { gan: dg, zhi: dz }, time: { gan: tg, zhi: tz } };
        const totalScore = calculateXuYulanScore(baziMap, dayElement);
        let strengthLabel = '';
        if (totalScore > 80) strengthLabel = '從強格'; else if (totalScore >= 45) strengthLabel = '身強'; else if (totalScore >= 20) strengthLabel = '身弱'; else strengthLabel = '從弱格';

        // ------------------------------------------------------------------------------------------
        // --- 整合全新「核心能量儀表板」---
        // ------------------------------------------------------------------------------------------

        // [Dash 1: 得令/得地/得勢 (Command, Root, Power) - 全新設計]
        const isStrong = (strengthLabel === '身強' || strengthLabel === '從強格');
        
        // 1. 判斷得令（優先採用「人元司令分野」精確法：依真實節氣交接日推算當令司令神；
        //    若無出生日期可用（如手動輸入八字模式），退回「月支主氣」簡易法）
        const genEl = Object.keys(wuxingRel).find(key => wuxingRel[key].sheng === dayElement);
        const siLingGan = getSiLingGan(birthSolarForJieQi, mz);
        let deLingEl, deLingSourceNote;
        if (siLingGan) {
            deLingEl = ganElementMap[siLingGan];
            deLingSourceNote = `節氣司令神：${siLingGan}（${deLingEl}）`;
        } else {
            deLingEl = zhiElementMap[mz];
            deLingSourceNote = `月支主氣：${mz}（${deLingEl}，簡易法）`;
        }
        const isDeLing = (deLingEl === dayElement || deLingEl === genEl);
        
        // 2. 判斷得地 (日主在地支是否有根)
        const pNames = ['年', '月', '日', '時'];
        let dayMasterRootsEval = getTraditionalRoots(dg, 2, allBaseZhis, pNames);
        let hasRoots = dayMasterRootsEval.roots.length > 0;
        let rootQuality = "無根";
        let rootClass = "status-off";
        if (hasRoots) {
            if (dayMasterRootsEval.label.includes("強根")) {
                rootQuality = "強根";
                rootClass = "status-on";
            } else {
                rootQuality = "有根";
                rootClass = "status-partial";
            }
        }

        // 3. 判斷得勢 (印比數量佔比)
        const originalPillars = [
            buildPillarObj('年柱', yg, yz), buildPillarObj('月柱', mg, mz),
            buildPillarObj('日柱', dg, dz, true), buildPillarObj('時柱', tg, tz)
        ];
        const baseZhis = originalPillars.map(p => p.zhi);
        const baseGans = originalPillars.map(p => p.gan);

        // ===== 流日速覽（過去 3 日＋未來 7 日，共 10 天，單一長條圖一行呈現趨勢） =====
        (function renderLiuriPanel() {
            try {
                if (typeof Solar === 'undefined') { document.getElementById('liuriOutput').innerHTML = ''; return; }
                const todayD = new Date();
                const weekChar = ['日', '一', '二', '三', '四', '五', '六'];
                const days = [];
                for (let offset = -3; offset <= 6; offset++) { // 過去3日 + 今日起未來7日 = 共10天
                    const d = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate() + offset);
                    const solarD = Solar.fromYmdHms(d.getFullYear(), d.getMonth() + 1, d.getDate(), 12, 0, 0);
                    const baziD = solarD.getLunar().getEightChar();
                    const dGanD = baziD.getDayGan(), dZhiD = baziD.getDayZhi();
                    const ganTenGod = getSpecificShiShen(dGanD, dayGan);
                    const zhiMainEl = zhiElementMap[dZhiD];
                    const zhiBroadTenGod = getTenGodForElement(zhiMainEl, dayElement);
                    const scores = computeLiuriScore(ganTenGod, zhiBroadTenGod);
                    const chongXingBadges = checkDayunChongXing(dGanD, dZhiD, baseGans, baseZhis, pNames);
                    const hejuBadges = checkDayunHeju(dZhiD, baseZhis);
                    days.push({
                        gan: dGanD, zhi: dZhiD, ganTenGod,
                        cGan: elementColors[ganElementMap[dGanD]], cZhi: elementColors[zhiMainEl],
                        isToday: offset === 0,
                        dateShort: `${d.getMonth() + 1}/${d.getDate()}`,
                        weekLabel: weekChar[d.getDay()],
                        overall: scores.overall, wealth: scores.wealth,
                        chongXingBadges, hejuBadges
                    });
                }

                // ---- 組裝 SVG 分組長條圖：X軸=10天，每天兩條bar（整體／財運），風格比照「原局五行」的漸層細長條 ----
                const w = 360, h = 200;
                const padL = 22, padR = 8, padT = 14, padB = 46;
                const plotW = w - padL - padR, plotH = h - padT - padB;
                const n = days.length;
                const groupW = plotW / n;
                const barW = groupW * 0.22; // 變細，呼應「原局五行」的細長條風格
                const gap = (groupW - barW * 2) / 3;
                const baseY = padT + plotH;
                const barRadius = barW / 2; // 圓角比照原局五行的膠囊造型

                let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="auto" style="display:block; max-width:100%;">`;
                svg += `
                    <defs>
                        <linearGradient id="liuriOverallGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="var(--color-liuri-overall)" stop-opacity="0.55"/>
                            <stop offset="100%" stop-color="var(--color-liuri-overall)" stop-opacity="1"/>
                        </linearGradient>
                        <linearGradient id="liuriWealthGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="var(--color-liuri-wealth)" stop-opacity="0.55"/>
                            <stop offset="100%" stop-color="var(--color-liuri-wealth)" stop-opacity="1"/>
                        </linearGradient>
                    </defs>
                `;
                // 50 分基準參考線
                const y50 = padT + plotH * (1 - 50 / 100);
                svg += `<line x1="${padL}" y1="${y50}" x2="${w - padR}" y2="${y50}" stroke="#333" stroke-width="1" stroke-dasharray="2,3"/>`;
                svg += `<line x1="${padL}" y1="${baseY}" x2="${w - padR}" y2="${baseY}" stroke="#444" stroke-width="1"/>`;

                days.forEach((dday, i) => {
                    const gx = padL + i * groupW;
                    if (dday.isToday) svg += `<rect x="${gx}" y="${padT}" width="${groupW}" height="${plotH}" fill="rgba(0,210,255,0.07)"/>`;

                    const hOverall = plotH * (dday.overall / 100);
                    const hWealth = plotH * (dday.wealth / 100);
                    const x1 = gx + gap;
                    const x2 = x1 + barW + gap;

                    // 深色凹槽軌道（比照原局五行 bar 的 inset track）
                    svg += `<rect x="${x1}" y="${padT}" width="${barW}" height="${plotH}" rx="${barRadius}" fill="rgba(0,0,0,0.5)" stroke="#333" stroke-width="0.6"/>`;
                    svg += `<rect x="${x2}" y="${padT}" width="${barW}" height="${plotH}" rx="${barRadius}" fill="rgba(0,0,0,0.5)" stroke="#333" stroke-width="0.6"/>`;

                    svg += `<rect x="${x1}" y="${baseY - hOverall}" width="${barW}" height="${Math.max(hOverall, barW)}" rx="${barRadius}" fill="url(#liuriOverallGrad)"><title>${dday.dateShort} ${dday.gan}${dday.zhi} 整體 ${dday.overall}</title></rect>`;
                    svg += `<rect x="${x2}" y="${baseY - hWealth}" width="${barW}" height="${Math.max(hWealth, barW)}" rx="${barRadius}" fill="url(#liuriWealthGrad)"><title>${dday.dateShort} ${dday.gan}${dday.zhi} 財運 ${dday.wealth}</title></rect>`;

                    const cx = gx + groupW / 2;
                    svg += `<text x="${cx}" y="${h - padB + 15}" text-anchor="middle" font-size="9" fill="${dday.isToday ? 'var(--accent)' : '#888'}" font-weight="${dday.isToday ? 'bold' : 'normal'}">${dday.dateShort}</text>`;
                    svg += `<text x="${cx}" y="${h - padB + 30}" text-anchor="middle" font-size="11" font-weight="bold"><tspan fill="${dday.cGan}">${dday.gan}</tspan><tspan fill="${dday.cZhi}">${dday.zhi}</tspan></text>`;
                });
                svg += `</svg>`;

                const today = days.find(d => d.isToday);
                const todayRelation = today && (today.chongXingBadges || today.hejuBadges)
                    ? `${today.chongXingBadges || ''} ${today.hejuBadges || ''}`.trim()
                    : '';
                const body = `
                    <div style="font-size:12px; color:#888; margin-bottom:8px;">過去 3 日．今日起未來 7 日，共 10 天｜依日主與流日日柱十神量化，僅供參考（可滑鼠停留在長條上看數值）</div>
                    <div class="liuri-legend">
                        <span><span class="liuri-legend-dot" style="background:var(--color-liuri-overall);"></span>整體運勢</span>
                        <span><span class="liuri-legend-dot" style="background:var(--color-liuri-wealth);"></span>財運</span>
                    </div>
                    <div class="liuri-chart-wrap">${svg}</div>
                    ${today ? `
                        <div class="liuri-today-callout">
                            <div style="margin-bottom:4px;">📍 今日 ${today.dateShort}（<b><span style="color:${today.cGan}">${today.gan}</span><span style="color:${today.cZhi}">${today.zhi}</span></b>・${today.ganTenGod || '-'}）</div>
                            <div style="margin-bottom:4px;">${todayRelation ? `與原局關係：${todayRelation}` : '與原局無明顯沖合刑，運勢平順'}</div>
                            <div>建議：${getLiuriSuggestion(today.ganTenGod)}</div>
                        </div>
                    ` : ''}
                `;
                document.getElementById('liuriOutput').innerHTML = wrapAccordion('📆 流日速覽（財運與整體運勢）', body, true);
            } catch (e) {
                console.warn('流日面板計算失敗:', e);
                document.getElementById('liuriOutput').innerHTML = '';
            }
        })();

        const elementCount = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
        const elementSpecificShiShen = { '木': [], '火': [], '土': [], '金': [], '水': [] }; 
        
        originalPillars.forEach(p => {
            if(p.name !== '日柱') { elementSpecificShiShen[ganElementMap[p.gan]].push(p.ganShiShen); elementCount[ganElementMap[p.gan]] += 1.0; } 
            else { elementCount[ganElementMap[p.gan]] += 1.0; }
            p.hideShiShen.forEach((ss, index) => {
                let hGanChar = p.hideGan[index], el = ganElementMap[hGanChar];
                let weight = zhiHiddenWeights[p.zhi][hGanChar] || (1.0 / p.hideGan.length);
                elementCount[el] += weight; elementSpecificShiShen[el].push(ss);
            });
        });

        let totalElements = 0;
        Object.values(elementCount).forEach(v => totalElements += v);
        
        let powerScore = 0;
        if(totalElements > 0) {
            powerScore = ((elementCount[dayElement] + elementCount[genEl]) / totalElements) * 100;
        }
        let isDeShi = powerScore >= 40; // 簡單定義：印比超過 40% 算得勢
        let shiLabel = isDeShi ? "得勢" : "失勢";
        let shiClass = isDeShi ? "status-on" : "status-off";

        // ---- 子平格局定式與用神／忌神判定 ----
        const geJuYongShen = determineGeJuAndYongShen(mz, dg, dayElement, baseGans, strengthLabel, elementCount, totalElements);
        
        let cmdHtml = `
            <div class="dash-score-badge">體力</div>
            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 15px; gap: 6px;">
                <div class="dash-status-row" style="margin-bottom: 0;">
                    <span class="dash-status-label" title="${deLingSourceNote}">日干月藏</span>
                    <span class="dash-status-value ${isDeLing ? 'status-on' : 'status-off'}">${isDeLing ? '得令' : '失令'}</span>
                </div>
                <div style="font-size:10px; color:#777; text-align:right; margin-top:-2px; margin-bottom:2px;">${deLingSourceNote}</div>
                <div class="dash-status-row" style="margin-bottom: 0;">
                    <span class="dash-status-label">日干通根</span>
                    <span class="dash-status-value ${rootClass}">${rootQuality}</span>
                </div>
                <div class="dash-status-row" style="margin-bottom: 0;">
                    <span class="dash-status-label">天干比印</span>
                    <span class="dash-status-value ${shiClass}">${shiLabel}</span>
                </div>
            </div>
        `;

        // [Dash 2: 顯星/定格 (Dynamic Penetration & Rooting)]
        // 「定格」統一改用 determineGeJuAndYongShen() 的結果（含建祿/羊刃/從格特例判斷，避免與下方重複計算）
        let traditionalPattern = geJuYongShen.isExtreme ? strengthLabel : geJuYongShen.geJuName;
        let traditionalDesc = geJuYongShen.isExtreme
            ? `不依正格論，原局月令屬${geJuYongShen.geJuBaseName}`
            : geJuYongShen.geJuNote;

        // 2. 判斷天干「實權主導」 (天干有強根者)
        let rootedShiShen = [];
        let strongestRootScore = 0;
        let powerDesc = "全局無明顯強根";

        [{gan: yg, idx: 0}, {gan: mg, idx: 1}, {gan: tg, idx: 3}].forEach(item => {
            if (item.gan !== '-') {
                let rootEval = getTraditionalRoots(item.gan, item.idx, allBaseZhis, pNames);
                if (rootEval.roots.length > 0) {
                    let ss = getSpecificShiShen(item.gan, dayGan);
                    if (!rootedShiShen.includes(ss)) {
                        rootedShiShen.push(ss);
                    }
                    if (rootEval.label.includes("強根")) strongestRootScore = 2;
                    else if (rootEval.label.includes("有根") && strongestRootScore < 2) strongestRootScore = 1;
                }
            }
        });

        let realPowerHtml = "";
        if (rootedShiShen.length > 0) {
            realPowerHtml = `<div style="font-size: 14px; font-weight: bold; color: #2ed573; margin-bottom: 2px; line-height: 1.2;">${rootedShiShen.join('、')}</div>`;
            if (strongestRootScore === 2) powerDesc = "通強根 (實權)";
            else powerDesc = "通根得地 (具影響力)";
        } else {
            realPowerHtml = `<div style="font-size: 13px; font-weight: bold; color: #888; margin-bottom: 2px; line-height: 1.2;">無明顯當權者</div>`;
            powerDesc = "天干虛浮無力";
        }

        let yongShenHtml = geJuYongShen.yongElements.map(el => `<b style="color:${elementColors[el]};">${el}</b>`).join('、');
        let jiShenHtml = geJuYongShen.jiElements.map(el => `<b style="color:${elementColors[el]}; opacity:0.6;">${el}</b>`).join('、');

        let penHtml = `
            <div class="dash-score-badge">格局</div>
            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; margin-top: 15px;">
                <div style="text-align: center; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 6px; padding-top: 4px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div style="font-size: 11px; color: #888; margin-bottom: 2px;">定格</div>
                    <div style="font-size: 15px; font-weight: bold; color: #00d2ff; letter-spacing: 1px; margin-bottom: 2px;">${traditionalPattern}</div>
                    <div style="font-size: 10px; color: #aaa;">${traditionalDesc}</div>
                </div>
                <div style="text-align: center; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 6px; padding-top: 6px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div style="font-size: 11px; color: #888; margin-bottom: 2px;">顯星</div>
                    ${realPowerHtml}
                    <div style="font-size: 10px; color: #aaa;">${powerDesc}</div>
                </div>
                <div style="text-align: center; padding-top: 6px; flex: 1; display: flex; flex-direction: column; justify-content: center;" title="${geJuYongShen.logicNote}">
                    <div style="font-size: 11px; color: #888; margin-bottom: 2px;">用神／忌神${geJuYongShen.tiaohouActive ? '（調候優先）' : ''}</div>
                    <div style="font-size: 14px; font-weight: bold; margin-bottom: 2px;">${yongShenHtml} <span style="color:#555;">／</span> ${jiShenHtml}</div>
                    <div style="font-size: 10px; color: #aaa;">${geJuYongShen.tiaohouActive ? '寒暖失衡，調候優先' : '依身強身弱扶抑而定'}</div>
                </div>
            </div>
        `;

        // [Dash 3: 命局溫度 (Temperature)]
        let tempScore = 0;
        const monthBaseTemp = { '亥': -40, '子': -50, '丑': -30, '寅': -10, '卯': 0, '辰': 10, '巳': 40, '午': 50, '未': 30, '申': 10, '酉': 0, '戌': 10 };
        tempScore += (monthBaseTemp[mz] || 0);
        const allChars = [yg, yz, mg, mz, dg, dz, tg, tz];
        allChars.forEach(c => {
            if (['丙','丁','巳','午'].includes(c)) tempScore += 15;
            if (['壬','癸','亥','子'].includes(c)) tempScore -= 15;
            if (['戌','未'].includes(c)) tempScore += 5;
            if (['辰','丑'].includes(c)) tempScore -= 5;
        });

        tempScore = Math.max(-100, Math.min(100, tempScore));
        let tempPct = ((tempScore + 100) / 200) * 100; 
        let tempLabel = "", tempColor = "";
        if (tempScore > 40) { tempLabel = "過燥"; tempColor = "#ff5252"; }
        else if (tempScore > 15) { tempLabel = "偏暖"; tempColor = "#ff9800"; }
        else if (tempScore >= -15) { tempLabel = "中和"; tempColor = "#2ed573"; }
        else if (tempScore >= -40) { tempLabel = "偏寒"; tempColor = "#00d2ff"; }
        else { tempLabel = "過寒"; tempColor = "#3498db"; }

        let motherEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        let keMeEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        let meKeEl = wuxingRel[dayElement].ke;
        let meShengEl = wuxingRel[dayElement].sheng;
        let badElements = isStrong ? [dayElement, motherEl] : [keMeEl, meKeEl, meShengEl];

        let rxText = "";
        if (tempScore <= -15) { 
            rxText = badElements.includes('火') ? "用木/燥土" : "建議用火";
        } else if (tempScore >= 15) { 
            rxText = badElements.includes('水') ? "用金/濕土" : "建議用水";
        } else {
            rxText = "溫度適中";
        }

        let tempHtml = `
            <div class="dash-score-badge">調候</div>
            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; margin-top: 15px; padding: 4px 0;">
                <div style="font-size: 16px; font-weight: bold; color: ${tempColor}; letter-spacing: 1px;">${tempLabel}</div>
                <div style="width: 85%; position:relative; height:6px; background: linear-gradient(to right, #3498db 0%, #2ed573 50%, #ff5252 100%); border-radius:3px; margin: 4px 0;">
                    <div style="position:absolute; top:-3px; left:${tempPct}%; width:4px; height:12px; background:#fff; border-radius:2px; box-shadow:0 0 4px rgba(0,0,0,0.8); transform:translateX(-50%); transition: left 1s ease;"></div>
                </div>
                <div style="font-size:11px; color:#aaa; background: rgba(0,0,0,0.25); padding: 4px 10px; border-radius: 6px;">${rxText}</div>
            </div>
        `;


        // [Dash 4: 五行比例 (Bar Chart - 優化版，滿版填滿不留白)]
        let barHtml = `<div style="width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; padding: 5px 5px 10px 5px;">`;
        ['木', '火', '土', '金', '水'].forEach(el => {
            let pct = totalElements > 0 ? ((elementCount[el] / totalElements) * 100).toFixed(0) : 0;
            let tg = getTenGodForElement(el, dayElement).substring(0, 1);
            barHtml += `
                <div style="display: flex; align-items: center; width: 100%;">
                    <div style="width: 38px; font-size: 14px; font-weight: bold; color: ${elementColors[el]}; display:flex; justify-content:space-between; align-items: center;">
                        <span>${el}</span><span style="font-size:10px; color:#666;">${tg}</span>
                    </div>
                    <div style="flex-grow: 1; background: rgba(0,0,0,0.5); height: 8px; border-radius: 4px; margin: 0 12px; overflow: hidden; border: 1px solid #333; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);">
                        <div style="height: 100%; background: linear-gradient(90deg, ${elementColors[el]}88, ${elementColors[el]}); width: ${pct}%; transition: width 0.8s; border-radius: 4px;"></div>
                    </div>
                    <div style="width: 28px; text-align: right; font-size: 12px; color: #ccc; font-weight: bold;">${pct}%</div>
                </div>
            `;
        });
        barHtml += `</div>`;

        // [Dash 5: 五芒星 (Pentagram - 優化版，滿版置中+氛圍背景)]
        const elementsArr = ['木', '火', '土', '金', '水'];
        const dayIdx = elementsArr.indexOf(dayElement);
        const orderedElements = [];
        for (let i = 0; i < 5; i++) orderedElements.push(elementsArr[(dayIdx + i) % 5]);

        const cx = 105, cy = 100, r = 68; // 畫布與半徑（放大版）
        const angles = [-Math.PI/2, -Math.PI/2 + (2*Math.PI/5), -Math.PI/2 + (4*Math.PI/5), -Math.PI/2 + (6*Math.PI/5), -Math.PI/2 + (8*Math.PI/5)];
        const svgNodes = {};
        orderedElements.forEach((el, index) => { svgNodes[el] = { x: cx + r * Math.cos(angles[index]), y: cy + r * Math.sin(angles[index]), color: elementColors[el] }; });

        // 外層加上 flex: 1 撐滿卡片，加上非常微弱的發光背景填補空白
        let svgHtml = `<div style="width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 60%); border-radius: 8px;">`;
        svgHtml += `<div style="position: absolute; top: -5px; right: -5px; background: rgba(0,210,255,0.1); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-size: 12px; border: 1px solid rgba(0,210,255,0.3); z-index: 2; backdrop-filter: blur(2px);">${strengthLabel}<br><span style="font-size:10px;">${totalScore}分</span></div>`;
        svgHtml += `<svg viewBox="-20 -20 250 230" width="100%" height="100%" style="max-height: 230px; max-width: 270px; drop-shadow: 0 0 8px rgba(0,0,0,0.5);">`;
        
        // Sheng Edges
        [['木','火'], ['火','土'], ['土','金'], ['金','水'], ['水','木']].forEach(e => { 
            svgHtml += `<line x1="${svgNodes[e[0]].x}" y1="${svgNodes[e[0]].y}" x2="${svgNodes[e[1]].x}" y2="${svgNodes[e[1]].y}" stroke="#666" stroke-width="1.5" />`; 
        });
        // Ke Edges
        [['木','土'], ['土','水'], ['水','火'], ['火','金'], ['金','木']].forEach(e => { 
            svgHtml += `<line x1="${svgNodes[e[0]].x}" y1="${svgNodes[e[0]].y}" x2="${svgNodes[e[1]].x}" y2="${svgNodes[e[1]].y}" stroke="#ff5252" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`; 
        });

        // 縮寫轉換對照表
        const ssShortName = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };

        Object.keys(svgNodes).forEach(el => {
            let node = svgNodes[el], isDayMaster = (el === dayElement);
            let tg = isDayMaster ? '主' : getTenGodForElement(el, dayElement).substring(0,1);
            let textColor = (el === '金') ? '#000' : '#fff';
            
            // 繪製五行圓圈與基本文字（放大版）
            svgHtml += `<circle cx="${node.x}" cy="${node.y}" r="18" fill="${node.color}" stroke="${isDayMaster ? '#fff' : 'none'}" stroke-width="2"/>
                <text x="${node.x}" y="${node.y + 5}" text-anchor="middle" fill="${textColor}" font-size="14" font-weight="bold">${el}</text>
                <text x="${node.x}" y="${node.y - 25}" text-anchor="middle" fill="#aaa" font-size="11">${tg}</text>`;
                
            // 處理並繪製旁邊的具體主/副星 (縮寫)
            let specificSSArray = elementSpecificShiShen[el] || [];
            if (specificSSArray.length > 0) {
                // 將全名轉換為縮寫
                let shortSSArray = specificSSArray.map(ss => ssShortName[ss] || ss);
                
                // 決定文字對齊與偏移位置
                let offsetX = 26, anchor = "start";
                if (node.x < cx) { offsetX = -26; anchor = "end"; } 
                
                // 如果有多個星，垂直排列
                let startY = node.y - ((shortSSArray.length - 1) * 6.5) + 5; 
                shortSSArray.forEach((ssText, idx) => { 
                    svgHtml += `<text x="${node.x + offsetX}" y="${startY + (idx * 13)}" text-anchor="${anchor}" fill="#00d2ff" font-size="12" font-weight="bold">${ssText}</text>`; 
                });
            }
        });
        svgHtml += `</svg></div>`;

        // --- 組裝成完整儀表板 ---
        let dashboardHtml = `
                <div class="dash-grid-top">
