                    let ss = getSpecificShiShen(item.gan, dayGan);
                    if (!rootedShiShen.includes(ss)) {
                        rootedShiShen.push(ss);
                    }
                    if (rootEval.label.includes("強根")) strongestRootScore = 2;
                    else if (rootEval.label.includes("有根") && strongestRootScore < 2) strongestRootScore = 1;
                }
            }
        });

        if (rootedShiShen.length > 0) {
            powerDesc = strongestRootScore === 2 ? "通強根（實權）" : "通根得地（具影響力）";
        } else {
            powerDesc = "天干虛浮無力";
        }

        // ---- 格局：中控顯示屏風格 ----
        // 顯星燈號列：透干有根＝亮燈；透干無根＝虛線半亮；未透＝熄燈
        const gjHex2rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
        const gjElOf = {
            '比劫': dayElement, '食傷': wuxingRel[dayElement].sheng, '財': wuxingRel[dayElement].ke,
            '官殺': Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement), '印': genEl
        };
        const gjTenGods = [['比肩','比','比劫'],['劫財','劫','比劫'],['食神','食','食傷'],['傷官','傷','食傷'],['偏財','才','財'],['正財','財','財'],['七殺','殺','官殺'],['正官','官','官殺'],['偏印','梟','印'],['正印','印','印']];
        const gjShown = [yg, mg, tg].filter(g => g && g !== '-').map(g => getSpecificShiShen(g, dayGan));
        let gjTiles = '';
        gjTenGods.forEach(([full, short, cat], i) => {
            const c = elementColors[gjElOf[cat]];
            const state = rootedShiShen.includes(full) ? 'lit' : (gjShown.includes(full) ? 'half' : '');
            gjTiles += `<div class="gj-tile gj-anim ${state}" title="${full}" style="--c:${c}; --cbg:${gjHex2rgba(c, .16)}; --cglow:${gjHex2rgba(c, .55)}; --d:${(0.25 + i * 0.06).toFixed(2)}s;">${short}</div>`;
        });

        // ---- 組合成格／破格（傳統子平；身強弱採儀表板三得其二） ----
        const tradDeDi = (dayMasterRootsEval.score || 0) >= 4;
        const tradStrongCnt = (isDeLing ? 1 : 0) + (tradDeDi ? 1 : 0) + (isDeShi ? 1 : 0);
        const tradStrong = tradStrongCnt >= 2;
        const mk = b => b ? '<b style="color:#2ed573">✓</b>' : '<b style="color:#ff5252">✗</b>';
        let comboHtml = '', comboPromptText = '';
        let comboMit = {};
        const lampHtml = (name, type, lit, i) => {
            const m = lit && comboMit[name];
            return `<span class="gj-lamp gj-anim ${lit ? (type === '成' ? 'ok' : 'bad') : ''} ${m || ''}" style="--d:${(1.2 + i * 0.05).toFixed(2)}s;"><i>${m === 'jie' ? '解' : m === 'qing' ? '輕' : type}</i>${name}</span>`;
        };
        window.__tgGuards = [];
        {
            const comboBase = geJuYongShen.isExtreme ? (geJuYongShen.congGeResult === '從強' ? '從強格' : '從弱格') : geJuYongShen.geJuBaseName;
            const combos = detectGeJuCombos([yg, mg, dg, tg], [yz, mz, dz, tz], dg, comboBase, tradStrong);
            window.__tgGuards = combos.filter(c => c.mit && c.guard);
            if (window.__tgGuards.length && window.__renderLiuri) window.__renderLiuri();
            const hitNames = combos.map(c => c.name);
            combos.forEach(c => { if (c.mit) comboMit[c.name] = c.mit; });
            const cand = COMBO_CATALOG[comboBase] || [];
            const warn = geJuYongShen.isExtreme ? [] : COMBO_WARNINGS.filter(w => !cand.some(c => c[0] === w));
            let li = 0;
            comboHtml = `
                <div class="gj-lamp-row"><span class="gj-lamp-lbl">本格</span><div class="gj-lamps">${cand.map(([n, t]) => lampHtml(n, t, hitNames.includes(n), li++)).join('') || '<span class="gj-lamp-empty">此格無組合標籤</span>'}</div></div>
                ${warn.length ? `<div class="gj-lamp-row"><span class="gj-lamp-lbl">全盤</span><div class="gj-lamps">${warn.map(n => lampHtml(n, '破', hitNames.includes(n), li++)).join('')}</div></div>` : ''}
                ${combos.length ? `<div class="gj-cb-list">${combos.map((c, i) => `

                        <div class="gj-cb-top"><span class="gj-cb-tag">${c.mit === 'jie' ? '破→解' : c.mit === 'qing' ? '破・輕' : c.type}</span><b>${c.name}</b><span class="gj-cb-cond">${c.cond}</span></div>
                        <div class="gj-cb-why">${c.why}</div>
                    </div>`).join('')}</div>` : ''}`;
            comboPromptText = combos.length
                ? combos.map(c => `  - 【${c.type}格${c.mit === 'jie' ? '・已通關化解' : c.mit === 'qing' ? '・通關減輕' : ''}】${c.name}：條件「${c.cond}」；本盤依據：${c.why}`).join('\n')
                : '  - 未見成格／破格組合（格局平淡，以原局結構論）';
        }
        const tradStrongText = `${tradStrong ? '身強' : '身弱'}（得令${isDeLing ? '✓' : '✗'}、得地${tradDeDi ? '✓' : '✗'}、得勢${isDeShi ? '✓' : '✗'}，三得其二為強）`;
        const activeGeJu = geJuYongShen.isExtreme ? geJuYongShen.congGeResult : geJuYongShen.geJuBaseName.replace('格', '');
        const baseGeJu = geJuYongShen.geJuBaseName.replace('格', '');
        const gjAllLamps = ALL_GEJU.map((n, i) => {
            const st = n === activeGeJu ? 'on' : (geJuYongShen.isExtreme && n === baseGeJu ? 'half' : '');
            return `<span class="gj-gl gj-anim ${st}" style="--d:${(0.3 + i * 0.04).toFixed(2)}s;">${n}</span>`;

        let penHtml = `
            <div class="gj-wrap">
                <div class="gj-lcd">
                    <div class="gj-lcd-head"><span>定格</span><span>傳統子平</span></div>
                    <div class="gj-name" data-final="${traditionalPattern}">${traditionalPattern}</div>
                    <div class="gj-desc">${traditionalDesc}</div>

                <div>
                    <div class="gj-sec-head"><span>成格／破格</span><span class="gj-note" style="color:#888;">${tradStrong ? '身強' : '身弱'}（令${mk(isDeLing)} 地${mk(tradDeDi)} 勢${mk(isDeShi)}）</span></div>
                    <div class="gj-combos">${comboHtml}</div>

                <div>
                    <div class="gj-sec-head"><span>顯星</span><span class="gj-note" style="color:${rootedShiShen.length ? '#2ed573' : '#888'};">${powerDesc}</span></div>
                    <div class="gj-tiles">${gjTiles}</div>
                    <div class="gj-legend"><span class="gj-key lit"></span>透干有根　<span class="gj-key half"></span>透干無根</div>
                </div>
            </div>
        `;

        // [Dash 3: 命局溫度 (Temperature)]
        let tempScore = 0;
        // 月令季節曲線：丑（小寒大寒）最冷、未（小暑大暑）最熱
        const monthBaseTemp = { '亥': -30, '子': -45, '丑': -50, '寅': -30, '卯': -10, '辰': 10, '巳': 30, '午': 45, '未': 50, '申': 30, '酉': 10, '戌': -10 };
        tempScore += (monthBaseTemp[mz] || 0);
        const allChars = [yg, yz, mg, mz, dg, dz, tg, tz];
        let dryWet = 0; // 燥濕另軸：+ 燥、- 濕（月支權重 ×2）
        allChars.forEach((c, i) => {
            if (['丙','丁','巳','午'].includes(c)) tempScore += 15;
            if (['壬','癸','亥','子'].includes(c)) tempScore -= 15;
            if (['庚','辛','申','酉'].includes(c)) tempScore -= 5;   // 金性寒涼
            if (['戌','未'].includes(c)) tempScore += 5;
            if (['辰','丑'].includes(c)) tempScore -= 5;
            const w = (i === 3) ? 2 : 1;
            if (['戌','未','丙','丁','巳','午'].includes(c)) dryWet += w;
            if (['辰','丑','壬','癸','亥','子'].includes(c)) dryWet -= w;
        });
        const dryWetLabel = dryWet >= 3 ? '偏燥' : (dryWet <= -3 ? '偏濕' : '燥濕適中');
        const dryWetColor = dryWet >= 3 ? '#ff9800' : (dryWet <= -3 ? '#00d2ff' : '#888');

        tempScore = Math.max(-100, Math.min(100, tempScore));
        let tempLabel = "", tempColor = "";
        if (tempScore > 40) { tempLabel = "過熱"; tempColor = "#ff5252"; }
        else if (tempScore > 15) { tempLabel = "偏暖"; tempColor = "#ff9800"; }
        else if (tempScore >= -15) { tempLabel = "中和"; tempColor = "#2ed573"; }
        else if (tempScore >= -40) { tempLabel = "偏寒"; tempColor = "#00d2ff"; }
        else { tempLabel = "過寒"; tempColor = "#3498db"; }

        let motherEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        let keMeEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        let meKeEl = wuxingRel[dayElement].ke;
        let meShengEl = wuxingRel[dayElement].sheng;
        let badElements = isStrong ? [dayElement, motherEl] : [keMeEl, meKeEl, meShengEl];

        let rxText = "";
        if (tempScore <= -15) { 
            rxText = badElements.includes('火') ? "用木/燥土" : "建議用火";
        } else if (tempScore >= 15) { 
            rxText = badElements.includes('水') ? "用金/濕土" : "建議用水";
        } else {
            rxText = "溫度適中";
        }

        // ---- 體力＋調候：汽車儀表面板 ----
        const rootScore = dayMasterRootsEval.score || 0;
        const rootLabelFull = dayMasterRootsEval.label === '虛浮無根' ? '無根' : dayMasterRootsEval.label;
        const rootColor = rootScore >= 8 ? '#2ed573' : (rootScore >= 4 ? '#00d2ff' : (rootScore > 0 ? '#ff9800' : '#ff5252'));
        const rootDetail = dayMasterRootsEval.roots.length
            ? dayMasterRootsEval.roots.map(r => `${r.pillarName}${r.zhi}${r.type}`).join('、')

        const gRoot = renderCarGauge({
            title: '日干通根', min: 0, max: 10, value: rootScore, fmt: 'int',
            zones: [{ from: 0, to: 1, color: '#ff5252' }, { from: 1, to: 4, color: '#ff9800' }, { from: 4, to: 8, color: '#00d2ff' }, { from: 8, to: 10, color: '#2ed573' }],

        const shiThPct = SHI_TH / SHI_MAX * 100;

            majors: [0, 25, 50, 75, 100], minorStep: 5,
            labels: [0, 25, 50, 75, 100].map(v => ({ v, text: v })),
            marker: { v: shiThPct, color: '#2ed573' },
            status: shiLabel, statusColor: shiColor, detail: shiParts.length ? shiParts.join('、') : '天干無比印'
        });
        const gTemp = renderCarGauge({
            title: '調候', min: -100, max: 100, value: tempScore, origin: 0, fmt: 'signed',
            zones: [{ from: -100, to: -40, color: '#3498db' }, { from: -40, to: -15, color: '#00d2ff' }, { from: -15, to: 15, color: '#2ed573' }, { from: 15, to: 40, color: '#ff9800' }, { from: 40, to: 100, color: '#ff5252' }],
            majors: [-100, -50, 0, 50, 100], minorStep: 10,
            labels: [{ v: -100, text: '寒', color: '#3498db', size: 11 }, { v: -50, text: '-50' }, { v: 0, text: '0', color: '#2ed573' }, { v: 50, text: '+50' }, { v: 100, text: '熱', color: '#ff5252', size: 11 }],
            status: tempLabel, statusColor: tempColor,
            detail: `<span style="color:${dryWetColor}; font-weight:bold;">${dryWetLabel}</span> · ${rxText}`
        });
        let cmdHtml = `
            <div class="pg-cluster" style="width:100%; flex:1; display:flex; flex-direction:column; justify-content:center;">
                ${renderCarGaugeDefs()}
                <div class="pg-lamp-row">
                    <span class="pg-lamp ${isDeLing ? 'on' : ''}" title="${deLingSourceNote}"><span class="pg-dot"></span>${isDeLing ? '得令' : '失令'}</span>
                    <span class="pg-lamp-note">${deLingSourceNote}</span>
                </div>
                <div class="pg-row">${gRoot}${gShi}${gTemp}</div>
            </div>
        `;


        // [Dash 4: 五行比例 —— LED 分段電平表（0–60%，每格 5%；虛線＝均衡 20%）]
        const WX_SEG = 12, WX_MAX = 60;
        let wxCols = '';
        ['木', '火', '土', '金', '水'].forEach((el, c) => {
