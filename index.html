    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d2ff;
            --border: #333;
            --good-color: #2e7d32;
            --bad-color: #555555;
            --card-bg: rgba(20, 20, 20, 0.6);

            /* ===== 命理語意色彩 Design Tokens =====
               全站沖/合/刑/庫/引動等關係一律引用這組變數，未來要調色只需改這裡。 */
            --color-chong: #ff5252;    /* 沖 */
            --color-hai: #ff9800;      /* 害 */
            --color-xing: #e91e63;     /* 刑（含自刑／三刑）— 與半合的紫色區分開 */
            --color-liuhe: #00d2ff;    /* 六合（天干／地支） */
            --color-sanhe: #8e44ad;    /* 三合局 */
            --color-banhe: #9b59b6;    /* 半合局 */
            --color-sanhui: #d35400;   /* 三會局 */
            --color-ku: #ff9800;       /* 墓庫／開庫引動 */
            --color-origin: #00d2ff;   /* 原局引動／通根透干 */
            --color-dayun: #f39c12;    /* 大運引動 */
            --color-liunian: #2ed573;  /* 流年引動 */
            --color-neutral: #888;     /* 無明顯反應／外來 */
            --score-good: #2ed573;     /* 量化評分：強／佳 */
            --score-warn: #ff9800;     /* 量化評分：普通 */
            --score-bad: #ff5252;      /* 量化評分：弱／差 */
            --color-liuri-overall: #00d2ff;  /* 流日圖表：整體運勢 */
            --color-liuri-wealth: #ffb347;   /* 流日圖表：財運 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-variant-numeric: tabular-nums; /* 數字等寬對齊，數據感更一致 */
        }
        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,210,255,0.05);
            width: 100%;
            max-width: 1280px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
        }
        /* 電腦寬螢幕：儀表板兩欄並排，善用橫向空間 */
        @media (min-width: 1000px) {
            body { padding: 24px 32px; }
            .container { padding: 28px 36px; }
            .dash-grid-top.pg-layout { grid-template-columns: 1.15fr 1fr !important; align-items: stretch; }
            .liuri-chart-wrap { max-width: 860px; margin: 0 auto; }
            .liuri-advice-scroll { gap: 8px; }
            .liuri-advice-card { flex: 0 0 calc((100% - 16px) / 3) !important; width: auto !important; scroll-snap-align: center !important; }
            .st-svg { max-width: 420px !important; }
        }
        /* 窄螢幕（手機）大幅收窄外層留白，讓內容盡量貼齊邊緣、減少不必要的左右滑動 */
        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { padding: 12px 8px; border-radius: 8px; }
        }
        h2 {
            color: var(--accent); text-align: center; margin-top: 0;
            letter-spacing: 2px; text-shadow: 0 0 12px rgba(0,210,255,0.35);
            font-weight: 700;
        }
        h2.app-title {
            font-size: 26px; letter-spacing: 6px; text-shadow: none;
            background: linear-gradient(90deg, #4caf50, #f44336, #ff9800, #ffd700, #2196f3, #4caf50);
            background-size: 200% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,210,255,.25));
            animation: titleFlow 8s linear infinite;
        }
        .app-brand { margin:4px 0 14px; text-align:center; line-height:0; }
        .app-logo { width:min(260px, 72vw); height:auto; filter:drop-shadow(0 0 14px rgba(0,210,255,.12)); }
        @keyframes titleFlow { to { background-position: 200% 0; } }
        @media (prefers-reduced-motion: reduce) { h2.app-title { animation: none; } }
        
        .form-group {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;
        }
        input, select, button {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: #2a2a2a; border: 1px solid var(--border);
            color: white; border-radius: 6px; font-size: 16px;
        }
        input:focus, select:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,210,255,0.2);
        }
        button {
            background-color: var(--accent); color: #000; font-weight: bold; cursor: pointer;
            grid-column: span 2; transition: 0.25s; letter-spacing: 0.5px;
        }
        button:hover { background-color: #0099cc; box-shadow: 0 0 16px rgba(0,210,255,0.5); transform: translateY(-1px); }
        
        .result-box {
            margin-top: 25px; padding: 20px; background-color: #232323;
            border-radius: 4px; display: none;
        }

        
        .bazi-table-wrapper { background: #1a1a1a; border-radius: 6px; padding: 15px 5px; margin-bottom: 20px; overflow-x: auto; }
        .bazi-table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
        .bazi-table td { padding: 6px 4px; vertical-align: middle; }
        .bazi-table .bt-header { color: #aaa; font-size: 13px; font-weight: bold; padding-bottom: 8px; }
        .bazi-table .bt-shishen { font-size: 12px; font-weight: bold; }
        .bazi-table .bt-ganzhi { font-size: 22px; font-weight: bold; }
        .bazi-table .bt-hidden-bg { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 5px 0; margin-top: 2px; height: 100%; min-width: 45px; }
        .bazi-table .bt-hidden-item { display: flex; justify-content: center; gap: 4px; margin-bottom: 2px; }

        /* --- 核心能量儀表板專用樣式 --- */
        .dash-grid-top {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px;
        }
        .dash-grid-bottom {
            display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px;
        }
        .dash-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            position: relative; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .dash-card:hover { border-color: rgba(0,210,255,0.35); box-shadow: 0 0 12px rgba(0,210,255,0.08); }
        .dash-card-title {
            font-size: 12px; color: #999; margin-bottom: 12px; font-weight: bold;
            width: 100%; border-bottom: 1px dashed #444; padding-bottom: 6px;
            letter-spacing: 0.5px; text-transform: none;
        }
        .dash-footnote {
            font-size: 11px; color: #777; line-height: 1.7; margin-top: 4px;
            padding: 8px 10px; border-top: 1px dashed #333;
        }
        
        .dayun-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
        .dayun-item { background: #2a2a2a; padding: 10px 5px; border-radius: 6px; border: 1px solid #444; }
        .table-container { border: 1px solid #333; border-radius: 6px; position: relative; overflow-x: auto; }
        .liunian-table { width: 100%; border-collapse: collapse; margin-bottom: 0; background: #1a1a1a; font-size: 13px; }
        .liunian-table th, .liunian-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #333; }
        .liunian-table th { background: #2a2a2a; color: var(--accent); font-weight: normal; font-size: 12px; border-bottom: 2px solid #555; }
        
        .score-box { background: rgba(0, 210, 255, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        
        .ai-btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .ai-btn-group button { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0; }

        .loc-dst { display:flex; align-items:center; gap:6px; font-size:13px; color:#ddd; padding:0 10px; background:#1c1c1c; border:1px solid #333; border-radius:8px; cursor:pointer; white-space:nowrap; }
        .loc-dst input { width:16px; height:16px; }
        .loc-dst.on { border-color:#ffb347; color:#ffb347; }
        .loc-info { font-size:12px; color:#7f8c8d; min-height:16px; padding:2px 2px; cursor:pointer; user-select:none; }
        .loc-info .loc-edit { color:#00d2ff; margin-left:6px; white-space:nowrap; }
        .loc-info.warn .loc-warn { color:#ffb347; margin-top:2px; }
        .loc-f.need, .loc-dst.need { border-color:#ffb347 !important; box-shadow:0 0 0 1px rgba(255,179,71,.35); position:relative; }
        .loc-f.need::after, .loc-dst.need::after { content:'請確認'; position:absolute; top:-8px; right:8px; font-size:10px; line-height:1; padding:2px 5px; border-radius:4px; background:#ffb347; color:#000; font-weight:700; }
        .loc-adv { display:none; }
        .loc-adv.open { display:flex; animation: peFade .25s ease-out both; }
        .loc-info b { color:#00d2ff; font-weight:600; }
        /* ===== 歲運互動盤 ===== */
        .tag-po { color:#f1c40f; background:rgba(241,196,15,0.14); }
        .ia-wrap { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
        @media (min-width: 900px) { .ia-wrap { grid-template-columns:minmax(380px, 1.1fr) minmax(0, 1fr); align-items:start; } .ia-left { position:sticky; top:10px; } }
        .ia-board { position:relative; background:transparent; border:none; padding:6px 0; }
        .ia-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) 6px repeat(4, minmax(0,1fr)); position:relative; z-index:1; }
        .ia-sep { background:linear-gradient(180deg, transparent, #333, transparent); width:1px; justify-self:center; }
        .ia-col { text-align:center; padding:6px 0 4px; border-radius:8px; transition:background .2s; }
        .ia-col.ext { background:rgba(0,210,255,.05); }
        .ia-col.hl { background:rgba(255,255,255,.08); }
        .ia-lab { font-size:11px; color:#888; }
        .ia-col.ext .ia-lab { color:#00d2ff; }
        .ia-ss { font-size:10.5px; color:#777; min-height:14px; }
        .ia-g, .ia-z { font-size:24px; font-weight:800; line-height:1.25; }
        .ia-zc { position:relative; }
        .ia-zss { position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:1px; display:flex; flex-direction:column; gap:0; font-size:8px; font-weight:700; line-height:1.05; text-align:left; }
        .ia-zss i { font-style:normal; }
        .ia-svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:2; }
        .ia-arc { fill:none; stroke-width:1.8; stroke-linecap:round; stroke-dasharray:6 4; opacity:0; animation: iaIn .45s ease-out forwards, iaFlow 1.1s linear infinite; animation-delay: var(--d), 0s; }
        .ia-lbl { opacity:0; animation: iaIn .45s ease-out forwards; animation-delay: var(--d); pointer-events:auto; cursor:pointer; }
        @keyframes iaIn { to { opacity: var(--o, 1); } }
        @keyframes iaFlow { to { stroke-dashoffset: -20; } }
        .ia-board.has-hl .ia-arc:not(.hl), .ia-board.has-hl .ia-lbl:not(.hl) { opacity:.12 !important; animation:none; }
        .ia-arc.hl { stroke-width:3; opacity:1 !important; animation: iaFlow .6s linear infinite; }
        .ia-lbl.hl { opacity:1 !important; animation:none; }
        @media (prefers-reduced-motion: reduce) { .ia-arc { animation: iaIn .01s forwards; } }
        .ia-pick { display:grid; grid-template-columns:40px minmax(0,1fr); gap:6px 8px; align-items:center; margin-top:12px; }
        .ia-pl { width:auto; grid-column:auto; letter-spacing:normal; font-family:inherit; font-size:12px; font-weight:600; color:#00d2ff; background:transparent; border:1px solid rgba(0,210,255,.35); border-radius:6px; padding:4px 0; cursor:pointer; }
        .ia-pl:hover { transform:none; box-shadow:none; background:rgba(0,210,255,.08); }
        .ia-pl.off { color:#555; border-color:#333; text-decoration:line-through; }
        .ia-col.ext { cursor:pointer; }
        .ia-col.off { opacity:.22; background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.04) 6px 12px) !important; }
        .ia-col.off .ia-lab { text-decoration:line-through; }
        .ia-strip { display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 0 4px; scrollbar-width:thin; }
        .ia-chip { flex:0 0 auto; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:52px; padding:5px 6px; border-radius:8px; background:#1a1a1a; border:1px solid #2c2c2c; color:#ccc; cursor:pointer; font-family:inherit; }

        .ia-chip small { font-size:10.5px; color:#777; }
        .ia-chip.now small { color:#00d2ff; }
        .ia-chip.on { border-color:#00d2ff; box-shadow:0 0 0 1px rgba(0,210,255,.4), 0 0 10px rgba(0,210,255,.2); background:#0f1d22; }
        .ia-chip, .ia-cat { width:auto; letter-spacing:normal; grid-column:auto; transition:border-color .2s, background .2s; }
        .ia-chip:hover, .ia-cat:hover { transform:none; box-shadow:none; background:#222; }
        .ia-cat.on:hover { background:color-mix(in srgb, var(--c) 18%, transparent); }
        .ia-chip.on:hover { background:#0f1d22; }
        .ia-scopes { display:inline-flex; background:#151515; border:1px solid #2c2c2c; border-radius:999px; padding:3px; margin-bottom:10px; gap:2px; }
        .ia-scope { width:auto; grid-column:auto; letter-spacing:normal; font-family:inherit; font-size:12.5px; font-weight:600; padding:5px 13px; border-radius:999px; border:none; background:transparent; color:#888; cursor:pointer; }
        .ia-scope:hover { transform:none; box-shadow:none; background:#222; color:#ccc; }
        .ia-scope.on, .ia-scope.on:hover { background:#00d2ff; color:#000; }
        .ia-cat-sp { flex:1 1 auto; }
        .ia-segrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .ia-segrow .ia-scopes:last-child { align-items:center; padding-left:8px; font-size:12px; }
        .ia-cat.ia-act { color:#aaa; border-color:#444; }
        .ia-board.nat-only .ia-col.ext { opacity:.3; }
        .ia-grp { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
        .ia-grp-t { font-size:11px; color:#777; min-width:28px; }
        .ia-grp-act { margin-left:auto; }
        .ia-cats { display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:10px; align-items:center; }
        .ia-cat { font-family:inherit; font-size:12.5px; padding:4px 11px; border-radius:999px; background:transparent; border:1px solid #333; color:#666; cursor:pointer; }
        .ia-cat.on { border-color:var(--c); color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); }
        .ia-gh { font-size:12.5px; color:#ccc; font-weight:700; margin:10px 0 6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
        .ia-gh span { font-weight:400; color:#888; }
        .ia-li { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.6; color:#ddd; padding:4px 6px; border-radius:6px; cursor:pointer; }
        .ia-li:hover, .ia-li.hl { background:rgba(255,255,255,.06); }
        .ia-tag { flex:0 0 auto; min-width:30px; text-align:center; font-size:11px; font-weight:700; padding:1px 6px; border-radius:5px; color:var(--c); border:1px solid var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); margin-top:2px; }

        .tt-sc { display:inline-flex; align-items:baseline; gap:4px; padding:4px 9px; border-radius:8px; background:#1a1a1a; border:1px solid color-mix(in srgb, var(--c) 45%, transparent); }

    // 指定時區在某 UTC 時刻的偏移（分鐘），含歷史夏令資料
    function tzOffsetAt(tz, utcMs) {
        try {
            const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            const o = {}; f.formatToParts(new Date(utcMs)).forEach(x => o[x.type] = x.value);
            return Math.round((Date.UTC(+o.year, o.month - 1, +o.day, +o.hour % 24, +o.minute) - Math.floor(utcMs / 60000) * 60000) / 60000);
        } catch (e) { return null; }
    }
    // 依當地鐘錶時間判斷：標準時區偏移、夏令時間加了幾分鐘
    function tzInfoForLocal(tz, y, m, d, h, mi) {
        const a = tzOffsetAt(tz, Date.UTC(y, 0, 15)), b = tzOffsetAt(tz, Date.UTC(y, 6, 15));
        if (a === null || b === null) return null;
        const std = Math.min(a, b);
        const wall = Date.UTC(y, m - 1, d, h, mi);
        let off = tzOffsetAt(tz, wall - std * 60000);
        off = tzOffsetAt(tz, wall - off * 60000);
        return { std, dst: Math.max(0, off - std) };
    }
    const fmtOff = (min) => { const sg = min < 0 ? '−' : '+', a = Math.abs(min); return `UTC${sg}${Math.floor(a / 60)}${a % 60 ? ':' + String(a % 60).padStart(2, '0') : ''}`; };
    function readBirthWall() {
        const v = document.getElementById('birthDate').value; if (!v) return null;
        const [y, m, d] = v.split('-').map(Number);
        return { y, m, d, h: parseInt(document.getElementById('birthHour').value) || 0, mi: parseInt(document.getElementById('birthMinute').value) || 0 };
    }
    // 標記需要使用者確認的欄位（橘框＋「請確認」）
    function setNeed(id, on) {
        const el = document.getElementById(id); if (!el) return;
        const box = el.closest('.loc-f, .loc-dst'); if (box) box.classList.toggle('need', !!on);
    }
    const clearNeeds = () => ['birthPlace', 'birthTzOff', 'useDst', 'longitude'].forEach(id => setNeed(id, false));
    // 城市對應斷開時（未知城市／手動改時區）：經度改用時區中央估計值、夏令先關閉，並提醒確認
    function detachCity() {
        const std = parseInt(document.getElementById('birthTzOff').value);
        document.getElementById('birthTz').value = '';
        if (!isNaN(std)) document.getElementById('longitude').value = (std / 4).toFixed(1);
        const dEl = document.getElementById('useDst'); dEl.checked = false; delete dEl.dataset.manual;
        setNeed('longitude', true); setNeed('useDst', true);
        document.getElementById('locAdv').classList.add('open');
    }
    function onPlaceInput() {
        const v = document.getElementById('birthPlace').value.trim();
        const c = CITY_MAP[v];
        if (c) {
            document.getElementById('longitude').value = c[1];
            document.getElementById('birthTz').value = c[2];
            delete document.getElementById('useDst').dataset.manual;
            delete document.getElementById('birthTzOff').dataset.manual;
            clearNeeds();
        } else if (v) {
            // 清單外的城市：時區、夏令、經度都要自己確認
            delete document.getElementById('birthTzOff').dataset.manual;
            detachCity();
            setNeed('birthTzOff', true);
        }
        autoTz();
    }
    function onTzManual() {
        const tzSel = document.getElementById('birthTzOff');
        tzSel.dataset.manual = '1';
        setNeed('birthTzOff', false);
        // 手動選時區：原本的城市不再適用，出生地改為自訂
        const pl = document.getElementById('birthPlace');
        if (CITY_MAP[pl.value.trim()]) { pl.value = ''; pl.placeholder = '自訂時區（可輸入地名）'; }
        detachCity();
        updateLocInfo();
    }
    function onLonManual() { setNeed('longitude', false); updateLocInfo(); }
    function onDstManual() { const d = document.getElementById('useDst'); d.dataset.manual = '1'; setNeed('useDst', false); updateLocInfo(); }
    // 城市已知時：自動帶入當年標準時區與夏令時間
    function autoTz() {
        const tz = document.getElementById('birthTz').value, w = readBirthWall();
        const dstEl = document.getElementById('useDst');
        if (tz && w) {
            const inf = tzInfoForLocal(tz, w.y, w.m, w.d, w.h, w.mi);
            if (inf) {
                document.getElementById('birthTzOff').value = String(inf.std);
                if (!dstEl.dataset.manual) dstEl.checked = inf.dst > 0;
                dstEl.dataset.auto = String(inf.dst || 60);
            }
        }
        updateLocInfo();
    }
    function getBirthLoc() {
        const lonRaw = parseFloat(document.getElementById('longitude').value);
        const dstEl = document.getElementById('useDst');
        const tz = document.getElementById('birthTz').value;
        return {
            place: document.getElementById('birthPlace').value.trim(),
            lon: isNaN(lonRaw) ? 120 : lonRaw,
            std: parseInt(document.getElementById('birthTzOff').value),
            dst: dstEl.checked ? (tz ? parseInt(dstEl.dataset.auto || '60') : 60) : 0
        };
    }
    function toggleLocAdv(force) {
        const el = document.getElementById('locAdv');
        el.classList.toggle('open', force === undefined ? !el.classList.contains('open') : force);
        updateLocInfo();
    }
    function updateLocInfo() {
        const L = getBirthLoc(), w = readBirthWall(), el = document.getElementById('locInfo');
        const tz = document.getElementById('birthTz').value;
        const open = document.getElementById('locAdv').classList.contains('open');
        document.querySelector('.loc-dst').classList.toggle('on', L.dst > 0);
        const tzManual = !!document.getElementById('birthTzOff').dataset.manual;
        const needs = document.querySelectorAll('#dateInputGroup .need').length;
        el.classList.toggle('warn', needs > 0);
        if (!w || isNaN(L.std)) { el.innerHTML = ''; return; }
        const utc = Date.UTC(w.y, w.m - 1, w.d, w.h, w.mi) - (L.std + L.dst) * 60000;
        const tw = new Date(utc + 480 * 60000), p2 = n => String(n).padStart(2, '0');
        const solarOn = document.getElementById('useTrueSolar').checked;
        const src = CITY_MAP[L.place] && tz ? L.place : (tzManual || !L.place ? '自訂時區' : L.place);
        const parts = [src, fmtOff(L.std), L.dst ? `夏令 +${L.dst / 60}h` : '無夏令', solarOn ? `真太陽時・經度 ${L.lon}` : '鐘錶時間'];
        const twTxt = '';
        const warnTxt = needs ? `<div class="loc-warn">⚠ 橘色欄位是估計值，請確認${!solarOn && document.querySelector('.loc-lon.need') ? '（經度只在開啟真太陽時使用）' : ''}</div>` : '';
        el.innerHTML = `排盤採用：${parts.join('・')}${twTxt}<span class="loc-edit">${open ? '收合 ▴' : '調整 ▾'}</span>${warnTxt}`;
    }

    function initPage() {
        if (typeof Solar === 'undefined') {
            document.querySelector('.container').innerHTML =
                '<h2 style="color:#ff5252;">⚠️ 排盤引擎載入失敗</h2>' +
                '<p style="color:#ccc; line-height:1.7;">無法載入 lunar-javascript 這個排盤核心套件（通常是 CDN 連線被擋、公司/學校網路防火牆，或暫時斷線）。<br>' +
                '請確認網路連線正常後重新整理頁面；若在企業網路環境仍失敗，建議改用手機網路或連上其他 Wi-Fi 測試。</p>';
            return;
        }
        const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
        const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const ganSelects = ['yg', 'mg', 'dg', 'tg'];
        const zhiSelects = ['yz', 'mz', 'dz', 'tz'];
        
        ganSelects.forEach(id => {
            const el = document.getElementById(id);
            stems.forEach(g => { el.appendChild(new Option(g, g)); });
        });

        zhiSelects.forEach(id => {
            const el = document.getElementById(id);
            branches.forEach(z => { el.appendChild(new Option(z, z)); });
        });

        const now = new Date();
        const pad2 = (n) => String(n).padStart(2, '0');
        // 24 小時制小時／分鐘下拉選單，避免原生 datetime-local 依裝置語系顯示 12 小時制造成誤判
        const hourSelect = document.getElementById('birthHour');
        for (let h = 0; h <= 23; h++) hourSelect.appendChild(new Option(`${pad2(h)} 時`, h));
        const minuteSelect = document.getElementById('birthMinute');
        for (let m = 0; m <= 59; m++) minuteSelect.appendChild(new Option(`${pad2(m)} 分`, m));

        document.getElementById('birthDate').value = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
        hourSelect.value = now.getHours();
        minuteSelect.value = now.getMinutes();
        document.getElementById('baziYear').value = now.getFullYear();

        try {
            const solarNow = Solar.fromYmdHms(now.getFullYear(), now.getMonth() + 1, now.getDate(), now.getHours(), now.getMinutes(), 0);
            const baziNow = solarNow.getLunar().getEightChar();
            
            document.getElementById('yg').value = baziNow.getYearGan();
            document.getElementById('yz').value = baziNow.getYearZhi();
            document.getElementById('mg').value = baziNow.getMonthGan();
            document.getElementById('mz').value = baziNow.getMonthZhi();
            document.getElementById('dg').value = baziNow.getDayGan();
            document.getElementById('dz').value = baziNow.getDayZhi();
            document.getElementById('tg').value = baziNow.getTimeGan();
            document.getElementById('tz').value = baziNow.getTimeZhi();
        } catch (e) {
            document.getElementById('yg').value = '己'; document.getElementById('yz').value = '巳';
            document.getElementById('mg').value = '己'; document.getElementById('mz').value = '巳';
            document.getElementById('dg').value = '丁'; document.getElementById('dz').value = '丑';
            document.getElementById('tg').value = '乙'; document.getElementById('tz').value = '巳';
        }
        const tzSel = document.getElementById('birthTzOff');
        const offs = []; for (let x = -12 * 60; x <= 14 * 60; x += 30) offs.push(x); offs.push(345, 525, 765);
        offs.sort((a, b) => a - b).forEach(x => tzSel.appendChild(new Option(fmtOff(x), x)));
        tzSel.value = '480';
        document.getElementById('cityList').innerHTML = CITY_DB.map(c => `<option value="${c[0]}"></option>`).join('');
        ['birthDate', 'birthHour', 'birthMinute'].forEach(id => document.getElementById(id).addEventListener('change', autoTz));
        autoTz();
        renderSavedChartsList();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPage);
    else initPage();

    function toggleTrueSolar() {
        if (typeof updateLocInfo === 'function') updateLocInfo();

    // ===== 手動八字：性別切換＋由四柱反推出生日期（自動得到出生年與起運歲） =====
    function setGenderSeg(g) {
        g = String(g); document.getElementById('gender').value = g;
        document.querySelectorAll('#genderSeg button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
        if (document.getElementById('baziCand')) renderBaziCand();
    }
    function baziCands() {
        const v = id => document.getElementById(id).value;
        try { return Solar.fromBaZi(v('yg') + v('yz'), v('mg') + v('mz'), v('dg') + v('dz'), v('tg') + v('tz'), 2, 1900).sort((a, b) => a.getYear() - b.getYear()); }
        catch (e) { return []; }
    }
    function baziPick(L) {
        const want = parseInt(document.getElementById('baziYear').value);
        const Y = new Date().getFullYear();
        return L.find(s => s.getYear() === want) || L.filter(s => s.getYear() <= Y).pop() || L[0] || null;
    }
    document.addEventListener('change', (e) => {
        if (e.target.closest && e.target.closest('#baziInputGroup select')) { document.getElementById('baziYear').value = ''; renderBaziCand(); }
    });
    function baziPickYear(y) { document.getElementById('baziYear').value = y; renderBaziCand(); }
    function renderBaziCand() {
        const box = document.getElementById('baziCand'); if (!box || typeof Solar === 'undefined') return;
        const L = baziCands(), s = baziPick(L), Y = new Date().getFullYear();
        if (!s) { document.getElementById('baziYear').value = ''; box.innerHTML = '<span class="bz-warn">這組干支查無對應日期，大運起運歲改用估算</span>'; return; }
        document.getElementById('baziYear').value = s.getYear();
        const age = Y - s.getYear();
        box.innerHTML = `<span class="bz-lbl">推算出生</span><b>${s.getYear()}/${s.getMonth()}/${s.getDay()} ${s.getHour()}時</b><span class="bz-age">${age >= 0 ? '約 ' + age + ' 歲' : '未出生'}</span>`
            + (L.length > 1 ? `<span class="bz-alt">${L.map(o => `<button type="button" class="${o === s ? 'on' : ''}" onclick="baziPickYear(${o.getYear()})">${o.getYear()}</button>`).join('')}</span>` : '');
    }
    function toggleInputMode() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        if (mode !== 'date') { setGenderSeg(document.getElementById('gender').value); renderBaziCand(); }
        if (mode === 'date') {
            document.getElementById('dateInputGroup').style.display = 'flex';
            document.getElementById('baziInputGroup').style.display = 'none';
        } else {
            document.getElementById('dateInputGroup').style.display = 'none';
            document.getElementById('baziInputGroup').style.display = 'flex';
        }
        document.querySelectorAll('.mode-toggle-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
    }

    // ===== 我的命盤：存在瀏覽器 localStorage，只有這台裝置看得到，不會上傳 =====
    // ===================================================================
    // 朋友契合度（單向：朋友對命主的幫助）— 不列入 AI 提詞
    // 命主身弱／從弱：喜 印、比劫（各 1.0）
    // 命主身強／從強：喜 官殺、財（各 1.0），食傷 0.3，印比 0
    // 總分 = 主分數 80% ＋ 補缺分 20%（命主喜用低於 20% 平衡線的缺口，合盤平均後補回比例）
    // ===================================================================
    const FRIENDS_KEY = 'bazi_friends_v1';
    const FIVE_ELS = ['木', '火', '土', '金', '水'];
    const BALANCE_LINE = 20;
    let __selectedFriendIdx = null;

    function getFriends() { try { return JSON.parse(localStorage.getItem(FRIENDS_KEY) || '[]'); } catch (e) { return []; } }
    function setFriends(list) { try { localStorage.setItem(FRIENDS_KEY, JSON.stringify(list)); } catch (e) { alert('儲存失敗，可能是瀏覽器隱私模式或空間已滿。'); } }

    // 朋友只有年月日（無時辰）：排年、月、日三柱，以中午 12:00 排盤避開子時換日
    function calcFriendPct(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const bz = Solar.fromYmdHms(y, m, d, 12, 0, 0).getLunar().getEightChar();
        const gans = [bz.getYearGan(), bz.getMonthGan(), bz.getDayGan()];
        const zhis = [bz.getYearZhi(), bz.getMonthZhi(), bz.getDayZhi()];
        const cnt = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
        gans.forEach(g => cnt[ganElementMap[g]] += 1.0);
        zhis.forEach(z => { const w = zhiHiddenWeights[z] || {}; Object.keys(w).forEach(g => cnt[ganElementMap[g]] += w[g]); });
        const total = Object.values(cnt).reduce((a, b) => a + b, 0);
        const pct = {}; FIVE_ELS.forEach(el => pct[el] = total ? cnt[el] / total * 100 : 0);
        return { pct, pillars: gans.map((g, i) => g + zhis[i]) };
    }

    function friendWeights(ctx) {
        const de = ctx.dayElement;
        const yin = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === de);
        const shiShang = wuxingRel[de].sheng, cai = wuxingRel[de].ke;
        const guanSha = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === de);
        const isWeak = ctx.strengthLabel === '身弱' || ctx.strengthLabel === '從弱格';
        const w = {}; FIVE_ELS.forEach(el => w[el] = 0);
        if (isWeak) { w[yin] = 1; w[de] = 1; }

    function computeFriendScore(ctx, frPct) {
        const { w } = friendWeights(ctx);
        const main = FIVE_ELS.reduce((sum, el) => sum + frPct[el] * w[el], 0);
        const combined = {}; FIVE_ELS.forEach(el => combined[el] = (ctx.mePct[el] + frPct[el]) / 2);
        let gap = 0, filled = 0;
        FIVE_ELS.forEach(el => {
            if (w[el] === 1 && ctx.mePct[el] < BALANCE_LINE) {
                gap += BALANCE_LINE - ctx.mePct[el];
                filled += Math.max(0, Math.min(combined[el], BALANCE_LINE) - ctx.mePct[el]);
            }
        });
        const fill = gap > 0 ? filled / gap * 100 : null;
        const total = Math.round(fill === null ? main : main * 0.8 + fill * 0.2);
        return { main: Math.round(main), fill: fill === null ? null : Math.round(fill), total: Math.max(0, Math.min(100, total)), combined };
    }

    function friendGrade(score) {

    // 正偏：數量多者為主；數量相同時，有天干主星者為主；仍相同則兩者並重（雙重性格）
    function calcPartner(p) {

        const gans = [bz.getYearGan(), bz.getMonthGan(), bz.getDayGan()].concat(hasHour ? [bz.getTimeGan()] : []);
        const zhis = [bz.getYearZhi(), bz.getMonthZhi(), bz.getDayZhi()].concat(hasHour ? [bz.getTimeZhi()] : []);
        const dg = gans[2], cnt = {}, ganStar = {};

        gans.forEach((g, i) => { if (i === 2) return; const t = getPreciseTenGod(g, dg); cnt[t]++; ganStar[t] += i === 1 ? 2 : 1; }); // 月干主星加權
        zhis.forEach(z => Object.keys(zhiHiddenWeights[z] || {}).forEach(h => cnt[getPreciseTenGod(h, dg)]++));

        const order = Object.keys(TG_PROFILE).sort((a, b) => catN[b] - catN[a] || catStar[b] - catStar[a]);

    function yyCtx(ctx) {

    function yySanhe(yz, pool, newZ) {

        if (!g) return null;

        const pel = ganElementMap[r.dg];

        const pcat = hpCat(lo) === hpCat(hi) ? hpCat(lo) : null;
        const strong = c => c === '身強' || c === '從強格', weak = c => c === '身弱' || c === '從弱格';
        const res = {};
        res.mutual = me.g !== pg ? (me.g === 1 ? hpKe(me.el) === pel : hpKe(pel) === me.el) : (hpKe(me.el) === pel || hpKe(pel) === me.el);
        res.samestar = hpSpouseEl(me.el, me.g) === hpSpouseEl(pel, pg);
        if (!pcat) res.comp = null;
        else if (me.cat === '從強格') res.comp = pel === me.el && weak(pcat);
        else if (me.cat === '從弱格') res.comp = pel === me.el && strong(pcat);
        else if (me.cat === '身強') res.comp = ([hpKe(me.el), hpKeBy(me.el)].includes(pel) && strong(pcat)) || (pel === me.el && weak(pcat));
        else res.comp = (pel === hpYin(me.el) && strong(pcat)) || (pel === me.el && strong(pcat));
        // 對方五行分布（天干 1＋地支藏干比重）
        const cnt = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
        r.gans.forEach(gn => cnt[ganElementMap[gn]] += 1);
        r.zhis.forEach(z => { const w = zhiHiddenWeights[z] || {}; Object.keys(w).forEach(h => cnt[ganElementMap[h]] += w[h]); });
        const sameDay = ganElementMap[me.dg] === pel && ganElementMap[zhiMainGan(me.dz)] === ganElementMap[zhiMainGan(r.zhis[2])];

        res.sanhe = me.yz !== r.zhis[0] && YY_SANHE.some(s => s.includes(me.yz) && s.includes(r.zhis[0]));
        return { res, pel, pg, assumedG: p.gender == null, lo, hi, pcat, sameDay, cnt };

     * 依據出生的真實節氣交接日，精確計算「本月人元司令神」。

    function jqGet(table, name) { return table ? (table[name] || table[JQ_SIMP[name]] || null) : null; }

    function getSiLingGan(birthSolar, monthZhi) {
        try {
            if (!birthSolar || typeof Solar === 'undefined') return null;
            const jieName = monthJieName[monthZhi];
            if (!jieName) return null;

            const y = birthSolar.getYear();
            // 取前一年、當年、後一年三份節氣表，避免跨年邊界（例如子月、丑月）找不到節氣日期
            let candidateDates = [];
            [y - 1, y, y + 1].forEach(yy => {
                const table = Solar.fromYmd(yy, 6, 1).getLunar().getJieQiTable();
                const jd = jqGet(table, jieName);
                if (jd) candidateDates.push(jd);
            });

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            const birthKey = toKey(birthSolar);

            if (validDates.length === 0) return null;
            validDates.sort((a, b) => toKey(b) - toKey(a));

            if (daysPassed < 0) return null;

            const segments = renYuanSiLing[monthZhi];
            if (!segments) return null;
            let acc = 0;
            for (let i = 0; i < segments.length; i++) {
                acc += segments[i][1];
                if (daysPassed < acc || i === segments.length - 1) return segments[i][0];
            }
            return segments[segments.length - 1][0];
        } catch (e) {
            console.warn('getSiLingGan 計算失敗，改用簡易月支五行法:', e);
            return null;
        }
    }

     * 回傳 null 代表節氣資料抓取失敗，呼叫端應 fallback 回國曆年月顯示。
     */
    function getJieQiRange(sampleSolar) {
        try {
            if (!sampleSolar || typeof Solar === 'undefined') return null;
            const y = sampleSolar.getYear();
            let allJie = [];
            [y - 1, y, y + 1].forEach(yy => {

            });

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            allJie.sort((a, b) => toKey(a.solar) - toKey(b.solar));
            const sampleKey = toKey(sampleSolar);

            let startIdx = -1;
            for (let i = 0; i < allJie.length; i++) {
                if (toKey(allJie[i].solar) <= sampleKey) startIdx = i; else break;
            }
            if (startIdx === -1 || !allJie[startIdx + 1]) return null;

            const start = allJie[startIdx];
            const end = allJie[startIdx + 1];
            const fmt = (s) => `${s.getYear()}/${s.getMonth()}/${s.getDay()}`;
            return {

    // 透藏：天干同五行的中氣、餘氣被引出（如辛丑透辛→金，金再生丑中癸→金水）
    // 藏生干：地支中氣、餘氣生天干（如丁亥，亥中甲木生丁→火旺）；權重 < 0.3 的藏干不計
    function pillarTags(g, z) {

    const ptTitle = { '一氣': '干支同五行，力量專一', '支生干': '地支本氣生天干，天干得力', '干生支': '天干生地支本氣，天干洩氣、地支得力', '蓋頭': '天干剋地支本氣，地支受制', '截腳': '地支本氣剋天干，天干受制', '透藏': '天干引出地支中的同五行藏干', '藏生干': '地支中氣／餘氣生天干' };

    // ===== 干支互動掃描引擎（原局／大運／流年／流月共用） =====
    const ZHI_PO = { '子':'酉', '酉':'子', '午':'卯', '卯':'午', '寅':'亥', '亥':'寅', '巳':'申', '申':'巳', '辰':'丑', '丑':'辰', '戌':'未', '未':'戌' };
    const XING_PAIR = [['寅','巳','無恩之刑'], ['巳','申','無恩之刑'], ['申','寅','無恩之刑'], ['丑','戌','恃勢之刑'], ['戌','未','恃勢之刑'], ['未','丑','恃勢之刑'], ['子','卯','恩愛之刑']];

    // 分組：刑沖（衝擊）／合絆（牽制、能量受影響）／成局（合出新能量）

    function iaPillars(baseGans, baseZhis, ext) {
        const NAT = ['年', '月', '日', '時'];
        const P = baseGans.map((g, i) => ({ key: 'n' + i, label: NAT[i] + '柱', short: NAT[i], gan: g, zhi: baseZhis[i], natal: true, idx: i, ord: 3 + i }));

    function iaScan(P) {
        const out = [];
        const dist = (a, b) => { const d = Math.abs(a.idx - b.idx); return d === 1 ? '相鄰' : (d === 2 ? '隔柱' : '遙隔'); };
        const add = (r) => { r.row = r.row || 'zhi'; r.natal = r.members.every(m => m.natal); out.push(r); };
        for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
            const a = P[i], b = P[j];
            const bothNat = a.natal && b.natal, ds = bothNat ? dist(a, b) : '';
            const far = bothNat && ds === '遙隔';
            if (a.zhi && b.zhi) {
                if (zhiChongMap[a.zhi] === b.zhi) add({ cat: 'chong', type: '沖', members: [a, b], ds });
                if (zhiHeMap[a.zhi] === b.zhi && !far) add({ cat: 'he', type: '六合', members: [a, b], ds });
                if (zhiHaiMap[a.zhi] === b.zhi) add({ cat: 'hai', type: '害', members: [a, b], ds });
                if (ZHI_PO[a.zhi] === b.zhi) add({ cat: 'po', type: '破', members: [a, b], ds });

                if (xp) add({ cat: 'xing', type: '刑', kind: xp[2], members: [a, b], ds, xingPair: true });

                if (full.some(c => c.includes(x) && c.includes(y))) return;
                add({ cat: 'ju', type: '半合', el, members: [x, y], ds: x.natal && y.natal ? dist(x, y) : '' });
            })));
            // 暗拱：生＋墓（缺中間帝旺），三合只剩兩字、力道較弱
            P.filter(p => p.zhi === zs[0]).forEach(x => P.filter(p => p.zhi === zs[2]).forEach(y => {
                if (full.some(c => c.includes(x) && c.includes(y))) return;
                add({ cat: 'gong', type: '暗拱', el, mid: zs[1], members: [x, y], ds: x.natal && y.natal ? dist(x, y) : '' });
            }));
        });
        IA_SANHUI.forEach(([zs, el]) => combos(zs).forEach(c => add({ cat: 'ju', type: '三會', el, members: c })));
        XING_TRIO.forEach(([zs, kind]) => {
            const cs = combos(zs);

        return out.filter(r => !r.hidden).map((r, i) => Object.assign(r, { id: 'ia' + i, members: [...r.members].sort((a, b) => a.ord - b.ord), between: !r.members.some(m => m.natal) }));

    const iaName = (m, row) => m.natal ? m.short + (row === 'gan' ? '干' : '支') : m.short;

    function iaText(r) {

        if (S.needCenter) { S.needCenter = false; ['iaDyStrip', 'iaLnStrip', 'iaLmStrip'].forEach(id => { const st = document.getElementById(id), on = st && st.querySelector('.on'); if (on) st.scrollLeft = on.offsetLeft - st.offsetLeft - st.clientWidth / 2 + on.clientWidth / 2; }); }
        const pos = {};
        board.querySelectorAll('.ia-col').forEach(el => {
            const z = el.querySelector('.ia-z').getBoundingClientRect(), g = el.querySelector('.ia-g').getBoundingClientRect();
            pos[el.dataset.key] = { x: z.left + z.width / 2 - br.left, zb: z.bottom - br.top + 3, gt: el.getBoundingClientRect().top - br.top - 2 };
        });
        if (S.mode !== 'rel') { ttDraw(board, svg, pos); return; }
        const rels = S.rels.filter(iaVisible);
        // 預留高度：用「目前大運／流年／流月下的全部互動」計算層數，開關切換時命盤高度不變
        const laneCount = (list) => {
            const Ls = { zhi: [], gan: [] };
            list.forEach(r => {
                const xs = r.members.map(m => pos[m.key].x).sort((a, b) => a - b), lo = xs[0] - 22, hi = xs[xs.length - 1] + 22, L = Ls[r.row];
                let li = L.findIndex(lane => lane.every(([a, b]) => hi < a || lo > b));
                if (li < 0) { L.push([]); li = L.length - 1; }
                L[li].push([lo, hi]);
            });
            return Ls;
        };
        const fullLanes = laneCount(S.rels);
        // 端點分散：同一柱有多條線時，依另一端方向左右錯開，避免全部擠在中心
        const ends = {};
        rels.forEach(r => r.members.forEach(m => {
            const others = r.members.filter(o => o !== m), dir = others.reduce((t, o) => t + pos[o.key].x, 0) / others.length - pos[m.key].x;
            const k = m.key + '|' + r.row; (ends[k] = ends[k] || []).push({ r, m, dir });
        }));
        const off = {};
        Object.values(ends).forEach(list => {
            list.sort((a, b) => a.dir - b.dir);
            const n = list.length, step = Math.min(7, 28 / Math.max(1, n - 1));
            list.forEach((e, i) => { off[e.r.id + '|' + e.m.key] = n > 1 ? (i - (n - 1) / 2) * step : 0; });
        });
        const X = (r, m) => pos[m.key].x + (off[r.id + '|' + m.key] || 0);
        // 分道：區間不重疊的放同一層
        const lanes = { zhi: [], gan: [] };
        const placed = rels.map(r => {
            const xs = r.members.map(m => X(r, m)).sort((a, b) => a - b);
            const lo = xs[0] - 8, hi = xs[xs.length - 1] + 8, L = lanes[r.row];
            let li = L.findIndex(lane => lane.every(([a, b]) => hi < a || lo > b));
            if (li < 0) { L.push([]); li = L.length - 1; }
            L[li].push([lo, hi]);
            return { r, xs, li };
        });
        const nZ = Math.max(lanes.zhi.length, fullLanes.zhi.length), nG = Math.max(lanes.gan.length, fullLanes.gan.length);
        const padB = nZ ? 20 + nZ * 13 : 6, padT = nG ? 18 + nG * 13 : 0;
        board.style.paddingBottom = padB + 'px'; board.style.paddingTop = padT + 'px';
        // padding 改變後重新量位置
        const br2 = board.getBoundingClientRect();
        board.querySelectorAll('.ia-col').forEach(el => {
            const z = el.querySelector('.ia-z').getBoundingClientRect(), g = el.querySelector('.ia-g').getBoundingClientRect();
            Object.assign(pos[el.dataset.key], { zb: z.bottom - br2.top + 3, gt: el.getBoundingClientRect().top - br2.top - 2 });
        });
        let defs = '<defs>' + IA_CAT_ORDER.map(c => `<marker id="iaM-${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="${IA_CAT[c].color}"/></marker>`).join('') + '</defs>';
        let arcs = '', labels = '';
        placed.forEach(({ r, xs, li }, n) => {
            const col = IA_CAT[r.cat].color, up = r.row === 'gan';
            const y0 = up ? Math.min(...r.members.map(m => pos[m.key].gt)) : Math.max(...r.members.map(m => pos[m.key].zb));
            const dpt = (up ? -1 : 1) * (13 + li * 13);
            const segs = [];
            for (let i = 0; i < xs.length - 1; i++) segs.push([xs[i], xs[i + 1]]);
            const delay = (n * 0.06).toFixed(2), op = (S.bright === 'on' ? 1 : 0.22) * (r.between ? 0.5 : 1);
            segs.forEach(([a, b]) => {
                const ax = a, bx = b, cx = (ax + bx) / 2;
                arcs += `<path class="ia-arc ${r.natal ? 'nat' : ''} ${r.between ? 'btw' : ''}" data-id="${r.id}" d="M${ax.toFixed(1)},${y0.toFixed(1)} Q${cx.toFixed(1)},${(y0 + dpt * 2).toFixed(1)} ${bx.toFixed(1)},${y0.toFixed(1)}" stroke="${col}" marker-start="url(#iaM-${r.cat})" marker-end="url(#iaM-${r.cat})" style="--d:${delay}s; --o:${op};"/>`;
            });
            const lx = xs.length === 3 ? xs[1] : (xs[0] + xs[1]) / 2, ly = y0 + dpt;
            const t = iaShort(r), w = t.length * 11 + 8;
            labels += `<g class="ia-lbl ${r.natal ? 'nat' : ''} ${r.between ? 'btw' : ''}" data-id="${r.id}" style="--d:${delay}s; --o:${op};" onclick="iaHl('${r.id}')"><rect x="${(lx - w / 2).toFixed(1)}" y="${(ly - 8).toFixed(1)}" width="${w}" height="16" rx="5" fill="#141414" stroke="${col}" stroke-width="1"/><text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${col}">${t}</text></g>`;
        });
        svg.innerHTML = defs + arcs + labels;
        iaApplyHl();
    }

    function ttDraw(board, svg, pos) {
        const S = window.__ia;
        board.style.paddingBottom = '8px'; board.style.paddingTop = '6px';
        const br = board.getBoundingClientRect();
        board.querySelectorAll('.ia-col').forEach(el => {
            const z = el.querySelector('.ia-z').getBoundingClientRect(), g = el.querySelector('.ia-g').getBoundingClientRect();
            Object.assign(pos[el.dataset.key], { gb: g.bottom - br.top + 1, zt: z.top - br.top - 1 });
        });
        const rels = S.rels.filter(iaVisible);
        // 端點分散：同一個干（或支）有多條線時依另一端方向左右錯開
        const ends = {};
        rels.forEach(r => {
            const gx = pos[r.ga.key].x, zx = pos[r.zb.key].x;
            (ends['g' + r.ga.key] = ends['g' + r.ga.key] || []).push({ r, end: 'g', dir: zx - gx });
            (ends['z' + r.zb.key] = ends['z' + r.zb.key] || []).push({ r, end: 'z', dir: gx - zx });
        });
        const off = {};
        Object.values(ends).forEach(list => {
            list.sort((a, b) => a.dir - b.dir);
            const n = list.length, step = Math.min(6, 24 / Math.max(1, n - 1));
            list.forEach((e, i) => { off[e.r.id + e.end] = n > 1 ? (i - (n - 1) / 2) * step : 0; });
        });
        const W = [2.6, 1.7, 1.1];
        let defs = '<defs>' + ['木', '火', '土', '金', '水'].map(el => `<marker id="ttM-${el}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="${elementColors[el]}"/></marker>`).join('') + '</defs>';
        if (!S.ttDir.tg && !S.ttDir.tou) { svg.innerHTML = ''; iaApplyHl(); return; }
        let arcs = '';
        rels.forEach((r, n) => {
            const el = ganElementMap[r.ga.gan], col = elementColors[el];
            const x1 = pos[r.ga.key].x + off[r.id + 'g'], y1 = pos[r.ga.key].gb;
            const x2 = pos[r.zb.key].x + off[r.id + 'z'], y2 = pos[r.zb.key].zt;
            const h = y2 - y1;
            // 路徑由天干畫到地支：通根＝箭頭指向地支（往下），透干＝箭頭指向天干（往上），兩者皆開＝雙向
            const d = `M${x1.toFixed(1)},${y1.toFixed(1)} C${x1.toFixed(1)},${(y1 + h * 0.55).toFixed(1)} ${x2.toFixed(1)},${(y2 - h * 0.55).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
            const mk = `${S.ttDir.tg ? `marker-end="url(#ttM-${el})"` : ''} ${S.ttDir.tou ? `marker-start="url(#ttM-${el})"` : ''}`;
            const flowUp = S.ttDir.tou && !S.ttDir.tg;
            const op = (S.bright === 'on' ? 1 : 0.22) * (r.between ? 0.5 : 1) * (r.qi === 2 ? 0.6 : 1);
            arcs += `<path class="ia-arc tt-arc q${r.qi} ${r.between ? 'btw' : ''} ${flowUp ? 'up' : ''}" data-id="${r.id}" d="${d}" stroke="${col}" stroke-width="${W[r.qi]}" ${mk} style="--d:${(n * 0.04).toFixed(2)}s; --o:${op};" onclick="iaHl('${r.id}')"/>`;
        });
        svg.innerHTML = defs + arcs;
        iaApplyHl();
    }
    // 亮度模式：全亮／全暗為基本模式；點某條線＝聚焦（只亮那條），再點同一條或點全亮／全暗即離開
    const iaBriMode = () => window.__ia.hl ? 'focus' : window.__ia.bright;
    function iaSyncBri() { document.querySelectorAll('.ia-bri').forEach(b => b.classList.toggle('on', b.dataset.bright === iaBriMode())); }
    function iaApplyHl() {
        const S = window.__ia, board = document.getElementById('iaBoard'); if (!board) return;
        board.classList.toggle('has-hl', !!S.hl);
        board.querySelectorAll('.ia-arc, .ia-lbl').forEach(el => el.classList.toggle('hl', el.dataset.id === S.hl));
        document.querySelectorAll('#iaList .ia-li').forEach(el => el.classList.toggle('hl', el.dataset.id === S.hl));
        const r = S.hl && S.rels.find(x => x.id === S.hl);
        board.querySelectorAll('.ia-col').forEach(el => el.classList.toggle('hl', !!r && r.members.some(m => m.key === el.dataset.key)));

    function iaBright(k) {

        if (k === 'focus') { if (!S.hl) { const first = S.rels.find(iaVisible); if (first) S.hl = first.id; } }

    function iaPickDy(i) {

        S.di = i; S.hl = null;

    function iaPickLm(k) { const S = window.__ia; S.mk = k; S.hl = null; iaRenderAll(); }

    function getOriginalChongXingHai(pillars) {
        let alerts = [];
        let zhis = pillars.map(p => p.zhi);
        
        if (zhis.includes('寅') && zhis.includes('巳') && zhis.includes('申')) alerts.push(`<span style="color:#ff5252;">• 原局地支：無恩三刑 (寅巳申)</span>`);
        if (zhis.includes('丑') && zhis.includes('戌') && zhis.includes('未')) alerts.push(`<span style="color:#ff5252;">• 原局地支：恃勢三刑 (丑戌未)</span>`);

        for(let i=0; i<3; i++) {
            for(let j=i+1; j<4; j++) {
                let z1 = pillars[i].zhi, z2 = pillars[j].zhi;
                let p1Name = pillars[i].name, p2Name = pillars[j].name;
                let dist = (j - i === 1) ? '相鄰' : (j - i === 2 ? '隔柱' : '遙隔');
                
                if(zhiChongMap[z1] === z2) alerts.push(`<span style="color:#ff5252;">• 原局六沖：${p1Name}「${z1}」與 ${p2Name}「${z2}」相沖 (${dist})</span>`);
                if(zhiHaiMap[z1] === z2) alerts.push(`<span style="color:#ff9800;">• 原局六害：${p1Name}「${z1}」與 ${p2Name}「${z2}」相害 (${dist})</span>`);
                if((z1 === '子' && z2 === '卯') || (z1 === '卯' && z2 === '子')) alerts.push(`<span style="color:#ff9800;">• 原局相刑：${p1Name}「${z1}」與 ${p2Name}「${z2}」無禮之刑 (${dist})</span>`);
                if(z1 === z2 && ['辰','午','酉','亥'].includes(z1) && dist !== '遙隔') alerts.push(`<span style="color:#ff9800;">• 原局自刑：${p1Name}與${p2Name}「${z1}」自刑 (${dist})</span>`);
                if(!zhis.includes('寅') || !zhis.includes('巳') || !zhis.includes('申')) {
                    if((z1 === '寅' && z2 === '巳') || (z1 === '巳' && z2 === '寅') || (z1 === '巳' && z2 === '申') || (z1 === '申' && z2 === '巳')) alerts.push(`<span style="color:#ff9800;">• 原局相刑：${p1Name}「${z1}」與 ${p2Name}「${z2}」無恩相刑 (${dist})</span>`);
                }
                if(!zhis.includes('丑') || !zhis.includes('戌') || !zhis.includes('未')) {
                    if((z1 === '丑' && z2 === '戌') || (z1 === '戌' && z2 === '丑') || (z1 === '戌' && z2 === '未') || (z1 === '未' && z2 === '戌')) alerts.push(`<span style="color:#ff9800;">• 原局相刑：${p1Name}「${z1}」與 ${p2Name}「${z2}」恃勢相刑 (${dist})</span>`);
                }
            }
        }
        return [...new Set(alerts)];
    }

    function getExternalChongXingHai(tZhi, pillars, label) {
        let alerts = [];
        let baseZhis = pillars.map(p => p.zhi);
        let allZhis = [...baseZhis, tZhi];
        
        if (allZhis.includes('寅') && allZhis.includes('巳') && allZhis.includes('申')) {
            if (tZhi === '寅' || tZhi === '巳' || tZhi === '申') {
                let needed = ['寅', '巳', '申'].filter(z => z !== tZhi);
                if (baseZhis.includes(needed[0]) && baseZhis.includes(needed[1])) alerts.push(`<span style="color:#ff5252;">• ${label}「${tZhi}」引爆無恩三刑 (寅巳申)！</span>`);
            }
        }
        if (allZhis.includes('丑') && allZhis.includes('戌') && allZhis.includes('未')) {
             if (tZhi === '丑' || tZhi === '戌' || tZhi === '未') {
                let needed = ['丑', '戌', '未'].filter(z => z !== tZhi);
                if (baseZhis.includes(needed[0]) && baseZhis.includes(needed[1])) alerts.push(`<span style="color:#ff5252;">• ${label}「${tZhi}」引爆恃勢三刑 (丑戌未)！</span>`);
            }
        }

        pillars.forEach(p => {
            let z2 = p.zhi;
            if(zhiChongMap[tZhi] === z2) alerts.push(`<span style="color:#ff5252;">• ${label}「${tZhi}」沖 ${p.name}「${z2}」</span>`);
            if(zhiHaiMap[tZhi] === z2) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」害 ${p.name}「${z2}」</span>`);
            if((tZhi === '子' && z2 === '卯') || (tZhi === '卯' && z2 === '子')) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」與 ${p.name}「${z2}」引發無禮之刑</span>`);
            if(tZhi === z2 && ['辰','午','酉','亥'].includes(tZhi)) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」引動 ${p.name}「${z2}」自刑</span>`);
            
            let isSanXingTriggered = false;
            if (['寅','巳','申'].includes(tZhi)) {
                let needed = ['寅', '巳', '申'].filter(z => z !== tZhi);
                if (baseZhis.includes(needed[0]) && baseZhis.includes(needed[1])) isSanXingTriggered = true;
            }
            if (!isSanXingTriggered && ((tZhi === '寅' && z2 === '巳') || (tZhi === '巳' && z2 === '寅') || (tZhi === '巳' && z2 === '申') || (tZhi === '申' && z2 === '巳'))) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」與 ${p.name}「${z2}」發生無恩相刑</span>`);
            
            let isShiShiTriggered = false;
            if (['丑','戌','未'].includes(tZhi)) {
                 let needed = ['丑', '戌', '未'].filter(z => z !== tZhi);
                 if (baseZhis.includes(needed[0]) && baseZhis.includes(needed[1])) isShiShiTriggered = true;
            }
            if (!isShiShiTriggered && ((tZhi === '丑' && z2 === '戌') || (tZhi === '戌' && z2 === '丑') || (tZhi === '戌' && z2 === '未') || (tZhi === '未' && z2 === '戌'))) alerts.push(`<span style="color:#ff9800;">• ${label}「${tZhi}」與 ${p.name}「${z2}」發生恃勢相刑</span>`);
        });
        return [...new Set(alerts)];
    }

    function calculateQuantStrengthScore(baziMap, dayElement) {
        const shengMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
        const helpfulElements = [dayElement];
        for (let k in shengMap) if (shengMap[k] === dayElement) helpfulElements.push(k);
        const isHelpful = (el) => helpfulElements.includes(el);

        let state = [
            { id: 'YG', el: ganElementMap[baziMap.year.gan], score: 0, max: 5 },
            { id: 'YZ', el: zhiElementMap[baziMap.year.zhi], score: 0, max: 20 },
            { id: 'MG', el: ganElementMap[baziMap.month.gan], score: 0, max: 5 },
            { id: 'MZ', el: zhiElementMap[baziMap.month.zhi], score: 0, max: 35 },
            { id: 'DG', el: ganElementMap[baziMap.day.gan], score: 0, max: 0 },
            { id: 'DZ', el: zhiElementMap[baziMap.day.zhi], score: 0, max: 20 },
            { id: 'TG', el: ganElementMap[baziMap.time.gan], score: 0, max: 5 },
            { id: 'TZ', el: zhiElementMap[baziMap.time.zhi], score: 0, max: 10 }
        ];

        const getChar = (idx) => [baziMap.year, baziMap.month, baziMap.day, baziMap.time][idx];

        state.forEach(item => { if (isHelpful(item.el)) item.score = item.max; });
        state[4].score = 0; 

        if (shengMap[state[3].el] === state[2].el && shengMap[state[2].el] === dayElement) state[3].score = state[3].max;
        if (shengMap[state[7].el] === state[6].el && shengMap[state[6].el] === dayElement) state[7].score = state[7].max;
        if (shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[0].score = state[0].max;
        if (shengMap[state[1].el] === state[0].el && shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[1].score = state[1].max;

        // 步驟 6｜四庫整合（依量化系統規則）
        //  「同柱／隔柱」＝本柱天干＋左右相鄰兩柱的天干（不看地支）
        //  基礎判斷：辰＝同柱干為木／水／土時取該五行，否則土；丑＝同柱干為土／金時取該五行，否則土；
        //            未、戌＝火土能量相當，以幫扶日主者視為火或土
        //            基礎五行為加分五行 → 得位置分；否則沿用上一步分數
        //  庫判斷：辰見水→水庫、丑見金→金庫、未見木→木庫、戌見土→土庫；
        //          候選為加分五行 → 接受覆寫（滿分）；為扣分五行 → 不計，回到基礎判斷
        //          辰的同柱干屬土／木／水時，禁止由隔柱觸發的水庫覆寫（維持基礎判斷）
        const KU_TRIGGER = { '辰': '水', '丑': '金', '未': '木', '戌': '土' };
        for(let p = 0; p < 4; p++) {
            const zhiChar = getChar(p).zhi;
            if (!KU_TRIGGER[zhiChar]) continue;
            const zhiState = state[p*2+1];
            const G = state[p*2].el;
            const adjGans = [];
            if (p > 0) adjGans.push(state[(p-1)*2].el);
            if (p < 3) adjGans.push(state[(p+1)*2].el);
            // 基礎判斷
            let base = '土';
            if (zhiChar === '辰') base = ['木', '水', '土'].includes(G) ? G : '土';
            else if (zhiChar === '丑') base = ['土', '金'].includes(G) ? G : '土';
            else base = isHelpful('火') ? '火' : '土';
            zhiState.el = base;
            if (isHelpful(base)) zhiState.score = zhiState.max;
            // 庫判斷
            const T = KU_TRIGGER[zhiChar];
            const seenSame = G === T, seenAdj = adjGans.includes(T);
            if (!seenSame && !seenAdj) continue;
            if (zhiChar === '辰' && !seenSame && ['土', '木', '水'].includes(G)) continue;
            if (isHelpful(T)) { zhiState.el = T; zhiState.score = zhiState.max; }
        }

        const allZhis = [getChar(0).zhi, getChar(1).zhi, getChar(2).zhi, getChar(3).zhi];
        const sanHui = [{r:['寅','卯','辰'], e:'木'}, {r:['巳','午','未'], e:'火'}, {r:['申','酉','戌'], e:'金'}, {r:['亥','子','丑'], e:'水'}];
        sanHui.forEach(hui => {
            if (hui.r.every(c => allZhis.includes(c))) {
                for(let i=0; i<4; i++) {
                    if (hui.r.includes(allZhis[i])) {
                        state[i*2+1].el = hui.e;
                        state[i*2+1].score = isHelpful(hui.e) ? state[i*2+1].max : 0;
                    }
                }
            }
        });

        const sanHe = [{r:['申','子','辰'], e:'水'}, {r:['亥','卯','未'], e:'木'}, {r:['寅','午','戌'], e:'火'}, {r:['巳','酉','丑'], e:'金'}];
        sanHe.forEach(he => {
            let matches = [];
            for(let i=0; i<4; i++) if (he.r.includes(allZhis[i])) matches.push({idx: i, branch: allZhis[i]});
            let uniqueBranches = [...new Set(matches.map(m => m.branch))];
            if (uniqueBranches.length >= 2) {
                if (isHelpful(he.e)) { 
                    matches.forEach(m => {
                        state[m.idx*2+1].el = he.e;
                        state[m.idx*2+1].score = state[m.idx*2+1].max;
                    });
                }
            }
        });

        let total = 0;
        state.forEach(s => total += s.score);
        return total;
    }

            ['三合', ['申','子','辰'], '水'], ['三合', ['亥','卯','未'], '木'], ['三合', ['寅','午','戌'], '火'], ['三合', ['巳','酉','丑'], '金'],

        ];
        const out = [];
        list.forEach(([kind, zs, el]) => {
            if (!zs.includes(dyZhi) || !zs.includes(lnZhi)) return;

    function getTraditionalRoots(targetGan, targetIndex, allZhis, pNames) {
        let roots = [];
        let targetElement = ganElementMap[targetGan]; 
        let maxScore = 0;
        let finalLabel = "虛浮無根";

        allZhis.forEach((zhi, index) => {
            let hideGansObj = zhiHiddenWeights[zhi] || {};
            let sortedGans = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
            let foundIndex = sortedGans.findIndex(hg => ganElementMap[hg] === targetElement);
            
            if (foundIndex !== -1) {
                let rootType = foundIndex === 0 ? "本氣" : (foundIndex === 1 ? "中氣" : "餘氣");
                roots.push({ pillarName: pNames[index], zhi: zhi, type: rootType });
                let score = 0;
                let distance = Math.abs(targetIndex - index);
                
                if (index === 1 && foundIndex === 0) score = 10;
                else if (distance === 0 && foundIndex === 0) score = 8;
                else if ((distance === 0 && foundIndex === 1) || (distance === 1 && foundIndex === 0)) score = 5;
                else if (distance > 1 && foundIndex === 0) score = 4;
                else score = 2;

                if (score > maxScore) maxScore = score;
            }
        });

        if (maxScore >= 10) finalLabel = "月令強根";
        else if (maxScore >= 8) finalLabel = "自坐強根";
        else if (maxScore >= 4) finalLabel = "有根";
        else if (maxScore > 0) finalLabel = "弱根";

        return { roots: roots, label: finalLabel, score: maxScore };
    }

    // ===== 汽車儀表風半圓儀表（體力：通根／天干比印／調候） =====
    const PG = { cx: 100, cy: 100, R: 78 };
    function pgPt(t, r) { const th = Math.PI * (1 - t); return [PG.cx + r * Math.cos(th), PG.cy - r * Math.sin(th)]; }
    function pgArc(t0, t1, r) {
        if (t1 < t0) [t0, t1] = [t1, t0];
        if (t1 - t0 < 0.0005) return '';
        const [x0, y0] = pgPt(t0, r), [x1, y1] = pgPt(t1, r);
        return `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
    }
    function pgZoneColor(cfg, v) {
        const zs = cfg.zones;
        if (v <= zs[0].from) return zs[0].color;
        const z = zs.find(z => v >= z.from && v < z.to) || zs[zs.length - 1];
        return z.color;
    }
    function pgFmt(cfg, v) {
        const n = Math.round(v);
        if (cfg.fmt === 'signed') return (n > 0 ? '+' : '') + n;
        if (cfg.fmt === 'pct') return n + '%';
        return String(n);
    }
    function renderCarGauge(cfg) {
        const { R } = PG, span = cfg.max - cfg.min, T = v => (v - cfg.min) / span;
        let s = `<svg viewBox="0 0 200 132" aria-label="${cfg.title}">`;
        // 錶面
        s += `<path d="M${PG.cx - R - 10},${PG.cy} A${R + 10},${R + 10} 0 0 1 ${PG.cx + R + 10},${PG.cy} Z" fill="url(#pgFace)" stroke="url(#pgBezel)" stroke-width="2"/>`;
        // 分區色帶（暗）＋內側細彩線
        cfg.zones.forEach(z => {
            s += `<path d="${pgArc(T(z.from), T(z.to), R)}" stroke="${z.color}" stroke-opacity="0.16" stroke-width="10" fill="none"/>`;
            s += `<path d="${pgArc(T(z.from), T(z.to), R - 9)}" stroke="${z.color}" stroke-opacity="0.75" stroke-width="1.6" fill="none"/>`;
        });
        // 刻度
        for (let v = cfg.min; v <= cfg.max + 1e-9; v += cfg.minorStep) {
            const major = cfg.majors.some(m => Math.abs(m - v) < 1e-6);
            const [x0, y0] = pgPt(T(v), major ? R - 22 : R - 17), [x1, y1] = pgPt(T(v), R - 12);
            s += `<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}" stroke="${major ? '#ddd' : '#666'}" stroke-width="${major ? 1.8 : 1}" stroke-linecap="round"/>`;
        }
        (cfg.labels || []).forEach(l => {
            const [x, y] = pgPt(T(l.v), R - 32);
            s += `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="${l.size || 9}" font-weight="bold" fill="${l.color || '#888'}">${l.text}</text>`;
        });
        // 門檻標記（三角形）
        if (cfg.marker) {
            const t = T(cfg.marker.v), [tx, ty] = pgPt(t, R + 8), [bx1, by1] = pgPt(t - 0.025, R + 15), [bx2, by2] = pgPt(t + 0.025, R + 15);
            s += `<polygon points="${tx.toFixed(1)},${ty.toFixed(1)} ${bx1.toFixed(1)},${by1.toFixed(1)} ${bx2.toFixed(1)},${by2.toFixed(1)}" fill="${cfg.marker.color}" filter="url(#pgGlow)"/>`;
            const [lx, ly] = pgPt(T(cfg.marker.v), R - 12), [lx2, ly2] = pgPt(T(cfg.marker.v), R + 5);
            s += `<line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}" stroke="${cfg.marker.color}" stroke-width="2"/>`;
        }
        // 動態：亮起的填充弧、指針、數值
        s += `<path class="pg-fill" d="" stroke="${pgZoneColor(cfg, cfg.min)}" stroke-width="10" fill="none" stroke-linecap="butt" filter="url(#pgGlow)"/>`;
        s += `<g class="pg-needle" transform="rotate(-90 ${PG.cx} ${PG.cy})" filter="url(#pgNeedleShadow)">
                <polygon points="${PG.cx - 3.2},${PG.cy + 2} ${PG.cx},${PG.cy - (R - 10)} ${PG.cx + 3.2},${PG.cy + 2} ${PG.cx},${PG.cy + 12}" fill="url(#pgNeedle)"/>
                <line x1="${PG.cx}" y1="${PG.cy - (R - 10)}" x2="${PG.cx}" y2="${PG.cy - (R - 24)}" stroke="#fff" stroke-width="1.2" stroke-opacity="0.9"/>
              </g>`;
        s += `<circle cx="${PG.cx}" cy="${PG.cy}" r="8" fill="url(#pgHub)" stroke="#555" stroke-width="1"/>`;
        s += `<circle cx="${PG.cx}" cy="${PG.cy}" r="2.4" fill="#ff5252"/>`;
        s += `<text class="pg-val" x="${PG.cx}" y="${PG.cy + 28}" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff" style="font-family: 'SF Mono', Menlo, Consolas, monospace;">${pgFmt(cfg, cfg.min)}</text>`;
        s += `</svg>`;
        const data = encodeURIComponent(JSON.stringify(cfg));
        return `<div class="pg-gauge" data-cfg="${data}">
                    ${s}
                    <div class="pg-title">${cfg.title}</div>
                    <div class="pg-status" style="color:${cfg.statusColor};">${cfg.status}</div>
                    <div class="pg-detail">${cfg.detail || ''}</div>
                </div>`;
    }
    // 共用 SVG 定義（漸層、光暈）只放一次
    function renderCarGaugeDefs() {
        return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
            <radialGradient id="pgFace" cx="50%" cy="100%" r="100%"><stop offset="0%" stop-color="#1d2733"/><stop offset="70%" stop-color="#11161c"/><stop offset="100%" stop-color="#0a0c0f"/></radialGradient>
            <linearGradient id="pgBezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5a6470"/><stop offset="50%" stop-color="#22272d"/><stop offset="100%" stop-color="#4a525c"/></linearGradient>
            <linearGradient id="pgNeedle" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff7b7b"/><stop offset="60%" stop-color="#ff3b3b"/><stop offset="100%" stop-color="#8a1c1c"/></linearGradient>
            <radialGradient id="pgHub" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#777"/><stop offset="100%" stop-color="#111"/></radialGradient>
            <filter id="pgGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="pgNeedleShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#ff3b3b" flood-opacity="0.7"/></filter>
        </defs></svg>`;
    }
    function pgSetFrame(el, cfg, v) {
        const t = Math.max(0, Math.min(1, (v - cfg.min) / (cfg.max - cfg.min)));
        const tO = ((cfg.origin ?? cfg.min) - cfg.min) / (cfg.max - cfg.min);
        el.querySelector('.pg-needle').setAttribute('transform', `rotate(${(-90 + t * 180).toFixed(2)} ${PG.cx} ${PG.cy})`);
        const fill = el.querySelector('.pg-fill');
        fill.setAttribute('d', pgArc(tO, t, PG.R));
        fill.setAttribute('stroke', pgZoneColor(cfg, Math.max(cfg.min, Math.min(cfg.max, v))));
        el.querySelector('.pg-val').textContent = pgFmt(cfg, Math.max(cfg.min, Math.min(cfg.max, v)));
    }
    // 點火自檢：指針掃到底 → 回彈落到實際值；燈號閃爍亮起
    function animateCarGauges(root) {
        if (!root) return;
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const lamp = root.querySelector('.pg-lamp');
        if (lamp) { lamp.classList.remove('lit'); void lamp.offsetWidth; setTimeout(() => lamp.classList.add('lit'), reduce ? 0 : 250); }
        root.querySelectorAll('.pg-gauge').forEach((el, i) => {
            const cfg = JSON.parse(decodeURIComponent(el.dataset.cfg));
            el.classList.remove('pg-done');
            if (el._pgRaf) cancelAnimationFrame(el._pgRaf);
            if (reduce) { pgSetFrame(el, cfg, cfg.value); el.classList.add('pg-done'); return; }
            const delay = i * 160, upDur = 650, hold = 120, downDur = 1100;
            const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const easeOutElastic = t => t === 1 ? 1 : 1 - Math.pow(2, -9 * t) * Math.cos(t * Math.PI * 2.6);
            pgSetFrame(el, cfg, cfg.min);
            let start = null;
            const step = ts => {
                if (start === null) start = ts;
                const e = ts - start - delay;
                let v;
                if (e < 0) v = cfg.min;
                else if (e < upDur) v = cfg.min + (cfg.max - cfg.min) * easeInOut(e / upDur);
                else if (e < upDur + hold) v = cfg.max;
                else if (e < upDur + hold + downDur) v = cfg.max + (cfg.value - cfg.max) * easeOutElastic((e - upDur - hold) / downDur);
                else { pgSetFrame(el, cfg, cfg.value); el.classList.add('pg-done'); el._pgRaf = null; return; }
                pgSetFrame(el, cfg, v);
                if (e > upDur + hold + downDur * 0.45) el.classList.add('pg-done');
                el._pgRaf = requestAnimationFrame(step);
            };
            el._pgRaf = requestAnimationFrame(step);
        });
    }
    // 定格名稱「解碼」效果：亂碼逐字鎖定成最終格局名
    function scrambleText(el, dur = 750) {
        if (!el) return;
        const final = el.dataset.final || el.textContent;
        const pool = '甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉戌亥格局';
        if (el._scr) cancelAnimationFrame(el._scr);
        let start = null;
        const step = ts => {
            if (start === null) start = ts;
            const p = Math.min(1, (ts - start) / dur);
            const lock = Math.floor(p * final.length);
            el.textContent = [...final].map((ch, i) => i < lock ? ch : pool[Math.floor(Math.random() * pool.length)]).join('');
            if (p < 1) el._scr = requestAnimationFrame(step); else el.textContent = final;
        };
        el._scr = requestAnimationFrame(step);
    }
    // 整個核心能量儀表板的進場動畫（儀表點火、格局燈號、十神星圖）
    function runDashAnims(root) {
        if (!root) return;
        root.classList.remove('anim-pending', 'anim-on');
        void root.offsetWidth;
        root.classList.add('anim-on');
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduce) scrambleText(root.querySelector('.gj-name'));
        if (!reduce) root.querySelectorAll('.wx-val[data-v]').forEach(el => {
            const target = +el.dataset.v, delay = parseFloat(getComputedStyle(el).getPropertyValue('--d')) * 1000 || 0, dur = 800;
            let st = null;
            const tick = ts => {
                if (st === null) st = ts;
                const p = Math.max(0, Math.min(1, (ts - st - delay) / dur));
                el.firstChild.nodeValue = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
                if (p < 1) requestAnimationFrame(tick);
            };
            el.firstChild.nodeValue = '0';
            requestAnimationFrame(tick);
        });
        animateCarGauges(root.querySelector('.pg-cluster'));
    }

    // ===== 組合成格／破格偵測（傳統子平：旺衰以透干、通根、月令判斷；身強弱用儀表板三得） =====
    // gans/zhis：[年,月,日,時]；baseName：定格名稱；isStrong：儀表板「得令/得地/得勢 三得其二」

            官: ['正官'], 殺: ['七殺'], 官殺: ['正官', '七殺'], 財: ['正財', '偏財'], 印: ['正印', '偏印'],

        };

            return { i, g: gans[i], tg: TG(gans[i]), rooted: sc >= 4 };

                    if (!SETS[k].includes(TG(hg))) return;
                    p += k2 === 0 ? (zi === 1 ? 2 : 1) : 0.3;
                });
            });
            return p;
        };
        const desc = k => tou(k).map(s => `${pN[s.i]}干${s.g}${s.tg}${s.rooted ? '·有根' : '·無根'}`).join('、');
        const adjacent = (k1, k2) => tou(k1).some(a => tou(k2).some(b => Math.abs(a.i - b.i) === 1));
        const out = [];
        const add = (name, type, cond, why) => { if (!out.some(o => o.name === name)) out.push({ name, type, cond, why }); };
        const STRONG = 2.5;
        const bodyTxt = isStrong ? '身強' : '身弱';

        switch (baseName) {
            case '正官格': {
                const cai = touRoot('財'), yin = touRoot('印');
                if (cai && yin) add('官印雙全', '成', '財、印皆透干有根，官居其中', `${desc('財')}；${desc('印')}`);
                else {
                    if (cai) add('財官相生', '成', '財星透干有根，生官', desc('財'));

                }

            case '正財格': case '偏財格': {
                if (power('財') >= STRONG && touRoot('官')) add('財旺生官', '成', '財旺，正官透干有根', `財力 ${power('財').toFixed(1)}；${desc('官')}`);

                if (!isStrong && power('財') >= STRONG && tou('印').length && !adjacent('財', '印'))
                    add('財格佩印', '成', '身弱財重，印星透干，且財印不相礙', `${bodyTxt}；財力 ${power('財').toFixed(1)}；${desc('印')}`);
                if (touRoot('比劫') && power('比劫') > power('財')) add('比劫奪財', '破', '比劫透干有根，財星輕', `${desc('比劫')}；比劫 ${power('比劫').toFixed(1)} ＞ 財 ${power('財').toFixed(1)}`);
                if (tou('殺').length && !tou('食').length && !tou('印').length) add('財黨七殺', '破', '財生七殺，殺重無制', `${desc('殺')}；無食神制、無印化`);

                if (touRoot('官')) add('官印相生', '成', '正官透干有根，生印', desc('官'));
                if (touRoot('殺')) add('殺印相生', '成', '七殺透干有根，生印', desc('殺'));
                if (isStrong && power('印') >= STRONG && touRoot('食傷')) add('印格洩秀', '成', '印旺身強，用食傷洩秀', `${bodyTxt}；${desc('食傷')}`);
                if (isStrong && power('印') >= 3.5 && power('印') > power('財') && touRoot('財')) add('棄印就財', '成', '印太重，用財抑印', `${bodyTxt}；印 ${power('印').toFixed(1)} ＞ 財 ${power('財').toFixed(1)}；${desc('財')}`);
                if (tou('財').length && power('財') > power('印')) add('貪財壞印', '破', '印輕，財星透干剋印', `${desc('財')}；財 ${power('財').toFixed(1)} ＞ 印 ${power('印').toFixed(1)}`);

                if (isStrong && power('殺') >= STRONG) add('身殺兩停', '成', '日主與七殺力量相當', `${bodyTxt}；殺力 ${power('殺').toFixed(1)}`);

                if (tou('殺').length) add('傷官駕殺', '成', '七殺透干，傷官制殺', desc('殺'));
                if (tou('官').length) add('傷官見官', '破', '正官透干，被傷官剋', desc('官'));

            case '建祿格': case '月劫格': {

                if (tou('財').length) add('祿劫用財', '成', '財星透干，最好有食傷通關', desc('財') + (tou('食傷').length ? '；有食傷通關' : '；無食傷通關'));
                if (tou('殺').length && tou('食傷').length) add('祿劫用殺', '成', '七殺透干而且有制', `${desc('殺')}；${desc('食傷')}`);
                if (touRoot('食傷')) add('祿劫洩秀', '成', '食傷透干有根', desc('食傷'));

            case '羊刃格': {

                const CHONG = { '子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳' };

        if (tou('官').length && tou('殺').length) add('官殺混雜', '破', '正官、七殺同時透干', `${desc('官')}、${desc('殺')}`);
        if (tou('傷').length && tou('官').length && adjacent('傷', '官')) add('傷官見官', '破', '傷官、正官同時透干，而且相鄰', `${desc('傷')}、${desc('官')}`);
        if (tou('梟').length && tou('食').length && touRoot('梟')) add('梟神奪食', '破', '偏印、食神同時透干，而且偏印有根', `${desc('梟')}、${desc('食')}`);
        if (touRoot('比劫') && tou('財').length && power('財') < 1.5) add('比劫奪財', '破', '比劫透干有根，財星孤弱', `${desc('比劫')}；財力 ${power('財').toFixed(1)}`);
        if (tou('財').length && tou('印').length && !touRoot('印')) add('貪財壞印', '破', '財星透干剋印，印星無根', `${desc('財')}、${desc('印')}`);
        // ---- 通關（傳統子平）：A 剋 B 的破格，若有「A 生 X、X 生 B」的通關神，剋轉為生 ----
        //  透干有根 → 化解；透干無根或地支本氣 → 減輕；只在中餘氣或沒有 → 不算
        //  通關神本身被剋（例如食傷遭梟神奪食）→ 通關失效
        const TONGGUAN = { '比劫奪財': ['食傷', '梟神奪食'], '傷官見官': ['財', '比劫奪財'], '梟神奪食': ['比劫', null], '貪財壞印': ['官殺', '傷官見官'] };
        const hitBefore = out.map(o => o.name);
        const mainOf = k => zhis.map((z, zi) => ({ z, zi, hw: zhiHiddenWeights[z] || {} }))
            .filter(o => { const m = Object.keys(o.hw).sort((x, y) => o.hw[y] - o.hw[x])[0]; return m && SETS[k].includes(TG(m)); });
        // 先算各破格的通關等級，再檢查通關神是否受剋（剋它的破格若已被化解，則不算受剋）
        const lvOf = {};
        out.forEach(o => {
            const tg = o.type === '破' && TONGGUAN[o.name]; if (!tg) return;

        });
        out.forEach(o => {
            const tg = o.type === '破' && TONGGUAN[o.name]; if (!tg || !lvOf[o.name]) return;
            const [k, killer] = tg, lv = lvOf[o.name];
            const src = tou(k).length ? desc(k) : mainOf(k).map(m => `${pN[m.zi]}支${m.z}本氣`).join('、');
            if (killer && hitBefore.includes(killer) && lvOf[killer] !== 'jie') { o.why += `；${k}通關失效（${killer}，${k}自身受剋）`; return; }
            o.mit = lv;
            o.why += `；${k}通關：${src} → ${lv === 'jie' ? '已化解' : '減輕'}`;
            // 通關神所在位置（供歲運檢查「通關受衝擊」）
            o.guard = { k, pos: tou(k).length
                ? tou(k).map(st => ({ i: st.i, row: 'gan', ch: st.g, el: ganElementMap[st.g] }))
                : mainOf(k).map(m => { const hw = m.hw; const mg = Object.keys(hw).sort((x, y) => hw[y] - hw[x])[0]; return { i: m.zi, row: 'zhi', ch: m.z, el: ganElementMap[mg] }; }) };
        });
        return out;
    }

    // ===== 通關受衝擊：歲運（大運／流年／流月／流日）打到通關神，已化解的破格重新發作 =====
    //  通關神在天干：歲運天干剋它、與它五合合絆、或沖它的坐支
    //  通關神在地支本氣：歲運地支沖它、或與它六合合絆
    //  有多個通關神時，全部都被打到才算發作
    function tgGuardHits(gan, zhi, natZhis) {
        const G = window.__tgGuards || [], out = [];
        G.forEach(c => {
            const why = c.guard.pos.map(p => {
                const pn = ['年', '月', '日', '時'][p.i];
                if (p.row === 'gan') {
                    if (gan && ganElementMap[gan] && wuxingRel[ganElementMap[gan]].ke === p.el) return `${gan}剋${pn}干${p.ch}`;
                    if (gan && ganHeMap[gan] === p.ch) return `${gan}合絆${pn}干${p.ch}`;
                    if (zhi && zhiChongMap[zhi] === natZhis[p.i]) return `${zhi}沖${pn}支${natZhis[p.i]}（${p.ch}坐支）`;
                } else {
                    if (zhi && zhiChongMap[zhi] === p.ch) return `${zhi}沖${pn}支${p.ch}`;
                    if (zhi && zhiHeMap[zhi] === p.ch) return `${zhi}合絆${pn}支${p.ch}`;
                }
                return null;
            });
            if (why.length && why.every(Boolean)) out.push({ name: c.name, k: c.guard.k, mit: c.mit, txt: `${why.join('、')} → ${c.guard.k}通關受衝擊，${c.name}發作` });
        });
        return out;
    }
    function tgGuardHtml(gan, zhi, natZhis, label) {
        return tgGuardHits(gan, zhi, natZhis).map(h => `<div class="tg-hit"><span class="tg-hit-tag">⚠ ${h.name}</span><span>${label ? label + '：' : ''}${h.txt}</span></div>`).join('');
