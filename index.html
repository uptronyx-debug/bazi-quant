<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字五行(量化版)</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d2ff;
            --border: #333;
            --good-color: #2e7d32;
            --bad-color: #555555;
            --card-bg: rgba(20, 20, 20, 0.6);

            /* ===== 命理語意色彩 Design Tokens =====
               全站沖/合/刑/庫/引動等關係一律引用這組變數，未來要調色只需改這裡。 */
            --color-chong: #ff5252;    /* 沖 */
            --color-hai: #ff9800;      /* 害 */
            --color-xing: #9b59b6;     /* 刑（含自刑／三刑） */
            --color-liuhe: #00d2ff;    /* 六合（天干／地支） */
            --color-sanhe: #8e44ad;    /* 三合局 */
            --color-banhe: #9b59b6;    /* 半合局 */
            --color-sanhui: #d35400;   /* 三會局 */
            --color-ku: #ff9800;       /* 墓庫／開庫引動 */
            --color-origin: #00d2ff;   /* 原局引動／通根透干 */
            --color-dayun: #f39c12;    /* 大運引動 */
            --color-liunian: #2ed573;  /* 流年引動 */
            --color-neutral: #888;     /* 無明顯反應／外來 */
            --score-good: #2ed573;     /* 量化評分：強／佳 */
            --score-warn: #ff9800;     /* 量化評分：普通 */
            --score-bad: #ff5252;      /* 量化評分：弱／差 */
            --color-liuri-overall: #00d2ff;  /* 流日圖表：整體運勢 */
            --color-liuri-wealth: #ffb347;   /* 流日圖表：財運 */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border);
        }
        h2 { color: var(--accent); text-align: center; margin-top: 0; }
        
        .form-group {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;
        }
        input, select, button {
            width: 100%; padding: 12px; box-sizing: border-box;
            background-color: #2a2a2a; border: 1px solid var(--border);
            color: white; border-radius: 6px; font-size: 16px;
        }
        button {
            background-color: var(--accent); color: #000; font-weight: bold; cursor: pointer;
            grid-column: span 2; transition: 0.3s;
        }
        button:hover { background-color: #0099cc; }
        
        .result-box {
            margin-top: 25px; padding: 20px; background-color: #232323;
            border-left: 4px solid var(--accent); border-radius: 4px; display: none;
        }

        .input-mode-toggle { text-align: center; margin-bottom: 20px; font-size: 15px; }
        .input-mode-toggle label { cursor: pointer; margin: 0 10px; color: #aaa; transition: 0.2s; }
        .input-mode-toggle label:hover, .input-mode-toggle input:checked + span { color: var(--accent); font-weight: bold; }
        
        .bazi-table-wrapper { background: #1a1a1a; border-radius: 6px; padding: 15px 5px; margin-bottom: 20px; overflow-x: auto; }
        .bazi-table { width: 100%; border-collapse: collapse; text-align: center; white-space: nowrap; }
        .bazi-table td { padding: 6px 4px; vertical-align: middle; }
        .bazi-table .bt-header { color: #aaa; font-size: 13px; font-weight: bold; padding-bottom: 8px; }
        .bazi-table .bt-shishen { font-size: 12px; font-weight: bold; }
        .bazi-table .bt-ganzhi { font-size: 22px; font-weight: bold; }
        .bazi-table .bt-hidden-bg { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 5px 0; margin-top: 2px; height: 100%; min-width: 45px; }
        .bazi-table .bt-hidden-item { display: flex; justify-content: center; gap: 4px; margin-bottom: 2px; }

        /* --- 核心能量儀表板專用樣式 --- */
        .dashboard-container {
            background: linear-gradient(145deg, #181818, #222);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .dashboard-header {
            text-align: center; font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .dashboard-header::before, .dashboard-header::after {
            content: ''; height: 1px; flex-grow: 1; background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .dash-grid-top {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px;
        }
        .dash-grid-bottom {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .dash-card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            position: relative; overflow: hidden;
        }
        .dash-card-title {
            font-size: 12px; color: #999; margin-bottom: 12px; font-weight: bold;
            width: 100%; border-bottom: 1px dashed #444; padding-bottom: 6px;
            letter-spacing: 0.5px; text-transform: none;
        }
        .dash-footnote {
            font-size: 11px; color: #777; line-height: 1.7; margin-top: 4px;
            padding: 8px 10px; border-top: 1px dashed #333;
        }
        .dash-score-badge {
            position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.1); 
            font-size: 10px; padding: 2px 6px; border-radius: 4px; color: #ddd;
        }
        @media (max-width: 500px) {
            .dash-grid-top, .dash-grid-bottom { grid-template-columns: 1fr; }
        }
        
        .dayun-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
        .dayun-item { background: #2a2a2a; padding: 10px 5px; border-radius: 6px; border: 1px solid #444; }
        .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; position: relative; }
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #1a1a1a; }
        .table-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .liunian-table { width: 100%; border-collapse: collapse; margin-bottom: 0; background: #1a1a1a; font-size: 14px; }
        .liunian-table th, .liunian-table td { padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        .liunian-table th { background: #2a2a2a; color: var(--accent); font-weight: normal; position: sticky; top: 0; z-index: 2; border-bottom: 2px solid #555; }
        
        .score-box { background: rgba(0, 210, 255, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; border: 1px dashed var(--accent); }
        
        .ai-btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .ai-btn-group button { padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0; }
        
        #copyPromptBtn { background: #333; color: var(--accent); border: 1px solid var(--accent); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        #copyPromptBtn:hover { background: #444; transform: translateY(-2px); }

        /* 新增：得令得地得勢 區塊樣式 */
        .dash-status-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 4px;
            font-size: 11px;
            align-items: center;
        }
        .dash-status-label {
            color: #aaa;
        }
        .dash-status-value {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .status-on { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; }
        .status-off { background: rgba(255, 82, 82, 0.15); color: #ff5252; border: 1px solid #ff5252; }
        .status-partial { background: rgba(255, 152, 0, 0.15); color: #ff9800; border: 1px solid #ff9800; }

        /* ===== 手風琴收合區塊 ===== */
        details.acc-section {
            background: linear-gradient(145deg, #181818, #222);
            border: 1px solid #444;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        details.acc-section summary.acc-summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            font-weight: bold;
            color: #fff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        details.acc-section summary.acc-summary::-webkit-details-marker,
        details.acc-section summary.acc-summary::marker { display: none; content: ''; }
        details.acc-section summary.acc-summary:hover { background: rgba(255,255,255,0.04); }
        details.acc-section .acc-chevron { color: #00d2ff; transition: transform 0.2s; font-size: 12px; flex-shrink: 0; margin-left: 10px; }
        details.acc-section[open] .acc-chevron { transform: rotate(180deg); }
        details.acc-section .acc-body { padding: 0 14px 16px 14px; border-top: 1px solid #333; padding-top: 14px; }
        @media (max-width: 500px) {
            details.acc-section summary.acc-summary { font-size: 14px; padding: 12px 14px; }
        }

        /* ===== 流日面板：單一長條圖，一行顯示10天趨勢 ===== */
        .liuri-legend { display: flex; gap: 16px; font-size: 11px; color: #ccc; margin-bottom: 8px; }
        .liuri-legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
        .liuri-chart-wrap { width: 100%; overflow: visible; }
        .liuri-today-callout { font-size: 12px; color: #ccc; margin-top: 10px; padding: 8px 10px; background: rgba(0,210,255,0.06); border: 1px solid rgba(0,210,255,0.25); border-radius: 6px; }

        /* ===== 近月動態流月掃描：真表格對齊（badge 欄自動依內容最寬對齊，不再跑版） ===== */
        table.lm-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        table.lm-table tr.lm-month-row td {
            color: var(--accent); font-weight: bold; font-size: 11px;
            padding: 10px 0 3px 0; border-top: 1px solid #2a2a2a;
        }
        table.lm-table tr.lm-month-row:first-child td { border-top: none; padding-top: 0; }
        table.lm-table td.lm-badge-cell { white-space: nowrap; vertical-align: top; padding: 2px 10px 8px 0; width: 1%; }
        table.lm-table td.lm-desc-cell { color: #ddd; font-size: 13px; vertical-align: top; padding: 2px 0 8px 0; }
        @media (max-width: 420px) {
            table.lm-table td.lm-badge-cell { white-space: normal; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>八字五行(量化版)</h2>
    <div class="input-mode-toggle">
        <label><input type="radio" name="inputMode" value="date" checked onchange="toggleInputMode()"> <span>依出生日期</span></label>
        <label><input type="radio" name="inputMode" value="bazi" onchange="toggleInputMode()"> <span>手動輸入八字</span></label>
    </div>

    <!-- 出生日期輸入介面 -->
    <div class="form-group" id="dateInputGroup" style="display: flex !important; flex-direction: column; gap: 15px; margin-bottom: 20px;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 14px;">年</span>
                <input type="number" id="year" style="padding-left: 36px; padding-right: 8px;">
            </div>
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 14px;">月</span>
                <input type="number" id="month" style="padding-left: 36px; padding-right: 8px;">
            </div>
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 14px;">日</span>
                <input type="number" id="day" style="padding-left: 36px; padding-right: 8px;">
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 14px;">時</span>
                <input type="number" id="hour" style="padding-left: 36px; padding-right: 8px;">
            </div>
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 14px;">分</span>
                <input type="number" id="minute" style="padding-left: 36px; padding-right: 8px;">
            </div>
        </div>
        <div style="background-color: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px;">
            <label style="display: flex; align-items: center; cursor: pointer; color: #fff; font-size: 15px;">
                <input type="checkbox" id="useSplitZi" style="width: 18px; height: 18px; margin-right: 8px;">
                <span style="flex:1;">區分早晚子時 <span style="font-size:12px; color:#aaa;">(23:00~00:00 日柱算當日)</span></span>
            </label>
            <div style="height: 1px; background: #3c3c3c;"></div>
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
                <label style="display: flex; align-items: center; cursor: pointer; color: #fff; font-size: 15px; min-width: 120px;">
                    <input type="checkbox" id="useTrueSolar" style="width: 18px; height: 18px; margin-right: 8px;" onchange="toggleTrueSolar()">
                    啟用真太陽時
                </label>
                <div id="solarTimeSettings" style="display: none; flex: 1; align-items: center; gap: 8px; min-width: 150px;">
                    <span style="color: #aaa; font-size: 13px; white-space: nowrap;">經度:</span>
                    <input type="number" id="longitude" value="121.5" step="0.1" style="padding: 8px; font-size: 14px; flex: 1; min-width: 60px;">
                    <span style="font-size: 12px; color: #888; white-space: nowrap;">(台灣 121.5)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 手動八字輸入介面 -->
    <div class="form-group" id="baziInputGroup" style="display: none; flex-direction: column; gap: 15px; margin-bottom: 20px;">
        <div style="background-color: #2a2a2a; padding: 15px; border-radius: 6px; border: 1px solid var(--border);">
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">年柱</span>
                <select id="yg" style="padding: 10px; font-size:15px;"></select>
                <select id="yz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">月柱</span>
                <select id="mg" style="padding: 10px; font-size:15px;"></select>
                <select id="mz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">日柱</span>
                <select id="dg" style="padding: 10px; font-size:15px;"></select>
                <select id="dz" style="padding: 10px; font-size:15px;"></select>
            </div>
            <div style="display: grid; grid-template-columns: 40px 1fr 1fr; gap: 10px; align-items: center;">
                <span style="color:#aaa; font-size:14px; font-weight:bold; text-align:center;">時柱</span>
                <select id="tg" style="padding: 10px; font-size:15px;"></select>
                <select id="tz" style="padding: 10px; font-size:15px;"></select>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 13px;">西元年</span>
                <input type="number" id="baziYear" title="出生年份，用來推算流年" style="padding-left: 60px; padding-right: 8px;">
            </div>
            <div style="position: relative;">
                <span style="position: absolute; left: 12px; top: 13px; color: #888; font-size: 13px;">起運歲</span>
                <input type="number" id="baziStartAge" value="1" title="大運幾歲開始交運 (虛歲)" style="padding-left: 60px; padding-right: 8px;">
            </div>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 0;">
        <select id="gender" style="grid-column: span 2;">
            <option value="1">男性</option>
            <option value="0">女性</option>
        </select>
    </div>
    <div class="form-group" style="grid-template-columns: 1fr; margin-top: 15px;">
        <button onclick="calculateBazi()">執行運算</button>
    </div>

    <div class="result-box" id="resultBox">
        <!-- 1. 排盤基本資料 (常駐顯示，不收合) -->
        <div id="baziGrid"></div>
        
        <!-- 2. 核心能量儀表板 (預設展開) -->
        <div id="energyDashboardOutput"></div>

        <!-- 3. 流日速覽 (新增，預設展開) -->
        <div id="liuriOutput"></div>

        <!-- 4. 原局結構拆解 (天地通透) -->
        <details class="acc-section">
            <summary class="acc-summary">☯️ 天地通透（藏干通根與透干）<span class="acc-chevron">▾</span></summary>
            <div class="acc-body">
                <div id="tonggenOutput"></div> 
                <div style="height: 1px; background: linear-gradient(90deg, transparent, #444, transparent); margin: 20px 0;"></div>
                <div id="touganOutput"></div> 
            </div>
        </details>
        
        <div id="hebanOutput"></div>
        <div id="chongxingOutput"></div>
        <div id="sikuOutput"></div>
        
        <!-- 5. 歲運交感與引動 (動態時間軸) -->
        <div id="dayunLiunianOutput"></div>
        <div id="dynamicTonggenTouganOutput"></div>
        
        <!-- 6. 落地戰術指南 -->
        <div id="monthlyTacticsOutput"></div>
        
        <!-- 7. AI 深度總結（永遠常駐顯示，不放進手風琴） -->
        <div class="ai-btn-group" id="aiBtnContainer" style="display:none;">
            <button id="copyPromptBtn" style="flex:1;" onclick="copyPromptForAI()">📋 一鍵複製提示詞，貼給 AI 解盤</button>
        </div>
    </div>
    
</div>

<script>
    window.currentBaziDataForAI = null;

    window.onload = function() {
        if (typeof Solar === 'undefined') {
            document.querySelector('.container').innerHTML =
                '<h2 style="color:#ff5252;">⚠️ 排盤引擎載入失敗</h2>' +
                '<p style="color:#ccc; line-height:1.7;">無法載入 lunar-javascript 這個排盤核心套件（通常是 CDN 連線被擋、公司/學校網路防火牆，或暫時斷線）。<br>' +
                '請確認網路連線正常後重新整理頁面；若在企業網路環境仍失敗，建議改用手機網路或連上其他 Wi-Fi 測試。</p>';
            return;
        }
        const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
        const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const ganSelects = ['yg', 'mg', 'dg', 'tg'];
        const zhiSelects = ['yz', 'mz', 'dz', 'tz'];
        
        ganSelects.forEach(id => {
            const el = document.getElementById(id);
            stems.forEach(g => { el.appendChild(new Option(g, g)); });
        });

        zhiSelects.forEach(id => {
            const el = document.getElementById(id);
            branches.forEach(z => { el.appendChild(new Option(z, z)); });
        });

        const now = new Date();
        document.getElementById('year').value = now.getFullYear();
        document.getElementById('month').value = now.getMonth() + 1;
        document.getElementById('day').value = now.getDate();
        document.getElementById('hour').value = now.getHours();
        document.getElementById('minute').value = now.getMinutes();
        document.getElementById('baziYear').value = now.getFullYear();

        try {
            const solarNow = Solar.fromYmdHms(now.getFullYear(), now.getMonth() + 1, now.getDate(), now.getHours(), now.getMinutes(), 0);
            const baziNow = solarNow.getLunar().getEightChar();
            
            document.getElementById('yg').value = baziNow.getYearGan();
            document.getElementById('yz').value = baziNow.getYearZhi();
            document.getElementById('mg').value = baziNow.getMonthGan();
            document.getElementById('mz').value = baziNow.getMonthZhi();
            document.getElementById('dg').value = baziNow.getDayGan();
            document.getElementById('dz').value = baziNow.getDayZhi();
            document.getElementById('tg').value = baziNow.getTimeGan();
            document.getElementById('tz').value = baziNow.getTimeZhi();
        } catch (e) {
            document.getElementById('yg').value = '己'; document.getElementById('yz').value = '巳';
            document.getElementById('mg').value = '己'; document.getElementById('mz').value = '巳';
            document.getElementById('dg').value = '丁'; document.getElementById('dz').value = '丑';
            document.getElementById('tg').value = '乙'; document.getElementById('tz').value = '巳';
        }
    };

    function toggleTrueSolar() {
        const isChecked = document.getElementById('useTrueSolar').checked;
        document.getElementById('solarTimeSettings').style.display = isChecked ? 'flex' : 'none';
    }

    function toggleInputMode() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        if (mode === 'date') {
            document.getElementById('dateInputGroup').style.display = 'flex';

    const renYuanSiLing = {

    // 對應每個月支「起運」的節氣名稱（十二「節」，非十二「中氣」）
    const monthJieName = {

    /**
     * 依據出生的真實節氣交接日，精確計算「本月人元司令神」。
     * birthSolar: lunar-javascript 的 Solar 物件（僅在「依出生日期」模式下可取得）
     * monthZhi: 月支文字，例如 '寅'
     * 若無法取得節氣資料（例如手動輸入八字、無出生日期時），回傳 null，呼叫端應改用簡易月支五行法 fallback。
     */
    function getSiLingGan(birthSolar, monthZhi) {
        try {
            if (!birthSolar || typeof Solar === 'undefined') return null;
            const jieName = monthJieName[monthZhi];
            if (!jieName) return null;

            const y = birthSolar.getYear();
            // 取前一年、當年、後一年三份節氣表，避免跨年邊界（例如子月、丑月）找不到節氣日期
            let candidateDates = [];
            [y - 1, y, y + 1].forEach(yy => {
                const table = Solar.fromYmd(yy, 6, 1).getLunar().getJieQiTable();
                if (table && table[jieName]) candidateDates.push(table[jieName]);
            });
            if (candidateDates.length === 0) return null;

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            const birthKey = toKey(birthSolar);
            // 找「不晚於出生日」且最近的一個節氣日期
            let validDates = candidateDates.filter(s => toKey(s) <= birthKey);
            if (validDates.length === 0) return null;
            validDates.sort((a, b) => toKey(b) - toKey(a));
            const jieDate = validDates[0];

            const daysPassed = birthSolar.getJulianDay() - jieDate.getJulianDay();
            if (daysPassed < 0) return null;

            const segments = renYuanSiLing[monthZhi];
            if (!segments) return null;
            let acc = 0;
            for (let i = 0; i < segments.length; i++) {
                acc += segments[i][1];
                if (daysPassed < acc || i === segments.length - 1) return segments[i][0];
            }
            return segments[segments.length - 1][0];
        } catch (e) {
            console.warn('getSiLingGan 計算失敗，改用簡易月支五行法:', e);
            return null;
        }
    }

    const jieOrderNames = ['立春', '驚蟄', '清明', '立夏', '芒種', '小暑', '立秋', '白露', '寒露', '立冬', '大雪', '小寒'];

    /**
     * 依任意一個取樣日期，回傳該日所屬的節氣月精確區間（起訖節氣名稱＋國曆日期）。
     * 回傳 null 代表節氣資料抓取失敗，呼叫端應 fallback 回國曆年月顯示。
     */
    function getJieQiRange(sampleSolar) {
        try {
            if (!sampleSolar || typeof Solar === 'undefined') return null;
            const y = sampleSolar.getYear();
            let allJie = [];
            [y - 1, y, y + 1].forEach(yy => {
                const table = Solar.fromYmd(yy, 6, 1).getLunar().getJieQiTable();
                jieOrderNames.forEach(name => { if (table && table[name]) allJie.push({ name: name, solar: table[name] }); });
            });
            if (allJie.length === 0) return null;

            const toKey = (s) => s.getYear() * 10000 + s.getMonth() * 100 + s.getDay();
            allJie.sort((a, b) => toKey(a.solar) - toKey(b.solar));
            const sampleKey = toKey(sampleSolar);

            let startIdx = -1;
            for (let i = 0; i < allJie.length; i++) {
                if (toKey(allJie[i].solar) <= sampleKey) startIdx = i; else break;
            }
            if (startIdx === -1 || !allJie[startIdx + 1]) return null;

            const start = allJie[startIdx];
            const end = allJie[startIdx + 1];
            const fmt = (s) => `${s.getYear()}/${s.getMonth()}/${s.getDay()}`;
            return {
                startLabel: `${fmt(start.solar)} ${start.name}`,
                endLabel: `${fmt(end.solar)} ${end.name}`,
                monthZhi: jieNameToZhi[start.name]
            };
        } catch (e) {
            console.warn('getJieQiRange 計算失敗，改用國曆年月顯示:', e);
            return null;
        }
    }

    function calculateXuYulanScore(baziMap, dayElement) {
        const shengMap = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
        const helpfulElements = [dayElement];
        for (let k in shengMap) if (shengMap[k] === dayElement) helpfulElements.push(k);
        const isHelpful = (el) => helpfulElements.includes(el);

        let state = [
            { id: 'YG', el: ganElementMap[baziMap.year.gan], score: 0, max: 5 },
            { id: 'YZ', el: zhiElementMap[baziMap.year.zhi], score: 0, max: 20 },
            { id: 'MG', el: ganElementMap[baziMap.month.gan], score: 0, max: 5 },
            { id: 'MZ', el: zhiElementMap[baziMap.month.zhi], score: 0, max: 35 },
            { id: 'DG', el: ganElementMap[baziMap.day.gan], score: 0, max: 0 },
            { id: 'DZ', el: zhiElementMap[baziMap.day.zhi], score: 0, max: 20 },
            { id: 'TG', el: ganElementMap[baziMap.time.gan], score: 0, max: 5 },
            { id: 'TZ', el: zhiElementMap[baziMap.time.zhi], score: 0, max: 10 }
        ];

        const getChar = (idx) => [baziMap.year, baziMap.month, baziMap.day, baziMap.time][idx];

        state.forEach(item => { if (isHelpful(item.el)) item.score = item.max; });
        state[4].score = 0; 

        if (shengMap[state[3].el] === state[2].el && shengMap[state[2].el] === dayElement) state[3].score = state[3].max;
        if (shengMap[state[7].el] === state[6].el && shengMap[state[6].el] === dayElement) state[7].score = state[7].max;
        if (shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[0].score = state[0].max;
        if (shengMap[state[1].el] === state[0].el && shengMap[state[0].el] === state[2].el && shengMap[state[2].el] === dayElement) state[1].score = state[1].max;

        const hasElementAdjacent = (pillarIdx, targetEl) => {
            if (state[pillarIdx*2].el === targetEl) return true; 
            if (pillarIdx > 0 && (state[(pillarIdx-1)*2].el === targetEl || state[(pillarIdx-1)*2+1].el === targetEl)) return true;
            if (pillarIdx < 3 && (state[(pillarIdx+1)*2].el === targetEl || state[(pillarIdx+1)*2+1].el === targetEl)) return true;
            return false;
        };

        for(let p = 0; p < 4; p++) {
            let zhiChar = getChar(p).zhi;
            if (!['辰', '戌', '丑', '未'].includes(zhiChar)) continue; 
            
            let zhiState = state[p*2+1];
            let ganState = state[p*2];

            if (zhiChar === '辰') {
                if (ganState.el === '木') zhiState.el = '木';
                else if (ganState.el === '水') zhiState.el = '水';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '水')) zhiState.el = '水';
            } else if (zhiChar === '戌') { 
                if (ganState.el === '火') zhiState.el = '火';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '火')) zhiState.el = '火';
            } else if (zhiChar === '丑') {
                if (ganState.el === '金') zhiState.el = '金';
                else if (ganState.el === '水') zhiState.el = '水';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '金')) zhiState.el = '金';
                if (hasElementAdjacent(p, '水')) zhiState.el = '水';
            } else if (zhiChar === '未') {
                if (ganState.el === '火') zhiState.el = '火';
                else if (ganState.el === '木') zhiState.el = '木';
                else zhiState.el = '土';
                if (hasElementAdjacent(p, '火')) zhiState.el = '火';
                if (hasElementAdjacent(p, '木')) zhiState.el = '木';
            }

            zhiState.score = isHelpful(zhiState.el) ? zhiState.max : 0;
        }

        const allZhis = [getChar(0).zhi, getChar(1).zhi, getChar(2).zhi, getChar(3).zhi];
        const sanHui = [{r:['寅','卯','辰'], e:'木'}, {r:['巳','午','未'], e:'火'}, {r:['申','酉','戌'], e:'金'}, {r:['亥','子','丑'], e:'水'}];
        sanHui.forEach(hui => {
            if (hui.r.every(c => allZhis.includes(c))) {
                for(let i=0; i<4; i++) {
                    if (hui.r.includes(allZhis[i])) {
                        state[i*2+1].el = hui.e;
                        state[i*2+1].score = isHelpful(hui.e) ? state[i*2+1].max : 0;
                    }
                }
            }
        });

        const sanHe = [{r:['申','子','辰'], e:'水'}, {r:['亥','卯','未'], e:'木'}, {r:['寅','午','戌'], e:'火'}, {r:['巳','酉','丑'], e:'金'}];
        sanHe.forEach(he => {
            let matches = [];
            for(let i=0; i<4; i++) if (he.r.includes(allZhis[i])) matches.push({idx: i, branch: allZhis[i]});
            let uniqueBranches = [...new Set(matches.map(m => m.branch))];
            if (uniqueBranches.length >= 2) {
                if (isHelpful(he.e)) { 
                    matches.forEach(m => {
                        state[m.idx*2+1].el = he.e;
                        state[m.idx*2+1].score = state[m.idx*2+1].max;
                    });
                }
            }
        });

        let total = 0;
        state.forEach(s => total += s.score);
        return total;
    }

    function getOriginalHeju(zhis) {
        let alerts = [];

    function getTraditionalRoots(targetGan, targetIndex, allZhis, pNames) {
        let roots = [];
        let targetElement = ganElementMap[targetGan]; 
        let maxScore = 0;
        let finalLabel = "虛浮無根";

        allZhis.forEach((zhi, index) => {
            let hideGansObj = zhiHiddenWeights[zhi] || {};
            let sortedGans = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
            let foundIndex = sortedGans.findIndex(hg => ganElementMap[hg] === targetElement);
            
            if (foundIndex !== -1) {
                let rootType = foundIndex === 0 ? "本氣" : (foundIndex === 1 ? "中氣" : "餘氣");
                roots.push({ pillarName: pNames[index], zhi: zhi, type: rootType });
                let score = 0;
                let distance = Math.abs(targetIndex - index);
                
                if (index === 1 && foundIndex === 0) score = 10;
                else if (distance === 0 && foundIndex === 0) score = 8;
                else if ((distance === 0 && foundIndex === 1) || (distance === 1 && foundIndex === 0)) score = 5;
                else if (distance > 1 && foundIndex === 0) score = 4;
                else score = 2;

                if (score > maxScore) maxScore = score;
            }
        });

        if (maxScore >= 10) finalLabel = "月令強根";
        else if (maxScore >= 8) finalLabel = "自坐強根";
        else if (maxScore >= 4) finalLabel = "有根";
        else if (maxScore > 0) finalLabel = "弱根";

        return { roots: roots, label: finalLabel };
    }

    /**
     * 流日「整體運勢」與「財運」量化評分（自訂簡化演算法，僅供快速比較參考，非傳統命理定論）。
     * ganTenGod：日干精確十神（比肩/劫財/食神/傷官/偏財/正財/七殺/正官/偏印/正印）
     * zhiBroadTenGod：日支粗分十神（比劫/食傷/財星/官殺/印星）
     */
    function computeLiuriScore(ganTenGod, zhiBroadTenGod) {
        let overall = 50, wealth = 50;
        const helpfulGan = ['比肩', '劫財', '正印', '偏印'];
        if (helpfulGan.includes(ganTenGod)) overall += 18;
        if (zhiBroadTenGod === '比劫' || zhiBroadTenGod === '印星') overall += 15;
        if (ganTenGod === '食神' || ganTenGod === '傷官') overall += 8;
        if (zhiBroadTenGod === '食傷') overall += 6;
        if (ganTenGod === '正財' || ganTenGod === '偏財') overall += 5;
        if (zhiBroadTenGod === '財星') overall += 4;
        if (ganTenGod === '七殺' || ganTenGod === '正官') overall -= 10;
        if (zhiBroadTenGod === '官殺') overall -= 8;

        // 財運：財星最旺、食傷生財次之；比劫剋財最忌；印星洩食傷、間接耗財源
        if (ganTenGod === '正財' || ganTenGod === '偏財') wealth += 30;
        if (zhiBroadTenGod === '財星') wealth += 22;
        if (ganTenGod === '食神' || ganTenGod === '傷官') wealth += 14;
        if (zhiBroadTenGod === '食傷') wealth += 10;
        if (ganTenGod === '比肩' || ganTenGod === '劫財') wealth -= 22;
        if (zhiBroadTenGod === '比劫') wealth -= 16;
        if (ganTenGod === '正印' || ganTenGod === '偏印') wealth -= 8;
        if (zhiBroadTenGod === '印星') wealth -= 6;

        overall = Math.max(5, Math.min(95, Math.round(overall)));
        wealth = Math.max(5, Math.min(95, Math.round(wealth)));
        return { overall, wealth };
    }
