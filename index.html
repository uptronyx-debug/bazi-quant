    // ===== 十神星圖（儀表風）＋大運疊加 =====
    const SS_SHORT = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
    const ST = { cx: 130, cy: 124, R: 80 };
    function stHex(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
    // 標籤膠囊（SVG）：anchor 'start' 向右長、'end' 向左長
    function stChip(x, y, text, anchor, cls) {
        const w = text.length * 10 + 8, rx = anchor === 'end' ? x - w : x;
        return `<g class="${cls}"><rect x="${rx.toFixed(1)}" y="${(y - 8).toFixed(1)}" width="${w}" height="15" rx="4"/>` +
               `<text x="${(rx + w / 2).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="middle">${text}</text></g>`;
    }
    function renderTenGodStar(ctx) {
        const { dayElement, orderedElements, elementSpecificShiShen, elementPct, strengthLabel, totalScore, daYunData, currentYear } = ctx;
        const { cx, cy, R } = ST;
        const nodes = {};
        orderedElements.forEach((el, i) => {
            const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
            nodes[el] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a, i };
        });
        window.__starCtx = { nodes, dayGan: ctx.dayGan, dayElement, daYunData, currentYear };

        let s = `<svg class="st-svg pe-svg" viewBox="-24 0 308 248">`;
        // 錶面：同心刻度環＋外圈刻度
        s += `<circle cx="${cx}" cy="${cy}" r="${R + 32}" fill="url(#pgFace)" stroke="url(#pgBezel)" stroke-width="1.5"/>`;
        [R * 0.5, R, R + 22].forEach(r => { s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1f2a33" stroke-width="1"/>`; });
        for (let k = 0; k < 60; k++) {
            const a = k * Math.PI / 30, major = k % 6 === 0, r0 = R + 27, r1 = R + (major ? 31 : 29.5);
            s += `<line x1="${(cx + r0 * Math.cos(a)).toFixed(1)}" y1="${(cy + r0 * Math.sin(a)).toFixed(1)}" x2="${(cx + r1 * Math.cos(a)).toFixed(1)}" y2="${(cy + r1 * Math.sin(a)).toFixed(1)}" stroke="${major ? '#4a5560' : '#2a3038'}" stroke-width="1"/>`;
        }
        // 相生（五角形邊）：先畫實線，再疊流動光點虛線（方向＝生的方向）
        const sheng = [['木','火'], ['火','土'], ['土','金'], ['金','水'], ['水','木']];
        const start = ['木','火','土','金','水'].indexOf(dayElement);
        sheng.forEach(([a, b]) => {
            const ord = (['木','火','土','金','水'].indexOf(a) - start + 5) % 5;
            const A = nodes[a], B = nodes[b];
            s += `<line class="pe-anim pe-sheng" style="--d:${(0.15 + ord * 0.14).toFixed(2)}s;" x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="rgba(0,210,255,0.35)" stroke-width="1.4"/>`;
            s += `<line class="pe-anim st-flow" style="--d:1.2s;" x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="#00d2ff" stroke-width="1.6" stroke-linecap="round"/>`;
        });
        // 相剋（星形對角線）
        [['木','土'], ['土','水'], ['水','火'], ['火','金'], ['金','木']].forEach(([a, b], i) => {
            const A = nodes[a], B = nodes[b];
            s += `<line class="pe-anim pe-ke" style="--d:${(0.85 + i * 0.07).toFixed(2)}s;" x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="#ff5252" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>`;
        });
        // 節點：外圈＝該五行佔比環（滿圈 60%），內為錶盤
        const RING = 21, C = 2 * Math.PI * RING;
        orderedElements.forEach(el => {
            const n = nodes[el], col = elementColors[el], isDay = el === dayElement;
            const cat = isDay ? '日主' : getTenGodForElement(el, dayElement);
            const frac = Math.min(1, (elementPct[el] || 0) / 60);
            if (isDay) {
                s += `<circle class="pe-halo" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${RING}" fill="none" stroke="${col}" stroke-width="1.5"/>`;
                s += `<circle class="st-orbit" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${RING + 5}" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2 4"/>`;
            }
            s += `<g class="pe-anim pe-node" style="--d:${(0.05 + n.i * 0.13).toFixed(2)}s;">
                <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${RING}" fill="#0c1015" stroke="#232a32" stroke-width="4"/>
                <circle class="st-ring" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${RING}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${n.x.toFixed(1)} ${n.y.toFixed(1)})" style="filter: drop-shadow(0 0 3px ${col});"/>
                <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="15" fill="url(#pgFace)" stroke="${stHex(col, isDay ? 0.9 : 0.45)}" stroke-width="${isDay ? 1.6 : 1}"/>
                <text x="${n.x.toFixed(1)}" y="${(n.y + 5).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="15" font-weight="bold" style="filter: drop-shadow(0 0 4px ${stHex(col, .6)});">${el}</text>
                <text x="${n.x.toFixed(1)}" y="${(n.y - 28).toFixed(1)}" text-anchor="middle" fill="${isDay ? '#fff' : '#7f95a3'}" font-size="9.5" letter-spacing="1">${cat}</text>
            </g>`;
            // 原局十神：逐一列出（單字方塊，等寬對齊；每欄最多 3 個）
            const ORDER = ['比','劫','食','傷','才','財','殺','官','梟','印'];
            const list = (elementSpecificShiShen[el] || []).map(ss => SS_SHORT[ss] || ss).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
            if (list.length) {
                const right = Math.cos(n.a) >= -0.01;
                const ROWS = 3, cols = Math.ceil(list.length / ROWS), rowsUsed = Math.min(ROWS, list.length);
                const SZ = 16, GAP = 3;
                let g = `<g class="pe-anim pe-ss ${right ? '' : 'pe-ss-l'}" style="--d:${(0.95 + n.i * 0.07).toFixed(2)}s;">`;
                list.forEach((k, j) => {
                    const c = Math.floor(j / ROWS), r = j % ROWS;
                    const x = right ? n.x + 26 + c * (SZ + GAP) : n.x - 26 - SZ - c * (SZ + GAP);
                    const y = n.y - (rowsUsed * SZ + (rowsUsed - 1) * GAP) / 2 + r * (SZ + GAP);
                    g += `<g class="st-chip"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${SZ}" height="${SZ}" rx="3"/><text x="${(x + SZ / 2).toFixed(1)}" y="${(y + 11.8).toFixed(1)}" text-anchor="middle">${k}</text></g>`;
                });
                s += g + `</g>`;
            }
        });
        s += `<g class="st-dy-layer"></g>`;
        s += `</svg>`;

        // 大運捲軸
        let items = '';
        let curIdx = daYunData.findIndex(dy => currentYear >= dy.startYear && currentYear < dy.startYear + 10);
        daYunData.forEach((dy, i) => {
            const past = dy.startYear + 10 <= currentYear, now = i === curIdx;
            const gTg = SS_SHORT[getPreciseTenGod(dy.gan, ctx.dayGan)] || '';
            const zMain = Object.keys(zhiHiddenWeights[dy.zhi] || {}).sort((a, b) => zhiHiddenWeights[dy.zhi][b] - zhiHiddenWeights[dy.zhi][a])[0];
            const zTg = SS_SHORT[getPreciseTenGod(zMain, ctx.dayGan)] || '';
            items += `<div class="st-dy-item ${past ? 'is-past' : ''} ${now ? 'is-now' : ''}" data-i="${i}" onclick="stDyPick(${i}, true)">
                <div class="st-dy-age">${dy.startAge}歲${now ? '<span class="rel-now">現在</span>' : ''}</div>
                <div class="st-dy-gz"><b style="color:${elementColors[ganElementMap[dy.gan]]}">${dy.gan}</b><b style="color:${elementColors[zhiElementMap[dy.zhi]]}">${dy.zhi}</b></div>
                <div class="st-dy-tg">${gTg}・${zTg}</div>
            </div>`;
        });
        window.__starCtx.curIdx = curIdx < 0 ? 0 : curIdx;

        return `
            <div class="st-panel">
                <div class="wx-head">
                    <span>十神</span>
                    <span class="st-head-r">
                        <button class="pe-anim pe-badge st-badge ${window.__strengthOverride ? 'ov' : ''}" style="--d:1.15s;" onclick="stOvOpen()" title="量化判定：${ctx.autoStrengthLabel}・${totalScore}分">${strengthLabel}・${window.__strengthOverride ? '手動' : totalScore + '分'} ▾</button>
                        ${daYunData.length ? `<label class="st-switch"><input type="checkbox" onchange="stToggleDayun(this.checked)"><span class="st-knob"></span>大運</label>` : ''}
                    </span>
                </div>
                <div class="st-ov" id="stOv" hidden>
                    <span class="st-ov-lbl">量化 ${ctx.autoStrengthLabel}・${totalScore}分</span>
                    ${[['', '自動'], ['身強', '身強'], ['身弱', '身弱'], ['從強格', '從強'], ['從弱格', '從弱']].map(([v, n]) => `<button class="st-ov-btn ${(window.__strengthOverride || '') === v ? 'on' : ''}" onclick="stOvSet('${v}')">${n}</button>`).join('')}
                </div>
                <div class="st-body">
                    <div class="st-svg-wrap">${s}</div>
                    <div class="st-dy">
                        <button class="st-dy-btn" onclick="stDyStep(-1)" aria-label="上一步大運">▲</button>
                        <div class="st-dy-list" onscroll="stDyOnScroll()">${items}</div>
                        <button class="st-dy-btn" onclick="stDyStep(1)" aria-label="下一步大運">▼</button>
                    </div>
                </div>
            </div>`;
    }
    // 在星圖上疊加某步大運的十神（琥珀色）
    function stDrawDayun(i) {
        const c = window.__starCtx; if (!c) return;
        const layer = document.querySelector('.st-dy-layer'); if (!layer) return;
        const dy = c.daYunData[i]; if (!dy) { layer.innerHTML = ''; return; }
        c.selIdx = i;
        const per = {}; // 五行 → [{label, strong}]
        const push = (el, label, strong) => { (per[el] = per[el] || []).push({ label, strong }); };
        push(ganElementMap[dy.gan], `運干 ${SS_SHORT[getPreciseTenGod(dy.gan, c.dayGan)]}`, true);
        const hw = zhiHiddenWeights[dy.zhi] || {};
        Object.keys(hw).sort((a, b) => hw[b] - hw[a]).forEach((hg, k) => {
            push(ganElementMap[hg], `${k === 0 ? '運支' : '藏'} ${SS_SHORT[getPreciseTenGod(hg, c.dayGan)]}`, k === 0);
        });
        let h = '';
        Object.keys(per).forEach(el => {
            const n = c.nodes[el]; if (!n) return;
            h += `<circle class="st-dy-ring" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="27" fill="none" stroke="#ffb347" stroke-width="1.6" stroke-dasharray="4 3"/>`;
            // 膠囊放在節點「內側」（朝向圓心），避開外側的原局十神
            const inX = n.x - Math.cos(n.a) * 34, inY = n.y - Math.sin(n.a) * 34 + 3;
            const cosA = Math.cos(n.a);
            per[el].forEach((it, j) => {
                const y = inY + j * 17 * (Math.sin(n.a) > 0.2 ? -1 : 1);
                const w = it.label.length * 10 + 8;
                // 置中（頂點）／節點在左側往右長／節點在右側往左長
                const left = Math.abs(cosA) < 0.2 ? inX - w / 2 : (cosA < 0 ? inX - 12 : inX + 12 - w);
                h += stChip(left, y, it.label, 'start', `st-dychip ${it.strong ? '' : 'weak'}`);
            });
        });
        layer.innerHTML = h;
        document.querySelectorAll('.st-dy-item').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
    }
    function stToggleDayun(on) {
        const panel = document.querySelector('.st-panel'); if (!panel) return;
        panel.classList.toggle('dy-on', on);
        if (on) {
            const c = window.__starCtx;
            requestAnimationFrame(() => stDyPick(c.selIdx ?? c.curIdx, false));
        } else {
            const layer = document.querySelector('.st-dy-layer'); if (layer) layer.innerHTML = '';
        }
    }
    function stDyPick(i, smooth) {
        const list = document.querySelector('.st-dy-list'); if (!list) return;
        const item = list.querySelector(`.st-dy-item[data-i="${i}"]`); if (!item) return;
        list._lock = true;
        list.scrollTo({ top: item.offsetTop - (list.clientHeight - item.offsetHeight) / 2, behavior: smooth ? 'smooth' : 'auto' });
        stDrawDayun(i);
        clearTimeout(list._lockT); list._lockT = setTimeout(() => { list._lock = false; }, smooth ? 450 : 50);
    }
    function stDyStep(d) {
        const c = window.__starCtx; if (!c) return;
        const n = Math.max(0, Math.min(c.daYunData.length - 1, (c.selIdx ?? c.curIdx) + d));
        stDyPick(n, true);
    }
    function stDyOnScroll() {
        const list = document.querySelector('.st-dy-list'); if (!list || list._lock) return;
        clearTimeout(list._t);
        list._t = setTimeout(() => {
            const mid = list.scrollTop + list.clientHeight / 2;
            let best = 0, bd = Infinity;
            list.querySelectorAll('.st-dy-item').forEach(el => {
                const d = Math.abs(el.offsetTop + el.offsetHeight / 2 - mid);
                if (d < bd) { bd = d; best = +el.dataset.i; }
            });
            if (best !== window.__starCtx.selIdx) stDrawDayun(best);
        }, 90);
    }

    // 小卡左右滑動：手機上左滑看下一筆、右滑看上一筆
    function attachSwipe(el, onPrev, onNext) {
        if (!el || el._swipe) return; el._swipe = true;
        let x0 = null, y0 = null;
        el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
        el.addEventListener('touchend', e => {
            if (x0 === null) return;
            const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
            x0 = null;
            if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
            const card = el.firstElementChild;
            if (dx < 0) onNext(); else onPrev();
            const nc = el.firstElementChild;
            if (nc) { nc.classList.remove('swipe-l', 'swipe-r'); void nc.offsetWidth; nc.classList.add(dx < 0 ? 'swipe-l' : 'swipe-r'); }
        }, { passive: true });
    }

    function initDashAnims(root) {
        if (!root) return;
        const details = root.closest('details');
        if (details && !details._pgBound) {
            details._pgBound = true;
            details.addEventListener('toggle', () => { if (details.open) runDashAnims(details.querySelector('.dash-anim')); });
        }
        if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver(entries => {
                entries.forEach(en => { if (en.isIntersecting) { runDashAnims(root); io.disconnect(); } });
            }, { threshold: 0.1 });
            io.observe(root);
        } else runDashAnims(root);
    }
    
    const getTenGodForElement = (targetEl, dayEl) => {
        if (!wuxingRel[targetEl] || !wuxingRel[dayEl]) return '';
        if (targetEl === dayEl) return '比劫';
        if (wuxingRel[dayEl].sheng === targetEl) return '食傷';
        if (wuxingRel[dayEl].ke === targetEl) return '財星';
        if (wuxingRel[targetEl].ke === dayEl) return '官殺';
        if (wuxingRel[targetEl].sheng === dayEl) return '印星';
        return '';
    };

    /**
     * 流日「整體運勢」與「財運」量化評分（自訂簡化演算法，僅供快速比較參考，非傳統命理定論）。
     * ganTenGod：日干精確十神（比肩/劫財/食神/傷官/偏財/正財/七殺/正官/偏印/正印）
     * zhiBroadTenGod：日支粗分十神（比劫/食傷/財星/官殺/印星）
     */
    function computeLiuriScore(ganTenGod, zhiBroadTenGod) {
        let overall = 50, wealth = 50;
        const helpfulGan = ['比肩', '劫財', '正印', '偏印'];
        if (helpfulGan.includes(ganTenGod)) overall += 18;
        if (zhiBroadTenGod === '比劫' || zhiBroadTenGod === '印星') overall += 15;
        if (ganTenGod === '食神' || ganTenGod === '傷官') overall += 8;
        if (zhiBroadTenGod === '食傷') overall += 6;
        if (ganTenGod === '正財' || ganTenGod === '偏財') overall += 5;
        if (zhiBroadTenGod === '財星') overall += 4;
        if (ganTenGod === '七殺' || ganTenGod === '正官') overall -= 10;
        if (zhiBroadTenGod === '官殺') overall -= 8;

        // 財運：財星最旺、食傷生財次之；比劫剋財最忌；印星洩食傷、間接耗財源
        if (ganTenGod === '正財' || ganTenGod === '偏財') wealth += 30;
        if (zhiBroadTenGod === '財星') wealth += 22;
        if (ganTenGod === '食神' || ganTenGod === '傷官') wealth += 14;
        if (zhiBroadTenGod === '食傷') wealth += 10;
        if (ganTenGod === '比肩' || ganTenGod === '劫財') wealth -= 22;
        if (zhiBroadTenGod === '比劫') wealth -= 16;
        if (ganTenGod === '正印' || ganTenGod === '偏印') wealth -= 8;
        if (zhiBroadTenGod === '印星') wealth -= 6;

        overall = Math.max(5, Math.min(95, Math.round(overall)));
        wealth = Math.max(5, Math.min(95, Math.round(wealth)));
        return { overall, wealth };
    }

    /**
     * 財旺流日（教材整理）：依日主五行列出「財旺天干」「財旺地支（含食傷/財）」與「需避開地支（含比劫奪財）」
     */
    const WEALTH_DAY_TABLE = {

        '火': { gan: ['庚','辛','戊','己'], zhi: ['丑','辰','申','酉'], avoid: ['寅','巳','午','未','戌'] },

        '水': { gan: ['甲','乙','丙','丁'], zhi: ['寅','卯','辰','巳','午','未','戌'], avoid: ['亥'] }

    // ===== 補運資料（教材整理；供未來「整體運勢／體感趨勢」使用，目前未上畫面） =====
    // 補運原則：身強 → 補「財」；身弱＋平衡大運（比劫、印）→ 補「財」；身弱＋不平衡大運（財、官殺、食傷）→ 補「比劫、印」
    // 破財時機：身強 → 財星被沖、財星（干或支）被合絆；身弱 → 平衡大運中財星被沖/合/剋，或走不平衡大運（財、官殺、食傷）
    // 化解：主動破財（保本投資、清償債務、汰舊換新、行善、進修）；破財運避做重大財務決定（開店、創業、合夥、借貸）；積極補充用神能量
    const BUYUN_GUIDE = {
        '金': { colors: ['金', '銀', '白', '灰'], items: '金飾、銀飾', dir: '西方', zodiac: ['猴', '雞', '牛'], action: '' },
        '木': { colors: ['藍', '黑', '綠', '藍綠'], items: '', dir: '東方', zodiac: ['豬', '兔', '羊', '龍'], action: '接觸大自然、擺飾植栽、木製品' },
        '水': { colors: ['黑', '藍', '白', '灰'], items: '', dir: '北方', zodiac: ['鼠', '猴', '龍', '豬'], action: '游泳、泡澡、多接觸水' },
        '火': { colors: ['紅', '橘', '黃', '綠'], items: '', dir: '南方', zodiac: ['馬', '虎', '狗', '羊'], action: '多曬太陽、從事戶外運動' },
        '土': { colors: ['紅', '橘', '黃', '土', '咖啡'], items: '', dir: '南方', zodiac: ['馬', '狗', '羊', '牛', '龍'], action: '接觸小狗' }
    };
    // 依身強弱與大運性質，決定應補的五行（回傳五行陣列）
    function getBuyunElements(isStrong, dayunCat, dayElement) {
        const caiEl = wuxingRel[dayElement].ke;
        const yinEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        if (isStrong) return [caiEl];
        if (dayunCat === '比劫' || dayunCat === '印') return [caiEl];
        return [dayElement, yinEl];
    }

    /**
     * 流日財星能量（只看當日干支，與身強身弱無關；承接力日後由「體感趨勢」疊圖處理）
     * 天干：財星 1.0、食傷 0.5（量化系統：主要看財星，只有食傷能量較弱）
     * 地支：依量化系統藏干比重，財星×1.0、食傷×0.5；地支不在財旺清單則不計
     * 滿分 2.0（干支皆純財，如金日主乙卯）→ 換算 0–100
     */
    // 流日趨勢圖共用門檻：地支目標十神合計（依藏干比重×權重）低於此值視為零星餘氣、不計（如寅中戊土 10%）
    // 所有用到「每日趨勢圖」的分頁都用同一個門檻，日與日之間才可比較
    const LIURI_ZHI_MIN = 0.15;
    // 干支權重（大運起一路到流日一致）：地支代表根基與實質力量約七成，天干代表外顯約三成
    const GZ_W = { gan: 0.3, zhi: 0.7 };
    // 旺日門檻：當天有主星（財運＝財星、工作＝官殺、人際＝比劫），且分數（含三合三會加分）達 50 以上
    // 用分數判定，旺日一定落在趨勢的高處，不會出現「旺日不在高峰」
    const LIURI_HOT = 50;
    // 透干引動（流日表現層，不改藏干比重表）：天干與地支的餘氣同五行時，餘氣被引出，升級到該地支中氣的比重
    //  例：木日主遇辛巳，巳中庚金 10% → 升為 40%（巳的中氣戊土比重）；本氣、中氣不再加
    function liuriHiddenEff(gan, zhi) {
        const hw0 = zhiHiddenWeights[zhi] || {}, hs = Object.keys(hw0).sort((a, b) => hw0[b] - hw0[a]);
        const out = { ...hw0 };
        if (hs.length < 3 || !ganElementMap[gan]) return out;
        const midW = hw0[hs[1]];
        hs.slice(2).forEach(h => { if (ganElementMap[h] === ganElementMap[gan] && hw0[h] < midW) out[h] = midW; });
        return out;
    }
    function computeLiuriWealth(dGan, dZhi, dayGan, dayElement) {
        // 依原則掃描（不查表）：財星 1.0、食傷 0.5（食傷生財）；地支依量化系統藏干比重加總
        const caiEl = wuxingRel[dayElement].ke, ssEl = wuxingRel[dayElement].sheng;
        const val = g => ganElementMap[g] === caiEl ? 1.0 : (ganElementMap[g] === ssEl ? 0.5 : 0);
        const C = g => elementColors[ganElementMap[g]];
        const ganOK = val(dGan) > 0;
        let zhiE = 0; const zhiParts = [];
        const hw = liuriHiddenEff(dGan, dZhi), hw0 = zhiHiddenWeights[dZhi] || {};
        Object.keys(hw).forEach(hg => {
            const v = val(hg) * hw[hg];
            if (v > 0) { zhiE += v; zhiParts.push(`<b style="color:${C(hg)}">${hg}${getPreciseTenGod(hg, dayGan)}</b>${hw[hg] > hw0[hg] ? `${Math.round(hw0[hg] * 100)}%→${Math.round(hw[hg] * 100)}%（透干引動）` : Math.round(hw[hg] * 100) + '%'}`); }
        });
        const zhiOK = zhiE >= LIURI_ZHI_MIN;
        if (!zhiOK) { zhiE = 0; zhiParts.length = 0; }
        // 當天要有財星（天干為財，或地支藏干含財）才算財旺日；只有食傷屬於生財之源，力量較弱
        const hasCai = ganElementMap[dGan] === caiEl || (zhiOK && Object.keys(hw).some(hg => ganElementMap[hg] === caiEl));
        const score = Math.max(0, Math.min(100, Math.round((val(dGan) * GZ_W.gan + zhiE * GZ_W.zhi) * 100)));
        const tier = (hasCai && score >= LIURI_HOT) ? '財旺日' : ((ganOK || zhiOK) ? '半財' : '平');
        const ganTxt = ganOK ? `天干<b style="color:${C(dGan)}">${dGan}${getPreciseTenGod(dGan, dayGan)}</b>` : '';
        const zhiTxt = zhiOK ? `地支${dZhi}含${zhiParts.join('、')}` : '';
        return { score, tier, hasMain: hasCai, ganOK, zhiOK, avoid: false, detail: [ganTxt, zhiTxt].filter(Boolean).join('；') };
    }

    /**
     * 流日破財偵測（教材「破財時機」）：
     *  ① 財星被沖：流日地支沖原局「含財星」的地支
     *  ② 財星於天干、底下地支被沖：流日地支沖原局天干財星所坐的地支
     *  ③ 地支財星被合絆：流日地支六合原局「含財星」的地支
     *  ④ 天干財星被合絆：流日天干合原局天干財星
     * （大運／流年層級的身強弱破財時機，留待「體感趨勢」處理）
     */
    /**
     * 轉職時機（教材整理）：大運只用來判斷「以身強或身弱論」，轉職分數看流年＋流月
     *  身強 → 宜財、官殺；身弱＋大運幫扶（印比）→ 以身強論，宜財、官殺；身弱＋大運削弱（財官食傷）→ 宜比劫、印
     *  從格：大運五行與格局相符＝成格，以身強論；不符＝破格，以身弱論
     *  每柱：天干、地支主氣各 1 分（0–2）；轉職分＝流年 40％＋流月 60％；≥60 標「轉」
     */
    function careerCatOf(el, dayElement) {
        if (!el || !wuxingRel[el] || !wuxingRel[dayElement]) return null; // 未起運等無資料情況
        if (el === dayElement) return '比劫';
        if (wuxingRel[el].sheng === dayElement) return '印';
        if (wuxingRel[dayElement].sheng === el) return '食傷';
        if (wuxingRel[dayElement].ke === el) return '財';
        return '官殺';
    }
    function zhiMainGan(z) { const hw = zhiHiddenWeights[z] || {}; return Object.keys(hw).sort((a, b) => hw[b] - hw[a])[0]; }
    function computeCareerContext(strengthLabel, totalScore, dayElement, dy, gans, zhis, year) {
        const dyEls = dy ? [ganElementMap[dy.gan], ganElementMap[zhiMainGan(dy.zhi)]] : [];
        const dyCats = dyEls.map(e => careerCatOf(e, dayElement));
        // 大運權重：天干 30％、地支 70％；大運後五年幾乎以地支為主（天干 0％、地支 100％）
        const late = dy && year != null && year >= dy.startYear + 5;
        const wG = late ? 0 : 0.3, wZ = late ? 1 : 0.7;
        const phase = dy ? (late ? '後五年・地支主導' : '前五年・干3支7') : '';
        let asStrong, basis, primaryEl = null;
        // 大運干支相生：地支本氣生天干，而天干屬削弱五行 → 地支的幫扶力轉去生天干（如金生水），整步運視為削弱
        const zhuanSheng = (helpG) => !!dy && wuxingRel[dyEls[1]] && wuxingRel[dyEls[1]].sheng === dyEls[0] && !helpG;
        const zsNote = '・地支生天干削弱五行（轉生）';
        const weigh = (isHelpEl) => {
            if (!dy) return { ok: false, zs: false }; // 未起運：沒有大運可判斷
            const hG = isHelpEl(dyEls[0]); let hZ = isHelpEl(dyEls[1]);
            const zs = hZ && zhuanSheng(hG); if (zs) hZ = false;
            return { ok: dy ? ((hG ? wG : 0) + (hZ ? wZ : 0)) >= 0.5 : false, zs };
        };
        if (strengthLabel === '從強格' || strengthLabel === '從弱格') {
            let geEls;
            if (strengthLabel === '從強格') geEls = [dayElement, Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement)];
            else {
                // 從弱：財、官殺、食傷皆為順勢（幫扶）五行；以原局（含藏干）最旺者為主要補充五行
                const cnt = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
                gans.forEach(g => { if (g && g !== '-') cnt[ganElementMap[g]] += 1; });
                zhis.forEach(z => { const hw = zhiHiddenWeights[z] || {}; Object.keys(hw).forEach(hg => cnt[ganElementMap[hg]] += hw[hg]); });
                geEls = Object.keys(cnt).filter(e => !['比劫', '印'].includes(careerCatOf(e, dayElement)));
                primaryEl = geEls.slice().sort((a, b) => cnt[b] - cnt[a])[0];
            }
            const w = weigh(e => geEls.includes(e));
            asStrong = w.ok;
            basis = `${strengthLabel}（${strengthLabel === '從弱格' ? '順勢五行' + geEls.join('、') + '・主' + primaryEl : '格局五行' + geEls.join('、')}）・${dy ? dy.ganZhi + '運（' + phase + '）' : '未起運'}${w.zs ? zsNote : ''}${w.ok ? '與格局相符＝成格，以身強論' : '不符格局＝破格，以身弱論'}`;
        } else if (strengthLabel === '身強') {
            asStrong = true;
            basis = `身強（${totalScore}分）`;
        } else {
            const isHelp = c => c === '比劫' || c === '印';
            const w = weigh(e => isHelp(careerCatOf(e, dayElement)));
            asStrong = w.ok;
            basis = `身弱（${totalScore}分）・${dy ? dy.ganZhi + '運（' + phase + '）' : '未起運'}${w.zs ? zsNote : ''}${w.ok ? '印比幫扶，以身強論' : '財官食傷削弱，以身弱論'}`;
        }
        const targets = asStrong ? ['財', '官殺'] : ['比劫', '印'];
        return { asStrong, basis, targets, targetTxt: targets.join('、'), primaryEl };
    }
    /**
     * 充能顏色（教材整理）：決定該補的五行
     *  從強格 → 繼續補幫扶（比劫、印）；從弱格 → 繼續補耗洩（財官食傷皆順勢，以原局最旺者為主）
     *  身強 → 補財；身弱＋大運幫扶 → 補財；身弱＋大運耗洩 → 補比劫、印
     */
    const CHARGE_COLORS = {
        '金': [['金', '#d4af37'], ['銀', '#c7ccd1'], ['白', '#f4f4f4'], ['灰', '#8a8a8a']],
        '木': [['藍', '#1f6fd6'], ['黑', '#111111'], ['綠', '#2e7d32'], ['藍綠', '#2a8a8a']],
        '水': [['黑', '#111111'], ['藍', '#1f6fd6'], ['白', '#f4f4f4'], ['灰', '#8a8a8a']],
        '火': [['紅', '#b71c1c'], ['橘', '#e67e22'], ['黃', '#f4d03f'], ['綠', '#3e8e41']],
        '土': [['紅', '#b71c1c'], ['橘', '#e67e22'], ['黃', '#f4d03f'], ['土', '#9c5a1a'], ['咖啡', '#8d6e63']]
    };
    function computeChargeContext(strengthLabel, totalScore, dayElement, dy, gans, zhis) {
        const caiEl = wuxingRel[dayElement].ke;
        const yinEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        if (strengthLabel === '從強格') return { els: [dayElement, yinEl], basis: '從強格・繼續補幫扶（比劫、印）' };
        if (strengthLabel === '從弱格') {
            const ctx = computeCareerContext(strengthLabel, totalScore, dayElement, dy, gans, zhis, dy ? dy.startYear : null);
            const ge = ctx.primaryEl;
            return { els: ge ? [ge] : [caiEl], basis: `從弱格・繼續補耗洩（以最旺的${ge || caiEl}為主）` };
        }
        if (strengthLabel === '身強') return { els: [caiEl], basis: `身強（${totalScore}分）・補財` };
        const ctx = computeCareerContext(strengthLabel, totalScore, dayElement, dy, gans, zhis, dy ? dy.startYear : null);
        return ctx.asStrong
            ? { els: [caiEl], basis: `身弱（${totalScore}分）・${dy ? dy.ganZhi + '運' : ''}印比幫扶・補財` }
            : { els: [dayElement, yinEl], basis: `身弱（${totalScore}分）・${dy ? dy.ganZhi + '運' : '未起運'}財官食傷耗洩・補比劫、印` };
    }

    function careerPillarScore(gan, zhi, ctx, dayElement) {
        let n = 0;
        if (ctx.targets.includes(careerCatOf(ganElementMap[gan], dayElement))) n++;
        if (ctx.targets.includes(careerCatOf(ganElementMap[zhiMainGan(zhi)], dayElement))) n++;
        return n;
    }
    // 每柱：天干 30%＋地支本氣 70%（轉職為人生大事，地支只看本氣，從嚴）
    function careerPillarW(gan, zhi, ctx, dayElement) {
        const g = ctx.targets.includes(careerCatOf(ganElementMap[gan], dayElement)) ? 1 : 0;
        const z = ctx.targets.includes(careerCatOf(ganElementMap[zhiMainGan(zhi)], dayElement)) ? 1 : 0;
        return g * GZ_W.gan + z * GZ_W.zhi;
    }
    function careerScore(yG, yZ, mG, mZ, ctx, dayElement) {
        const y = careerPillarScore(yG, yZ, ctx, dayElement), m = careerPillarScore(mG, mZ, ctx, dayElement);
        const score = Math.round(careerPillarW(yG, yZ, ctx, dayElement) * 40 + careerPillarW(mG, mZ, ctx, dayElement) * 60);
        return { y, m, score, ok: score >= 60 };
    }

    /**
     * 官運旺流日（教材整理；教材組合為舉例，包含但不限於）：
     *  主看官殺星（剋我者），財星可生官為輔（天干官殺×地支財亦可）
     *  天干：官殺 1.0、財 0.5；地支：依藏干比重，官殺×1.0、財×0.5
     *  天干、地支皆含官殺或財，且當日有官殺出現 → 官旺日
     */
    function computeLiuriWork(dGan, dZhi, dayGan, dayElement) {
        const caiEl = wuxingRel[dayElement].ke;
        const gsEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        const val = g => ganElementMap[g] === gsEl ? 1.0 : (ganElementMap[g] === caiEl ? 0.5 : 0);
        const C = g => elementColors[ganElementMap[g]];
        const ganOK = val(dGan) > 0;
        let zhiE = 0; const zhiParts = [];
        const hw = liuriHiddenEff(dGan, dZhi), hw0 = zhiHiddenWeights[dZhi] || {};
        Object.keys(hw).forEach(hg => {
            const v = val(hg) * hw[hg];
            if (v > 0) { zhiE += v; zhiParts.push(`<b style="color:${C(hg)}">${hg}${getPreciseTenGod(hg, dayGan)}</b>${hw[hg] > hw0[hg] ? `${Math.round(hw0[hg] * 100)}%→${Math.round(hw[hg] * 100)}%（透干引動）` : Math.round(hw[hg] * 100) + '%'}`); }
        });
        const zhiOK = zhiE >= LIURI_ZHI_MIN;
        if (!zhiOK) { zhiE = 0; zhiParts.length = 0; }
        const hasGS = ganElementMap[dGan] === gsEl || (zhiOK && Object.keys(hw).some(hg => ganElementMap[hg] === gsEl));
        const score = Math.max(0, Math.min(100, Math.round((val(dGan) * GZ_W.gan + zhiE * GZ_W.zhi) * 100)));
        const tier = (hasGS && score >= LIURI_HOT) ? '官旺日' : ((ganOK || zhiOK) ? '半官' : '平');
        const ganTxt = ganOK ? `天干<b style="color:${C(dGan)}">${dGan}${getPreciseTenGod(dGan, dayGan)}</b>` : '';
        const zhiTxt = zhiOK ? `地支${dZhi}含${zhiParts.join('、')}` : '';
        return { score, tier, hasMain: hasGS, ganOK, zhiOK, detail: [ganTxt, zhiTxt].filter(Boolean).join('；') };
    }

    /**
     * 人際流日（比劫能量）：不分身強身弱，掃描比肩、劫財旺的日子
     *  天干：比劫 1.0；地支：依量化系統藏干比重，比劫 ×1.0
     *  天干、地支皆含比劫 → 慎言日（人際交集旺，容易節外生枝、口角）
     *  身弱者比劫為幫扶，體感通常不明顯；身強者較容易感受到
     */
    function computeLiuriRen(dGan, dZhi, dayGan, dayElement) {
        const val = g => ganElementMap[g] === dayElement ? 1.0 : 0;
        const C = g => elementColors[ganElementMap[g]];
        const ganOK = val(dGan) > 0;
        let zhiE = 0; const zhiParts = [];
        const hw = liuriHiddenEff(dGan, dZhi), hw0 = zhiHiddenWeights[dZhi] || {};
        Object.keys(hw).forEach(hg => {
            const v = val(hg) * hw[hg];
            if (v > 0) { zhiE += v; zhiParts.push(`<b style="color:${C(hg)}">${hg}${getPreciseTenGod(hg, dayGan)}</b>${hw[hg] > hw0[hg] ? `${Math.round(hw0[hg] * 100)}%→${Math.round(hw[hg] * 100)}%（透干引動）` : Math.round(hw[hg] * 100) + '%'}`); }
        });
        const zhiOK = zhiE >= LIURI_ZHI_MIN;
        if (!zhiOK) { zhiE = 0; zhiParts.length = 0; }
        const score = Math.max(0, Math.min(100, Math.round((val(dGan) * GZ_W.gan + zhiE * GZ_W.zhi) * 100)));
        const tier = ((ganOK || zhiOK) && score >= LIURI_HOT) ? '慎言日' : ((ganOK || zhiOK) ? '人際活絡' : '平');
        const ganTxt = ganOK ? `天干<b style="color:${C(dGan)}">${dGan}${getPreciseTenGod(dGan, dayGan)}</b>` : '';
        const zhiTxt = zhiOK ? `地支${dZhi}含${zhiParts.join('、')}` : '';
        return { score, tier, hasMain: ganOK || zhiOK, ganOK, zhiOK, detail: [ganTxt, zhiTxt].filter(Boolean).join('；') };
    }

    /**
     * 流日三合／三會偵測（延伸應用，非教材規則）：
     *  只在「原局＋大運＋流年」已具兩字、由流日補上第三字時成立（原局本身已成局者不算）
     *  財局 → 財星加強；食傷局 → 食傷生財；比劫局 → 比劫奪財（破財）；
     *  印局／官殺局且原局含財地支被拉入 → 財星被化走（破財）
     */
    const JU_LIST = [
        { kind: '三合', zhi: ['申','子','辰'], el: '水' }, { kind: '三合', zhi: ['亥','卯','未'], el: '木' },
        { kind: '三合', zhi: ['寅','午','戌'], el: '火' }, { kind: '三合', zhi: ['巳','酉','丑'], el: '金' },
        { kind: '三會', zhi: ['寅','卯','辰'], el: '木' }, { kind: '三會', zhi: ['巳','午','未'], el: '火' },
        { kind: '三會', zhi: ['申','酉','戌'], el: '金' }, { kind: '三會', zhi: ['亥','子','丑'], el: '水' }
    ];
    // srcs：[{ zhi, from:'年支'|'月支'|'日支'|'時支'|'大運'|'流年', natal:bool }]
    function detectLiuriJu(dZhi, srcs, dayElement, topic) {
        const caiEl = wuxingRel[dayElement].ke, ssEl = wuxingRel[dayElement].sheng;
        const gsEl = Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        const out = [];
        JU_LIST.forEach(ju => {
            if (!ju.zhi.includes(dZhi)) return;
            if (srcs.some(x => x.zhi === dZhi)) return; // 流日需補上「新的」一字
            const others = ju.zhi.filter(z => z !== dZhi);
            const used = others.map(z => srcs.find(x => x.zhi === z));
            if (used.some(u => !u)) return;
            const name = `${ju.zhi.join('')}${ju.kind === '三會' ? '會' : '合'}${ju.el}`;
            const from = used.map(u => `${u.from}${u.zhi}`).join('、');
            const strong = ju.kind === '三會';
            let effect = null;
            if (topic === 'ren') {
                if (ju.el === dayElement) out.push({ name, kind: ju.kind, from, members: ju.zhi, type: 'boost', label: '比劫局', bonus: strong ? 30 : 25 });
                return;
            }
            if (topic === 'work') {
                if (ju.el === gsEl) effect = { type: 'boost', label: '官殺局', bonus: strong ? 30 : 25 };
                else if (ju.el === caiEl) effect = { type: 'boost', label: '財局（財生官）', bonus: strong ? 15 : 12 };
                if (effect) out.push({ name, kind: ju.kind, from, members: ju.zhi, ...effect });
                return;
            }
            // 三合／三會只當加分項：財局、食傷局（比劫局、印局、官殺局暫不判破財）
            if (ju.el === caiEl) effect = { type: 'boost', label: '財局', bonus: strong ? 30 : 25 };
            else if (ju.el === ssEl) effect = { type: 'boost', label: '食傷局', bonus: strong ? 15 : 12 };
            if (effect) out.push({ name, kind: ju.kind, from, members: ju.zhi, ...effect });
        });
        return out;
    }

    function detectPoCai(dGan, dZhi, baseGans, baseZhis, dayGan, dayElement) {
        const caiEl = wuxingRel[dayElement].ke;
        const P = ['年', '月', '日', '時'];
        const zhiHasCai = z => Object.keys(zhiHiddenWeights[z] || {}).some(hg => ganElementMap[hg] === caiEl);
        const hits = [];
        baseZhis.forEach((z, i) => {
            if (!z || z === '-') return;
            if (zhiHasCai(z) && zhiChongMap[z] === dZhi) hits.push({ type: '沖', txt: `${dZhi}沖${P[i]}支${z}（財星）` });
            if (zhiHasCai(z) && zhiHeMap[z] === dZhi) hits.push({ type: '合', liuheZhi: z, txt: `${dZhi}${z}合，${P[i]}支財星被合絆` });
        });
        baseGans.forEach((g, i) => {
            if (i === 2 || !g || g === '-' || ganElementMap[g] !== caiEl) return;
            const z = baseZhis[i];
            if (z && zhiChongMap[z] === dZhi && !zhiHasCai(z)) hits.push({ type: '沖', txt: `${dZhi}沖${P[i]}支${z}，動及${P[i]}干財星${g}` });
            if (ganHeMap[g] === dGan) hits.push({ type: '合', txt: `${dGan}${g}合，${P[i]}干財星被合絆` });
        });
        return hits;
    }


    // 全域版精確十神（含陰陽），供格局／用神判定使用（與 calculateBaziCore 內的 getSpecificShiShen 邏輯相同）
    // ===================================================================
    // 六親動態偵測器 (Relative_Dynamics_Scanner) — 子女星專屬偵測模組 (Child_Star_Scanner)
    // 角色映射：男命子女星＝官殺、女命子女星＝食傷（不分兒女、不論胎數）；子女宮＝時柱地支
    // 只做條件觸發與數據記錄，不做解讀；解讀交給 AI 提詞
    // ===================================================================
    const XING_PAIRS = ['子卯', '寅巳', '巳申', '申寅', '丑戌', '戌未', '未丑'];
    function getXingType(a, b) {
        if (!a || !b || a === '-' || b === '-') return null;
        if (a === b && ['辰', '午', '酉', '亥'].includes(a)) return '自刑';
        if (XING_PAIRS.includes(a + b) || XING_PAIRS.includes(b + a)) return '刑';
        return null;
    }

    // 六親星統一取法：天干全取（日干除外，最多 3 顆）；天干不足 2 顆才以地支主氣補到 2 顆；
    // 天干、地支主氣皆無，才往地支中氣→餘氣找 1 顆（同層取比重最高者）
    function pickRelStars(el, baseGans, baseZhis, ganOrder, zhiOrder, extra) {
        const hs = z => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };
        const out = [];
        ganOrder.forEach(i => { if (i !== 2 && baseGans[i] && baseGans[i] !== '-' && ganElementMap[baseGans[i]] === el) out.push({ ...(extra || {}), gan: baseGans[i], pillarIdx: i, layer: '天干' }); });
        zhiOrder.forEach(i => { if (out.length >= 2) return; const z = baseZhis[i]; if (!z || z === '-') return; const m = hs(z)[0]; if (m && ganElementMap[m] === el) out.push({ ...(extra || {}), gan: m, pillarIdx: i, layer: '地支主氣' }); });
        if (!out.length) {
            for (const [pos, layerName] of [[1, '地支中氣'], [2, '地支餘氣']]) {
                let best = null;
                zhiOrder.forEach(i => { const z = baseZhis[i]; if (!z || z === '-') return; const hg = hs(z)[pos];
                    if (hg && ganElementMap[hg] === el && (!best || zhiHiddenWeights[z][hg] > best.w)) best = { i, hg, w: zhiHiddenWeights[z][hg] }; });
                if (best) { out.push({ ...(extra || {}), gan: best.hg, pillarIdx: best.i, layer: layerName }); break; }
            }
        }
        return out;
    }

    function scanChildStars(ctx) {
        const { dg, dayElement, gender, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const childEl = gender === 1
            ? Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement)   // 男命：官殺（剋我者）
            : wuxingRel[dayElement].sheng;                                       // 女命：食傷（我生者）
        const childCatName = gender === 1 ? '官殺' : '食傷';
        const palaceZhi = baseZhis[3];

        // ---- 二、子女星擷取：天干全取；不足 2 顆以地支主氣補；皆無才取中氣／餘氣 1 顆（子女宮時柱優先） ----
        const stars = pickRelStars(childEl, baseGans, baseZhis, [3, 1, 0], [3, 2, 1, 0]);

        // ---- 三、狀態屬性判定 ----
        const dayHourChong = baseZhis[2] !== '-' && zhiChongMap[baseZhis[2]] === baseZhis[3];
        stars.forEach(s => {
            s.tenGod = getPreciseTenGod(s.gan, dg);
            s.pillarName = pNames[s.pillarIdx];
            s.sittingBranch = baseZhis[s.pillarIdx];
            if (s.layer === '天干') {
                const r = getTraditionalRoots(s.gan, s.pillarIdx, baseZhis, pNames);
                s.hasTonggen = r.roots.length > 0;
                s.tonggenLabel = r.label;
                s.hasTougan = true; // 本身就在天干
                s.touganLabel = '本身透干';
            } else {
                s.hasTonggen = true; // 本身就藏於地支
                s.tonggenLabel = s.layer;
                const exact = baseGans.some((g, i) => i !== 2 && g === s.gan);
                const sameEl = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === childEl);
                s.hasTougan = exact || sameEl;
                s.touganLabel = exact ? `「${s.gan}」透出` : (sameEl ? '同類透出' : '未透干');
            }
            // 子女緣分輕薄：①無通根或無透干（天干星本身已透看通根；地支星本身有根看透干）②日支與時支相沖

        });

        // ---- 四、動態歲運偵測 ----
        const sittingSet = [...new Set(stars.map(s => s.sittingBranch).filter(z => z && z !== '-'))];
        const targets = [{ zhi: palaceZhi, label: '子女宮' }];
        sittingSet.forEach(z => { if (z !== palaceZhi) targets.push({ zhi: z, label: `子女星(${z})` }); });

        // 依地支順序排出固定寫法（例：午子 → 子午）
        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                if (!t.zhi || t.zhi === '-') return;
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                // 三刑：歲運地支＋目標地支＋原局另一支 湊齊
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', name: `${pairName(inZhi, t.zhi)}刑`, target: t.label }); // 寅申、丑未已計沖，不重複標刑
            });
            return hits;
        };
        // 依教材「易懷孕時機」：① 子女星（男官殺／女食傷）透干 ② 地支主氣為子女星
        const checkStarArrival = (inGan, inZhi, ganLabel) => {
            const hits = [];
            if (inGan && ganElementMap[inGan] === childEl) hits.push('原星透干');
            const w = zhiHiddenWeights[inZhi] || {};
            const main = Object.keys(w).sort((a, b) => w[b] - w[a])[0];
            if (main && ganElementMap[main] === childEl) hits.push('地支主氣');
            return hits;
        };

        // 合：依所學體系暫只採「三合成子女星局」（歲運地支＋原局另兩支湊齊，且局的五行＝子女星）
        const SAN_HE = [['申','子','辰','水'], ['亥','卯','未','木'], ['寅','午','戌','火'], ['巳','酉','丑','金']];
        const checkHe = (inGan, inZhi) => {
            const hits = [];
            SAN_HE.forEach(([a, b, c, el]) => {
                if (el !== childEl || ![a, b, c].includes(inZhi)) return;
                if ([a, b, c].filter(z => z !== inZhi).every(z => baseZhis.includes(z)))
                    hits.push({ kind: '三合', name: `${a}${b}${c}三合${el}局` });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            const arrive = checkStarArrival(dy.gan, dy.zhi, '天干帶子女星');
            const he = checkHe(dy.gan, dy.zhi);
            if (clash.length || arrive.length || he.length) events.dayun.push({
                time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive, he
            });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const g = gz.charAt(0), z = gz.charAt(1);
            const clash = checkClash(z);
            const arrive = checkStarArrival(g, z, '流年天干透子女星');
            const he = checkHe(g, z);
            if (clash.length || arrive.length || he.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive, he });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const g = bz.getMonthGan(), z = bz.getMonthZhi();
            const clash = checkClash(z);
            const arrive = checkStarArrival(g, z, '流月天干透子女星');
            const he = checkHe(g, z);
            if (!clash.length && !arrive.length && !he.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({
                time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: g + z, isCurrent: i === 0, isPast: i < 0, clash, arrive, he
            });
        }

        // 子女個性判讀柱：子女星所在的柱（天干＋地支），去重後合併
        // 只用干支本身（五行陰陽），不帶命主十神：十神是「相對日主」的關係，不代表子女本身的個性
        const YANG_ZHI = '子寅辰午申戌';
        const personalityPillars = [...new Set(stars.map(s => s.pillarIdx))].sort().map(i => ({
            pillarName: pNames[i], gan: baseGans[i], zhi: baseZhis[i],
            ganDesc: `${stemPolarity[baseGans[i]] === 1 ? '陽' : '陰'}${ganElementMap[baseGans[i]]}`,
            zhiDesc: `${YANG_ZHI.includes(baseZhis[i]) ? '陽' : '陰'}${zhiElementMap[baseZhis[i]]}`
        }));

        // 整盤判定子女緣（不逐星判斷）
        // 子女緣強：①子女星干支相見（有通根／透干：天干星有根，或地支星有透）或 ②子女星坐子女宮（時支主氣為子女星），且日時支不相沖
        // 其餘皆為子女緣分輕薄（含原局不見子女星）
        const ganZhiMeet = stars.some(st => st.hasTonggen && st.hasTougan);
        const palaceMain = (() => { const w = zhiHiddenWeights[palaceZhi] || {}; const m = Object.keys(w).sort((a, b) => w[b] - w[a])[0]; return m && ganElementMap[m] === childEl ? m : null; })();
        const strongReasons = [];
        if (ganZhiMeet) strongReasons.push('子女星干支相見（通根透干）');
        if (palaceMain) strongReasons.push(`子女星坐子女宮（時支${palaceZhi}主氣${palaceMain}）`);
        const thinReasons = [];
        if (!stars.length) thinReasons.push('原局不見子女星');
        else if (!strongReasons.length) thinReasons.push('子女星未通根透干，也未坐子女宮');
        if (dayHourChong) thinReasons.push('日時支相沖');
        const affinity = (strongReasons.length && !dayHourChong) ? 'strong' : 'thin';

        return { childEl, childCatName, palaceZhi, stars, events, dayHourChong, dg, baseGans, baseZhis, personalityPillars,
            affinity, strongReasons, thinReasons };
    }

    /**
     * 六親迷你命盤：沿用上方排盤格式（時/日/月/年），十神改標為該分頁對應的「星」。
     * roleFn(gan) → 回傳角色名（例如「子女星」）或 null（非該星，改以淡色顯示原十神縮寫）
     */
    function renderRoleChart(baseGans, baseZhis, dg, isRoleFn, palaceIdx, palaceLabel, extraZhiRingIdx = []) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const names = ['年柱', '月柱', '日柱', '時柱'];
        const order = [3, 2, 1, 0];
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };
        const tg = (g, isDm) => isDm ? '日主' : (ssShort[getPreciseTenGod(g, dg)] || '');
        // 屬於該星的字加圈；地支只要藏有該星也圈起來
        const ring = (ch, color, on) => `<span class="rc-ch${on ? ' rc-ring' : ''}" style="color:${color}">${ch}</span>`;
        let h = `<div class="rc-wrap"><table class="rc-table"><tr>`;
        order.forEach(i => h += `<td class="rc-head">${names[i]}${i === palaceIdx ? `<div class="rc-palace">${palaceLabel}</div>` : ''}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-tg">${tg(baseGans[i], i === 2)}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ring(baseGans[i], elementColors[ganElementMap[baseGans[i]]] || '#888', i !== 2 && isRoleFn(baseGans[i]))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ring(baseZhis[i], elementColors[zhiElementMap[baseZhis[i]]] || '#888', hiddenOf(baseZhis[i]).some(isRoleFn) || extraZhiRingIdx.includes(i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => {
            h += `<td class="rc-hidden">` + hiddenOf(baseZhis[i]).map(g =>
                `<div>${ring(g, elementColors[ganElementMap[g]], isRoleFn(g))}<span style="color:${elementColors[ganElementMap[g]]}">${tg(g, false)}</span></div>`
            ).join('') + `</td>`;
        });
        h += `</tr></table></div>`;
        return h;
    }

    function renderChildScanHtml(scan) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const elC = elementColors[scan.childEl];
        let html = `
            <div class="rel-summary">
                <span>子女宮 <b>時支「${scan.palaceZhi}」</b></span>
                <span>子女星 <b style="color:${elC}">${scan.childCatName}（${scan.childEl}）</b></span>
                <span>${scan.affinity === 'strong'
                    ? `<span class="tag tag-star">子女緣強</span> <span class="rel-thin-why">${scan.strongReasons.join('・')}</span>`
                    : `<span class="tag tag-chong">子女緣分輕薄</span> <span class="rel-thin-why">${scan.thinReasons.join('・')}</span>`}</span>
            </div>
        `;
        html += renderRoleChart(scan.baseGans, scan.baseZhis, scan.dg,
            (g) => ganElementMap[g] === scan.childEl, 3, '子女宮');
        if (scan.personalityPillars.length) {
            html += `<div class="rel-persona">🧬 子女個性判讀柱：` + scan.personalityPillars.map(pp =>
                `<b>${pp.pillarName}柱 <span style="color:${elementColors[ganElementMap[pp.gan]]}">${pp.gan}</span><span style="color:${elementColors[zhiElementMap[pp.zhi]]}">${pp.zhi}</span></b>`
            ).join('、') + `</div>`;
        }
        if (scan.stars.length === 0) {
            html += `<div class="rel-empty"><span class="tag tag-neutral">原局不見子女星</span></div>`;
        } else {
            html += `<div class="rel-star-grid">` + scan.stars.map(s => `
                <div class="rel-star-card">
                    <div class="rel-star-head">
                        <span class="rel-star-gan" style="color:${elementColors[ganElementMap[s.gan]]}">${s.gan}<small>${ssShort[s.tenGod] || s.tenGod}</small></span>
                        <span class="rel-star-pos">${s.pillarName}・${s.layer}</span>
                    </div>
                    <div class="rel-star-row"><span>坐柱</span><b>${s.pillarName}柱 ${scan.baseGans[s.pillarIdx]}${s.sittingBranch}</b></div>
                    <div class="rel-star-row"><span>通根</span><b class="${s.hasTonggen ? 'ok' : 'ng'}">${s.tonggenLabel}</b></div>
                    <div class="rel-star-row"><span>透干</span><b class="${s.hasTougan ? 'ok' : 'ng'}">${s.touganLabel}</b></div>
                </div>
            `).join('') + `</div>`;
        }

        html += renderRelEventBlocks(scan.events);
        return html;
    }

    function renderRelEventBlocks(events) {
        const evRow = (e) => {
            const tags = e.clash.map(c => `<span class="tag ${c.type === '沖' ? 'tag-chong' : c.type === '害' ? 'tag-hai' : 'tag-xing'}">${c.name}・${c.target}</span>`)
                .concat(e.arrive.map(a => `<span class="tag tag-star">${a}</span>`))
                .concat((e.he || []).map(h => `<span class="tag tag-sanhe">${h.name}</span>`)).join(' ');
            return `
                <div class="rel-ev-row${e.isCurrent ? ' is-current' : ''}${e.isPast ? ' is-past' : ''}">
                    <div class="rel-ev-time">${e.time}${e.isCurrent ? ' <span class="rel-now">現在</span>' : ''}</div>
                    <div class="rel-ev-gz">${e.ganZhi.split('').map(c => `<span style="color:${elementColors[ganElementMap[c] || zhiElementMap[c]]}">${c}</span>`).join('')}</div>
                    <div class="rel-ev-tags">${tags}</div>
                </div>`;
        };
        const evBlock = (title, list, emptyMsg) => `
            <div class="rel-ev-block">
                <div class="rel-ev-title">${title}</div>
                ${list.length ? list.map(evRow).join('') : `<div class="rel-ev-empty">${emptyMsg}</div>`}
            </div>`;
        return evBlock('🌊 大運', events.dayun, '各步大運無觸發')
            + evBlock('📆 流年（前後 3 年）', events.liunian, '此區間無觸發')
            + evBlock('🗓️ 流月（前 6 月＋後 12 月）', events.liuyue, '此區間無觸發');
    }


    // ===================================================================
    // 夫妻星／夫妻宮偵測（婚姻分頁）：夫妻星＝男財（我剋）、女官殺（剋我）；夫妻宮＝日支
    // 天干全取（月→時→年）；天干不足 2 顆才以地支主氣補到 2 顆（日→月→時→年）；不取中氣、餘氣
    // 原局：夫妻宮、夫妻星所在柱地支 與鄰近地支的刑沖害
    // 歲運：大運／流年／流月地支 刑沖害 夫妻宮與夫妻星坐支
    // ===================================================================
    const SPOUSE_AGE = ['年紀差距 10～20 歲，或異國、遠距離', '年紀差距 2～10 歲', '年紀差距 ±2 歲', '年紀小 2～10 歲'];
    function scanSpouseStars(ctx) {
        const { dg, dayElement, gender, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const el = gender === 1 ? wuxingRel[dayElement].ke : Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement);
        const catName = gender === 1 ? '財' : '官殺';
        const mainOf = z => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a])[0]; };
        // 以天干為主：天干有幾顆取幾顆（月→時→年，不限顆數）；天干不足 2 顆時，才以地支主氣補到 2 顆（日→月→時→年）
        const stars = [];
        [1, 3, 0].forEach(i => { if (baseGans[i] && baseGans[i] !== '-' && ganElementMap[baseGans[i]] === el) stars.push({ gan: baseGans[i], pillarIdx: i, layer: '天干' }); });
        [2, 1, 3, 0].forEach(i => { if (stars.length >= 2) return; const m = mainOf(baseZhis[i]); if (m && ganElementMap[m] === el) stars.push({ gan: m, pillarIdx: i, layer: '地支主氣' }); });
        const distOf = i => { const d = Math.abs(i - 2); return d === 0 ? '坐夫妻宮' : (d === 1 ? '緊貼日主' : (d === 2 ? '隔一柱' : '遙隔')); };
        stars.forEach(st => {
            st.tenGod = getPreciseTenGod(st.gan, dg); st.pillarName = pNames[st.pillarIdx]; st.sittingBranch = baseZhis[st.pillarIdx];
            st.age = SPOUSE_AGE[st.pillarIdx]; st.dist = distOf(st.pillarIdx);
            if (st.layer === '天干') { const r = getTraditionalRoots(st.gan, st.pillarIdx, baseZhis, pNames); st.tonggenLabel = r.roots.length ? r.label : '無根'; }
            else st.tonggenLabel = '地支主氣';
        });
        const palace = baseZhis[2];
        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const relOf = (a, b) => {
            const out = [];
            if (zhiChongMap[a] === b) out.push({ type: '沖', name: `${pairName(a, b)}沖` });
            const x = getXingType(a, b);
            if (x === '自刑') out.push({ type: '刑', name: `${a}${b}自刑` });
            else if (x && zhiChongMap[a] !== b) out.push({ type: '刑', name: `${pairName(a, b)}刑` });
            if (zhiHaiMap[a] === b) out.push({ type: '害', name: `${pairName(a, b)}害` });
            return out;
        };
        // 原局：與鄰近地支（左右兩柱）
        const natal = [];
        const neigh = i => [i - 1, i + 1].filter(j => j >= 0 && j < 4 && baseZhis[j] && baseZhis[j] !== '-');
        neigh(2).forEach(j => relOf(palace, baseZhis[j]).forEach(r => natal.push({ ...r, who: '夫妻宮', with: `${pNames[j]}支${baseZhis[j]}` })));
        const starIdx = [...new Set(stars.map(s => s.pillarIdx))].filter(i => i !== 2);
        starIdx.forEach(i => neigh(i).forEach(j => relOf(baseZhis[i], baseZhis[j]).forEach(r => {
            if (natal.some(n => n.name === r.name && (n.with.includes(baseZhis[i]) || n.with.includes(baseZhis[j])))) return;
            natal.push({ ...r, who: `夫妻星（${pNames[i]}柱）`, with: `${pNames[j]}支${baseZhis[j]}` });
        })));
        // 歲運
        const targets = [{ idx: 2, zhi: palace, label: `夫妻宮(${palace})` }];
        starIdx.forEach(i => { if (!targets.some(t => t.zhi === baseZhis[i])) targets.push({ idx: i, zhi: baseZhis[i], label: `夫妻星(${baseZhis[i]})` }); });
        const checkClash = z => { const hits = []; targets.forEach(t => relOf(z, t.zhi).forEach(r => hits.push({ type: r.type === '害' ? '刑' : r.type, name: r.name, target: t.label }))); return hits; };
        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            if (clash.length) events.dayun.push({ time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi, isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const clash = checkClash(gz.charAt(1));
            if (clash.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15), bz = solar.getLunar().getEightChar();
            const clash = checkClash(bz.getMonthZhi()); if (!clash.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`, ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash, arrive: [] });
        }
        const zuoGong = ganElementMap[mainOf(palace)] === el; // 夫妻星坐夫妻宮：日支主氣即夫妻星（不受取星順序影響）
        return { el, catName, stars, palace, natal, events, dg, baseGans, baseZhis, zuoGong };
    }
    function renderSpouseScanHtml(scan) {
        const RING = '#ff7eb6', marks = [{ type: 'zhi', idx: 2, gan: null, color: '#00d2ff' }];
        scan.stars.forEach(st => {
            if (st.layer === '天干') marks.push({ type: 'gan', idx: st.pillarIdx, gan: null, color: RING });
            else marks.push({ type: 'zhi', idx: st.pillarIdx, gan: st.gan, color: RING });
        });
        let html = `<div class="rel-summary">
                <span>夫妻星 <b style="color:${elementColors[scan.el]}">${scan.catName}（${scan.el}）</b></span>
                <span>夫妻宮 <b style="color:#00d2ff">日支 ${scan.palace}</b></span>
                ${scan.zuoGong ? '<span class="tag tag-star">夫妻星坐夫妻宮</span>' : ''}
            </div>` + renderMarkedChart(scan.baseGans, scan.baseZhis, scan.dg, marks);
        html += scan.stars.length ? `<div class="rel-star-grid">` + scan.stars.map(st => `
                <div class="rel-star-card">
                    <div class="rel-star-head"><span class="rel-star-gan" style="color:${elementColors[ganElementMap[st.gan]]}">${st.gan}<small>${st.tenGod}</small></span><span class="rel-star-pos">${st.pillarName}・${st.layer}</span></div>
                    <div class="rel-star-row"><span>距日主</span><b>${st.dist}</b></div>
                    <div class="rel-star-row"><span>通根</span><b class="${st.tonggenLabel === '無根' ? 'ng' : 'ok'}">${st.tonggenLabel}</b></div>
                </div>`).join('') + `</div>`
            : `<div class="rel-empty"><span class="tag tag-neutral">原局天干、地支主氣不見夫妻星</span></div>`;
        html += `<div class="rel-ev-block"><div class="rel-ev-title">🏠 原局刑沖害</div>${scan.natal.length ? scan.natal.map(n => `
                <div class="rel-ev-row"><div class="rel-ev-time">${n.who}</div><div class="rel-ev-tags"><span class="tag ${n.type === '沖' ? 'tag-chong' : n.type === '害' ? 'tag-hai' : 'tag-xing'}">${n.name}・${n.with}</span></div></div>`).join('')
            : '<div class="rel-ev-empty">無</div>'}</div>`;
        html += renderRelEventBlocks(scan.events);
        return html;
    }
    function buildSpouseScanPromptText(scan) {
        let t = `夫妻星＝${scan.catName}（${scan.el}），天干全取，天干不足 2 顆才以地支主氣補到 2 顆；夫妻宮＝日支「${scan.palace}」。\n`;
        t += `柱位對應：時柱＝年紀小 2～10 歲；日支＝±2 歲；月柱＝差 2～10 歲；年柱＝差 10～20 歲或異國、遠距離。\n`;

        if (scan.zuoGong) t += '夫妻星坐夫妻宮：是（日支主氣為夫妻星）\n';

        const fmt = (e) => `- ${e.time} ${e.ganZhi}${e.isCurrent ? '（現在）' : (e.isPast ? '（已過，供驗證）' : '')}：${e.clash.map(c => c.name + '・' + c.target).join('、')}`;

        return t;
    }

    function buildChildScanPromptText(scan) {

            : `整體子女緣：[子女緣分輕薄]（${scan.thinReasons.join('、')}）\n`;

            if (e.arrive.length) parts.push(`歲運現子女星（${e.arrive.join('、')}）[推斷得子時機]`);
            (e.he || []).forEach(h => parts.push(`${h.name}（子女星局）[推斷得子時機・力量強]`));

    // ===================================================================
    // 兄弟星偵測 (Sibling_Star_Scanner)：比劫星＝與日主同五行；只掃比劫星坐支被歲運沖刑
    // ===================================================================
    function scanSiblingStars(ctx) {
        const { dg, dayElement, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const el = dayElement;
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };

        // 擷取：天干全取；不足 2 顆以地支主氣補；皆無才取中氣／餘氣 1 顆。順序：月→年→日→時（月柱為兄弟宮）
        const stars = pickRelStars(el, baseGans, baseZhis, [1, 0, 3], [1, 0, 2, 3]);

        stars.forEach(st => {
            st.tenGod = getPreciseTenGod(st.gan, dg);
            st.pillarName = pNames[st.pillarIdx];
            st.sittingBranch = baseZhis[st.pillarIdx];
            if (st.layer === '天干') {
                const r = getTraditionalRoots(st.gan, st.pillarIdx, baseZhis, pNames);
                st.hasTonggen = r.roots.length > 0; st.tonggenLabel = r.label;
                st.hasTougan = true; st.touganLabel = '本身透干';
            } else {
                st.hasTonggen = true; st.tonggenLabel = st.layer;
                const exact = baseGans.some((g, i) => i !== 2 && g === st.gan);
                const sameEl = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === el);
                st.hasTougan = exact || sameEl;
                st.touganLabel = exact ? `「${st.gan}」透出` : (sameEl ? '同類透出' : '未透干');
            }
        });

        // 目標：比劫星坐支（去重）
        const targets = [];
        stars.forEach(st => { if (st.sittingBranch && st.sittingBranch !== '-' && !targets.some(t => t.idx === st.pillarIdx)) targets.push({ idx: st.pillarIdx, zhi: st.sittingBranch, label: `比劫(${st.sittingBranch})` }); });

        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', name: `${pairName(inZhi, t.zhi)}刑`, target: t.label });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            if (clash.length) events.dayun.push({ time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const clash = checkClash(gz.charAt(1));
            if (clash.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const clash = checkClash(bz.getMonthZhi());
            if (!clash.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash, arrive: [] });
        }
        return { el, stars, targets, events, dg, baseGans, baseZhis };
    }

    function buildSiblingScanPromptText(scan) {
        let t = `兄弟星＝比劫（${scan.el}，與日主同五行），天干全取；天干不足 2 顆才以地支主氣補到 2 顆；皆無才取地支中氣或餘氣 1 顆（用於提醒手足安危）。\n`;
        if (scan.stars.length === 0) t += '原局比劫星：無\n';
        scan.stars.forEach((st, i) => {
            t += `比劫星${i + 1}：${st.gan}（${st.tenGod}）位於${st.pillarName}柱${st.layer}，坐支「${st.sittingBranch}」；通根：${st.tonggenLabel}；透干：${st.touganLabel}\n`;
