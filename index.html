        t += '大運觸發：\n' + (scan.events.dayun.length ? scan.events.dayun.map(fmt).join('\n') : '- 無') + '\n';
        t += '流年觸發：\n' + (scan.events.liunian.length ? scan.events.liunian.map(fmt).join('\n') : '- 無') + '\n';
        t += '流月觸發：\n' + (scan.events.liuyue.length ? scan.events.liuyue.map(fmt).join('\n') : '- 無');
        return t;
    }

    // ===================================================================
    // 父母星偵測 (Parent_Star_Scanner)：母＝印星（生我者）、父＝財星（我剋者），不分正偏
    // 天干全取；天干不足 2 顆才以地支主氣補到 2 顆；皆無才取中氣／餘氣 1 顆
    // 掃描：父母星所在柱的地支，被大運／流年／流月沖刑（依教材「家人星該柱地支」）
    // ===================================================================
    const YIMA_ZHI = '寅申巳亥', SIKU_ZHI = '辰戌丑未';
    function scanParentStars(ctx) {
        const { dg, dayElement, baseGans, baseZhis, pNames, daYunData, currentYear } = ctx;
        const motherEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        const fatherEl = wuxingRel[dayElement].ke;
        const PILLAR_ORDER = [1, 0, 2, 3]; // 父母以月、年柱優先
        const hiddenSorted = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };

        // 擷取：天干全取；不足 2 顆以地支主氣補；皆無才取中氣／餘氣 1 顆（月、年柱優先）
        const pickStars = (el, who) => {
            const picked = pickRelStars(el, baseGans, baseZhis, [1, 0, 3], PILLAR_ORDER, { who });
            picked.forEach(st => {
                st.tenGod = getPreciseTenGod(st.gan, dg);
                st.pillarName = pNames[st.pillarIdx];
                st.sittingBranch = baseZhis[st.pillarIdx];
                if (st.layer === '天干') {
                    const r = getTraditionalRoots(st.gan, st.pillarIdx, baseZhis, pNames);
                    st.hasTonggen = r.roots.length > 0; st.hasTougan = true;
                } else {
                    st.hasTonggen = true;
                    st.hasTougan = baseGans.some((g, i) => i !== 2 && g !== '-' && ganElementMap[g] === el);
                }
            });
            return picked;
        };

        const mother = pickStars(motherEl, '母');
        const father = pickStars(fatherEl, '父');

        // 目標：父母星所在柱的地支（同一支同時是父母星時合併標示）
        const targets = [];
        [...mother, ...father].forEach(st => {
            const ex = targets.find(t => t.idx === st.pillarIdx);
            if (ex) { if (!ex.who.includes(st.who)) ex.who.push(st.who); }
            else targets.push({ idx: st.pillarIdx, zhi: st.sittingBranch, who: [st.who] });
        });
        targets.forEach(t => t.label = `${t.who.join('、')}(${t.zhi})`);

        const ZHI_ORDER = '子丑寅卯辰巳午未申酉戌亥';
        const pairName = (a, b) => ZHI_ORDER.indexOf(a) <= ZHI_ORDER.indexOf(b) ? a + b : b + a;
        const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
        // 刑的性質：驛馬（寅申巳亥）＝出入安全；四庫（辰戌丑未）＝健康檢查；其餘（子卯、午午、酉酉）＝一般刑
        const xingKind = (chars) => [...chars].every(c => YIMA_ZHI.includes(c)) ? '驛馬' : ([...chars].every(c => SIKU_ZHI.includes(c)) ? '四庫' : '');
        const checkClash = (inZhi) => {
            const hits = [];
            targets.forEach(t => {
                const isChong = zhiChongMap[inZhi] === t.zhi;
                if (isChong) hits.push({ type: '沖', kind: '沖', name: `${pairName(inZhi, t.zhi)}沖`, target: t.label });
                const trio = SAN_XING.find(tr => tr.includes(inZhi) && tr.includes(t.zhi) && inZhi !== t.zhi);
                if (trio) {
                    const third = trio.find(z => z !== inZhi && z !== t.zhi);
                    if (baseZhis.includes(third)) { hits.push({ type: '刑', kind: xingKind(trio.join('')), name: `${trio.join('')}三刑`, target: t.label }); return; }
                }
                const x = getXingType(inZhi, t.zhi);
                if (x === '自刑') hits.push({ type: '刑', kind: xingKind(inZhi), name: `${inZhi}${t.zhi}自刑`, target: t.label });
                else if (x && !isChong) hits.push({ type: '刑', kind: xingKind(inZhi + t.zhi), name: `${pairName(inZhi, t.zhi)}刑`, target: t.label });
            });
            return hits;
        };

        const events = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const endYear = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const clash = checkClash(dy.zhi);
            if (clash.length) events.dayun.push({ time: `${dy.startYear}–${endYear}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi,
                isCurrent: currentYear >= dy.startYear && currentYear <= endYear, isPast: endYear < currentYear, clash, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = Solar.fromYmd(y, 7, 1).getLunar().getEightChar().getYear();
            const clash = checkClash(gz.charAt(1));
            if (clash.length) events.liunian.push({ time: `${y}`, ganZhi: gz, isCurrent: y === currentYear, isPast: y < currentYear, clash, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15);
            const bz = solar.getLunar().getEightChar();
            const clash = checkClash(bz.getMonthZhi());
            if (!clash.length) continue;
            const r = getJieQiRange(solar);
            events.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`,
                ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash, arrive: [] });
        }
        return { motherEl, fatherEl, mother, father, targets, events, dg, baseGans, baseZhis };
    }

    const PARENT_RING = { '母': '#ff6b9d', '父': '#ffb347' };

    // 指定位置加圈的迷你命盤（每顆星可用不同顏色）
    function renderMarkedChart(baseGans, baseZhis, dg, marks) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const names = ['年柱', '月柱', '日柱', '時柱'];
        const order = [3, 2, 1, 0];
        const hiddenOf = (z) => { const w = zhiHiddenWeights[z] || {}; return Object.keys(w).sort((a, b) => w[b] - w[a]); };
        const tg = (g, isDm) => isDm ? '日主' : (ssShort[getPreciseTenGod(g, dg)] || '');
        const ringColor = (type, idx, g) => { const m = marks.find(mk => mk.type === type && mk.idx === idx && (!g || mk.gan === g)); return m ? m.color : null; };
        const ch = (c, color, rc) => `<span class="rc-ch${rc ? ' rc-ring' : ''}" style="color:${color};${rc ? `border-color:${rc};` : ''}">${c}</span>`;
        let h = `<div class="rc-wrap"><table class="rc-table"><tr>`;
        order.forEach(i => h += `<td class="rc-head">${names[i]}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-tg">${tg(baseGans[i], i === 2)}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ch(baseGans[i], elementColors[ganElementMap[baseGans[i]]] || '#888', ringColor('gan', i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => h += `<td class="rc-gz">${ch(baseZhis[i], elementColors[zhiElementMap[baseZhis[i]]] || '#888', ringColor('zhi', i))}</td>`);
        h += `</tr><tr>`;
        order.forEach(i => {
            h += `<td class="rc-hidden">` + hiddenOf(baseZhis[i]).map(g =>
                `<div>${ch(g, elementColors[ganElementMap[g]], ringColor('zhi', i, g))}<span style="color:${elementColors[ganElementMap[g]]}">${tg(g, false)}</span></div>`
            ).join('') + `</td>`;
        });
        h += `</tr></table></div>`;
        return h;
    }

    function renderParentScanHtml(scan) {
        const ssShort = { '比肩':'比', '劫財':'劫', '食神':'食', '傷官':'傷', '偏財':'才', '正財':'財', '七殺':'殺', '正官':'官', '偏印':'梟', '正印':'印' };
        const all = [...scan.mother, ...scan.father];
        const marks = all.map(st => ({ type: st.layer === '天干' ? 'gan' : 'zhi', idx: st.pillarIdx, gan: st.layer === '天干' ? null : st.gan, color: PARENT_RING[st.who] }));
        let html = `
            <div class="rel-summary">
                <span><i class="rel-dot" style="border-color:${PARENT_RING['母']}"></i>母星 <b style="color:${elementColors[scan.motherEl]}">印（${scan.motherEl}）</b></span>
                <span><i class="rel-dot" style="border-color:${PARENT_RING['父']}"></i>父星 <b style="color:${elementColors[scan.fatherEl]}">財（${scan.fatherEl}）</b></span>
            </div>
        `;

        html += renderMarkedChart(scan.baseGans, scan.baseZhis, scan.dg, marks);
        const card = (st) => `
            <div class="rel-star-card" style="border-color:${PARENT_RING[st.who]}55">
                <div class="rel-star-head">
                    <span class="rel-star-gan" style="color:${elementColors[ganElementMap[st.gan]]}">${st.gan}<small>${ssShort[st.tenGod] || st.tenGod}</small></span>
                    <span class="rel-star-pos"><b style="color:${PARENT_RING[st.who]}">${st.who}星</b><br>${st.pillarName}・${st.layer}</span>
                </div>
                <div class="rel-star-row"><span>坐柱</span><b>${st.pillarName}柱 ${scan.baseGans[st.pillarIdx]}${st.sittingBranch}</b></div>
            </div>`;
        const missing = [];
        if (!scan.mother.length) missing.push('原局不見印星（母星）');
        if (!scan.father.length) missing.push('原局不見財星（父星）');
        if (missing.length) html += `<div class="rel-empty">${missing.map(m => `<span class="tag tag-neutral">${m}</span>`).join(' ')}</div>`;
        if (all.length) html += `<div class="rel-star-grid">${all.map(card).join('')}</div>`;
        html += renderRelEventBlocks(scan.events);
        return html;
    }

    function buildParentScanPromptText(scan) {
        let t = `母星＝印星（${scan.motherEl}），父星＝財星（${scan.fatherEl}），不分正偏。天干全取；天干不足 2 顆才以地支主氣補到 2 顆；皆無才取地支中氣或餘氣 1 顆。\n`;
        const line = (arr, who) => arr.length
            ? arr.map(st => `${who}星：${st.gan}（${st.tenGod}）位於${st.pillarName}柱${st.layer}，該柱地支「${st.sittingBranch}」`).join('\n') + '\n'
            : `${who}星：原局無\n`;
        t += line(scan.mother, '母') + line(scan.father, '父');

        const tagOf = (c) => c.kind === '四庫' ? '[推斷家人健康檢查]' : '[推斷家人出入安全]';
        const fmt = (e) => `- ${e.time} ${e.ganZhi}${e.isCurrent ? '（現在）' : (e.isPast ? '（已過，供驗證）' : '')}：` +
            e.clash.map(c => `${c.name}・${c.target}${c.kind === '驛馬' ? '（驛馬刑）' : c.kind === '四庫' ? '（四庫刑）' : ''} ${tagOf(c)}`).join('；');
        t += '大運觸發：\n' + (scan.events.dayun.length ? scan.events.dayun.map(fmt).join('\n') : '- 無') + '\n';
        t += '流年觸發：\n' + (scan.events.liunian.length ? scan.events.liunian.map(fmt).join('\n') : '- 無') + '\n';
        t += '流月觸發：\n' + (scan.events.liuyue.length ? scan.events.liuyue.map(fmt).join('\n') : '- 無');
        return t;
    }


    // ===================================================================
    // 平安提醒：行車・跌倒（沖＋三刑湊齊）、安太歲（犯太歲＝生肖；太歲引動＝其他柱）
    // ===================================================================
    const SAN_XING = [['寅', '巳', '申'], ['丑', '戌', '未']];
    const YIMA = '寅申巳亥';
    const ZORD = '子丑寅卯辰巳午未申酉戌亥';
    const zPair = (a, b) => ZORD.indexOf(a) <= ZORD.indexOf(b) ? a + b : b + a;
    function scanSafety(ctx) {
        const { baseZhis, pNames, daYunData, currentYear } = ctx;
        const nz = baseZhis.map((z, i) => ({ z, i })).filter(o => o.z && o.z !== '-');
        // ---- 原局 ----
        const natal = [];
        for (let a = 0; a < nz.length; a++) for (let b = a + 1; b < nz.length; b++)
            if (zhiChongMap[nz[a].z] === nz[b].z) natal.push({ type: '沖', name: `${zPair(nz[a].z, nz[b].z)}沖`, with: `${pNames[nz[a].i]}支×${pNames[nz[b].i]}支` });
        SAN_XING.forEach(g => { if (g.every(x => nz.some(o => o.z === x))) natal.push({ type: '刑', name: `${g.join('')}三刑`, with: '原局湊齊' }); });
        const yima = nz.filter(o => YIMA.includes(o.z));
        // ---- 歲運 ----
        const hits = (z, pool) => {
            const out = [];
            nz.forEach(o => { if (zhiChongMap[z] === o.z) out.push({ type: '沖', name: `${zPair(z, o.z)}沖`, target: `${pNames[o.i]}支` }); });
            SAN_XING.forEach(g => {
                if (!g.includes(z)) return;
                const all = nz.map(o => o.z).concat(pool, [z]);
                if (g.every(x => all.includes(x)) && !g.every(x => nz.some(o => o.z === x))) out.push({ type: '刑', name: `${g.join('')}三刑`, target: '湊齊' });
            });
            return out;
        };
        const dyOf = y => (daYunData || []).find(d => y >= d.startYear && y < d.startYear + 10);
        const ev = { dayun: [], liunian: [], liuyue: [] };
        (daYunData || []).forEach((dy, idx) => {
            const end = daYunData[idx + 1] ? daYunData[idx + 1].startYear - 1 : dy.startYear + 9;
            const c = hits(dy.zhi, []);
            if (c.length) ev.dayun.push({ time: `${dy.startYear}–${end}（${dy.startAge}歲起）`, ganZhi: dy.ganZhi || (dy.gan + dy.zhi), isCurrent: currentYear >= dy.startYear && currentYear <= end, isPast: end < currentYear, clash: c, arrive: [] });
        });
        for (let y = currentYear - 3; y <= currentYear + 3; y++) {
            const gz = iaYearGZ(y), dy = dyOf(y);
            const c = hits(gz.zhi, dy ? [dy.zhi] : []);
            if (c.length) ev.liunian.push({ time: `${y}`, ganZhi: gz.gan + gz.zhi, isCurrent: y === currentYear, isPast: y < currentYear, clash: c, arrive: [] });
        }
        const now = new Date();
        for (let i = -6; i <= 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15), bz = solar.getLunar().getEightChar();
            const dy = dyOf(d.getFullYear());
            const c = hits(bz.getMonthZhi(), (dy ? [dy.zhi] : []).concat([bz.getYearZhi()]));
            if (!c.length) continue;
            const r = getJieQiRange(solar);
            ev.liuyue.push({ time: r ? `${r.startLabel} ~ ${r.endLabel}` : `${d.getFullYear()}/${d.getMonth() + 1}`, ganZhi: bz.getMonthGan() + bz.getMonthZhi(), isCurrent: i === 0, isPast: i < 0, clash: c, arrive: [] });
        }
        // ---- 月曆（本月起 12 個月，含未觸發月份）----
        const cal = [];
        for (let i = 0; i < 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() + i, 15);
            const solar = Solar.fromYmd(d.getFullYear(), d.getMonth() + 1, 15), bz = solar.getLunar().getEightChar();
            const dy = dyOf(d.getFullYear()), r = getJieQiRange(solar);
            cal.push({ y: d.getFullYear(), m: d.getMonth() + 1, gan: bz.getMonthGan(), zhi: bz.getMonthZhi(), range: r ? `${r.startLabel} ~ ${r.endLabel}` : '',
                clash: hits(bz.getMonthZhi(), (dy ? [dy.zhi] : []).concat([bz.getYearZhi()])), ln: hits(bz.getYearZhi(), dy ? [dy.zhi] : []) });
        }
        // ---- 安太歲（10 年）----
        const yz = baseZhis[0], ts = [];
        for (let k = 0; k < 10; k++) {
            const y = currentYear + k, gz = iaYearGZ(y), l = gz.zhi, fan = [], yin = [];
            if (yz && yz !== '-') {
                if (l === yz) fan.push(getXingType(l, yz) === '自刑' ? `坐太歲・${yz}${l}自刑` : '坐太歲');
                else if (zhiChongMap[l] === yz) fan.push(`沖太歲・${zPair(yz, l)}沖`);
                else if (getXingType(l, yz)) fan.push(`刑太歲・${zPair(yz, l)}刑`);
            }
            nz.filter(o => o.i !== 0).forEach(o => {
                if (zhiChongMap[l] === o.z) yin.push(`${pNames[o.i]}支${zPair(o.z, l)}沖`);
                else { const x = getXingType(l, o.z); if (x) yin.push(`${pNames[o.i]}支${x === '自刑' ? o.z + l + '自刑' : zPair(o.z, l) + '刑'}`); }
            });
            ts.push({ y, gz, fan, yin });
        }
        return { natal, yima, ev, ts, yz, cal, hits, dyOf };
    }
    function renderSafetyHtml(sc) {
        const tab = window.__sfTab || 'ts', sel = window.__sfSel || (window.__sfSel = { ts: 0, car: 0 }), more = !!window.__sfMore;
        const gz = (g, z) => `<b style="color:${elementColors[ganElementMap[g]]}">${g}</b><b style="color:${elementColors[zhiElementMap[z]]}">${z}</b>`;
        let body = '';
        if (tab === 'ts') {
            const cells = sc.ts.map((r, k) => {
                const st = r.fan.length ? r.fan[0].split('・')[0] : (r.yin.length ? '引動' : '');
                return `<div class="sf-cell ${r.fan.length ? 'fan' : (r.yin.length ? 'yin' : '')} ${k === sel.ts ? 'sel' : ''} ${k === 0 ? 'now' : ''}" onclick="sfPick('ts',${k})">
                    <span class="sf-y">${r.y}</span><span class="sf-gz">${gz(r.gz.gan, r.gz.zhi)}</span><span class="sf-st">${st || '・'}</span></div>`;
            }).join('');
            const r = sc.ts[sel.ts];
            const det = r.fan.length || r.yin.length
                ? [...r.fan.map(t => `<div class="sf-line fan"><b>${t.split('・')[0]}</b><span>${t.split('・')[1] || '生肖' + sc.yz}</span><em>建議安太歲</em></div>`),
                   ...r.yin.map(t => `<div class="sf-line yin"><b>太歲引動</b><span>${t}</span><em>影響較輕</em></div>`)].join('')
                : '<div class="sf-line"><span>這一年沒有犯太歲</span></div>';
            body = `<div class="sf-grid sf-grid5">${cells}</div>
                <div class="sf-det"><div class="sf-det-h">${r.y} ${gz(r.gz.gan, r.gz.zhi)} 年</div>${det}</div>
                <div class="sf-legend"><span><i class="sf-dot fan"></i>犯太歲（生肖 ${sc.yz} 被坐、沖、刑）</span><span><i class="sf-dot yin"></i>太歲引動（其他柱，影響較輕）</span></div>`;
        } else {
            const natalTxt = [...sc.natal.map(n => n.name), ...(sc.yima.length >= 2 ? [`驛馬 ${sc.yima.length} 個`] : [])];
            const cells = sc.cal.map((c, k) => `<div class="sf-cell ${c.clash.length ? 'warn' : ''} ${k === sel.car ? 'sel' : ''} ${k === 0 ? 'now' : ''}" onclick="sfPick('car',${k})">
                    <span class="sf-y">${c.m === 1 || k === 0 ? c.y + '/' : ''}${c.m}月</span><span class="sf-gz">${gz(c.gan, c.zhi)}</span><span class="sf-st">${c.clash.length ? '⚠' : '・'}</span></div>`).join('');
            const c = sc.cal[sel.car];
            const det = c.clash.length
                ? c.clash.map(x => `<div class="sf-line warn"><b>${x.type === '沖' ? '相沖' : '三刑'}</b><span>${x.name}・${x.target}</span><em>開車、出遠門、長輩行走多注意</em></div>`).join('')
                : '<div class="sf-line"><span>這個月沒有特別要注意的</span></div>';
            body = (natalTxt.length ? `<div class="sf-natal">原局本身有 ${natalTxt.join('、')}，平時就較常奔波，行車多留意</div>` : '')
                + `<div class="sf-grid sf-grid4">${cells}</div>
                <div class="sf-det"><div class="sf-det-h">${c.y}/${c.m}月 ${gz(c.gan, c.zhi)}<small>${c.range}</small></div>${det}</div>
                <div class="sf-legend"><span><i class="sf-dot warn"></i>⚠ 開車、長輩跌倒多注意（地支相沖或三刑湊齊）</span></div>
                <button class="sf-more" onclick="sfMore()">${more ? '收起命師詳細 ▴' : '命師詳細（大運・流年・流月）▾'}</button>
                ${more ? sfDetailHtml(sc, c, natalTxt) : ''}`;
        }
        return `<div class="lm-tabs sf-tabs">
                <button class="lm-tab ${tab === 'ts' ? 'on' : ''}" onclick="sfTab('ts')">🧧 安太歲</button>
                <button class="lm-tab ${tab === 'car' ? 'on' : ''}" onclick="sfTab('car')">🚗 行車・跌倒</button>
            </div>${body}`;
    }
    function sfDetailHtml(sc, c, natalTxt) {
        const row = (time, gzs, clash, cur) => `<div class="rel-ev-row${cur ? ' is-current' : ''}">
                <div class="rel-ev-time">${time}${cur ? ' <span class="rel-now">現在</span>' : ''}</div>
                <div class="rel-ev-gz">${gzs.split('').map(x => `<span style="color:${elementColors[ganElementMap[x] || zhiElementMap[x]]}">${x}</span>`).join('')}</div>
                <div class="rel-ev-tags">${clash.length ? clash.map(x => `<span class="tag ${x.type === '沖' ? 'tag-chong' : 'tag-xing'}">${x.name}・${x.target}</span>`).join(' ') : '<span class="sf-none">無觸發</span>'}</div></div>`;
        const block = (title, inner) => `<div class="rel-ev-block"><div class="rel-ev-title">${title}</div>${inner}</div>`;
        const now = new Date(), soon = new Date(now.getFullYear(), now.getMonth() + 6, now.getDate());
        // 大運：目前；6 個月內換運則加下一步
        const dys = (window.__friendCtx && window.__friendCtx.daYunData) || [];
        const ci = dys.findIndex(d => now.getFullYear() >= d.startYear && now.getFullYear() < d.startYear + 10);
        const dyList = ci >= 0 ? [dys[ci]].concat(dys[ci + 1] && dys[ci + 1].startYear <= soon.getFullYear() ? [dys[ci + 1]] : []) : [];
        const dyHtml = dyList.length ? dyList.map((d, k) => row(`${d.startYear}–${d.startYear + 9}（${d.startAge}歲起）`, d.ganZhi || d.gan + d.zhi, sc.hits(d.zhi, []), k === 0)).join('') : '<div class="rel-ev-empty">無</div>';
        // 流年：目前（以立春分年）；6 個月內過立春則加下一年
        const yNow = Solar.fromDate(now).getLunar().getEightChar(), ySoon = Solar.fromDate(soon).getLunar().getEightChar();
        const y0 = now.getFullYear() - (now.getMonth() === 0 || (now.getMonth() === 1 && now.getDate() < 5) ? 1 : 0); // 立春前算前一年
        const lnList = [{ gz: yNow.getYearGan() + yNow.getYearZhi(), y: y0 }];
        if (ySoon.getYearZhi() !== yNow.getYearZhi()) lnList.push({ gz: ySoon.getYearGan() + ySoon.getYearZhi(), y: y0 + 1 });
        const lnHtml = lnList.map((o, k) => { const dy = sc.dyOf(o.y); return row(`${o.y}`, o.gz, sc.hits(o.gz[1], dy ? [dy.zhi] : []), k === 0); }).join('');
        // 流月：點選的月份
        const lmHtml = row(c.range || `${c.y}/${c.m}`, c.gan + c.zhi, c.clash, false);
        // 流日：該節氣月內每一天
        const dy = sc.dyOf(c.y), days = [];
        for (let k = -25; k <= 25; k++) {
            const d = new Date(c.y, c.m - 1, 15 + k), bz = Solar.fromYmdHms(d.getFullYear(), d.getMonth() + 1, d.getDate(), 12, 0, 0).getLunar().getEightChar();
            if (bz.getMonthZhi() !== c.zhi || bz.getMonthGan() !== c.gan) continue;
            const h = sc.hits(bz.getDayZhi(), (dy ? [dy.zhi] : []).concat([bz.getYearZhi(), bz.getMonthZhi()]));
            if (h.length) days.push(`<div class="sf-day"><span class="sf-day-d">${d.getMonth() + 1}/${d.getDate()}</span><span class="rel-ev-gz">${(bz.getDayGan() + bz.getDayZhi()).split('').map(x => `<span style="color:${elementColors[ganElementMap[x] || zhiElementMap[x]]}">${x}</span>`).join('')}</span><span class="rel-ev-tags">${h.map(x => `<span class="tag ${x.type === '沖' ? 'tag-chong' : 'tag-xing'}">${x.name}・${x.target}</span>`).join(' ')}</span></div>`);
        }
        const natalHtml = natalTxt.length ? `<div class="rel-ev-row"><div class="rel-ev-tags">${[...sc.natal.map(n => `<span class="tag ${n.type === '沖' ? 'tag-chong' : 'tag-xing'}">${n.name}・${n.with}</span>`), ...(sc.yima.length >= 2 ? [`<span class="tag tag-xing">驛馬 ${sc.yima.length} 個・${sc.yima.map(o => o.z).join('')}</span>`] : [])].join(' ')}</div></div>` : '<div class="rel-ev-empty">無</div>';
        return block('🏠 原局', natalHtml) + block('🌊 大運', dyHtml) + block('📆 流年', lnHtml)
            + block(`🗓️ 流月（${c.y}/${c.m}月）`, lmHtml) + block(`📍 流日（${c.y}/${c.m}月，共 ${days.length} 天）`, days.length ? days.join('') : '<div class="rel-ev-empty">本月無觸發</div>');
    }

    function getPreciseTenGod(targetGan, dGan) {
        if (!targetGan || targetGan === '-') return '';
        const tEl = ganElementMap[targetGan], dEl = ganElementMap[dGan];
        const samePol = stemPolarity[targetGan] === stemPolarity[dGan];
        if (tEl === dEl) return samePol ? '比肩' : '劫財';
        if (wuxingRel[dEl].sheng === tEl) return samePol ? '食神' : '傷官';
        if (wuxingRel[dEl].ke === tEl) return samePol ? '偏財' : '正財';
        if (wuxingRel[tEl].ke === dEl) return samePol ? '七殺' : '正官';
        if (wuxingRel[tEl].sheng === dEl) return samePol ? '偏印' : '正印';
        return '';
    }

    /**
     * 獨立的「從格」判斷——完全不使用量化系統總分，改用傳統子平「通根有無」＋
     * 「滿盤一面倒（比劫印 or 財官食傷其中一方掛零）」的離散式判斷，與量化分數系統脫鉤。
     * 回傳 '從強' / '從弱' / null（null 代表不成立從格，仍依正格常規論）。
     */
    function checkCongGeIndependently(dGan, dayElement, baseGans, baseZhis, pNames, genEl) {
        const dayIndex = pNames.indexOf('日');
        const dayRoots = getTraditionalRoots(dGan, dayIndex, baseZhis, pNames);
        const hasRoot = dayRoots.roots.length > 0;

        const catOf = (el) => {
            if (el === dayElement) return '比劫';
            if (el === genEl) return '印';
            if (wuxingRel[dayElement].sheng === el) return '食傷';
            if (wuxingRel[dayElement].ke === el) return '財';
            return '官殺';
        };
        let helpCount = 0, drainCount = 0; // 統計日干以外的 3 天干＋4 地支本氣，落在「印比」或「財官食傷」哪一邊
        baseGans.forEach((g, idx) => {
            if (idx === dayIndex || g === '-') return;
            const cat = catOf(ganElementMap[g]);
            if (cat === '比劫' || cat === '印') helpCount++; else drainCount++;
        });
        baseZhis.forEach((z) => {
            if (z === '-') return;
            const cat = catOf(zhiElementMap[z]);
            if (cat === '比劫' || cat === '印') helpCount++; else drainCount++;
        });

        if (!hasRoot && helpCount === 0) return '從弱';
        if (hasRoot && drainCount === 0) return '從強';
        return null;
    }

    /**
     * 子平格局定式＋用神／忌神判定（簡化版，僅供參考，非嚴格對應單一流派）。
     * 格局：以月令（月支）藏干為主氣，優先採「已透干」者定格；比肩／劫財月令另定建祿／羊刃（月劫）；
     *       從強格／從弱格的判定改用傳統子平「通根＋滿盤一面倒」的獨立邏輯（見 checkCongGeIndependently），
     *       與下方「用神／忌神」的量化分數（量化系統）判斷脫鉤，兩者刻意採不同方法。
     * 用神／忌神：先判斷是否需要調候（月支寒暖＋原局水火比例），調候優先於扶抑；
     *            從格時用神方向依上方獨立判斷的從強／從弱而定；非從格時才採用量化系統的量化身強／身弱。
     */
    function determineGeJuAndYongShen(mz, dGan, dayElement, baseGans, baseZhis, pNames, strengthLabel, elementCount, totalElements) {
        // ---- 1. 格局：月令司令神（本氣優先，若有其他藏干已透干則以透干者優先） ----
        const hideGansObj = zhiHiddenWeights[mz] || {};
        const sortedCandidates = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
        const benQiGan = sortedCandidates[0];
        // 傳統子平：建祿／羊刃（月劫）只看「月令本氣」是否為比劫；
        // 雜氣月（如丑辰未戌）中、餘氣的比劫即使透干也不另成格，改取其他透干者，皆無則取本氣。
        // （另排除日干本身：日干不算「透出」）
        const isBiJieGan = g => ganElementMap[g] === dayElement;
        const otherGans = baseGans.filter((g, i) => g && g !== '-' && i !== pNames.indexOf('日'));
        let geJuGan, skippedBiJie = null;
        if (isBiJieGan(benQiGan)) {
            geJuGan = benQiGan;
        } else {
            const transparentCandidate = sortedCandidates.find(c => otherGans.includes(c) && !isBiJieGan(c));
            skippedBiJie = sortedCandidates.find(c => otherGans.includes(c) && isBiJieGan(c)) || null;
            geJuGan = transparentCandidate || benQiGan;
        }
        const isTou = otherGans.includes(geJuGan);
        const geJuTenGod = getPreciseTenGod(geJuGan, dGan);

        const geJuNameMap = {
            '正官': '正官格', '七殺': '七殺格', '正財': '正財格', '偏財': '偏財格',
            '食神': '食神格', '傷官': '傷官格', '正印': '正印格', '偏印': '偏印格'
        };
        let geJuBaseName;
        if (geJuTenGod === '比肩') {
            geJuBaseName = '建祿格';
        } else if (geJuTenGod === '劫財') {
            geJuBaseName = (stemPolarity[dGan] === 1) ? '羊刃格' : '月劫格';
        } else {
            geJuBaseName = geJuNameMap[geJuTenGod] || '雜氣格';
        }

        // 獨立判斷從格（不依賴量化系統總分）
        const genEl = Object.keys(wuxingRel).find(k => wuxingRel[k].sheng === dayElement);
        const congGeResult = checkCongGeIndependently(dGan, dayElement, baseGans, baseZhis, pNames, genEl);

        let geJuName = geJuBaseName;
        let isExtreme = !!congGeResult;
        if (isExtreme) {
            const extremeLabel = congGeResult === '從強' ? '從強格（專旺）' : '從弱格';
            geJuName = `${extremeLabel}（不依正格論，原局月令本屬${geJuBaseName}；依傳統子平通根＋滿盤判定，非量化系統分數）`;
        }
        const geJuNote = `月支「${mz}」藏干以「${geJuGan}」定格${isTou ? '，且已透干（格局清晰）' : '，未透干，僅以藏干本氣論格'}` +
            (skippedBiJie ? `；${skippedBiJie}為比劫透出，不另成格` : '');

        // ---- 2. 調候判斷（優先於扶抑） ----
        const pct = (el) => totalElements > 0 ? (elementCount[el] / totalElements) * 100 : 0;
        const winterZhi = ['亥', '子', '丑'], summerZhi = ['巳', '午', '未'];
        let tiaohou = null;
        if (winterZhi.includes(mz) && pct('火') < 12) {
            tiaohou = { need: ['火', '木'], avoid: ['水', '金'], reason: `月支「${mz}」屬冬季寒月，原局火僅約 ${pct('火').toFixed(0)}%，調候優先，需以火（次選木生火）為用` };
        } else if (summerZhi.includes(mz) && pct('水') < 12) {
            tiaohou = { need: ['水', '金'], avoid: ['火', '木'], reason: `月支「${mz}」屬夏季炎月，原局水僅約 ${pct('水').toFixed(0)}%，調候優先，需以水（次選金生水）為用` };
        }

        // ---- 3. 扶抑用神／忌神（十神類別 → 換算對應五行） ----
        const catToEl = {
            '比劫': dayElement,
            '印': genEl,
            '食傷': wuxingRel[dayElement].sheng,
            '財': wuxingRel[dayElement].ke,
            '官殺': Object.keys(wuxingRel).find(k => wuxingRel[k].ke === dayElement)
        };
        const toElements = (cats) => [...new Set(cats.map(c => catToEl[c]))];

        let yongCats, jiCats, logicNote;
        if (congGeResult === '從強') {
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '從強格：日主氣勢已成一方獨大，用神反取比劫、印星以順其勢；財官食傷逆勢而為，稱忌神。（此判斷依傳統子平通根＋滿盤，非量化系統分數）';
        } else if (congGeResult === '從弱') {
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '從弱格：日主氣勢已從他方，用神反取財官食傷順其強勢；比劫印星欲扶身反而逆勢，稱忌神。（此判斷依傳統子平通根＋滿盤，非量化系統分數）';
        } else if (strengthLabel === '身強' || strengthLabel === '從強格') {
            yongCats = ['財', '官殺', '食傷']; jiCats = ['比劫', '印'];
            logicNote = '身強：日主偏旺（依量化系統判定），用神取財官食傷剋洩耗身；印比為忌神，恐助身過旺。';
        } else {
            // 涵蓋 strengthLabel === '身弱' 或 '從弱格'：只要獨立判斷未成立從格，一律以正格「身弱」扶抑邏輯處理
            yongCats = ['比劫', '印']; jiCats = ['財', '官殺', '食傷'];
            logicNote = '身弱：日主偏弱（依量化系統判定），用神取比劫印星生扶日主；財官食傷為忌神，恐耗身過度。';
        }

        let yongElements = toElements(yongCats), jiElements = toElements(jiCats);
        let tiaohouActive = false;
        if (tiaohou) {
            tiaohouActive = true;
            yongElements = tiaohou.need;
            jiElements = tiaohou.avoid;
            logicNote = `【調候優先於扶抑】${tiaohou.reason}。扶抑判斷僅供次要參考：${logicNote}`;
        }

        return {
            geJuName, geJuBaseName, geJuGan, geJuTenGod, geJuNote, isExtreme, congGeResult,
            yongElements, jiElements, yongCats, jiCats, logicNote, tiaohouActive
        };
    }

    function generate12MonthTactics(dg, dz, mg, mz, tg, tz, yg, yz, dayElement, gender, daYunData) {
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); 

        let tactics = { love: [], career: [], wealth: [], health: [], family: [] };
        
        const baseGans = [yg, mg, dg, tg];
        const baseZhis = [yz, mz, dz, tz];
        const pNames = ['年', '月', '日', '時'];

        const months = [], ev = [];
        const addTactic = (cat, monthStr, badge, desc, kind, mi) => {
            ev.push({ cat, kind, mi, desc, badge });
            tactics[cat].push(`
                <tr class="lm-month-row"><td colspan="2"><span class="lm-month-chip">📅 ${monthStr}</span></td></tr>
                <tr class="lm-event-row">
                    <td class="lm-badge-cell">${badge}</td>
                    <td class="lm-desc-cell">${desc}</td>
                </tr>
            `);
        };

        for(let i = -6; i <= 12; i++) {
            let d = new Date(currentYear, currentMonth + i, 15);
            let y = d.getFullYear();
            let m = d.getMonth() + 1;
            
            const solar = Solar.fromYmd(y, m, 15);
            const lunar = solar.getLunar();
            const bazi = lunar.getEightChar();
            let mGan = bazi.getMonthGan();
            let mZhi = bazi.getMonthZhi();

            const jieRange = getJieQiRange(solar);
            const timeText = jieRange
                ? `${jieRange.startLabel} ~ ${jieRange.endLabel}`
                : `${y}年${m}月`; // 節氣資料抓取失敗時的備援顯示
            // 時間格式比照六親分頁：過去＝深藍、現在＝亮藍＋「現在」標記；干支依五行上色
            const gzHtml = `<span style="color:${elementColors[ganElementMap[mGan]]}">${mGan}</span><span style="color:${elementColors[zhiElementMap[mZhi]]}">${mZhi}</span>`;
            months.push({ i, y, m, gan: mGan, zhi: mZhi, start: jieRange ? jieRange.startLabel : `${m}月`, time: timeText });
            const mi = months.length - 1;
            let monthStr = `<span class="lm-time${i < 0 ? ' is-past' : ''}">${timeText}</span> <span class="lm-gz">${gzHtml}</span>`
                + (i === 0 ? ' <span class="rel-now">現在</span>' : (i < 0 ? '<span class="lm-past-note">（已過）</span>' : ''));

            let mGanEl = ganElementMap[mGan];
            let tgGan = getTenGodForElement(mGanEl, dayElement);
            let isWealth = tgGan === '財星';
            let isShiShang = tgGan === '食傷';
            let isGuanSha = tgGan === '官殺';
            let isBiJie = tgGan === '比劫';

            let originPillars = [];
            baseGans.forEach((bg, idx) => { if(bg !== '-' && bg === mGan) originPillars.push(`${pNames[idx]}干`); });
            baseZhis.forEach((bz, idx) => { if(bz !== '-' && Object.keys(zhiHiddenWeights[bz] || {}).includes(mGan)) originPillars.push(`${pNames[idx]}支`); });

            let originBadge = originPillars.length > 0 
                ? `<b style="color:var(--color-origin); font-size:11px;">📍原局引動(${originPillars.join('/')})</b>` 
                : `<b style="color:var(--color-neutral); font-size:11px;">☄️流月外來</b>`;
            
            // 動態判斷透干強度描述
            let hasGan = originPillars.some(p => p.includes('干'));
            let hasZhi = originPillars.some(p => p.includes('支'));
            let actionDesc = "透干";
            if (hasGan && hasZhi) actionDesc = "通根透干";
            else if (hasZhi && !hasGan) actionDesc = "藏干引透";
            else if (hasGan && !hasZhi) actionDesc = "天干明透";

            const clashBadge = (target) => `<b style="color:var(--color-chong); font-size:11px;">💥沖${target}</b>`;
            const combineBadge = (target) => `<b style="color:var(--color-liuhe); font-size:11px;">🌀合${target}</b>`;
            const kuBadge = (target) => `<b style="color:var(--color-ku); font-size:11px;">🔑沖開${target}</b>`;
            const xingBadge = (target) => `<b style="color:var(--color-xing); font-size:11px;">🌀${target}自刑</b>`;


            { const dyM = (daYunData || []).find(x => y >= x.startYear && y < x.startYear + 10);
              const shM = yySanhe(yz, [dyM ? dyM.zhi : '', bazi.getYearZhi(), mZhi], mZhi);
              if (shM) addTactic('love', monthStr, `<b style="color:#ff7eb6; font-size:11px;">★生肖三合</b>`, `${shM}三合・生肖${yz}`, 'sanhe', mi); }
            if (zhiChongMap[dz] === mZhi) addTactic('love', monthStr, clashBadge('日支'), `沖動夫妻宮 (${dz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[dz] === mZhi) addTactic('love', monthStr, combineBadge('日支'), `合動夫妻宮 (${dz}${mZhi}合)`, 'he', mi);
            if ((gender === 1 && isWealth) || (gender === 0 && isGuanSha)) addTactic('love', monthStr, originBadge, `✨ 配偶星「${mGan}」${actionDesc}`, 'yin', mi);

            if (zhiChongMap[mz] === mZhi) addTactic('career', monthStr, clashBadge('月支'), `沖動事業宮 (${mz}${mZhi}沖)`, 'chong', mi);
            if (isShiShang) addTactic('career', monthStr, originBadge, `💡 食傷「${mGan}」${actionDesc}`, 'yin', mi);
            if (isGuanSha) addTactic('career', monthStr, originBadge, `⚠️ 官殺「${mGan}」${actionDesc}`, 'yin', mi);

            if (zhiChongMap[tz] === mZhi) addTactic('wealth', monthStr, clashBadge('時支'), `沖動投資/子女宮 (${tz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[tz] === mZhi) addTactic('wealth', monthStr, combineBadge('時支'), `合動時柱 (${tz}${mZhi}合)`, 'he', mi);
            if (isBiJie) addTactic('wealth', monthStr, originBadge, `💸 比劫「${mGan}」${actionDesc}`, 'yin', mi);
            if (['辰','戌','丑','未'].includes(mZhi)) {
                let clashIndex = baseZhis.indexOf(zhiChongMap[mZhi]);
                if (clashIndex !== -1) {
                    addTactic('wealth', monthStr, kuBadge(`${pNames[clashIndex]}庫`), `財庫引動 (${baseZhis[clashIndex]}${mZhi}沖)`, 'ku', mi);
                }
            }

            if (zhiChongMap[dz] === mZhi) addTactic('health', monthStr, clashBadge('日支'), `根基逢沖 (${dz}${mZhi}沖)`, 'chong', mi);
            else if (zhiChongMap[mz] === mZhi) addTactic('health', monthStr, clashBadge('月支'), `提綱逢沖 (${mz}${mZhi}沖)`, 'chong', mi);
            if (['辰','午','酉','亥'].includes(mZhi) && mZhi === dz) addTactic('health', monthStr, xingBadge('日支'), `自刑引動 (${dz}${mZhi}刑)`, 'xing', mi);

            if (zhiChongMap[yz] === mZhi) addTactic('family', monthStr, clashBadge('年支'), `沖動父母宮 (${yz}${mZhi}沖)`, 'chong', mi);
            if (zhiHeMap[yz] === mZhi) addTactic('family', monthStr, combineBadge('年支'), `合動父母宮 (${yz}${mZhi}合)`, 'he', mi);
        }

        // 流月清單（新版）：一個月一列；左邊時間＋干支（中性色），右邊每件事一行，只用前方圓點區分類型
        const EV_DOT = { sanhe: 'ev-sanhe', chong: 'ev-chong', xing: 'ev-xing', ku: 'ev-ku', he: 'ev-he', yin: 'ev-yin' };
        const evClean = t => String(t || '').replace(/<[^>]*>/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️★]/gu, '').replace(/\s+/g, ' ').trim();
        const lmList = (k) => {
            const rows = months.map((o, mi) => {
                const L = ev.filter(e => e.cat === k && e.mi === mi);
                if (!L.length) return '';
                return `<div class="ev-row ${o.i < 0 ? 'past' : ''} ${o.i === 0 ? 'now' : ''}" title="${o.time}">
                    <div class="ev-when"><b>${o.y}/${o.m}月</b><span>${o.gan}${o.zhi}</span>${o.i === 0 ? '<em>現在</em>' : ''}</div>
                    <div class="ev-items">${L.map(e => `<div class="ev-it ${EV_DOT[e.kind] || 'ev-yin'}">${evClean(e.desc)}${e.kind === 'yin' ? `<small>${evClean(e.badge)}</small>` : ''}</div>`).join('')}</div>
                </div>`;
            }).filter(Boolean);
            return rows.length ? `<div class="ev-list">${rows.join('')}</div>` : '<div class="rel-ev-empty">無</div>';
        };
        const TOPICS = [
            ['love', '感情', '#ff9800', '觀測日支與配偶星', '無'],
            ['career', '事業', '#2ed573', '觀測月柱與官殺食傷', '無'],
            ['wealth', '財運', '#00d2ff', '觀測時柱與比劫財星', '無'],
            ['health', '健康', '#ff5252', '觀測日月支逢沖刑', '無'],
            ['family', '家庭', '#a29bfe', '觀測年柱', '無']
        ];
        // 每格的記號：沖＝紅點、刑＝粉點、庫＝金菱、合＝青環、十神引動＝主題色方塊（同格多件以優先序顯示並標件數）
        // 提詞用純文字（依主題、依月份合併）
        {
            const strip = t => String(t).replace(/<[^>]*>/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️]/gu, '').replace(/\s+/g, ' ').trim();
            const CATS = [['love', '感情（日支夫妻宮、配偶星）'], ['career', '事業（月柱、官殺食傷）'], ['wealth', '財運（時柱、比劫財星）'], ['health', '健康（日月支逢沖刑）'], ['family', '家庭（年柱）']];
            window.__lmPromptText = CATS.map(([k, n]) => {
                const rows = months.map((o, mi) => {
                    const L = ev.filter(e => e.cat === k && e.mi === mi);
                    if (!L.length) return '';
                    return `- ${o.time} ${o.gan}${o.zhi}${o.i < 0 ? '（已過）' : (o.i === 0 ? '（現在）' : '')}：` + L.map(e => strip(e.desc) + (e.kind === 'yin' ? `（${strip(e.badge)}）` : '')).join('；');
                }).filter(Boolean);
                return `${n}：\n${rows.length ? rows.join('\n') : '- 無'}`;
            }).join('\n');
        }
        const KIND = { sanhe: ['★', '#ff7eb6'], chong: ['●', '#ff6b6b'], xing: ['●', '#ffa94d'], ku: ['◆', '#e6c35c'], he: ['○', '#5cc8e6'], yin: ['■', null] };
        const cellOf = (cat, mi, col) => {
            const L = ev.filter(e => e.cat === cat && e.mi === mi);
            if (!L.length) return '<i class="lm-dot0"></i>';
            const pri = ['sanhe', 'chong', 'xing', 'ku', 'he', 'yin'].find(k => L.some(e => e.kind === k));
            const [ch, c] = KIND[pri];
            return `<b class="lm-mk" style="color:${c || col}" data-tip="${months[mi].gan}${months[mi].zhi}（${months[mi].start}起）：${L.map(e => e.desc).join('；')}">${ch}${L.length > 1 ? `<sup>${L.length}</sup>` : ''}</b>`;
        };
        const colCls = (o) => o.i < 0 ? 'past' : (o.i === 0 ? 'now' : '');
        const grid = `
            <div class="lm-grid-wrap"><table class="lm-grid">
                <tr><th class="lm-rl"></th>${months.map(o => `<th class="${colCls(o)}"><span style="color:${elementColors[ganElementMap[o.gan]]}">${o.gan}</span><span style="color:${elementColors[zhiElementMap[o.zhi]]}">${o.zhi}</span><small>${o.m}月</small></th>`).join('')}</tr>
                ${TOPICS.map(([k, n, col]) => `<tr><td class="lm-rl" style="color:${col}" onclick="lmTab('${k}')">${n}</td>${months.map((o, mi) => `<td class="${colCls(o)}">${cellOf(k, mi, col)}</td>`).join('')}</tr>`).join('')}
                <tr class="lm-sum"><td class="lm-rl">變動</td>${months.map((o, mi) => { const n = ev.filter(e => e.mi === mi && e.kind !== 'yin' && e.kind !== 'sanhe').length; return `<td class="${colCls(o)}">${n ? `<span class="lm-bar" style="height:${Math.min(4, n) * 4 + 2}px"></span>` : ''}</td>`; }).join('')}</tr>
            </table></div>
            <div class="lm-legend"><span><b style="color:#ff6b6b">●</b>沖</span><span><b style="color:#ffa94d">●</b>刑</span><span><b style="color:#e6c35c">◆</b>庫</span><span><b style="color:#5cc8e6">○</b>合</span><span><b>■</b>十神引動</span><span><b style="color:#ff7eb6">★</b>生肖三合</span><span class="lm-legend-r">淡＝已過・框＝本月</span></div>`;
        const upcoming = k => ev.filter(e => e.cat === k && months[e.mi].i >= 0).length;
        return `
            <div class="lm-wrap">
                <div class="lm-tabs">
                    <button class="lm-tab on" data-k="all" onclick="lmTab('all')">總覽</button>
                    ${TOPICS.map(([k, n, col]) => `<button class="lm-tab" data-k="${k}" style="--c:${col}" onclick="lmTab('${k}')">${n}${upcoming(k) ? `<sup>${upcoming(k)}</sup>` : ''}</button>`).join('')}
                </div>
                <div class="lm-pane" data-k="all">${grid}</div>
                <div class="lm-lists">
                ${TOPICS.map(([k, n, col, sub, empty]) => `<div class="lm-pane" data-k="${k}" style="display:none;">
                    <div class="lm-sub" style="color:${col}">${n}<span>${sub}</span></div>
                    ${lmList(k)}
                </div>`).join('')}
                </div>
            </div>
        `;
    }
    function tt2Tab(k) {
        document.querySelectorAll('.tt2-tabs .lm-tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
        document.querySelectorAll('.tt2-pane').forEach(p => p.style.display = p.dataset.k === k ? '' : 'none');
    }
    function lmTab(k) {
        document.querySelectorAll('#monthlyTacticsOutput .lm-tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
        document.querySelectorAll('#monthlyTacticsOutput .lm-pane').forEach(p => p.style.display = p.dataset.k === k ? '' : 'none');
    }

    function calculateBaziCore() {
        const mode = document.querySelector('input[name="inputMode"]:checked').value;
        const gender = parseInt(document.getElementById('gender').value);
        const genderStr = gender === 1 ? '元男' : '元女';
        const currentYear = new Date().getFullYear();

        let yg, yz, mg, mz, dg, dz, tg, tz;
        let startYearOfLife;
        let daYunData = [];
        let solarInfoHtml = '';
        let birthSolarForJieQi = null; // 僅在「依出生日期」模式下有值，供精確得令（人元司令分野）計算使用

        if (mode === 'date') {
            let dateVal = document.getElementById('birthDate').value; // 格式："YYYY-MM-DD"
            if (!dateVal) { alert('請選擇出生日期'); return; }
            let [y, m, d] = dateVal.split('-').map(Number);
            let h = parseInt(document.getElementById('birthHour').value);
            let min = parseInt(document.getElementById('birthMinute').value);

            let useTrueSolar = document.getElementById('useTrueSolar').checked;
            let useSplitZi = document.getElementById('useSplitZi').checked;

            // 出生地換算：當地鐘錶時間 → 扣夏令 → UTC
            const L = getBirthLoc();
            const stdOff = isNaN(L.std) ? 480 : L.std;
            const wallMs = Date.UTC(y, m - 1, d, h, min);
            const utcMs = wallMs - (stdOff + L.dst) * 60000;
            // 年、月柱（節氣交接）與大運：用絕對時刻，換成東八區時間對照節氣表
            const absD = new Date(utcMs + 480 * 60000);
            const solarAbs = Solar.fromYmdHms(absD.getUTCFullYear(), absD.getUTCMonth() + 1, absD.getUTCDate(), absD.getUTCHours(), absD.getUTCMinutes(), 0);
            const baZiAbs = solarAbs.getLunar().getEightChar();
            // 日、時柱：用出生地的當地時間（標準時間，或真太陽時）
            let localMs = wallMs - L.dst * 60000;
            const p2 = (n) => String(n).padStart(2, '0');
            const locNote = (stdOff !== 480 || L.dst) ? `出生地 ${L.place || ''}（${fmtOff(stdOff)}${L.dst ? `，夏令 +${L.dst / 60}h` : ''}）${L.dst ? ` → 當地標準時間 ${p2(new Date(localMs).getUTCHours())}:${p2(new Date(localMs).getUTCMinutes())}` : ''}` : '';

            if (useTrueSolar) {
                const lon = L.lon;
                const lonDiff = lon * 4 - stdOff;
                const isLeap = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
                const daysInMonth = [0, 31, isLeap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
                let dayOfYear = d;
                for (let i = 1; i < m; i++) dayOfYear += daysInMonth[i];
                const B = (360 / 365.24) * (dayOfYear - 81) * (Math.PI / 180);
                const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
                const totalOffset = lonDiff + eot;
                localMs += totalOffset * 60000;
                const t = new Date(localMs);
                const sign = totalOffset >= 0 ? '+' : '';
                solarInfoHtml = `<div style="text-align:center; margin-bottom:15px; font-size:13px; color:#aaa; background:#1a1a1a; padding:8px 12px; border-radius:6px; border:1px solid #333;">
                    ${locNote ? `<span style="color:#ccc;">${locNote}</span><br>` : ''}
                    <b style="color:#00d2ff;">☀️ 真太陽時校正：</b> 經度 ${lon}° (時差 ${sign}${totalOffset.toFixed(1)} 分鐘)<br>
                    <span style="color:#e0e0e0; margin-top: 4px; display: inline-block;">當地真太陽時：${t.getUTCFullYear()}年${t.getUTCMonth() + 1}月${t.getUTCDate()}日 ${t.getUTCHours()}時${t.getUTCMinutes()}分</span>
                </div>`;
            } else if (locNote) {
                solarInfoHtml = `<div style="text-align:center; margin-bottom:15px; font-size:13px; color:#ccc; background:#1a1a1a; padding:8px 12px; border-radius:6px; border:1px solid #333;">${locNote}</div>`;
            }
            const lt = new Date(localMs);
            let dateObj = new Date(lt.getUTCFullYear(), lt.getUTCMonth(), lt.getUTCDate(), lt.getUTCHours(), lt.getUTCMinutes(), 0);

            y = dateObj.getFullYear();
            m = dateObj.getMonth() + 1;
            d = dateObj.getDate();
            h = dateObj.getHours();
            let finalMin = dateObj.getMinutes();

            const solar = Solar.fromYmdHms(y, m, d, h, finalMin, 0);
            birthSolarForJieQi = solarAbs;
            const baZi = solar.getLunar().getEightChar();

            yg = baZiAbs.getYearGan(); yz = baZiAbs.getYearZhi();
            mg = baZiAbs.getMonthGan(); mz = baZiAbs.getMonthZhi();
            tg = baZi.getTimeGan(); tz = baZi.getTimeZhi();

            // 【早晚子時 絕對控制邏輯】
            if (h === 23) {
                if (useSplitZi) {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setHours(22);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                } else {
                    let tempDate = new Date(dateObj.getTime());
                    tempDate.setDate(tempDate.getDate() + 1);
                    tempDate.setHours(1);
                    let tempSolar = Solar.fromYmdHms(tempDate.getFullYear(), tempDate.getMonth() + 1, tempDate.getDate(), tempDate.getHours(), tempDate.getMinutes(), 0);
                    dg = tempSolar.getLunar().getEightChar().getDayGan();
                    dz = tempSolar.getLunar().getEightChar().getDayZhi();
                }
            } else {
                dg = baZi.getDayGan(); 
                dz = baZi.getDayZhi();
            }

            startYearOfLife = absD.getUTCFullYear();

            const yun = baZiAbs.getYun(gender);
            yun.getDaYun().forEach(dy => {
                if (dy.getIndex() > 0 && dy.getIndex() <= 10) {
                    const gz = dy.getGanZhi();
                    daYunData.push({ index: dy.getIndex(), startYear: dy.getStartYear(), startAge: dy.getStartAge(), gan: gz.charAt(0), zhi: gz.charAt(1), ganZhi: gz });
                }
            });
        } else {
            yg = document.getElementById('yg').value; yz = document.getElementById('yz').value;
            mg = document.getElementById('mg').value; mz = document.getElementById('mz').value;
            dg = document.getElementById('dg').value; dz = document.getElementById('dz').value;
            tg = document.getElementById('tg').value; tz = document.getElementById('tz').value;
            
            // 由四柱反推出生日期：找得到就用真實的出生年與大運；找不到才用估算
            const cand = baziPick(baziCands());
            if (cand) {
                startYearOfLife = cand.getYear();
                cand.getLunar().getEightChar().getYun(gender).getDaYun().forEach(dy => {
                    if (dy.getIndex() > 0 && dy.getIndex() <= 10) {
                        const gz = dy.getGanZhi();
                        daYunData.push({ index: dy.getIndex(), startYear: dy.getStartYear(), startAge: dy.getStartAge(), gan: gz.charAt(0), zhi: gz.charAt(1), ganZhi: gz });
                    }
                });
            }
            if (!startYearOfLife) startYearOfLife = currentYear - 30;
            let yunStartAge = parseInt(document.getElementById('baziStartAge').value) || 1;

            const isYangYear = stemPolarity[yg] === 1;
            const isMale = gender === 1;
            const direction = (isYangYear === isMale) ? 1 : -1;

            const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
            const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

            for (let i = 1; i <= 10 && !cand; i++) {
                let gIdx = (stems.indexOf(mg) + i * direction) % 10;
                if(gIdx < 0) gIdx += 10;
                let zIdx = (branches.indexOf(mz) + i * direction) % 12;
                if(zIdx < 0) zIdx += 12;

                let dGan = stems[gIdx], dZhi = branches[zIdx];
                daYunData.push({ index: i, startYear: startYearOfLife + yunStartAge - 1 + ((i-1) * 10), startAge: yunStartAge + ((i-1) * 10), gan: dGan, zhi: dZhi, ganZhi: dGan + dZhi });
            }
        }

        const dayGan = dg;
        const dayElement = ganElementMap[dayGan];
        const allBaseZhis = [yz, mz, dz, tz]; 

        let currentDaYun = daYunData.find(dy => currentYear >= dy.startYear && currentYear < dy.startYear + 10);
        let dyGan = '-', dyZhi = '-';
        
        if (currentDaYun) { dyGan = currentDaYun.gan; dyZhi = currentDaYun.zhi; } 
        else if (daYunData.length > 0) { dyGan = daYunData[0].gan; dyZhi = daYunData[0].zhi; }

        const lnSolar = Solar.fromYmd(currentYear, 7, 1);
        const lnBaZi = lnSolar.getLunar().getEightChar();
        const lnGan = lnBaZi.getYearGan(); const lnZhi = lnBaZi.getYearZhi();

        function getSpecificShiShen(targetGan, dGan) {
            if (!targetGan || targetGan === '-') return '-';
            const tEl = ganElementMap[targetGan], dEl = ganElementMap[dGan];
            const samePol = stemPolarity[targetGan] === stemPolarity[dGan];
            if (tEl === dEl) return samePol ? '比肩' : '劫財';
            if (wuxingRel[dEl].sheng === tEl) return samePol ? '食神' : '傷官';
            if (wuxingRel[dEl].ke === tEl) return samePol ? '偏財' : '正財';
            if (wuxingRel[tEl].ke === dEl) return samePol ? '七殺' : '正官';
            if (wuxingRel[tEl].sheng === dEl) return samePol ? '偏印' : '正印';
            return '';
        }

        function buildPillarObj(name, gan, zhi, isDay = false) {
            let hideGansObj = zhiHiddenWeights[zhi] || {};
            let hideGans = Object.keys(hideGansObj).sort((a, b) => hideGansObj[b] - hideGansObj[a]);
            if(hideGans.length === 0 && zhi !== '-') hideGans = [gan]; 
            return {
                name: name, gan: gan, zhi: zhi,
                ganShiShen: isDay ? genderStr : getSpecificShiShen(gan, dayGan),
                hideGan: hideGans, hideShiShen: hideGans.map(hg => getSpecificShiShen(hg, dayGan))
            };
        }

        const displayPillars = [
            buildPillarObj('流年', lnGan, lnZhi), buildPillarObj('大運', dyGan, dyZhi),
            buildPillarObj('時柱', tg, tz), buildPillarObj('日柱', dg, dz, true),
            buildPillarObj('月柱', mg, mz), buildPillarObj('年柱', yg, yz)
        ];

        let gridHtml = `<div class="bazi-table-wrapper"><table class="bazi-table"><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            gridHtml += `<td class="bt-header" style="${style}">${p.name}</td>`;
        });
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = p.name === '日柱' ? '#2ed573' : (elementColors[ganElementMap[p.gan]] || '#888');
            gridHtml += `<td class="bt-shishen" style="${style} color:${color};">${p.ganShiShen}</td>`;
        });
        
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = elementColors[ganElementMap[p.gan]] || '#888';
            gridHtml += `<td class="bt-ganzhi" style="${style} color:${color};">${p.gan}</td>`;
        });
        
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let color = elementColors[zhiElementMap[p.zhi]] || '#888';
            gridHtml += `<td class="bt-ganzhi" style="${style} color:${color};">${p.zhi}</td>`;
        });
        gridHtml += `</tr><tr>`;
        displayPillars.forEach((p, i) => {
            let style = i === 1 ? 'border-right: 1px solid #444; padding-right: 12px;' : (i === 2 ? 'padding-left: 12px;' : '');
            let hiddenHtml = '<div class="bt-hidden-bg">';
            for(let j=0; j<p.hideGan.length; j++) {
                let hGan = p.hideGan[j];
                let hColor = elementColors[ganElementMap[hGan]] || '#888';
                hiddenHtml += `<div class="bt-hidden-item"><span style="color:${hColor}; font-size:12px; font-weight:bold;">${hGan}</span><span style="color:${hColor}; font-size:12px; font-weight:bold;">${p.hideShiShen[j]}</span></div>`;
            }
            hiddenHtml += '</div>';
            gridHtml += `<td style="${style} vertical-align:top;">${hiddenHtml}</td>`;
        });
        gridHtml += `</tr></table></div>`;
        document.getElementById('baziGrid').innerHTML = solarInfoHtml + gridHtml;

        const baziMap = { year: { gan: yg, zhi: yz }, month: { gan: mg, zhi: mz }, day: { gan: dg, zhi: dz }, time: { gan: tg, zhi: tz } };
        const totalScore = calculateQuantStrengthScore(baziMap, dayElement);
        let strengthLabel = '';
        if (totalScore > 80) strengthLabel = '從強格'; else if (totalScore >= 45) strengthLabel = '身強'; else if (totalScore >= 20) strengthLabel = '身弱'; else strengthLabel = '從弱格';

        // 滿分 3.75；≥2.0 為得勢（約 53%）
        const SHI_MAX = 3.75, SHI_TH = 2.0;

        // cmdHtml 於調候計算完成後組裝（體力＋調候 合併為汽車儀表面板）

        // 從強/從弱的短標籤取自「獨立子平判斷」(congGeResult)，不使用量化系統分數的 strengthLabel 字串，兩套系統徹底脫鉤

        const rootScore = dayMasterRootsEval.score || 0;

        const buildLiunianRow = (i, dyZhi, dyGanRow) => {

    function cleanHtmlToPureText(arrOrStr) {
        if (!arrOrStr) return '無明顯反應';
        let str = Array.isArray(arrOrStr) ? arrOrStr.join('\n') : arrOrStr;
        return str.replace(/<[^>]*>/g, '').replace(/&emsp;/g, ' ').replace(/&nbsp;/g, ' ').trim() || '無明顯反應';
    }

    // 提詞用：把畫面卡片轉成一行一筆的純文字（去 emoji、去多餘空白）
    const ptxt = t => String(t || '').replace(/➔/g, '：').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️]/gu, '')
        .replace(/\s+/g, ' ').replace(/\s*：\s*/g, '：').replace(/([有弱]) 根/g, '$1根').replace(/隱 藏/g, '隱藏').replace(/(SSS|S|A|B|C) 級/g, '$1級').replace(/元[男女]/g, '日主').trim();
    function promptRows(id) {
        const root = document.getElementById(id); if (!root) return '無';
        const out = [];
        root.querySelectorAll('div, b').forEach(el => {
            if (el.tagName === 'B') { if (/^【/.test(el.textContent.trim()) && !el.closest('div[style*="flex"]')) out.push(ptxt(el.textContent)); return; }
            if (el.style.display !== 'flex' || (el.parentElement && el.parentElement.style.display === 'flex')) return;
            const cells = [...el.children].map(c => ptxt(c.textContent).replace(/：$/, '')).filter(Boolean);
            if (cells.length) out.push('- ' + (cells.length > 1 ? cells.slice(0, -1).join(' ') + '｜' : '') + cells[cells.length - 1].replace(/ ：/g, '：'));
        });
        return out.length ? out.join('\n') : '無';
    }
    function promptPlain(id) {
        const root = document.getElementById(id); if (!root) return '無';
        const body = root.querySelector('.acc-body') || root;
        const lines = body.innerHTML.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li)>/gi, '\n').replace(/<[^>]*>/g, '').replace(/&nbsp;|&emsp;/g, ' ').split('\n').map(ptxt).filter(Boolean);

        copyWithAiGo(prompt, btn, 'aiGo', `✅ 已複製${mode === 'plain' ? '白話' : '命師'}提詞`);
    }
    // 複製文字 → 按鈕顯示已複製 → 打開指定的 AI 選擇框
    function copyWithAiGo(text, btn, panelId, title) {
        const done = () => {
            const go = document.getElementById(panelId);
            if (go) { const t = go.querySelector('.ai-go-title'); if (t) t.textContent = title; go.style.display = 'block'; }
            if (!btn) return;
            const t = btn.querySelector('.ab-t') || btn, original = t.innerHTML;
            t.innerHTML = '✅ 已複製'; btn.classList.add('copied');
            setTimeout(() => { t.innerHTML = original; btn.classList.remove('copied'); }, 2500);
        };
        const fallback = () => {
            try {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'absolute'; ta.style.left = '-9999px';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
            } catch (err) { console.error('複製失敗:', err); alert('複製失敗，請檢查瀏覽器權限或換個瀏覽器試試。'); }
        };
        window.__lastPrompt = text;
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    }

</script>
